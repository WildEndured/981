<input type="file" id="fileInput" accept="image/*">
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let session = null;

// 1. Загрузка модели при старте (замените на ваш путь к модели)
async function loadModel() {
  try {
    // ВАЖНО: загрузите .onnx файл в корень вашего репозитория GitHub
    session = await ort.InferenceSession.create('./anime_face.onnx'); 
    console.log("Модель загружена");
  } catch (e) {
    console.error("Ошибка загрузки модели:", e);
  }
}
loadModel();

// 2. Обработка выбора файла
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();

  // Устанавливаем размер canvas под картинку
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);

  if (!session) {
    alert("Модель еще загружается, подождите...");
    return;
  }

  // 3. Подготовка данных (Здесь зависит от вашей модели!)
  // Примерный препроцессинг для YOLO:
  const inputSize = 640;
  const offscreen = document.createElement('canvas');
  offscreen.width = inputSize;
  offscreen.height = inputSize;
  const offCtx = offscreen.getContext('2d');
  offCtx.drawImage(img, 0, 0, inputSize, inputSize);

  const imageData = offCtx.getImageData(0, 0, inputSize, inputSize);
  const data = imageData.data;
  const float32Data = new Float32Array(3 * inputSize * inputSize);

  // Нормализация (обычно 0-1 и перевод в RGB planar)
  for (let i = 0; i < data.length; i += 4) {
    const idx = i / 4;
    float32Data[idx] = data[i] / 255.0;               // R
    float32Data[idx + inputSize * inputSize] = data[i+1] / 255.0; // G
    float32Data[idx + 2 * inputSize * inputSize] = data[i+2] / 255.0; // B
  }

  const tensor = new ort.Tensor('float32', float32Data, [1, 3, inputSize, inputSize]);

  // 4. Запуск нейросети
  const feeds = {};
  feeds[session.inputNames[0]] = tensor; // Имя входа модели
  const results = await session.run(feeds);
  
  // 5. Отрисовка (Здесь ВАЖНО знать формат выхода вашей модели)
  // Обычно YOLO возвращает массив [x, y, w, h, confidence, class1, class2...]
  const output = results[session.outputNames[0]].data;
  
  // ВАМ НУЖНО БУДЕТ ДОБАВИТЬ ПАРСИНГ OUTPUT И NMS (Non-Maximum Suppression)
  // Пример отрисовки (заглушка):
  ctx.strokeStyle = 'red';
  ctx.lineWidth = 3;
  // ctx.strokeRect(x, y, w, h); 
  
  console.log("Результат модели:", results);
});
                                                         </script>
