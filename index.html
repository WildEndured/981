<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Канон «X голов» — фигура и голова</title>
<style>
  :root {
    --bg: #f7f5f2;
    --ink: #1c1c1e;
    --muted: #8a8a8f;
    --red: #f03e6e;
    --blue: #3b7cff;
    --green: #22a06b;
    --guide: #c8c4cc;
    --panel: #ffffff;
    --shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: 1fr 300px;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  }

  /* сцена */
  #stage {
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 24px;
  }
  #svg {
    max-width: 100%;
    max-height: 100%;
    background: #fff;
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  /* панель управления */
  aside {
    background: var(--panel);
    border-left: 1px solid #eae6e1;
    padding: 20px;
    overflow-y: auto;
  }
  @media (max-width: 720px) {
    aside { border-left: 0; border-top: 1px solid #eae6e1; }
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; display: block; margin-top: 2px; }
  h2 {
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 8px; font-weight: 600;
  }
  .row {
    display: flex; align-items: center; gap: 8px;
    margin: 6px 0;
  }
  .row label { flex: 0 0 110px; color: #444; }
  .row input[type=range] { flex: 1; }
  .row output {
    flex: 0 0 48px; text-align: right;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .check { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  .check input { width: 16px; height: 16px; }
  .legend { margin-top: 20px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-block; margin-right: 10px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

  /* элементы SVG */
  #svg text { font: 12px/1 system-ui, sans-serif; fill: var(--muted); user-select: none; }
  #svg .guide { stroke: var(--guide); stroke-width: 1; fill: none; }
  #svg .guide.dashed { stroke-dasharray: 4 4; }
  #svg .label { fill: var(--muted); font-size: 11px; }
  #svg .figure  { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  #svg .head-circle { stroke: var(--red); stroke-width: 2; fill: none; }
  #svg .head-line  { stroke: var(--red); stroke-width: 1.5; fill: none; }
  #svg .neck-line  { stroke: var(--blue); stroke-width: 1.5; fill: none; }
  #svg .badge { fill: var(--red); }
  #svg .badge-num { fill: #fff; font-size: 10px; font-weight: 700; }
</style>
</head>
<body>

<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="-3 -1.2 6 10" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<aside>
  <h1>Канон «X голов»
    <small>Высота фигуры = N голов. Голова делится на 5 частей.</small>
  </h1>

  <h2>Шаг 1 · Размер и пропорции</h2>
  <div class="row">
    <label for="heads">Рост в головах</label>
    <input id="heads" type="range" min="5" max="8" step="1" value="7" />
    <output id="heads-out">7</output>
  </div>
  <div class="row">
    <label for="width">Ширина фигуры</label>
    <input id="width" type="range" min="0.5" max="1.4" step="0.05" value="0.9" />
    <output id="width-out">0.90</output>
  </div>
  <div class="row">
    <label for="shoulder">Плечи</label>
    <input id="shoulder" type="range" min="1.2" max="2.6" step="0.05" value="1.8" />
    <output id="shoulder-out">1.80</output>
  </div>

  <h2>Шаг 2 · Голова и шея</h2>
  <label class="check"><input id="show-head" type="checkbox" checked /> Показывать круг головы (3/5)</label>
  <label class="check"><input id="show-chin" type="checkbox" checked /> Линия подбородка (4/5)</label>
  <label class="check"><input id="show-neck" type="checkbox" checked /> Шея (ниже подбородка)</label>
  <label class="check"><input id="show-grid" type="checkbox" checked /> Сетка «X голов» слева</label>
  <label class="check"><input id="show-labels" type="checkbox" checked /> Подписи</label>

  <div class="legend">
    <span><i class="swatch" style="background:var(--red)"></i>Голова</span>
    <span><i class="swatch" style="background:var(--blue)"></i>Шея</span>
    <span><i class="swatch" style="background:var(--guide)"></i>Построения</span>
  </div>
</aside>

<script>
/* ============================================================
   Единицы: 1 «единица» = 1 голова по вертикали.
   Начало координат — верх фигуры (y = 0), ось Y направлена вниз
   (так удобнее: голова наверху, ноги внизу).
   ============================================================ */

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');

/* ---------- Утилиты ---------- */
const el = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};
const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); };

/* ---------- Модель ---------- */
const state = {
  heads: 7,          // N голов
  width: 0.9,        // относительная ширина фигуры (×1 голова)
  shoulder: 1.8,     // ширина плеч в головах
  showHead: true,
  showChin: true,
  showNeck: true,
  showGrid: true,
  showLabels: true,
};

/* ---------- Построение ---------- */
function render() {
  const N = state.heads;
  const H = N;               // полная высота фигуры (в единицах головы)
  const headH = 1;           // высота головы = 1
  const step = headH / 5;    // 5 частей головы

  // Автоматический viewBox с полями (слева — сетка, справа — фигура)
  const leftMargin = state.showGrid ? 1.6 : 0.6;
  const rightMargin = 0.6;
  const topMargin = 0.4;
  const bottomMargin = 0.4;
  const widthTotal = leftMargin + state.shoulder + rightMargin + 1.2;
  svg.setAttribute('viewBox', `${-leftMargin} ${-topMargin} ${widthTotal} ${H + topMargin + bottomMargin}`);
  clear(svg);

  // Центр фигуры по X
  const cx = 0;

  /* --- Слой 1: сетка «X голов» слева --- */
  if (state.showGrid) {
    const g = el('g');
    // Вертикальная шкала — N равных частей
    for (let i = 0; i <= N; i++) {
      const y = i * headH;
      g.appendChild(el('line', { x1: -1.4, x2: -1.0, y1: y, y2: y, class: 'guide' }));
      if (i < N) {
        const t = el('text', { x: -0.95, y: y + headH / 2 + 0.08, class: 'label' });
        t.textContent = `${i + 1}`;
        g.appendChild(t);
      }
    }
    g.appendChild(el('line', { x1: -1.2, x2: -1.2, y1: 0, y2: H, class: 'guide' }));
    svg.appendChild(g);
  }

  /* --- Слой 2: горизонтальные линии деления на N частей --- */
  if (state.showLabels) {
    for (let i = 0; i <= N; i++) {
      const y = i * headH;
      svg.appendChild(el('line', {
        x1: cx - state.shoulder / 2 - 0.3,
        x2: cx + state.shoulder / 2 + 0.3,
        y1: y, y2: y,
        class: 'guide dashed'
      }));
    }
  }

  /* --- Слой 3: фигура (силуэт) --- */
  svg.appendChild(buildFigure(cx, state.shoulder, H, state.width));

  /* --- Слой 4: голова (5 частей) --- */
  if (state.showHead || state.showChin || state.showNeck) {
    svg.appendChild(buildHead(cx, 0, headH, step, state));
  }

  /* --- Слой 5: бейдж с N --- */
  if (state.showLabels) {
    const b = el('g');
    const r = 0.22;
    b.appendChild(el('circle', { cx: cx + state.shoulder / 2 + 0.6, cy: 0.25, r, class: 'badge' }));
    const t = el('text', { x: cx + state.shoulder / 2 + 0.6, y: 0.25 + 0.05, class: 'badge-num', 'text-anchor': 'middle' });
    t.textContent = String(N);
    b.appendChild(t);
    svg.appendChild(b);
  }
}

/* ---------- Силуэт фигуры (очень схематично) ---------- */
function buildFigure(cx, shoulder, H, width) {
  const g = el('g');
  const hipY = H * 0.52;              // линия таза примерно посередине
  const footY = H;
  const shoulderY = 1;                // плечи на уровне подбородка
  const neckY = 0.8;

  // Плечи
  g.appendChild(el('line', {
    x1: cx - shoulder / 2, x2: cx + shoulder / 2,
    y1: shoulderY, y2: shoulderY,
    class: 'figure'
  }));

  // Торс: от плеч к тазу (сужение)
  const torsoD = `M ${cx - shoulder / 2} ${shoulderY}
                  L ${cx - width / 2} ${hipY}
                  L ${cx + width / 2} ${hipY}
                  L ${cx + shoulder / 2} ${shoulderY}`;
  g.appendChild(el('path', { d: torsoD, class: 'figure' }));

  // Ноги — очень схематично, две прямые
  const legW = width * 0.35;
  const legGap = width * 0.05;
  g.appendChild(el('line', {
    x1: cx - legW - legGap, x2: cx - legW - legGap,
    y1: hipY, y2: footY, class: 'figure'
  }));
  g.appendChild(el('line', {
    x1: cx + legW + legGap, x2: cx + legW + legGap,
    y1: hipY, y2: footY, class: 'figure'
  }));

  // Руки — от плеч вниз до бёдер
  g.appendChild(el('line', {
    x1: cx - shoulder / 2, x2: cx - width / 2 - legW * 0.4,
    y1: shoulderY, y2: hipY + width * 0.05, class: 'figure'
  }));
  g.appendChild(el('line', {
    x1: cx + shoulder / 2, x2: cx + width / 2 + legW * 0.4,
    y1: shoulderY, y2: hipY + width * 0.05, class: 'figure'
  }));

  return g;
}

/* ---------- Голова по шагу 2 ---------- */
function buildHead(cx, topY, headH, step, s) {
  const g = el('g');
  const circleBottomY = topY + headH * (3 / 5);   // 3/5 — низ круга
  const chinY = topY + headH * (4 / 5);           // 4/5 — подбородок
  const neckBottomY = topY + headH;               // 5/5 — основание шеи

  // Круг черепа: диаметр = 3/5 высоты головы
  const r = headH * (3 / 10);
  const circleCx = cx;
  const circleCy = topY + r;

  if (s.showHead) {
    g.appendChild(el('circle', {
      cx: circleCx, cy: circleCy, r,
      class: 'head-circle'
    }));
    // Верхняя точка и центр — маленькие маркеры
    g.appendChild(el('circle', { cx: circleCx, cy: circleCy, r: 0.02, fill: '#f03e6e' }));

    // Внутренние 3 горизонтальные линии — деления 1/5, 2/5, 3/5
    for (let i = 1; i <= 3; i++) {
      const y = topY + headH * (i / 5);
      const half = Math.sqrt(Math.max(0, r * r - (y - circleCy) ** 2));
      if (half > 0.001) {
        g.appendChild(el('line', {
          x1: circleCx - half, x2: circleCx + half,
          y1: y, y2: y, class: 'head-line'
        }));
      }
    }
  }

  // Линия подбородка (4/5)
  if (s.showChin) {
    const halfChin = r * 0.55;
    g.appendChild(el('line', {
      x1: cx - halfChin, x2: cx + halfChin,
      y1: chinY, y2: chinY, class: 'head-line'
    }));
    // Вертикальная ось лица
    g.appendChild(el('line', {
      x1: cx, x2: cx, y1: topY, y2: chinY, class: 'head-line'
    }));
    // Боковые контуры лица: от низа круга к подбородку
    g.appendChild(el('line', {
      x1: circleCx - r, x2: cx - halfChin,
      y1: circleBottomY, y2: chinY, class: 'head-line'
    }));
    g.appendChild(el('line', {
      x1: circleCx + r, x2: cx + halfChin,
      y1: circleBottomY, y2: chinY, class: 'head-line'
    }));
  }

  // Шея: от подбородка до основания (1 голова вниз от 4/5)
  if (s.showNeck) {
    const neckHalf = r * 0.35;
    g.appendChild(el('line', {
      x1: cx - neckHalf, x2: cx - neckHalf,
      y1: chinY, y2: neckBottomY, class: 'neck-line'
    }));
    g.appendChild(el('line', {
      x1: cx + neckHalf, x2: cx + neckHalf,
      y1: chinY, y2: neckBottomY, class: 'neck-line'
    }));
  }

  // Подписи «1/5 … 5/5» слева от головы
  if (s.showLabels) {
    for (let i = 1; i <= 5; i++) {
      const y = topY + headH * (i / 5) - headH * (0.5 / 5) + 0.05;
      const t = el('text', { x: cx - state.shoulder / 2 - 0.7, y, class: 'label' });
      t.textContent = `${i}/5`;
      g.appendChild(t);
    }
  }

  return g;
}

/* ---------- Привязка слайдеров ---------- */
const headsInput = document.getElementById('heads');
const headsOut = document.getElementById('heads-out');
const widthInput = document.getElementById('width');
const widthOut = document.getElementById('width-out');
const shoulderInput = document.getElementById('shoulder');
const shoulderOut = document.getElementById('shoulder-out');
const checkboxes = {
  showHead: document.getElementById('show-head'),
  showChin: document.getElementById('show-chin'),
  showNeck: document.getElementById('show-neck'),
  showGrid: document.getElementById('show-grid'),
  showLabels: document.getElementById('show-labels'),
};

headsInput.addEventListener('input', () => {
  state.heads = Number(headsInput.value);
  headsOut.textContent = state.heads;
  render();
});
widthInput.addEventListener('input', () => {
  state.width = Number(widthInput.value);
  widthOut.textContent = state.width.toFixed(2);
  render();
});
shoulderInput.addEventListener('input', () => {
  state.shoulder = Number(shoulderInput.value);
  shoulderOut.textContent = state.shoulder.toFixed(2);
  render();
});
for (const [key, input] of Object.entries(checkboxes)) {
  input.addEventListener('change', () => {
    state[key] = input.checked;
    render();
  });
}

/* ---------- Старт ---------- */
render();
</script>
</body>
</html>
