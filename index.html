<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Разметка на 4 части + штриховка до контура</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 14px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    background: #1d2027;
    border-radius: 10px;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; }
  .stage {
    position: relative;
    display: inline-block;
    border: 1px solid #2b2f37;
    background: #0b0c0f;
    line-height: 0;
  }
  .stage canvas {
    display: block;
    max-width: min(90vw, 900px);
    height: auto;
  }
  .stage canvas#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hint { font-size: 12px; color: #8b93a1; max-width: 700px; text-align: center; }

  @media (max-width: 600px) {
    input[type="range"] { width: 140px; height: 24px; }
    .controls { flex-direction: column; align-items: stretch; }
    .stage canvas { max-width: 96vw; }
  }
</style>
</head>
<body>

<h1>Загрузите изображение персонажа</h1>

<div class="controls">
  <label>Изображение:
    <input id="file" type="file" accept="image/*" />
  </label>
  <label>Порог контура:
    <input id="threshold" type="range" min="20" max="200" value="80" />
    <span id="thresholdVal">80</span>
  </label>
  <label>Отличие от фона:
    <input id="bgDist" type="range" min="30" max="250" value="140" />
    <span id="bgDistVal">140</span>
  </label>
  <label>Шаг штриховки:
    <input id="step" type="range" min="2" max="20" value="6" />
    <span id="stepVal">6</span>
  </label>
  <label>
    <input id="showGrid" type="checkbox" checked />
    Показать разметку на 4 части
  </label>
</div>

<div class="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<p class="hint">
  Фон определяется автоматически по краям изображения — штриховка идёт от краёв
  к центру сквозь фон и останавливается на тёмных контурах персонажа.
</p>

<script>
const fileInput    = document.getElementById('file');
const baseCanvas   = document.getElementById('base');
const overlay      = document.getElementById('overlay');
const thresholdEl  = document.getElementById('threshold');
const bgDistEl     = document.getElementById('bgDist');
const stepEl       = document.getElementById('step');
const showGridEl   = document.getElementById('showGrid');
const thresholdVal = document.getElementById('thresholdVal');
const bgDistVal    = document.getElementById('bgDistVal');
const stepVal      = document.getElementById('stepVal');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imageData = null;
let imgWidth = 0, imgHeight = 0;
let srcImage = null;
let bgColor = { r: 0, g: 0, b: 0 };

// ---------- Шаг 1: загрузка изображения ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    srcImage  = img;
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width  = imgWidth;
      c.height = imgHeight;
    });

    baseCtx.clearRect(0, 0, imgWidth, imgHeight);
    baseCtx.drawImage(img, 0, 0);
    imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);

    detectBgColor();
    drawGrid();
    drawHatching();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- Автоопределение цвета фона ----------
function detectBgColor() {
  const d = imageData.data;
  const w = imgWidth, h = imgHeight;
  let r = 0, g = 0, b = 0, n = 0;
  const take = (x, y) => {
    const i = (y * w + x) * 4;
    const a = d[i + 3];
    if (a < 20) return; // прозрачное не учитываем
    r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
  };
  // рамка 4px по периметру
  for (let x = 0; x < w; x += 2) {
    take(x, 1); take(x, 2); take(x, h - 2); take(x, h - 3);
  }
  for (let y = 0; y < h; y += 2) {
    take(1, y); take(2, y); take(w - 2, y); take(w - 3, y);
  }
  if (n === 0) { bgColor = { r: 255, g: 255, b: 255 }; return; }
  bgColor = { r: r / n, g: g / n, b: b / n };
}

// ---------- Шаг 2: разметка на 4 части ----------
function drawGrid() {
  if (!imageData) return;

  baseCtx.clearRect(0, 0, imgWidth, imgHeight);
  baseCtx.drawImage(srcImage, 0, 0);

  if (!showGridEl.checked) return;

  baseCtx.save();
  baseCtx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
  baseCtx.lineWidth = Math.max(2, Math.round(imgWidth / 400));
  baseCtx.setLineDash([12, 8]);

  const mx = imgWidth / 2;
  const my = imgHeight / 2;

  baseCtx.beginPath();
  baseCtx.moveTo(mx, 0);
  baseCtx.lineTo(mx, imgHeight);
  baseCtx.stroke();

  baseCtx.beginPath();
  baseCtx.moveTo(0, my);
  baseCtx.lineTo(imgWidth, my);
  baseCtx.stroke();

  baseCtx.restore();
}

// ---------- Препятствие: тёмный контур ИЛИ сильно отличается от фона ----------
function isObstacle(x, y, threshold, bgDist) {
  if (x < 0 || y < 0 || x >= imgWidth || y >= imgHeight) return true;

  const i = (y * imgWidth + x) * 4;
  const d = imageData.data;
  const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3];

  if (a < 20) return false; // прозрачное — не препятствие

  const lum = 0.299 * r + 0.587 * g + 0.114 * b;

  // (A) явно тёмный пиксель — line art
  if (lum < threshold) return true;

  // (B) сильно отличается от цвета фона
  const dr = r - bgColor.r;
  const dg = g - bgColor.g;
  const db = b - bgColor.b;
  const dist = Math.sqrt(dr * dr + dg * dg + db * db);
  if (dist > bgDist) return true;

  return false;
}

// ---------- Шаг 3 + 4: штриховка от краёв к центру до контура ----------
function drawHatching() {
  if (!imageData) return;

  const threshold = +thresholdEl.value;
  const bgDist    = +bgDistEl.value;
  const step      = +stepEl.value;

  overlayCtx.clearRect(0, 0, imgWidth, imgHeight);

  const cx = imgWidth / 2;
  const cy = imgHeight / 2;

  overlayCtx.save();
  overlayCtx.strokeStyle = 'rgba(80, 200, 255, 0.85)';
  overlayCtx.lineWidth = 1;

  // Горизонтальные линии: слева и справа к центру
  for (let y = 0; y < imgHeight; y += step) {
    // слева → к центру
    let xL = 0;
    while (xL < cx && !isObstacle(xL, y, threshold, bgDist)) xL++;
    if (xL > 0) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(0, y);
      overlayCtx.lineTo(xL, y);
      overlayCtx.stroke();
    }

    // справа → к центру
    let xR = imgWidth - 1;
    while (xR > cx && !isObstacle(xR, y, threshold, bgDist)) xR--;
    if (xR < imgWidth - 1) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(imgWidth, y);
      overlayCtx.lineTo(xR, y);
      overlayCtx.stroke();
    }
  }

  // Вертикальные линии: сверху и снизу к центру
  for (let x = 0; x < imgWidth; x += step) {
    // сверху → к центру
    let yT = 0;
    while (yT < cy && !isObstacle(x, yT, threshold, bgDist)) yT++;
    if (yT > 0) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(x, 0);
      overlayCtx.lineTo(x, yT);
      overlayCtx.stroke();
    }

    // снизу → к центру
    let yB = imgHeight - 1;
    while (yB > cy && !isObstacle(x, yB, threshold, bgDist)) yB--;
    if (yB < imgHeight - 1) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(x, imgHeight);
      overlayCtx.lineTo(x, yB);
      overlayCtx.stroke();
    }
  }

  overlayCtx.restore();
}

// ---------- Перерисовка при изменении параметров ----------
thresholdEl.addEventListener('input', () => {
  thresholdVal.textContent = thresholdEl.value;
  drawHatching();
});
bgDistEl.addEventListener('input', () => {
  bgDistVal.textContent = bgDistEl.value;
  drawHatching();
});
stepEl.addEventListener('input', () => {
  stepVal.textContent = stepEl.value;
  drawHatching();
});
showGridEl.addEventListener('change', drawGrid);
</script>

</body>
</html>
