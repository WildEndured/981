<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Anime Face Detector — zoom + pan + zones</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1e1e24; color: #e5e5ea; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 8px 14px; background: #2a2a33; border-bottom: 1px solid #3a3a45; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
  h1 { margin: 0; font-size: 16px; }
  .hint { font-size: 11px; color: #9a9aa8; }

  .app { display: grid; grid-template-columns: 300px 1fr; flex: 1; min-height: 0; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .side { max-height: 42vh; overflow-y: auto; border-right: none !important; border-bottom: 1px solid #3a3a45; }
  }

  .side { background: #23232b; border-right: 1px solid #3a3a45; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .panel { background: #26262e; padding: 10px 12px; border-radius: 8px; flex-shrink: 0; }
  .panel h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #9a9aa8; }
  .methods label { display: block; padding: 6px 8px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; background: #1e1e24; border: 1px solid transparent; font-size: 12px; }
  .methods label:hover { background: #2f2f3a; }
  .methods input { margin-right: 8px; }
  .methods label.active { border-color: #4f9dff; background: #2b3550; }
  .desc { font-size: 11px; color: #9a9aa8; margin-top: 6px; line-height: 1.4; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row button { flex: 1; }
  button { background: #4f9dff; color: #fff; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
  button:hover { background: #6aabff; }
  button:disabled { opacity: .4; cursor: default; }
  button.gray { background: #3a3a45; }
  button.gray:hover { background: #4a4a55; }
  button.active { background: #ff9d4f; }
  .stat { font-size: 11px; color: #b0b0be; margin-top: 8px; line-height: 1.4; }
  .stat b { color: #e5e5ea; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; }
  .slider-row span { width: 40px; text-align: right; color: #9a9aa8; }
  .toggle { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: #c0c0cc; cursor: pointer; user-select: none; }
  .toggle input { cursor: pointer; }
  .legend { font-size: 11px; color: #88889a; margin-top: 8px; line-height: 1.7; }
  .legend .l { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 2px solid; vertical-align: middle; }
  .legend .d { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 2px dashed; vertical-align: middle; }
  .zone-info { font-size: 11px; color: #9a9aa8; margin-top: 6px; line-height: 1.5; }

  /* ===== область холста ===== */
  .canvasWrap {
    position: relative;
    overflow: hidden;
    background: #0f0f14;
    touch-action: none;              /* жесты обрабатываем сами */
    user-select: none; -webkit-user-select: none;
  }
  .canvasWrap.empty::after {
    content: 'Перетащите картинку сюда, Ctrl+V или «Пример»';
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #55556a; font-size: 13px; pointer-events: none; text-align: center; padding: 20px;
  }
  .canvasWrap.drag { box-shadow: inset 0 0 0 3px #4f9dff; }

  /* сам холст = реальный размер изображения, масштабируется через transform */
  #cv {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    image-rendering: auto;
    will-change: transform;
    touch-action: none;
  }
  /* сетка-шахматка под прозрачность — на фоне wrap */
  .canvasWrap.transparent {
    background-image:
      linear-gradient(45deg, #1a1a20 25%, transparent 25%),
      linear-gradient(-45deg, #1a1a20 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1a20 75%),
      linear-gradient(-45deg, transparent 75%, #1a1a20 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }

  /* зум-панель */
  .zoomBar {
    position: absolute; bottom: 12px; right: 12px;
    display: flex; gap: 4px; background: rgba(30,30,36,0.92);
    border: 1px solid #3a3a45; border-radius: 8px; padding: 4px;
    align-items: center; z-index: 5;
  }
  .zoomBar button {
    width: 32px; height: 32px; padding: 0;
    background: #2a2a33; font-size: 16px; line-height: 1;
  }
  .zoomBar button:hover { background: #3a3a45; }
  .zoomBar .level { font-size: 11px; color: #b0b0be; min-width: 48px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>🎨 Anime Face Detector — zoom + pan</h1>
  <span class="hint">колесо/пинч — зум · 2 пальца / пробел / средняя кнопка — пан · Enter — искать</span>
</header>

<div class="app">
  <aside class="side">
    <div class="panel">
      <h2>Метод-детектор</h2>
      <div class="methods" id="methods">
        <label class="active"><input type="radio" name="m" value="skin" checked>1. Skin (YCbCr)</label>
        <label><input type="radio" name="m" value="eyes">2. Глаза + геометрия</label>
        <label><input type="radio" name="m" value="ncc">3. NCC multi-scale</label>
        <label><input type="radio" name="m" value="sym">4. Симметрия</label>
        <label><input type="radio" name="m" value="all">5. Все + NMS</label>
      </div>
      <div class="desc" id="desc"></div>
    </div>

    <div class="panel">
      <h2>Зоны поиска</h2>
      <button id="btnZoneMode" class="gray" style="width:100%">🖊 Разметка (Z)</button>
      <div class="row">
        <button id="btnAutoZones" class="gray">Авто-зоны</button>
        <button id="btnClearZones" class="gray">Очистить</button>
      </div>
      <div class="zone-info" id="zoneInfo">Зон: 0</div>
    </div>

    <div class="panel">
      <h2>Параметры</h2>
      <input type="file" id="file" accept="image/*" style="width:100%; font-size:11px;">
      <div class="slider-row"><label>Порог</label><input type="range" id="thr" min="1" max="100" value="50" style="flex:1"><span id="thrV">50</span></div>
      <label class="toggle"><input type="checkbox" id="verify" checked> Верификация глазами</label>
      <label class="toggle"><input type="checkbox" id="colorEyes" checked> Цветовой бонус глаз</label>
      <label class="toggle"><input type="checkbox" id="zoneSoft"> Мягкий режим зон</label>
      <div class="stat" id="stat">Загрузите картинку</div>
      <div class="legend">
        <span class="l" style="border-color:#4f9dff"></span>лицо
        <span class="l" style="border-color:#ff4f9d; margin-left:6px"></span>глаза<br>
        <span class="d" style="border-color:#ffd24f"></span>зона
        <span class="l" style="border-color:#ff9d4f; margin-left:6px"></span>рисуемая
      </div>
    </div>

    <div class="row" style="padding: 0 2px;">
      <button id="btn2" class="gray">Пример</button>
      <button id="btnSave" class="gray" disabled>PNG</button>
    </div>
  </aside>

  <div class="canvasWrap empty" id="wrap">
    <canvas id="cv"></canvas>
    <div class="zoomBar">
      <button id="zOut" title="Уменьшить">−</button>
      <span class="level" id="zLevel">100%</span>
      <button id="zIn" title="Увеличить">+</button>
      <button id="zFit" title="Вписать" style="font-size:11px;">⤢</button>
      <button id="z1" title="1:1" style="font-size:11px;">1:1</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ГЛОБАЛЬНЫЕ
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');

let imgData = null, W = 0, H = 0;
let srcImage = null;
let _grayCache = null;
let lastBoxes = [];

// --- viewport (зум/пан) ---
const view = { scale: 1, tx: 0, ty: 0 };
const MIN_SCALE = 0.1, MAX_SCALE = 16;

// --- зоны ---
let zones = [];
let drawingMode = false;
let drawing = null;              // создаваемая зона (в координатах изображения)
let selectedZone = -1;
let interaction = null;          // { type:'create'|'move'|'resize', idx, handle, startImg, orig }
const HANDLE_R_PX = 14;
const CORNER_HIT_PX = 22;

// --- жесты ---
const pointers = new Map();      // pointerId -> {sx, sy} в экранных коорд. относительно wrap
let gesture = null;              // { kind:'pinch'|'pan', startDist, startCenter, startScale, startTx, startTy, ... }
let spaceDown = false;

const DESCR = {
  skin: "Маска кожи YCbCr → компоненты → фильтр формы. Верификация глазами.",
  eyes: "Тёмные блобы + цветовой бонус → пары 'глаз' → бокс лица.",
  ncc:  "NCC с шаблонами глаза (16/24/32 px) → боксы лица.",
  sym:  "Skin-кандидаты + симметрия.",
  all:  "Объединение skin+eyes+NCC + симметрия + NMS."
};

// ============================================================
// VIEWPORT: применение transform
// ============================================================
function applyView() {
  cv.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.scale})`;
  document.getElementById('zLevel').textContent = Math.round(view.scale * 100) + '%';
}

function fitToScreen() {
  if (!W || !H) return;
  const rw = wrap.clientWidth, rh = wrap.clientHeight;
  const s = Math.min(rw / W, rh / H) * 0.96;
  view.scale = s;
  view.tx = (rw - W * s) / 2;
  view.ty = (rh - H * s) / 2;
  applyView();
}

function setZoom(newScale, cx, cy) {
  // cx,cy — экранные коорд. относительно wrap (центр зума)
  if (cx === undefined) { cx = wrap.clientWidth / 2; cy = wrap.clientHeight / 2; }
  const s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
  const wx = (cx - view.tx) / view.scale;
  const wy = (cy - view.ty) / view.scale;
  view.scale = s;
  view.tx = cx - wx * s;
  view.ty = cy - wy * s;
  applyView();
}

function zoomBy(factor, cx, cy) { setZoom(view.scale * factor, cx, cy); }

// экранные коорд. (clientX/Y) → координаты изображения
function clientToImage(clientX, clientY) {
  const r = wrap.getBoundingClientRect();
  const sx = clientX - r.left;
  const sy = clientY - r.top;
  return {
    x: (sx - view.tx) / view.scale,
    y: (sy - view.ty) / view.scale,
    sx, sy                      // экранные относит. wrap
  };
}
// координаты изображения → экранные относительно wrap
function imageToScreen(ix, iy) {
  return { x: ix * view.scale + view.tx, y: iy * view.scale + view.ty };
}

// ============================================================
// ЗАГРУЗКА
// ============================================================
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => loadImage(ev.target.result);
  r.readAsDataURL(f);
});

document.getElementById('btn2').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = 500; c.height = 400;
  const g = c.getContext('2d');
  g.fillStyle = '#c8d8e8'; g.fillRect(0, 0, 500, 400);
  g.fillStyle = '#3a2545'; g.beginPath(); g.ellipse(250, 220, 170, 210, 0, 0, 7); g.fill();
  g.fillStyle = '#ffe0c8'; g.beginPath(); g.ellipse(250, 220, 130, 160, 0, 0, 7); g.fill();
  g.fillStyle = '#1a1a3a';
  g.beginPath(); g.ellipse(200, 200, 28, 38, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(300, 200, 28, 38, 0, 0, 7); g.fill();
  g.fillStyle = '#4f9dff';
  g.beginPath(); g.ellipse(200, 205, 16, 22, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(300, 205, 16, 22, 0, 0, 7); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(192, 190, 9, 0, 7); g.fill();
  g.beginPath(); g.arc(292, 190, 9, 0, 7); g.fill();
  g.strokeStyle = '#c04060'; g.lineWidth = 4;
  g.beginPath(); g.arc(250, 290, 22, 0.2, Math.PI - 0.2); g.stroke();
  loadImage(c.toDataURL());
});

function loadImage(src) {
  const im = new Image();
  im.onload = () => {
    srcImage = im;
    W = im.width;
    H = im.height;
    cv.width = W; cv.height = H;
    ctx.drawImage(im, 0, 0);
    imgData = ctx.getImageData(0, 0, W, H);

    _grayCache = null;
    lastBoxes = []; zones = []; selectedZone = -1;
    updateZoneInfo();
    wrap.classList.remove('empty');
    document.getElementById('btnSave').disabled = true;

    // подгоняем масштаб под окно
    fitToScreen();

    document.getElementById('stat').textContent = `Готово: ${W}×${H}`;
    drawAll();
  };
  im.src = src;
}

// ресайз окна → сохранить/подогнать вид
let resizeTO = null;
window.addEventListener('resize', () => {
  if (!W) return;
  clearTimeout(resizeTO);
  resizeTO = setTimeout(() => { /* оставляем текущий зум, только обновим позицию */ applyView(); }, 100);
});

// ============================================================
// УТИЛИТЫ
// ============================================================
function grayPixels() {
  const g = new Uint8Array(W * H);
  const d = imgData.data;
  for (let i = 0, j = 0; i < d.length; i += 4, j++)
    g[j] = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) | 0;
  return g;
}
function grayCached() {
  if (!_grayCache) _grayCache = grayPixels();
  return _grayCache;
}
function iou(a, b) {
  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x+a.w, b.x+b.w), y2 = Math.min(a.y+a.h, b.y+b.h);
  const iw = Math.max(0, x2-x1), ih = Math.max(0, y2-y1);
  const inter = iw*ih;
  return inter / (a.w*a.h + b.w*b.h - inter || 1);
}
function nms(boxes, thr = 0.3) {
  if (!boxes.length) return boxes;
  const sorted = [...boxes].sort((a, b) => (b.score||0) - (a.score||0));
  const keep = [];
  for (const b of sorted) if (keep.every(k => iou(k, b) < thr)) keep.push(b);
  return keep;
}
function erode(mask, w, h) {
  const out = new Uint8Array(w*h);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) {
    let s = 1;
    for (let dy = -1; dy <= 1 && s; dy++)
      for (let dx = -1; dx <= 1; dx++)
        if (!mask[(y+dy)*w + (x+dx)]) { s = 0; break; }
    out[y*w + x] = s;
  }
  return out;
}
function dilate(mask, w, h) {
  const out = new Uint8Array(w*h);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) {
    let s = 0;
    for (let dy = -1; dy <= 1 && !s; dy++)
      for (let dx = -1; dx <= 1; dx++)
        if (mask[(y+dy)*w + (x+dx)]) { s = 1; break; }
    out[y*w + x] = s;
  }
  return out;
}
function connectedComponents(mask, w, h, minArea = 20) {
  const labels = new Int32Array(w*h).fill(-1);
  const comps = [];
  const stack = [];
  let L = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const idx = y*w + x;
    if (!mask[idx] || labels[idx] !== -1) continue;
    stack.length = 0; stack.push(x, y);
    labels[idx] = L;
    let minX = x, minY = y, maxX = x, maxY = y, area = 0;
    while (stack.length) {
      const py = stack.pop(), px = stack.pop();
      area++;
      if (px < minX) minX = px; if (px > maxX) maxX = px;
      if (py < minY) minY = py; if (py > maxY) maxY = py;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = px + dx, ny = py + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const ni = ny*w + nx;
        if (mask[ni] && labels[ni] === -1) { labels[ni] = L; stack.push(nx, ny); }
      }
    }
    if (area >= minArea)
      comps.push({ x: minX, y: minY, w: maxX-minX+1, h: maxY-minY+1, area });
    L++;
  }
  return comps;
}
function otsuThreshold(gray, x0, y0, w, h) {
  const hist = new Uint32Array(256);
  let total = 0;
  for (let y = y0; y < y0 + h; y++)
    for (let x = x0; x < x0 + w; x++) { hist[gray[y*W + x]]++; total++; }
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, maxVar = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > maxVar) { maxVar = v; thr = t; }
  }
  return thr;
}
function colorEyeScore(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const s = max === 0 ? 0 : (max - min) / max;
  let h = 0;
  if (max !== min) {
    if (max === r) h = 60 * (((g - b) / (max - min)) % 6);
    else if (max === g) h = 60 * ((b - r) / (max - min) + 2);
    else h = 60 * ((r - g) / (max - min) + 4);
  }
  if (h < 0) h += 360;
  return (s > 0.35 && (h < 15 || h > 50)) ? 1 : 0;
}

// ============================================================
// ЗОНЫ
// ============================================================
function inAnyZone(box) {
  if (!zones.length) return true;
  const cx = box.x + box.w/2, cy = box.y + box.h/2;
  for (const z of zones)
    if (cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h) return true;
  return false;
}

function makeAutoZones() {
  if (!imgData) return [];
  const d = imgData.data;
  const mask = new Uint8Array(W*H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const cb = 128 - 0.168736*r - 0.331264*g + 0.5*b;
    const cr = 128 + 0.5*r - 0.418688*g - 0.081312*b;
    if (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173) mask[j] = 1;
  }
  const m2 = erode(mask, W, H), m3 = dilate(m2, W, H);
  const comps = connectedComponents(m3, W, H, Math.round(W*H*0.005));
  const zs = [];
  for (const c of comps) {
    const fill = c.area / (c.w*c.h);
    const ar = c.h / c.w;
    if (fill < 0.25) continue;
    if (ar < 0.3 || ar > 2.5) continue;
    const ex = c.w * 0.2, ey = c.h * 0.2;
    const x = Math.max(0, c.x - ex), y = Math.max(0, c.y - ey);
    zs.push({ x, y, w: Math.min(W - x, c.w + 2*ex), h: Math.min(H - y, c.h + 2*ey) });
  }
  return zs;
}

function updateZoneInfo() {
  document.getElementById('zoneInfo').textContent = zones.length
    ? `Зон: ${zones.length} · тап — выбрать, тянуть за ручки`
    : 'Зон: 0 (поиск по всему изображению)';
}

// ручки выбранной зоны в ЭКРАННЫХ координатах (не зависят от зума)
function getScreenHandles(zone) {
  const x0 = zone.x * view.scale + view.tx;
  const y0 = zone.y * view.scale + view.ty;
  const x1 = (zone.x + zone.w) * view.scale + view.tx;
  const y1 = (zone.y + zone.h) * view.scale + view.ty;
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  return {
    nw: { x: x0, y: y0 }, n: { x: mx, y: y0 }, ne: { x: x1, y: y0 },
    w:  { x: x0, y: my },                     e:  { x: x1, y: my },
    sw: { x: x0, y: y1 }, s: { x: mx, y: y1 }, se: { x: x1, y: y1 }
  };
}

function hitZone(sx, sy) {
  // ручки выбранной зоны (экранные px)
  if (selectedZone >= 0 && selectedZone < zones.length) {
    const h = getScreenHandles(zones[selectedZone]);
    for (const key in h) {
      const dx = sx - h[key].x, dy = sy - h[key].y;
      if (dx*dx + dy*dy < CORNER_HIT_PX * CORNER_HIT_PX)
        return { type: 'resize', idx: selectedZone, handle: key };
    }
  }
  // сами зоны (по центру, в координатах изображения)
  for (let i = zones.length - 1; i >= 0; i--) {
    const z = zones[i];
    const s = imageToScreen(z.x, z.y);
    const x1 = s.x + z.w * view.scale;
    const y1 = s.y + z.h * view.scale;
    if (sx >= s.x && sx <= x1 && sy >= s.y && sy <= y1)
      return { type: 'move', idx: i };
  }
  return null;
}

// ============================================================
// РИСОВАНИЕ
// ============================================================
function drawAll() {
  ctx.drawImage(srcImage, 0, 0);

  // боксы
  for (const b of lastBoxes) {
    ctx.lineWidth = 2 / view.scale;    // постоянная толщина на экране
    ctx.strokeStyle = '#4f9dff';
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#4f9dff';
    ctx.font = `bold ${Math.max(10, 12 / view.scale)}px sans-serif`;
    ctx.fillText(Math.round((b.score||0) * 100) + '%', b.x, Math.max(12/view.scale, b.y - 4/view.scale));
    if (b.eyes) {
      ctx.strokeStyle = '#ff4f9d';
      for (const e of b.eyes) ctx.strokeRect(e.x, e.y, e.w, e.h);
    }
  }

  // зоны
  for (let i = 0; i < zones.length; i++) {
    const z = zones[i];
    const isSel = i === selectedZone;
    ctx.setLineDash([6/view.scale, 4/view.scale]);
    ctx.lineWidth = (isSel ? 3 : 2) / view.scale;
    ctx.strokeStyle = isSel ? '#ffd24f' : 'rgba(255,210,79,0.75)';
    ctx.strokeRect(z.x, z.y, z.w, z.h);
    if (isSel) {
      ctx.fillStyle = 'rgba(255,210,79,0.08)';
      ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.setLineDash([]);

      // ручки — в экранных пикселях, постоянный размер
      const sh = getScreenHandles(z);
      const rImg = HANDLE_R_PX / view.scale;
      for (const k in sh) {
        const ix = (sh[k].x - view.tx) / view.scale;
        const iy = (sh[k].y - view.ty) / view.scale;
        ctx.fillStyle = '#ffd24f';
        ctx.beginPath(); ctx.arc(ix, iy, rImg, 0, 7); ctx.fill();
        ctx.strokeStyle = '#1e1e24'; ctx.lineWidth = 2 / view.scale;
        ctx.beginPath(); ctx.arc(ix, iy, rImg, 0, 7); ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }

  // текущая новая зона
  if (drawing) {
    ctx.setLineDash([6/view.scale, 4/view.scale]);
    ctx.lineWidth = 2 / view.scale;
    ctx.strokeStyle = '#ff9d4f';
    ctx.strokeRect(drawing.x, drawing.y, drawing.w, drawing.h);
    ctx.setLineDash([]);
  }
}

// ============================================================
// МЕТОДЫ-ДЕТЕКТОРЫ
// ============================================================
function methodSkin(threshold = 0.5) {
  const d = imgData.data;
  const mask = new Uint8Array(W*H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const cb = 128 - 0.168736*r - 0.331264*g + 0.5*b;
    const cr = 128 + 0.5*r - 0.418688*g - 0.081312*b;
    if (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173) mask[j] = 1;
  }
  const m2 = erode(mask, W, H), m3 = dilate(m2, W, H);
  const comps = connectedComponents(m3, W, H, 300);
  const boxes = [];
  for (const c of comps) {
    const ar = c.h / c.w;
    if (ar < 0.4 || ar > 1.6) continue;
    const fill = c.area / (c.w*c.h);
    if (fill < 0.35) continue;
    boxes.push({ x: c.x, y: c.y, w: c.w, h: c.h, score: Math.min(1, fill*1.2) });
  }
  return nms(boxes, 0.4);
}

function methodEyes(threshold = 0.5) {
  const g = grayCached();
  const t = 60 + threshold * 40;
  const mask = new Uint8Array(W*H);
  for (let i = 0; i < g.length; i++) if (g[i] < t) mask[i] = 1;
  const m2 = erode(mask, W, H);
  const comps = connectedComponents(m2, W, H, 60);
  const eyes = comps.filter(c => {
    const ar = c.w / c.h;
    const fill = c.area / (c.w*c.h);
    return ar > 0.4 && ar < 2.5 && fill > 0.35 &&
           c.area > 80 && c.area < W*H*0.05;
  });
  const boxes = [];
  for (let i = 0; i < eyes.length; i++) for (let j = i+1; j < eyes.length; j++) {
    const a = eyes[i], b = eyes[j];
    const dy = Math.abs((a.y+a.h/2) - (b.y+b.h/2));
    const dx = Math.abs((a.x+a.w/2) - (b.x+b.w/2));
    const sizeAvg = (a.w + b.w) / 2;
    if (dy > sizeAvg * 0.6) continue;
    const ratio = dx / sizeAvg;
    if (ratio < 1.2 || ratio > 4) continue;
    if (Math.max(a.w,b.w) / Math.min(a.w,b.w) > 2) continue;
    const cx = (a.x + a.w/2 + b.x + b.w/2) / 2;
    const cyEyes = (a.y + a.h/2 + b.y + b.h/2) / 2;
    const eyeSpan = dx + sizeAvg;
    const fw = eyeSpan * 1.6, fh = fw * 1.3;
    boxes.push({ x: cx - fw/2, y: cyEyes - fh * 0.42, w: fw, h: fh, score: 0.9 });
  }
  return nms(boxes, 0.3);
}

function makeEyeTemplate(size) {
  const t = new Float32Array(size*size);
  const cx = size/2, cy = size/2;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (x - cx) / (size*0.32), dy = (y - cy) / (size*0.45);
    const r2 = dx*dx + dy*dy;
    let v = r2 < 1 ? 0.15 : 0.9;
    const bx = (x - cx*0.7) / (size*0.1), by = (y - cy*0.8) / (size*0.12);
    if (bx*bx + by*by < 1) v = 1;
    t[y*size + x] = v;
  }
  return { data: t, size };
}
const TEMPLATES = [16, 24, 32].map(s => makeEyeTemplate(s));

function nccScan(gF, tpl, tMin, STEP) {
  const { data: T, size: S } = tpl;
  const I = new Float64Array((W+1)*(H+1));
  const I2 = new Float64Array((W+1)*(H+1));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = gF[y*W + x];
    I[(y+1)*(W+1) + (x+1)]  = v   + I[y*(W+1)+(x+1)]     + I[(y+1)*(W+1)+x]     - I[y*(W+1)+x];
    I2[(y+1)*(W+1) + (x+1)] = v*v + I2[y*(W+1)+(x+1)]    + I2[(y+1)*(W+1)+x]    - I2[y*(W+1)+x];
  }
  const sumT = T.reduce((a, b) => a + b, 0);
  const sumT2 = T.reduce((a, b) => a + b*b, 0);
  const N = S*S;
  const raw = [];
  for (let y = 0; y + S < H; y += STEP) for (let x = 0; x + S < W; x += STEP) {
    const a  = I[y*(W+1)+x],      b  = I[y*(W+1)+x+S];
    const c  = I[(y+S)*(W+1)+x],  dd = I[(y+S)*(W+1)+x+S];
    const sumI = dd - b - c + a;
    const a2  = I2[y*(W+1)+x],     b2  = I2[y*(W+1)+x+S];
    const c2  = I2[(y+S)*(W+1)+x], d2  = I2[(y+S)*(W+1)+x+S];
    const sumI2 = d2 - b2 - c2 + a2;
    let sumIT = 0;
    for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++)
      sumIT += gF[(y+yy)*W + (x+xx)] * T[yy*S + xx];
    const num = sumIT - sumI*sumT/N;
    const den = Math.sqrt((sumI2 - sumI*sumI/N) * (sumT2 - sumT*sumT/N));
    const ncc = den > 1e-6 ? num / den : 0;
    if (ncc > tMin) raw.push({ x, y, w: S, h: S, score: ncc });
  }
  return raw;
}

function methodNCC(threshold = 0.5) {
  const g = grayCached();
  const gF = new Float32Array(W*H);
  for (let i = 0; i < g.length; i++) gF[i] = g[i] / 255;
  const tMin = 0.45 + threshold * 0.3;
  const STEP = 3;
  const allRaw = [];
  for (const tpl of TEMPLATES) allRaw.push(...nccScan(gF, tpl, tMin, STEP));
  const face = allRaw.map(b => {
    const fw = b.w * 3, fh = fw * 1.3;
    return { x: b.x - fw*0.28, y: b.y + b.h*0.1, w: fw, h: fh, score: b.score };
  });
  return nms(face, 0.25);
}

function symmetryScore(g, b) {
  const x0 = Math.max(0, b.x), x1 = Math.min(W, b.x + b.w);
  const y0 = Math.max(0, b.y), y1 = Math.min(H, b.y + b.h);
  const bw = x1 - x0, half = Math.floor(bw / 2);
  let sad = 0, n = 0;
  for (let y = y0; y < y1; y++) for (let x = 0; x < half; x++) {
    sad += Math.abs(g[y*W + x0+x] - g[y*W + x1-1-x]); n++;
  }
  if (!n) return 0;
  return Math.max(0, Math.min(1, 1 - (sad / n) / 255));
}

function methodSymmetry(threshold = 0.5) {
  const g = grayCached();
  const base = methodSkin(threshold);
  const out = [];
  for (const b of base) {
    const s = symmetryScore(g, b);
    if (s > 0.72) out.push({ ...b, score: s });
  }
  return out;
}

function methodAll(threshold = 0.5) {
  const g = grayCached();
  const a = methodSkin(threshold), b = methodEyes(threshold), c = methodNCC(threshold);
  const all = [...a, ...b, ...c].map(x => ({
    ...x, score: (x.score||0) * 0.5 + symmetryScore(g, x) * 0.5
  }));
  return nms(all.filter(b => symmetryScore(g, b) > 0.65), 0.3);
}

// ============================================================
// ГЛАЗА В ROI + ВЕРИФИКАЦИЯ
// ============================================================
function roiLooksLikeFace(gray, roi) {
  const rx = Math.max(0, roi.x|0), ry = Math.max(0, roi.y|0);
  const rw = Math.min(W - rx, roi.w|0), rh = Math.min(H - ry, roi.h|0);
  if (rw < 20 || rh < 20) return false;
  let dark = 0, total = 0, min = 255, max = 0;
  for (let y = 0; y < rh; y += 2) for (let x = 0; x < rw; x += 2) {
    const v = gray[(ry+y)*W + (rx+x)];
    if (v < 90) dark++;
    if (v < min) min = v;
    if (v > max) max = v;
    total++;
  }
  const darkRatio = dark / total;
  return (max - min) > 50 && darkRatio > 0.005 && darkRatio < 0.6;
}

function findEyesInROI(gray, roi) {
  const rx = Math.max(0, roi.x | 0);
  const ry = Math.max(0, roi.y | 0);
  const rw = Math.min(W - rx, roi.w | 0);
  const rh = Math.min(H - ry, roi.h | 0);
  if (rw < 20 || rh < 20) return null;
  if (!roiLooksLikeFace(gray, roi)) return null;

  const t = Math.min(115, Math.max(40, otsuThreshold(gray, rx, ry, rw, rh)));
  const mask = new Uint8Array(rw * rh);
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++)
    if (gray[(ry + y)*W + (rx + x)] < t) mask[y*rw + x] = 1;

  const m2 = erode(mask, rw, rh), m3 = dilate(m2, rw, rh);
  const comps = connectedComponents(m3, rw, rh, 20);
  const eyes = comps.filter(c => {
    const ar = c.w / c.h;
    const fill = c.area / (c.w * c.h);
    const areaRatio = c.area / (rw * rh);
    return ar > 0.35 && ar < 3.0 && fill > 0.3 &&
           areaRatio > 0.004 && areaRatio < 0.25;
  });
  if (eyes.length < 2) return null;

  const useColor = document.getElementById('colorEyes').checked;
  const d = imgData.data;

  let best = null, bestScore = -Infinity;
  for (let i = 0; i < eyes.length; i++) for (let j = i + 1; j < eyes.length; j++) {
    const a = eyes[i], b = eyes[j];
    const ax = a.x + a.w/2, ay = a.y + a.h/2;
    const bx = b.x + b.w/2, by = b.y + b.h/2;
    const dx = Math.abs(ax - bx), dy = Math.abs(ay - by);
    const sAvg = (a.w + b.w) / 2;
    const sRatio = Math.max(a.w, b.w) / Math.min(a.w, b.w);
    if (sAvg < 3) continue;
    if (dy > sAvg * 0.7) continue;
    const rel = dx / sAvg;
    if (rel < 1.0 || rel > 4.5) continue;
    if (sRatio > 2.2) continue;
    if (Math.max(ay, by) / rh > 0.75) continue;

    let colorBonus = 0;
    if (useColor) {
      for (const e of [a, b]) {
        const mx = rx + e.x + (e.w>>1), my = ry + e.y + (e.h>>1);
        const idx = (my*W + mx) * 4;
        colorBonus += colorEyeScore(d[idx], d[idx+1], d[idx+2]);
      }
      colorBonus /= 2;
    }

    const score = (1 - Math.abs(rel - 2) / 2.5) - dy / sAvg * 1.5 - (sRatio - 1) * 1.5 + colorBonus * 0.6;
    if (score > bestScore) {
      bestScore = score;
      best = [
        { x: rx + a.x, y: ry + a.y, w: a.w, h: a.h },
        { x: rx + b.x, y: ry + b.y, w: b.w, h: b.h }
      ];
    }
  }
  return best ? { pair: best, score: Math.max(0, bestScore) } : null;
}

function verifyFaceByEyes(gray, faceBox) {
  const res = findEyesInROI(gray, faceBox);
  if (!res) return null;
  const [e1, e2] = res.pair;
  const cx = (e1.x + e1.w/2 + e2.x + e2.w/2) / 2;
  const cyEyes = (e1.y + e1.h/2 + e2.y + e2.h/2) / 2;
  const eyeSpan = Math.abs((e1.x + e1.w/2) - (e2.x + e2.w/2)) + (e1.w + e2.w)/2;
  const fw = Math.max(eyeSpan * 1.7, faceBox.w * 0.8);
  const fh = fw * 1.25;
  return {
    x: cx - fw/2, y: cyEyes - fh * 0.40, w: fw, h: fh,
    score: Math.max(0, Math.min(1, (faceBox.score||0.5) * 0.5 + 0.5 + res.score*0.05)),
    eyes: res.pair
  };
}

// ============================================================
// ЖЕСТЫ (wheel, pinch, pan) + разметка зон
// ============================================================
let lastTap = { time: 0, x: 0, y: 0 };

function localPoint(e) {
  const r = wrap.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// колесо
wrap.addEventListener('wheel', e => {
  if (!imgData) return;
  e.preventDefault();
  const p = localPoint(e);
  const factor = Math.exp(-e.deltaY * 0.0015);   // плавный зум
  zoomBy(factor, p.x, p.y);
}, { passive: false });

wrap.addEventListener('pointerdown', e => {
  if (!imgData) return;
  e.preventDefault();
  wrap.setPointerCapture(e.pointerId);

  const p = localPoint(e);
  pointers.set(e.pointerId, p);

  // 2+ пальца → pinch/pan жест
  if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const center = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    gesture = {
      kind: 'pinch',
      startDist: dist,
      startCenter: center,
      startScale: view.scale,
      startTx: view.tx,
      startTy: view.ty
    };
    // отменяем активное рисование
    drawing = null; interaction = null;
    drawAll();
    return;
  }

  // средняя кнопка мыши / пробел → пан
  if (e.button === 1 || spaceDown) {
    gesture = { kind: 'pan', startX: p.x, startY: p.y, startTx: view.tx, startTy: view.ty };
    return;
  }

  if (pointers.size !== 1) return;

  // двойной тап
  const now = Date.now();
  if (now - lastTap.time < 320 &&
      Math.abs(p.x - lastTap.x) < 25 && Math.abs(p.y - lastTap.y) < 25) {
    const hit = hitZone(p.x, p.y);
    if (hit) {
      // двойной тап по зоне — удалить
      zones.splice(hit.idx, 1);
      selectedZone = -1;
      updateZoneInfo(); drawAll();
      lastTap.time = 0;
      return;
    } else {
      // двойной тап по пустоте — сброс зума
      fitToScreen();
      lastTap.time = 0;
      return;
    }
  }
  lastTap = { time: now, x: p.x, y: p.y };

  // режим разметки: ручки/перемещение/новая зона
  if (drawingMode) {
    const hit = hitZone(p.x, p.y);
    if (hit && hit.type === 'resize') {
      const z = zones[hit.idx];
      interaction = {
        type: 'resize', idx: hit.idx, handle: hit.handle,
        startImg: { x: (p.x - view.tx) / view.scale, y: (p.y - view.ty) / view.scale },
        orig: { x: z.x, y: z.y, w: z.w, h: z.h }
      };
      return;
    }
    if (hit && hit.type === 'move') {
      selectedZone = hit.idx;
      const z = zones[hit.idx];
      interaction = {
        type: 'move', idx: hit.idx,
        startImg: { x: (p.x - view.tx) / view.scale, y: (p.y - view.ty) / view.scale },
        orig: { x: z.x, y: z.y, w: z.w, h: z.h }
      };
      drawAll();
      return;
    }
    // новая зона
    const ix = (p.x - view.tx) / view.scale;
    const iy = (p.y - view.ty) / view.scale;
    drawing = { x: ix, y: iy, w: 0, h: 0 };
    selectedZone = -1;
    drawAll();
  } else {
    // выбор зоны или пан-жест за пустоту
    const hit = hitZone(p.x, p.y);
    if (hit) {
      selectedZone = hit.idx;
      drawAll();
    } else {
      selectedZone = -1;
      gesture = { kind: 'pan', startX: p.x, startY: p.y, startTx: view.tx, startTy: view.ty };
      drawAll();
    }
  }
});

wrap.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const p = localPoint(e);
  pointers.set(e.pointerId, p);

  // пинч
  if (gesture && gesture.kind === 'pinch' && pointers.size >= 2) {
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const center = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };

    const scaleFactor = dist / gesture.startDist;
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, gesture.startScale * scaleFactor));
    // точка под startCenter должна оказаться под center
    const wx = (gesture.startCenter.x - gesture.startTx) / gesture.startScale;
    const wy = (gesture.startCenter.y - gesture.startTy) / gesture.startScale;
    view.scale = newScale;
    view.tx = center.x - wx * newScale;
    view.ty = center.y - wy * newScale;
    applyView();
    drawAll();
    return;
  }

  // пан
  if (gesture && gesture.kind === 'pan') {
    view.tx = gesture.startTx + (p.x - gesture.startX);
    view.ty = gesture.startTy + (p.y - gesture.startY);
    applyView();
    drawAll();
    return;
  }

  if (pointers.size !== 1) return;

  // создание зоны
  if (drawing) {
    const ix = (p.x - view.tx) / view.scale;
    const iy = (p.y - view.ty) / view.scale;
    drawing.w = ix - drawing.x;
    drawing.h = iy - drawing.y;
    drawAll();
    return;
  }

  // ресайз / перенос
  if (interaction) {
    const ix = (p.x - view.tx) / view.scale;
    const iy = (p.y - view.ty) / view.scale;
    const dx = ix - interaction.startImg.x;
    const dy = iy - interaction.startImg.y;
    const o = interaction.orig;

    if (interaction.type === 'move') {
      zones[interaction.idx] = {
        x: Math.max(0, Math.min(W - o.w, o.x + dx)),
        y: Math.max(0, Math.min(H - o.h, o.y + dy)),
        w: o.w, h: o.h
      };
    } else if (interaction.type === 'resize') {
      let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
      const hd = interaction.handle;
      if (hd.includes('w')) x1 = o.x + dx;
      if (hd.includes('e')) x2 = o.x + o.w + dx;
      if (hd.includes('n')) y1 = o.y + dy;
      if (hd.includes('s')) y2 = o.y + o.h + dy;
      let nx = Math.min(x1, x2), ny = Math.min(y1, y2);
      let nw = Math.abs(x2 - x1), nh = Math.abs(y2 - y1);
      nx = Math.max(0, Math.min(W - 10, nx));
      ny = Math.max(0, Math.min(H - 10, ny));
      nw = Math.max(10, Math.min(W - nx, nw));
      nh = Math.max(10, Math.min(H - ny, nh));
      zones[interaction.idx] = { x: nx, y: ny, w: nw, h: nh };
    }
    drawAll();
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId) && !gesture) return;
  pointers.delete(e.pointerId);

  if (pointers.size < 2 && gesture && gesture.kind === 'pinch') {
    gesture = null;
  }
  if (pointers.size === 0 && gesture && gesture.kind === 'pan') {
    gesture = null;
  }

  if (drawing) {
    if (drawing.w < 0) { drawing.x += drawing.w; drawing.w = -drawing.w; }
    if (drawing.h < 0) { drawing.y += drawing.h; drawing.h = -drawing.h; }
    if (drawing.w > 8 && drawing.h > 8) {
      zones.push({ ...drawing });
      selectedZone = zones.length - 1;
    }
    drawing = null;
    updateZoneInfo();
    drawAll();
  }

  if (interaction) {
    interaction = null;
    updateZoneInfo();
    if (imgData) run();
  }
}

wrap.addEventListener('pointerup', endPointer);
wrap.addEventListener('pointercancel', endPointer);

// пробел → пан мышью
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spaceDown && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
    spaceDown = true;
    wrap.style.cursor = 'grab';
    e.preventDefault();
  }
  if (e.key === 'Enter' && imgData && e.target.tagName !== 'INPUT') run();
  if ((e.key === 'z' || e.key === 'Z') && imgData && e.target.tagName !== 'INPUT') {
    document.getElementById('btnZoneMode').click();
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && e.target.tagName !== 'INPUT') {
    zones = []; selectedZone = -1;
    updateZoneInfo(); drawAll();
    if (imgData) run();
  }
  if (e.key === '0') { if (imgData) fitToScreen(); }
  if (e.key === '1') { if (imgData) document.getElementById('z1').click(); }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { spaceDown = false; wrap.style.cursor = ''; }
});

// ============================================================
// ФАЙЛЫ / DRAG&DROP / PASTE
// ============================================================
document.getElementById('btnSave').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'faces.png';
  a.href = cv.toDataURL('image/png');
  a.click();
});

['dragenter','dragover'].forEach(ev => wrap.addEventListener(ev, e => {
  e.preventDefault(); wrap.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => wrap.addEventListener(ev, e => {
  e.preventDefault(); wrap.classList.remove('drag');
}));
wrap.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) {
    const r = new FileReader();
    r.onload = ev => loadImage(ev.target.result);
    r.readAsDataURL(f);
  }
});

window.addEventListener('paste', e => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith('image/')) {
      const f = item.getAsFile();
      const r = new FileReader();
      r.onload = ev => loadImage(ev.target.result);
      r.readAsDataURL(f);
      break;
    }
  }
});

// ============================================================
// ЗАПУСК ДЕТЕКТОРА
// ============================================================
function run() {
  if (!imgData) return;
  const thr = +document.getElementById('thr').value / 100;
  const needVerify = document.getElementById('verify').checked;
  const soft = document.getElementById('zoneSoft').checked;
  document.getElementById('btn').disabled = true;
  const t0 = performance.now();

  setTimeout(() => {
    try {
      const t1 = performance.now();
      const candidates = methods[currentMethod](thr);
      const tDet = performance.now() - t1;

      const t2 = performance.now();
      let boxes = candidates;
      if (needVerify) {
        const gray = grayCached();
        const verified = [];
        for (const b of boxes) {
          const v = verifyFaceByEyes(gray, b);
          if (v) verified.push(v);
        }
        boxes = nms(verified, 0.3);
      } else {
        boxes = nms(boxes, 0.3);
      }
      const tVer = performance.now() - t2;

      let inZones = boxes.length, outZones = 0;
      if (zones.length) {
        if (soft) {
          boxes = boxes.map(b => ({ ...b, score: (b.score||0) + (inAnyZone(b) ? 0.15 : 0) }));
          inZones = boxes.filter(inAnyZone).length;
          outZones = boxes.length - inZones;
        } else {
          const before = boxes.length;
          boxes = boxes.filter(inAnyZone);
          inZones = boxes.length;
          outZones = before - inZones;
        }
      }

      lastBoxes = boxes;
      drawAll();
      document.getElementById('btnSave').disabled = boxes.length === 0;

      const dt = (performance.now() - t0).toFixed(0);
      document.getElementById('stat').innerHTML =
        `Метод: <b>${currentMethod}</b> | кандидатов: ${candidates.length} | ` +
        `итог: <b>${boxes.length}</b>` +
        (zones.length ? ` (в зонах: ${inZones}, вне: ${outZones})` : '') + `<br>` +
        `детектор: ${tDet.toFixed(0)} мс · верификация: ${tVer.toFixed(0)} мс · всего: ${dt} мс`;
    } catch (err) {
      drawAll();
      document.getElementById('stat').textContent = 'Ошибка: ' + err.message;
      console.error(err);
    }
    document.getElementById('btn').disabled = false;
  }, 10);
}
</script>
