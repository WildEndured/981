<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова и шея</title>
<style>
  :root {
    --bg: #141419;
    --panel: #1e1e26;
    --panel-2: #262630;
    --accent: #e8b04b;
    --text: #e8e8f0;
    --muted: #8a8a99;
    --border: #33333f;
    --danger: #e85b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at top, #1c1c26 0%, var(--bg) 70%);
    color: var(--text); font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; gap: 20px;
  }
  header { text-align: center; }
  header h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  header p { margin: 0; font-size: .8rem; color: var(--muted); }
  .app {
    display: flex; gap: 24px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center;
    width: 100%; max-width: 950px;
  }
  .controls {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px 20px;
    width: 100%; max-width: 340px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .controls h2 {
    font-size: .75rem; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted);
    margin: 0 0 4px; font-weight: 600;
  }
  .control { display: flex; flex-direction: column; gap: 6px; }
  .control-head { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; }
  .badge {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--accent); font-variant-numeric: tabular-nums;
    font-size: .75rem; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
    min-width: 46px; text-align: center;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 3px;
    background: #33333f; outline: none; cursor: pointer; position: relative;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 0%), #33333f var(--fill, 0%), #33333f 100%);
    height: 6px; border-radius: 3px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent);
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
    cursor: pointer; transition: transform .15s; margin-top: -5px;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  .actions {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 12px; border-top: 1px solid var(--border); margin-top: 4px;
  }
  .btn-reset {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: .75rem; transition: all .2s;
  }
  .btn-reset:hover { border-color: var(--danger); color: var(--danger); }
  .checkbox-wrap {
    display: flex; align-items: center; gap: 6px;
    font-size: .75rem; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .checkbox-wrap input { accent-color: var(--accent); }
  canvas {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    max-width: 100%; height: auto;
  }
</style>
</head>
<body>

<header>
  <h1>Построение головы и шеи</h1>
  <p>Связанный контур черепа, челюсти и шеи</p>
</header>

<div class="app">
  <div class="controls">
    <h2>Голова</h2>

    <div class="control">
      <div class="control-head">
        <label for="rangeParts">Частей (голов)</label>
        <span class="badge" id="valParts">7</span>
      </div>
      <input id="rangeParts" type="range" min="3" max="10" value="7" step="1">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="rangeRadius">Размер круга</label>
        <span class="badge" id="valRadius">1.5</span>
      </div>
      <input id="rangeRadius" type="range" min="1.0" max="2.0" value="1.5" step="0.1">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="rangeAttach">Крепление челюсти</label>
        <span class="badge" id="valAttach">2.0</span>
      </div>
      <input id="rangeAttach" type="range" min="1.0" max="3.0" value="2.0" step="0.1">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="rangeChinW">Ширина подбородка</label>
        <span class="badge" id="valChinW">0.50</span>
      </div>
      <input id="rangeChinW" type="range" min="0.05" max="1.0" value="0.5" step="0.05">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="rangeChinH">Высота подбородка</label>
        <span class="badge" id="valChinH">4.0</span>
      </div>
      <input id="rangeChinH" type="range" min="3.0" max="5.0" value="4.0" step="0.1">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="rangeRound">Округлость</label>
        <span class="badge" id="valRound">0.00</span>
      </div>
      <input id="rangeRound" type="range" min="0" max="1" value="0" step="0.05">
    </div>

    <h2 style="margin-top: 8px;">Шея</h2>

    <div class="control">
      <div class="control-head">
        <label for="rangeNeckW">Ширина шеи</label>
        <span class="badge" id="valNeckW">0.40</span>
      </div>
      <input id="rangeNeckW" type="range" min="0.1" max="1.0" value="0.4" step="0.05">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="rangeNeckL">Длина шеи</label>
        <span class="badge" id="valNeckL">1.0</span>
      </div>
      <input id="rangeNeckL" type="range" min="0.2" max="2.0" value="1.0" step="0.1">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="rangeNeckX">Смещение шеи</label>
        <span class="badge" id="valNeckX">0.0</span>
      </div>
      <input id="rangeNeckX" type="range" min="-0.5" max="0.5" value="0.0" step="0.1">
    </div>

    <div class="actions">
      <label class="checkbox-wrap">
        <input type="checkbox" id="showPoints" checked>
        Точки
      </label>
      <button class="btn-reset" id="btnReset">Сбросить</button>
    </div>
  </div>

  <canvas id="canvas" width="450" height="800"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const els = {
  parts:  { r: document.getElementById('rangeParts'),  v: document.getElementById('valParts'),  def: 7 },
  radius: { r: document.getElementById('rangeRadius'), v: document.getElementById('valRadius'), def: 1.5 },
  attach: { r: document.getElementById('rangeAttach'), v: document.getElementById('valAttach'), def: 2.0 },
  chinW:  { r: document.getElementById('rangeChinW'),  v: document.getElementById('valChinW'),  def: 0.5 },
  chinH:  { r: document.getElementById('rangeChinH'),  v: document.getElementById('valChinH'),  def: 4.0 },
  round:  { r: document.getElementById('rangeRound'),  v: document.getElementById('valRound'),  def: 0 },
  neckW:  { r: document.getElementById('rangeNeckW'),  v: document.getElementById('valNeckW'),  def: 0.4 },
  neckL:  { r: document.getElementById('rangeNeckL'),  v: document.getElementById('valNeckL'),  def: 1.0 },
  neckX:  { r: document.getElementById('rangeNeckX'),  v: document.getElementById('valNeckX'),  def: 0.0 }
};

const showPointsEl = document.getElementById('showPoints');
const btnReset = document.getElementById('btnReset');

function updateFill(el) {
  const min = parseFloat(el.min), max = parseFloat(el.max), val = parseFloat(el.value);
  el.style.setProperty('--fill', ((val - min) / (max - min)) * 100 + '%');
}

function updateValDisplay(el, valEl) {
  const isTwoDecimals = ['rangeChinW', 'rangeRound', 'rangeNeckW'].includes(el.id);
  valEl.textContent = isTwoDecimals ? parseFloat(el.value).toFixed(2) : parseFloat(el.value).toFixed(1).replace('.0', '');
}

Object.values(els).forEach(({ r, v }) => {
  r.addEventListener('input', () => {
    if (r.id === 'rangeAttach' && parseFloat(r.value) > parseFloat(els.chinH.r.value) - 0.5) {
      r.value = parseFloat(els.chinH.r.value) - 0.5;
    }
    if (r.id === 'rangeChinH' && parseFloat(r.value) < parseFloat(els.attach.r.value) + 0.5) {
      r.value = parseFloat(els.attach.r.value) + 0.5;
    }
    
    updateValDisplay(r, v);
    updateFill(r);
    if (r.id === 'rangeAttach') updateFill(els.chinH.r);
    if (r.id === 'rangeChinH') updateFill(els.attach.r);
    draw();
  });
  updateValDisplay(r, v);
  updateFill(r);
});

btnReset.addEventListener('click', () => {
  Object.values(els).forEach(({ r, def }) => { r.value = def; updateFill(r); });
  Object.keys(els).forEach(k => updateValDisplay(els[k].r, els[k].v));
  draw();
});

showPointsEl.addEventListener('change', draw);

function drawPoint(x, y, color = '#e85b5b') {
  ctx.beginPath();
  ctx.arc(x, y, 4, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
}

function draw() {
  const parts = parseInt(els.parts.r.value);
  const radiusMultiplier = parseFloat(els.radius.r.value);
  const attachPos = parseFloat(els.attach.r.value);
  const chinWidthMul = parseFloat(els.chinW.r.value);
  const chinHeightPos = parseFloat(els.chinH.r.value);
  const roundness = parseFloat(els.round.r.value);
  
  const neckW = parseFloat(els.neckW.r.value);
  const neckL = parseFloat(els.neckL.r.value);
  const neckX = parseFloat(els.neckX.r.value);
  
  const showPoints = showPointsEl.checked;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20, top = pad, bottom = canvas.height - pad;
  const height = bottom - top, step = height / parts;
  const left = 20, right = canvas.width - 20, cx = (left + right) / 2;

  // Сетка
  ctx.strokeStyle = '#3a3a46'; ctx.lineWidth = 1;
  ctx.font = '11px system-ui'; ctx.fillStyle = '#8a8a99';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, right - 16, y + step / 2);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, bottom); ctx.stroke(); ctx.setLineDash([]);

  // Геометрия головы
  const fifth = step / 5;
  const y0 = top;
  const r = fifth * radiusMultiplier;
  const cy = y0 + r;
  const yChin = top + fifth * chinHeightPos;

  const yAttach = top + fifth * attachPos;
  const attachYClamped = Math.max(cy - r * 0.95, Math.min(cy + r * 0.95, yAttach)); 
  const attachXOffset = Math.sqrt(Math.max(0, r*r - (attachYClamped - cy)*(attachYClamped - cy)));
  const halfTop = attachXOffset;
  const halfBot = halfTop * chinWidthMul;

  // Вспомогательные линии
  ctx.strokeStyle = 'rgba(232,176,75,0.22)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  for (let i = 1; i <= 5; i++) {
    const y = top + fifth * i;
    ctx.beginPath(); ctx.moveTo(cx - r - 40, y); ctx.lineTo(cx + r + 40, y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Череп
  ctx.strokeStyle = '#e8b04b'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

  // Точки челюсти
  const ptTopL = { x: cx - halfTop, y: attachYClamped };
  const ptTopR = { x: cx + halfTop, y: attachYClamped };
  const ptBotL = { x: cx - halfBot, y: yChin };
  const ptBotR = { x: cx + halfBot, y: yChin };

  // Шея (рисуем под челюстью)
  // Ширина шеи берется как доля от ширины подбородка
  const neckHalfW = halfBot * neckW;
  const neckShift = halfTop * neckX; // Смещение относительно центра
  const neckTopY = yChin - 2; // Чуть заходим под челюсть
  const neckBotY = yChin + (fifth * neckL); // Длина шеи в долях

  ctx.fillStyle = 'rgba(232,176,75,0.1)'; // Легкая заливка для шеи
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(cx - neckHalfW + neckShift, neckTopY);
  ctx.lineTo(cx - neckHalfW + neckShift, neckBotY);
  ctx.lineTo(cx + neckHalfW + neckShift, neckBotY);
  ctx.lineTo(cx + neckHalfW + neckShift, neckTopY);
  ctx.stroke();
  ctx.fill();

  // Челюсть (поверх шеи)
  ctx.beginPath();
  ctx.moveTo(ptTopL.x, ptTopL.y);
  
  const y3 = top + fifth * 3;
  const yBreak = Math.min(y3, yChin); 
  
  ctx.lineTo(cx - halfTop, yBreak);

  if (roundness > 0) {
    const cp1x = cx - halfBot - (halfTop - halfBot) * 0.4;
    const cp1y = yBreak + (yChin - yBreak) * 0.3;
    const cp2x = cx - halfBot;
    const cp2y = yBreak + (yChin - yBreak) * 0.8;
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, ptBotL.x, ptBotL.y);
  } else {
    ctx.lineTo(ptBotL.x, ptBotL.y);
  }

  if (roundness > 0) {
    const dip = (yChin - yBreak) * 0.4 * roundness;
    ctx.quadraticCurveTo(cx, yChin + dip, ptBotR.x, ptBotR.y);
  } else {
    ctx.lineTo(ptBotR.x, ptBotR.y);
  }

  if (roundness > 0) {
    const cp1x = cx + halfBot;
    const cp1y = yBreak + (yChin - yBreak) * 0.8;
    const cp2x = cx + halfBot + (halfTop - halfBot) * 0.4;
    const cp2y = yBreak + (yChin - yBreak) * 0.3;
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, ptTopR.x, yBreak);
  } else {
    ctx.lineTo(ptTopR.x, yBreak);
  }

  ctx.lineTo(ptTopR.x, ptTopR.y);
  ctx.stroke();

  // Точки
  if (showPoints) {
    drawPoint(ptTopL.x, ptTopL.y);
    drawPoint(ptTopR.x, ptTopR.y);
    if (yBreak !== yChin) {
      drawPoint(cx - halfTop, yBreak);
      drawPoint(cx + halfTop, yBreak);
    }
    drawPoint(ptBotL.x, ptBotL.y, '#7fb4e8');
    drawPoint(ptBotR.x, ptBotR.y, '#7fb4e8');
    drawPoint(cx, yChin, '#7fb4e8');
    
    // Точки шеи
    drawPoint(cx - neckHalfW + neckShift, neckBotY, '#a8a8b8');
    drawPoint(cx + neckHalfW + neckShift, neckBotY, '#a8a8b8');
  }

  // Подписи
  ctx.fillStyle = '#8a8a99'; ctx.font = '10px system-ui';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i++) {
    ctx.fillText(`${i}/5`, cx + r + 10, top + fifth * i - fifth / 2);
  }
}

draw();
</script>
</body>
</html>
