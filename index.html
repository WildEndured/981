<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Штриховка вокруг персонажа</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: center; padding: 10px 14px;
    background: #1d2027; border-radius: 10px; max-width: 100%;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; max-width: 160px; }
  input[type="color"] {
    width: 32px; height: 24px; border: none; border-radius: 4px;
    background: none; cursor: pointer; padding: 0;
  }
  .stage {
    position: relative; display: inline-block;
    border: 1px solid #2b2f37; background: #0b0c0f; line-height: 0;
  }
  .stage canvas {
    display: block; max-width: min(92vw, 900px); height: auto;
  }
  .stage canvas#overlay {
    position: absolute; inset: 0; pointer-events: none;
  }
  .hint {
    font-size: 12px; color: #8b93a1; max-width: 780px;
    text-align: center; line-height: 1.5;
  }
  @media (max-width: 600px) {
    input[type="range"] { width: 120px; height: 24px; }
    .controls { flex-direction: column; align-items: stretch; }
    .stage canvas { max-width: 96vw; }
  }
</style>
</head>
<body>

<h1>Штриховка вокруг персонажа</h1>

<div class="controls">
  <label>Изображение:
    <input id="file" type="file" accept="image/*" />
  </label>

  <label>Порог контура:
    <input id="edgeTol" type="range" min="30" max="200" value="110" />
    <span id="edgeTolVal">110</span>
  </label>

  <label>Шаг линий:
    <input id="step" type="range" min="3" max="30" value="8" />
    <span id="stepVal">8</span>
  </label>

  <label>Толщина:
    <input id="thickness" type="range" min="0.3" max="3" step="0.1" value="1" />
    <span id="thicknessVal">1</span>
  </label>

  <label>Цвет:
    <input id="color" type="color" value="#1e4a8a" />
  </label>

  <label>
    <input id="showGrid" type="checkbox" checked />
    Разметка 4 части
  </label>

  <button id="reset">↺ Сброс</button>
</div>

<div class="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<p class="hint">
  Скрипт находит контур персонажа (тёмные линии) и ведёт штриховку
  от краёв изображения к центру, пока не встретит контур. Внутри
  персонажа штриховки нет, а во внутренних окнах (между ног, рук, змей) — есть.
</p>

<script>
const fileInput    = document.getElementById('file');
const baseCanvas   = document.getElementById('base');
const overlay      = document.getElementById('overlay');
const edgeTolEl    = document.getElementById('edgeTol');
const stepEl       = document.getElementById('step');
const thicknessEl  = document.getElementById('thickness');
const colorEl      = document.getElementById('color');
const showGridEl   = document.getElementById('showGrid');
const edgeTolVal   = document.getElementById('edgeTolVal');
const stepVal      = document.getElementById('stepVal');
const thicknessVal = document.getElementById('thicknessVal');
const resetBtn     = document.getElementById('reset');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imageData = null;
let imgWidth = 0, imgHeight = 0;
let srcImage = null;
let isEdge = null;   // Uint8Array: 1 = пиксель контура

// ---------- Загрузка ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    srcImage  = img;
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width = imgWidth; c.height = imgHeight;
    });

    baseCtx.clearRect(0, 0, imgWidth, imgHeight);
    baseCtx.drawImage(img, 0, 0);
    imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);

    buildEdgeMap();
    drawGrid();
    redrawOverlay();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- Карта контура ----------
// Пиксель — контур, если его яркость заметно ниже яркости соседей.
// Берём разницу с соседом через 3 пикселя (чтобы не ловить шум).
function buildEdgeMap() {
  const w = imgWidth, h = imgHeight;
  const d = imageData.data;
  const tol = +edgeTolEl.value;

  // Считаем яркость всех пикселей
  const lum = new Float32Array(w * h);
  for (let i = 0, p = 0; i < w * h; i++, p += 4) {
    const a = d[p + 3];
    if (a < 20) { lum[i] = 255; continue; } // прозрачное = "белое"
    lum[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
  }

  isEdge = new Uint8Array(w * h);
  const r = 3; // радиус сравнения

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      const l = lum[idx];

      // Соседи
      const lLeft  = x >= r     ? lum[idx - r]     : 255;
      const lRight = x < w - r  ? lum[idx + r]     : 255;
      const lUp    = y >= r     ? lum[idx - r * w] : 255;
      const lDown  = y < h - r  ? lum[idx + r * w] : 255;

      const maxL = Math.max(lLeft, lRight, lUp, lDown);
      if (maxL - l > tol) {
        isEdge[idx] = 1;
      }
    }
  }
}

// ---------- Разметка на 4 части ----------
function drawGrid() {
  if (!imageData) return;
  baseCtx.clearRect(0, 0, imgWidth, imgHeight);
  baseCtx.drawImage(srcImage, 0, 0);

  if (!showGridEl.checked) return;

  baseCtx.save();
  baseCtx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
  baseCtx.lineWidth = Math.max(2, Math.round(imgWidth / 400));
  baseCtx.setLineDash([12, 8]);
  const mx = imgWidth / 2, my = imgHeight / 2;
  baseCtx.beginPath(); baseCtx.moveTo(mx, 0); baseCtx.lineTo(mx, imgHeight); baseCtx.stroke();
  baseCtx.beginPath(); baseCtx.moveTo(0, my); baseCtx.lineTo(imgWidth, my); baseCtx.stroke();
  baseCtx.restore();
}

// ---------- Штриховка от краёв до контура ----------
function redrawOverlay() {
  if (!imageData || !isEdge) return;

  const step      = +stepEl.value;
  const thickness = +thicknessEl.value;
  const hex       = colorEl.value;

  const w = imgWidth, h = imgHeight;
  overlayCtx.clearRect(0, 0, w, h);

  const rr = parseInt(hex.slice(1, 3), 16);
  const gg = parseInt(hex.slice(3, 5), 16);
  const bb = parseInt(hex.slice(5, 7), 16);
  const strokeStyle = `rgba(${rr},${gg},${bb},0.85)`;

  const cx = w / 2, cy = h / 2;

  overlayCtx.save();
  overlayCtx.strokeStyle = strokeStyle;
  overlayCtx.lineWidth = thickness;
  overlayCtx.lineCap = 'round';

  // Горизонтальные линии: слева и справа к центру
  for (let y = 0; y < h; y += step) {
    const yy = y + 0.5;

    // слева → вправо
    let xL = 0;
    while (xL < w && !isEdge[y * w + xL]) xL++;
    if (xL > 0) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(0, yy);
      overlayCtx.lineTo(xL, yy);
      overlayCtx.stroke();
    }

    // справа → влево
    let xR = w - 1;
    while (xR >= 0 && !isEdge[y * w + xR]) xR--;
    if (xR < w - 1) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(w, yy);
      overlayCtx.lineTo(xR, yy);
      overlayCtx.stroke();
    }
  }

  // Вертикальные линии: сверху и снизу к центру
  for (let x = 0; x < w; x += step) {
    const xx = x + 0.5;

    // сверху → вниз
    let yT = 0;
    while (yT < h && !isEdge[yT * w + x]) yT++;
    if (yT > 0) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(xx, 0);
      overlayCtx.lineTo(xx, yT);
      overlayCtx.stroke();
    }

    // снизу → вверх
    let yB = h - 1;
    while (yB >= 0 && !isEdge[yB * w + x]) yB--;
    if (yB < h - 1) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(xx, h);
      overlayCtx.lineTo(xx, yB);
      overlayCtx.stroke();
    }
  }

  overlayCtx.restore();
}

// ---------- Сброс ----------
resetBtn.addEventListener('click', () => {
  edgeTolEl.value = 110;  edgeTolVal.textContent   = 110;
  stepEl.value    = 8;    stepVal.textContent      = 8;
  thicknessEl.value = 1;  thicknessVal.textContent = 1;
  colorEl.value   = '#1e4a8a';
  showGridEl.checked = true;
  if (imageData) {
    buildEdgeMap();
    drawGrid();
    redrawOverlay();
  }
});

// ---------- Реакции на контролы ----------
edgeTolEl.addEventListener('input', () => {
  edgeTolVal.textContent = edgeTolEl.value;
  if (imageData) { buildEdgeMap(); redrawOverlay(); }
});
stepEl.addEventListener('input', () => {
  stepVal.textContent = stepEl.value;
  redrawOverlay();
});
thicknessEl.addEventListener('input', () => {
  thicknessVal.textContent = thicknessEl.value;
  redrawOverlay();
});
colorEl.addEventListener('input', redrawOverlay);
showGridEl.addEventListener('change', drawGrid);
</script>

</body>
</html>
