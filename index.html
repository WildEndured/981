<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Фон и персонаж</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: center; padding: 10px 14px;
    background: #1d2027; border-radius: 10px;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; }
  input[type="range"] { width: 160px; }
  .stage {
    position: relative; display: inline-block;
    border: 1px solid #2b2f37; background: #0b0c0f; line-height: 0;
  }
  .stage.hide canvas#base { opacity: 0; }
  .stage.hide { background: #fff; }
  .stage canvas { display: block; max-width: min(92vw, 900px); height: auto; }
  .stage canvas#base { transition: opacity 0.15s; }
  .stage canvas#overlay { position: absolute; inset: 0; pointer-events: none; }
  @media (max-width: 600px) {
    .controls { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="controls">
  <label>Изображение: <input id="file" type="file" accept="image/*" /></label>
  <label>Допуск цвета фона:
    <input id="tol" type="range" min="5" max="120" value="45" />
    <span id="tolVal">45</span>
  </label>
  <label>Яркость «дырок»:
    <input id="holeLum" type="range" min="80" max="255" value="170" />
    <span id="holeLumVal">170</span>
  </label>
  <label><input id="hideImage" type="checkbox" /> Скрыть изображение</label>
</div>

<div class="stage" id="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<script>
const fileInput    = document.getElementById('file');
const baseCanvas   = document.getElementById('base');
const overlay      = document.getElementById('overlay');
const stageEl      = document.getElementById('stage');
const tolEl        = document.getElementById('tol');
const tolVal       = document.getElementById('tolVal');
const holeLumEl    = document.getElementById('holeLum');
const holeLumVal   = document.getElementById('holeLumVal');
const hideImageEl  = document.getElementById('hideImage');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imgWidth = 0, imgHeight = 0;
let pixels = null;      // Uint8ClampedArray RGBA оригинала
let lum = null;         // Float32Array яркости
let isBg = null;        // Uint8Array: 1 = фон
let bgColor = { r: 255, g: 255, b: 255 }; // опорный цвет фона (из углов)

// ---------- Загрузка ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width = imgWidth; c.height = imgHeight;
    });

    baseCtx.drawImage(img, 0, 0);
    const imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);
    pixels = imageData.data;

    computeLuminance();
    detectBgColor();
    buildMask();
    fillHoles();
    smoothMask();
    drawOverlay();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- Яркость ----------
function computeLuminance() {
  const d = pixels;
  const N = imgWidth * imgHeight;
  lum = new Float32Array(N);
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    if (d[p + 3] < 20) { lum[i] = 255; continue; }
    lum[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
  }
}

// ---------- Определение цвета фона по углам ----------
function detectBgColor() {
  const w = imgWidth, h = imgHeight, d = pixels;
  // берём несколько точек по периметру, чтобы не зависеть от одного пикселя
  const samples = [
    [2, 2], [w - 3, 2], [2, h - 3], [w - 3, h - 3],
    [(w / 2) | 0, 2], [(w / 2) | 0, h - 3],
    [2, (h / 2) | 0], [w - 3, (h / 2) | 0]
  ];
  let r = 0, g = 0, b = 0, n = 0;
  for (const [x, y] of samples) {
    const p = (y * w + x) * 4;
    r += d[p]; g += d[p + 1]; b += d[p + 2];
    n++;
  }
  bgColor = { r: r / n, g: g / n, b: b / n };
}

// ---------- Проверка: пиксель похож на цвет фона ----------
function isBgColorAt(i) {
  const p = i * 4;
  const tol = +tolEl.value;
  const dr = pixels[p]     - bgColor.r;
  const dg = pixels[p + 1] - bgColor.g;
  const db = pixels[p + 2] - bgColor.b;
  // евклидово расстояние в RGB
  return (dr * dr + dg * dg + db * db) < tol * tol;
}

// ---------- Маска фона (BFS от краёв) ----------
function buildMask() {
  const w = imgWidth, h = imgHeight;
  const N = w * h;
  isBg = new Uint8Array(N);
  const queue = [];

  const push = i => {
    if (i < 0 || i >= N) return;
    if (isBg[i]) return;
    if (!isBgColorAt(i)) return;
    isBg[i] = 1;
    queue.push(i);
  };

  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }

  let head = 0;
  while (head < queue.length) {
    const i = queue[head++];
    const x = i % w, y = (i / w) | 0;
    if (x > 0)     push(i - 1);
    if (x < w - 1) push(i + 1);
    if (y > 0)     push(i - w);
    if (y < h - 1) push(i + w);
  }
}

// ---------- Заполнение «дырок» внутри силуэта ----------
// Всё, что не фон и недостижимо от края через не-фон, — это замкнутая область.
// Если она светлая (похожа на фон), помечаем её фоном.
function fillHoles() {
  const w = imgWidth, h = imgHeight, N = w * h;
  const visited = new Uint8Array(N);
  const queue = [];

  const push = i => {
    if (i < 0 || i >= N) return;
    if (visited[i] || isBg[i]) return;
    visited[i] = 1;
    queue.push(i);
  };

  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }

  let head = 0;
  while (head < queue.length) {
    const i = queue[head++];
    const x = i % w, y = (i / w) | 0;
    if (x > 0)     push(i - 1);
    if (x < w - 1) push(i + 1);
    if (y > 0)     push(i - w);
    if (y < h - 1) push(i + w);
  }

  // собираем замкнутые компоненты (не фон, не достижимы от края)
  const inComponent = new Uint8Array(N);
  const holeLum = +holeLumEl.value;

  for (let start = 0; start < N; start++) {
    if (visited[start] || isBg[start] || inComponent[start]) continue;

    // BFS по компоненте
    const comp = [start];
    inComponent[start] = 1;
    let compHead = 0;
    while (compHead < comp.length) {
      const i = comp[compHead++];
      const x = i % w, y = (i / w) | 0;
      const neigh = [];
      if (x > 0)     neigh.push(i - 1);
      if (x < w - 1) neigh.push(i + 1);
      if (y > 0)     neigh.push(i - w);
      if (y < h - 1) neigh.push(i + w);
      for (const n of neigh) {
        if (visited[n] || isBg[n] || inComponent[n]) continue;
        inComponent[n] = 1;
        comp.push(n);
      }
    }

    // средняя яркость компоненты
    let sum = 0;
    for (const i of comp) sum += lum[i];
    const avg = sum / comp.length;

    // если компонента светлая — это «дырка» фона внутри силуэта
    if (avg >= holeLum) {
      for (const i of comp) isBg[i] = 1;
    }
  }
}

// ---------- Сглаживание маски (dilate + erode) ----------
// Убирает одиночные пиксели-артефакты по краям.
function smoothMask() {
  const w = imgWidth, h = imgHeight, N = w * h;
  const tmp = new Uint8Array(N);

  // Dilate: фон расширяется на 1 пиксель
  for (let i = 0; i < N; i++) {
    if (isBg[i]) { tmp[i] = 1; continue; }
    const x = i % w, y = (i / w) | 0;
    if ((x > 0 && isBg[i - 1]) ||
        (x < w - 1 && isBg[i + 1]) ||
        (y > 0 && isBg[i - w]) ||
        (y < h - 1 && isBg[i + w])) {
      tmp[i] = 1;
    }
  }

  // Erode: фон сжимается обратно, но «бахрома» уже срезана
  for (let i = 0; i < N; i++) {
    if (!tmp[i]) { isBg[i] = 0; continue; }
    const x = i % w, y = (i / w) | 0;
    const ok =
      (x > 0     ? tmp[i - 1] : 1) &&
      (x < w - 1 ? tmp[i + 1] : 1) &&
      (y > 0     ? tmp[i - w] : 1) &&
      (y < h - 1 ? tmp[i + w] : 1);
    isBg[i] = ok ? 1 : 0;
  }
}

// ---------- Отрисовка ----------
function drawOverlay() {
  const w = imgWidth, h = imgHeight;
  if (!w) return;
  overlayCtx.clearRect(0, 0, w, h);
  const img = overlayCtx.createImageData(w, h);
  const data = img.data;

  for (let i = 0, j = 0; i < w * h; i++, j += 4) {
    if (!isBg[i]) {
      data[j]     = 255;
      data[j + 1] = 60;
      data[j + 2] = 60;
      data[j + 3] = 140;
    }
  }
  overlayCtx.putImageData(img, 0, 0);
}

// ---------- Пересчёт ----------
function recompute() {
  if (!pixels) return;
  buildMask();
  fillHoles();
  smoothMask();
  drawOverlay();
}

tolEl.addEventListener('input', () => {
  tolVal.textContent = tolEl.value;
  recompute();
});

holeLumEl.addEventListener('input', () => {
  holeLumVal.textContent = holeLumEl.value;
  recompute();
});

hideImageEl.addEventListener('change', () => {
  stageEl.classList.toggle('hide', hideImageEl.checked);
});
</script>

</body>
</html>
