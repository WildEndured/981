<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поиск перспективы</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🔍 Поиск перспективы</h1>
    <p class="subtitle">Найдите перспективные направления по ключевым словам и критериям</p>
  </header>

  <main>
    <!-- Поиск -->
    <section class="search-box">
      <input type="text" id="searchInput" placeholder="Введите ключевое слово (например: AI, экология, финтех)..." />
      <select id="categoryFilter">
        <option value="all">Все категории</option>
        <option value="tech">Технологии</option>
        <option value="finance">Финансы</option>
        <option value="career">Карьера</option>
        <option value="business">Бизнес</option>
      </select>
      <select id="sortFilter">
        <option value="rating">По рейтингу</option>
        <option value="growth">По росту</option>
        <option value="name">По названию</option>
      </select>
    </section>

    <!-- Результаты -->
    <section id="results" class="results"></section>

    <!-- Статистика -->
    <section class="stats">
      <div>Найдено: <span id="count">0</span></div>
      <div>Средний рейтинг: <span id="avgRating">0</span></div>
    </section>
  </main>

  <footer>
    <p>© 2024 Поиск перспективы | <a href="https://github.com/">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
