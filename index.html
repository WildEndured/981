<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Торс (яйцо) + Таз (квадрат)</title>
<style>
  :root {
    --guide-red: #f03e6e;
    --guide-blue: #3b7cff;
    --bg: #faf8fc;
    --panel: #ffffff;
    --text: #2a2430;
    --muted: #8a8394;
    --line: #e5e1eb;
    --accent: #7a4dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    overflow: hidden;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .view-name {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  #stage {
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, var(--bg) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; user-select: none; }
  #stage .label {
    font-size: 13px;
    font-weight: 600;
    paint-order: stroke;
    stroke: #fff;
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }
  .label--red  { fill: var(--guide-red); }
  .label--blue { fill: var(--guide-blue); }
  .label--ink  { fill: var(--text); }
  #drop-cover {
    position: absolute;
    inset: 0;
    background: rgba(122, 77, 255, 0.15);
    border: 2px dashed var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    pointer-events: none;
  }
  #drop-cover[hidden] { display: none; }
  aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 0;
  }
  section { padding: 0 16px 12px; }
  section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 14px 0 8px;
  }
  .btn {
    font: inherit;
    font-size: 12px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .slider {
    display: grid;
    grid-template-columns: 1fr 52px;
    gap: 2px 8px;
    margin-bottom: 10px;
    align-items: center;
  }
  .slider label { grid-column: 1 / -1; font-size: 12px; color: var(--text); }
  .slider input[type="range"] { width: 100%; height: 20px; accent-color: var(--accent); }
  .slider output {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .group-h {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 12px 0 6px;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 8px;
  }
  @media (max-width: 800px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: 48px 1fr auto;
      height: 100dvh;
    }
    aside { border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Торс (яйцо) + Таз (квадрат)</h1>
  <span class="view-name" id="view-name">Анфас · 0°</span>
</header>

<main id="stage">
  <svg id="canvas" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="drop-cover" hidden>Отпустите, чтобы вставить</div>
</main>

<aside>
  <section>
    <h2>Поворот</h2>
    <div class="slider">
      <label>Yaw</label>
      <input type="range" id="yaw" min="-180" max="180" step="1" value="0">
      <output id="yaw-out">0°</output>
    </div>
    <div class="slider">
      <label>Pitch</label>
      <input type="range" id="pitch" min="-60" max="60" step="1" value="0">
      <output id="pitch-out">0°</output>
    </div>
    <div class="row">
      <button class="btn" data-angle="front" type="button">Анфас</button>
      <button class="btn" data-angle="three" type="button">3/4</button>
      <button class="btn" data-angle="side" type="button">Профиль</button>
      <button class="btn" data-angle="back" type="button">Спина</button>
    </div>
    <div class="row">
      <button class="btn" id="reset-view" type="button">Сброс</button>
    </div>
  </section>

  <section>
    <h2>Пропорции</h2>
    <div class="slider">
      <label>Ведущий размер W</label>
      <input type="range" id="W" min="0.8" max="1.6" step="0.01" value="1.15">
      <output id="W-out">1.15</output>
    </div>
    <p class="hint">Высота грудной клетки = W. Ширина таза = высота таза = W.</p>
  </section>

  <section>
    <h2>Грудная клетка (яйцо)</h2>
    <div id="egg-sliders"></div>
  </section>

  <section>
    <h2>Таз (квадрат)</h2>
    <div id="pelvis-sliders"></div>
  </section>

  <section>
    <h2>Отображение</h2>
    <div class="slider">
      <label>Толщина линии</label>
      <input type="range" id="line" min="0.002" max="0.02" step="0.001" value="0.006">
      <output id="line-out">0.006</output>
    </div>
    <div class="row">
      <button class="btn" id="toggle-hidden" aria-pressed="true" type="button">Скрытые линии</button>
      <button class="btn" id="toggle-labels" aria-pressed="true" type="button">Подписи</button>
    </div>
  </section>

  <section>
    <h2>Подложка</h2>
    <p class="hint" id="underlay-hint">Перетащи файл, вставь из буфера или выбери ниже</p>
    <div class="row">
      <button class="btn" id="underlay-pick" type="button">Выбрать</button>
      <button class="btn" id="underlay-remove" type="button" hidden>Удалить</button>
      <input type="file" id="underlay-input" accept="image/*" hidden>
    </div>
    <div class="slider">
      <label>Прозрачность</label>
      <input type="range" id="underlay-opacity" min="0.1" max="0.9" step="0.05" value="0.4">
      <output id="underlay-opacity-out">40%</output>
    </div>
    <div class="slider">
      <label>Масштаб</label>
      <input type="range" id="underlay-scale" min="0.3" max="2" step="0.01" value="1">
      <output id="underlay-scale-out">100%</output>
    </div>
  </section>

  <section>
    <h2>Экспорт</h2>
    <div class="row">
      <button class="btn" id="save-png" type="button">PNG</button>
      <button class="btn" id="save-svg" type="button">SVG</button>
    </div>
  </section>
</aside>

<script type="module">
/* ==================================================================
 * math
 * ================================================================== */
const rad = (d) => (d * Math.PI) / 180;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

const SEG = 96;
const CX = 300, CY = 300;
const SCALE = 180;

/* ==================================================================
 * параметры
 * ================================================================== */
const EGG_PARAMS = [
  { key: 'egg_top',    label: 'Сужение верха',      min: 0.3, max: 0.9,  step: 0.01, def: 0.55 },
  { key: 'egg_bottom', label: 'Ширина низа',        min: 0.7, max: 1.1,  step: 0.01, def: 0.95 },
  { key: 'egg_depth',  label: 'Глубина',            min: 0.5, max: 1.0,  step: 0.01, def: 0.72 },
  { key: 'egg_round',  label: 'Скругление',         min: 0.3, max: 1.0,  step: 0.01, def: 0.6  },
  { key: 'egg_bulge',  label: 'Выпуклость книзу',   min: 0,   max: 0.4,  step: 0.01, def: 0.12 },
];

const PELVIS_PARAMS = [
  { key: 'p_w',     label: 'Ширина (×W)',          min: 0.7, max: 1.3,  step: 0.01, def: 1.0 },
  { key: 'p_h',     label: 'Высота (×W)',          min: 0.7, max: 1.3,  step: 0.01, def: 1.0 },
  { key: 'p_d',     label: 'Глубина (×W)',         min: 0.5, max: 1.0,  step: 0.01, def: 0.72 },
  { key: 'p_n',     label: 'Квадратность',         min: 2.0, max: 8.0,  step: 0.1,  def: 4.0 },
  { key: 'p_taper', label: 'Сужение книзу',        min: 0.7, max: 1.0,  step: 0.01, def: 0.92 },
  { key: 'p_glute', label: 'Выступ ягодиц',        min: 0.6, max: 1.4,  step: 0.01, def: 1.05 },
  { key: 'p_tilt',  label: 'Наклон таза',          min: -20, max: 20,   step: 1,    def: 6, unit: '°' },
];

const state = {
  W: 1.15,
  egg: Object.fromEntries(EGG_PARAMS.map(p => [p.key, p.def])),
  pelvis: Object.fromEntries(PELVIS_PARAMS.map(p => [p.key, p.def])),
  line: 0.006,
  view: { yaw: 0, pitch: 0 },
  display: { hidden: true, labels: true },
  underlay: { opacity: 0.4, scale: 1 },
};

/* ==================================================================
 * грудная клетка — яйцо
 * ================================================================== */
function makeEgg(W, p) {
  const h = W;
  const wBottom = W * p.egg_bottom;
  const wTop = W * p.egg_top;
  const depth = W * p.egg_depth;
  const k = p.egg_round;
  const bulge = p.egg_bulge;

  const profile = (t) => Math.pow(Math.max(0, 1 - t * t), k);
  const widthAt = (t) => {
    const lin = wBottom + (wTop - wBottom) * (t + 1) / 2;
    const b = 1 + bulge * Math.sin(Math.PI * (t + 1) / 2) * (1 - (t + 1) / 2);
    return (lin / 2) * b * profile(t);
  };
  const depthAt = (t) => (depth / 2) * profile(t);

  const point = (phi, t) => [
    widthAt(t) * Math.cos(phi),
    depthAt(t) * Math.sin(phi),
    (h / 2) * t,
  ];

  return { h, point, widthAt, depthAt };
}

/* ==================================================================
 * таз — суперэллипс (квадрат со скруглением)
 * ================================================================== */
function makePelvis(W, p) {
  const w = W * p.p_w;
  const h = W * p.p_h;
  const d = W * p.p_d;
  const n = p.p_n;
  const taper = p.p_taper;
  const glute = p.p_glute;
  const tilt = rad(p.p_tilt);

  const scaleAt = (t) => 1 - (1 - taper) * (1 - t) / 2;
  const widthAt = (t) => (w / 2) * scaleAt(t);
  const depthAt = (t) => (d / 2) * scaleAt(t) * (t < 0 ? glute : 1);

  // superellipse
  const superX = (phi, a) => a * Math.sign(Math.cos(phi)) * Math.pow(Math.abs(Math.cos(phi)), 2 / n);
  const superY = (phi, b) => b * Math.sign(Math.sin(phi)) * Math.pow(Math.abs(Math.sin(phi)), 2 / n);

  const tiltX = (pt) => {
    const c = Math.cos(tilt), s = Math.sin(tilt);
    return [pt[0], pt[1] * c - pt[2] * s, pt[1] * s + pt[2] * c];
  };

  const point = (phi, t) => tiltX([
    superX(phi, widthAt(t)),
    superY(phi, depthAt(t)),
    (h / 2) * t,
  ]);

  return { h, point, widthAt, depthAt };
}

/* ==================================================================
 * сборка фигуры
 * ================================================================== */
function buildFigure() {
  const W = state.W;
  const egg = makeEgg(W, state.egg);
  const pelvis = makePelvis(W, state.pelvis);

  const gap = W * 0.10;
  const pelvisTop = 0;
  const pelvisBottom = -pelvis.h;
  const eggBottom = pelvisTop + gap;
  const eggTop = eggBottom + egg.h;
  const eggCenterZ = (eggTop + eggBottom) / 2;

  const eggAt = (phi, t) => {
    const p = egg.point(phi, t);
    return [p[0], p[1], p[2] + eggCenterZ];
  };
  const pelvisAt = (phi, t) => {
    const p = pelvis.point(phi, t);
    return [p[0], p[1], p[2] + pelvisTop];
  };

  const lines = [];
  const labels = {};
  const add = (id, color, pts, closed = false) => lines.push({ id, color, closed, pts });

  // --- грудная клетка: кольца ---
  for (const t of [-0.75, -0.35, 0.0, 0.35, 0.75]) {
    const pts = [];
    for (let i = 0; i < SEG; i++) pts.push(eggAt((i / SEG) * Math.PI * 2, t));
    add('egg', 'red', pts, true);
  }
  // меридианы
  for (const phi of [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2]) {
    const pts = [];
    for (let i = 0; i <= SEG / 2; i++) {
      const t = -1 + (i / (SEG / 2)) * 2;
      pts.push(eggAt(phi, clamp(t, -0.999, 0.999)));
    }
    add('egg', 'red', pts);
  }

  // --- таз: кольца ---
  for (const t of [-0.75, -0.35, 0.0, 0.35, 0.75]) {
    const pts = [];
    for (let i = 0; i < SEG; i++) pts.push(pelvisAt((i / SEG) * Math.PI * 2, t));
    add('pelvis', 'blue', pts, true);
  }
  // меридианы по углам квадрата (45°, 135°, 225°, 315°)
  for (const phi of [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4]) {
    const pts = [];
    for (let i = 0; i <= SEG / 2; i++) {
      const t = -1 + (i / (SEG / 2)) * 2;
      pts.push(pelvisAt(phi, clamp(t, -0.999, 0.999)));
    }
    add('pelvis', 'blue', pts);
  }
  // осевые меридианы таза (для читаемости)
  for (const phi of [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2]) {
    const pts = [];
    for (let i = 0; i <= SEG / 2; i++) {
      const t = -1 + (i / (SEG / 2)) * 2;
      pts.push(pelvisAt(phi, clamp(t, -0.999, 0.999)));
    }
    add('pelvis', 'blue', pts);
  }

  labels['egg'] = [{ p: eggAt(Math.PI / 2, 0.2), n: [0, 1, 0] }];
  labels['pelvis'] = [{ p: pelvisAt(Math.PI / 4, 0.2), n: [1, 1, 0] }];
  labels['waist'] = [{ p: [0, 0, eggBottom], n: [0, -1, 0] }];

  return { lines, labels };
}

/* ==================================================================
 * камера
 * ================================================================== */
function rotate(p) {
  const yaw = rad(state.view.yaw), pitch = rad(state.view.pitch);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = p[0] * cy - p[1] * sy;
  const y1 = p[0] * sy + p[1] * cy;
  const z1 = p[2];
  const x2 = x1;
  const y2 = y1 * cp - z1 * sp;
  const z2 = y1 * sp + z1 * cp;
  return [x2, y2, z2];
}

function project(p) {
  const r = rotate(p);
  return { x: CX + r[0] * SCALE, y: CY - r[2] * SCALE, depth: r[1] };
}

/* ==================================================================
 * SVG-рендер
 * ================================================================== */
const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('canvas');
const gHidden = document.createElementNS(SVG_NS, 'g');
const gVisible = document.createElementNS(SVG_NS, 'g');
const gLabels = document.createElementNS(SVG_NS, 'g');
svg.appendChild(gHidden);
svg.appendChild(gVisible);
svg.appendChild(gLabels);

const LABEL_TEXT = { egg: 'грудь', pelvis: 'таз', waist: 'талия' };
const LABEL_COLOR = { egg: 'red', pelvis: 'blue', waist: 'ink' };

function computeNormal(pts, i, centerAxis) {
  // касательная по соседям
  const prev = pts[Math.max(0, i - 1)];
  const next = pts[Math.min(pts.length - 1, i + 1)];
  const tangent = sub(next, prev);
  // радиальная составляющая от центра
  const p = pts[i];
  // центр сечения: на той же высоте z, ось (0,0,z)
  const radial = [p[0] - 0, p[1] - 0, 0]; // для симметричных тел нормаль ~ радиальная + вертикальная
  // нормаль = tangent × radial (если не коллинеарны) -> даёт "боковую" нормаль
  const n0 = [
    tangent[1] * radial[2] - tangent[2] * radial[1],
    tangent[2] * radial[0] - tangent[0] * radial[2],
    tangent[0] * radial[1] - tangent[1] * radial[0],
  ];
  if (len(n0) < 1e-6) return norm(radial);
  // ориентируем наружу
  const outward = [radial[0], radial[1], 0];
  const sign = (n0[0]*outward[0] + n0[1]*outward[1]) >= 0 ? 1 : -1;
  return norm([n0[0]*sign, n0[1]*sign, n0[2]*sign]);
}

function render() {
  const fig = buildFigure();
  gHidden.innerHTML = '';
  gVisible.innerHTML = '';
  gLabels.innerHTML = '';

  const sw = state.line * SCALE;

  for (const l of fig.lines) {
    const projected = l.pts.map(project);
    const parts = [];
    let cur = { vis: null, pts: [] };

    for (let i = 0; i < l.pts.length; i++) {
      const n = computeNormal(l.pts, i);
      const rn = rotate(n);
      const v = rn[1] < 0; // нормаль смотрит на камеру

      if (cur.vis === null) {
        cur.vis = v;
        cur.pts.push(projected[i]);
      } else if (cur.vis === v) {
        cur.pts.push(projected[i]);
      } else {
        cur.pts.push(projected[i]);
        parts.push(cur);
        cur = { vis: v, pts: [projected[i]] };
      }
    }
    if (cur.pts.length) parts.push(cur);

    for (const part of parts) {
      if (part.pts.length < 2) continue;
      const path = document.createElementNS(SVG_NS, 'path');
      let d = `M${part.pts[0].x.toFixed(1)},${part.pts[0].y.toFixed(1)}`;
      for (let i = 1; i < part.pts.length; i++) d += `L${part.pts[i].x.toFixed(1)},${part.pts[i].y.toFixed(1)}`;
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', l.color === 'red' ? 'var(--guide-red)' : 'var(--guide-blue)');
      path.setAttribute('stroke-width', sw.toFixed(2));
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      if (!part.vis) {
        if (!state.display.hidden) continue;
        path.setAttribute('stroke-opacity', '0.22');
        path.setAttribute('stroke-dasharray', `${(sw * 1.5).toFixed(1)} ${(sw * 2.5).toFixed(1)}`);
        gHidden.appendChild(path);
      } else {
        gVisible.appendChild(path);
      }
    }
  }

  if (state.display.labels) {
    for (const [id, cands] of Object.entries(fig.labels)) {
      for (const c of cands) {
        if (rotate(c.n)[1] >= 0) continue;
        const pr = project(c.p);
        const t = document.createElementNS(SVG_NS, 'text');
        t.setAttribute('x', (pr.x + 12).toFixed(1));
        t.setAttribute('y', (pr.y - 12).toFixed(1));
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('class', `label label--${LABEL_COLOR[id]}`);
        t.textContent = LABEL_TEXT[id];
        gLabels.appendChild(t);
        break;
      }
    }
  }
}

/* ==================================================================
 * UI
 * ================================================================== */
const $ = (id) => document.getElementById(id);

function buildSlider(host, param, get, set) {
  const row = document.createElement('div');
  row.className = 'slider';
  const id = `s-${param.key}`;
  row.innerHTML = `<label for="${id}">${param.label}</label>
    <input type="range" id="${id}" min="${param.min}" max="${param.max}" step="${param.step}">
    <output for="${id}"></output>`;
  host.appendChild(row);
  const input = row.querySelector('input');
  const out = row.querySelector('output');
  const fmt = (v) => param.unit ? `${Math.round(v)}${param.unit}` : v.toFixed(2);
  const sync = () => { input.value = get(); out.textContent = fmt(get()); };
  input.addEventListener('input', () => {
    set(Number(input.value));
    out.textContent = fmt(Number(input.value));
    render();
  });
  sync();
  return sync;
}

(() => {
  const input = $('W'), out = $('W-out');
  input.addEventListener('input', () => {
    state.W = Number(input.value);
    out.textContent = state.W.toFixed(2);
    render();
  });
})();

EGG_PARAMS.forEach(p => buildSlider($('egg-sliders'), p, () => state.egg[p.key], v => state.egg[p.key] = v));
PELVIS_PARAMS.forEach(p => buildSlider($('pelvis-sliders'), p, () => state.pelvis[p.key], v => state.pelvis[p.key] = v));

{
  const input = $('line'), out = $('line-out');
  input.value = state.line;
  out.textContent = state.line.toFixed(3);
  input.addEventListener('input', () => {
    state.line = Number(input.value);
    out.textContent = state.line.toFixed(3);
    render();
  });
}

const yawInput = $('yaw'), pitchInput = $('pitch');
yawInput.addEventListener('input', () => {
  state.view.yaw = Number(yawInput.value);
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  render(); updateViewName();
});
pitchInput.addEventListener('input', () => {
  state.view.pitch = Number(pitchInput.value);
  $('pitch-out').textContent = Math.round(state.view.pitch) + '°';
  render(); updateViewName();
});

document.querySelectorAll('[data-angle]').forEach(b => {
  b.addEventListener('click', () => {
    const map = { front: [0, 0], three: [45, 0], side: [90, 0], back: [180, 0] };
    const [y, p] = map[b.dataset.angle] || [0, 0];
    state.view.yaw = y; state.view.pitch = p;
    yawInput.value = y; pitchInput.value = p;
    $('yaw-out').textContent = y + '°';
    $('pitch-out').textContent = p + '°';
    render(); updateViewName();
  });
});

$('reset-view').addEventListener('click', () => {
  state.view.yaw = 0; state.view.pitch = 0;
  yawInput.value = 0; pitchInput.value = 0;
  $('yaw-out').textContent = '0°';
  $('pitch-out').textContent = '0°';
  render(); updateViewName();
});

const tH = $('toggle-hidden'), tL = $('toggle-labels');
tH.setAttribute('aria-pressed', String(state.display.hidden));
tL.setAttribute('aria-pressed', String(state.display.labels));
tH.addEventListener('click', () => {
  state.display.hidden = !state.display.hidden;
  tH.setAttribute('aria-pressed', String(state.display.hidden));
  render();
});
tL.addEventListener('click', () => {
  state.display.labels = !state.display.labels;
  tL.setAttribute('aria-pressed', String(state.display.labels));
  render();
});

function updateViewName() {
  const y = state.view.yaw;
  const ay = Math.abs(y);
  let name = 'Анфас';
  if (ay > 22 && ay <= 68) name = y > 0 ? '3/4 влево' : '3/4 вправо';
  else if (ay > 68 && ay <= 112) name = y > 0 ? 'Профиль влево' : 'Профиль вправо';
  else if (ay > 112 && ay <= 158) name = 'Задний 3/4';
  else if (ay > 158) name = 'Спина';
  $('view-name').textContent = `${name} · ${Math.round(y)}°`;
}

/* ==================================================================
 * мышь
 * ================================================================== */
let drag = null;
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, yaw: state.view.yaw, pitch: state.view.pitch };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  state.view.yaw = clamp(drag.yaw + (e.clientX - drag.x) * 0.5, -180, 180);
  state.view.pitch = clamp(drag.pitch - (e.clientY - drag.y) * 0.3, -60, 60);
  yawInput.value = state.view.yaw;
  pitchInput.value = state.view.pitch;
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  $('pitch-out').textContent = Math.round(state.view.pitch) + '°';
  render(); updateViewName();
});
stage.addEventListener('pointerup', () => drag = null);
stage.addEventListener('pointercancel', () => drag = null);

/* ==================================================================
 * подложка
 * ================================================================== */
const underlayImg = document.createElementNS(SVG_NS, 'image');
underlayImg.setAttribute('x', CX - SCALE);
underlayImg.setAttribute('y', CY - SCALE);
underlayImg.setAttribute('width', SCALE * 2);
underlayImg.setAttribute('height', SCALE * 2);
underlayImg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
underlayImg.style.display = 'none';
svg.insertBefore(underlayImg, svg.firstChild);

$('underlay-pick').addEventListener('click', () => $('underlay-input').click());
$('underlay-input').addEventListener('change', e => {
  const f = e.target.files?.[0];
  if (f) loadUnderlay(f);
  e.target.value = '';
});
$('underlay-remove').addEventListener('click', () => {
  underlayImg.removeAttribute('href');
  underlayImg.style.display = 'none';
  $('underlay-remove').hidden = true;
  $('underlay-hint').textContent = 'Перетащи файл, вставь из буфера или выбери ниже';
});
$('underlay-opacity').addEventListener('input', e => {
  state.underlay.opacity = Number(e.target.value);
  $('underlay-opacity-out').textContent = Math.round(state.underlay.opacity * 100) + '%';
  underlayImg.style.opacity = state.underlay.opacity;
});
$('underlay-scale').addEventListener('input', e => {
  state.underlay.scale = Number(e.target.value);
  $('underlay-scale-out').textContent = Math.round(state.underlay.scale * 100) + '%';
  applyUnderlayTransform();
});
function applyUnderlayTransform() {
  const s = state.underlay.scale;
  underlayImg.setAttribute('transform',
    `translate(${CX} ${CY}) scale(${s}) translate(${-CX} ${-CY})`);
  underlayImg.style.opacity = state.underlay.opacity;
}
function loadUnderlay(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = () => {
    underlayImg.setAttribute('href', r.result);
    underlayImg.style.display = '';
    $('underlay-remove').hidden = false;
    $('underlay-hint').textContent = file.name;
    applyUnderlayTransform();
  };
  r.readAsDataURL(file);
}
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types ?? [])].includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('drop-cover').hidden = false; } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop-cover').hidden = true; } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('drop-cover').hidden = true;
  const f = e.dataTransfer.files?.[0];
  if (f) loadUnderlay(f);
});
document.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items ?? [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); loadUnderlay(item.getAsFile()); }
});

/* ==================================================================
 * экспорт
 * ================================================================== */
$('save-png').addEventListener('click', async () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVG_NS);
  const bg = document.createElementNS(SVG_NS, 'rect');
  bg.setAttribute('width', 600); bg.setAttribute('height', 600); bg.setAttribute('fill', '#fff');
  clone.insertBefore(bg, clone.firstChild);
  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 1200; c.height = 1200;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b => download(b, 'torso-pelvis.png'));
  };
  img.src = url;
});
$('save-svg').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVG_NS);
  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  download(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }), 'torso-pelvis.svg');
});
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ==================================================================
 * старт
 * ================================================================== */
render();
updateViewName();
</script>
