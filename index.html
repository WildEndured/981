<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова и шея</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #1e1e24; color: #e6e6e6;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; box-sizing: border-box;
  }
  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: .9rem; }
  input[type="range"] { width: 200px; accent-color: #e8b04b; }
  canvas { background: #2a2a33; border-radius: 8px; }
</style>
</head>
<body>

<div class="controls">
  <label>Частей (голов): <span id="val">7</span></label>
  <input id="range" type="range" min="3" max="10" value="7" step="1">
</div>

<canvas id="canvas" width="400" height="700"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const range = document.getElementById('range');
const val = document.getElementById('val');

function draw(parts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20;
  const top = pad;
  const bottom = canvas.height - pad;
  const height = bottom - top;
  const step = height / parts;          // 1 голова
  const left = 20;
  const right = canvas.width - 20;
  const cx = (left + right) / 2;

  // ================= ШАГ 1: сетка =================
  ctx.strokeStyle = '#4a4a5a';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#b8b8c0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, right - 16, y + step / 2);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(cx, bottom);
  ctx.stroke();
  ctx.setLineDash([]);

  // ================= ШАГ 2: голова и шея =================
  const fifth = step / 5;
  
  // Ключевые уровни
  const y0 = top;                   // 0/5 (верх головы)
  const y2 = top + fifth * 2;       // 2/5 (линия глаз)
  const y3 = top + fifth * 3;       // 3/5 (низ черепа)
  const y4 = top + fifth * 4;       // 4/5 (линия подбородка)
  const y5 = top + fifth * 5;       // 5/5 (низ шеи)

  // Радиус круга: он занимает 3 доли (от 0 до 3/5). 
  // Значит его диаметр = 3 * fifth. Радиус = 1.5 * fifth.
  const r = fifth * 1.5;
  const cy = y0 + r;                // Центр круга

  // Ширина челюсти (ровно по краям круга)
  const jawWidthTop = r * 2;        // На уровне 2/5 (по экватору круга)
  const jawWidthBot = r * 1.1;      // На уровне подбородка (4/5)
  const neckWidth = r * 0.5;        // Ширина шеи

  // Вспомогательные пунктирные линии (5 долей)
  ctx.strokeStyle = 'rgba(232,176,75,0.30)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  for (let i = 1; i <= 5; i++) {
    const y = top + fifth * i;
    ctx.beginPath();
    ctx.moveTo(cx - r - 40, y);
    ctx.lineTo(cx + r + 40, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 1. Круг черепа
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Челюсть
  ctx.strokeStyle = '#e8b04b'; // Теперь того же цвета, что и круг
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  // Начинаем от пересечения круга и линии 2/5 (слева)
  ctx.moveTo(cx - jawWidthTop / 2, y2);
  // Идем вниз к подбородку (слева)
  ctx.lineTo(cx - jawWidthBot / 2, y4);
  // Линия подбородка
  ctx.lineTo(cx + jawWidthBot / 2, y4);
  // Идем наверх к пересечению круга и линии 2/5 (справа)
  ctx.lineTo(cx + jawWidthTop / 2, y2);
  ctx.stroke();

  // 3. Шея (от 4/5 до 5/5)
  ctx.strokeStyle = '#e8b04b';
  ctx.beginPath();
  ctx.moveTo(cx - neckWidth / 2, y4);
  ctx.lineTo(cx - neckWidth / 2, y5);
  ctx.moveTo(cx + neckWidth / 2, y4);
  ctx.lineTo(cx + neckWidth / 2, y5);
  ctx.stroke();

  // Подписи долей справа
  ctx.fillStyle = '#b8b8c0';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i++) {
    ctx.fillText(`${i}/5`, cx + r + 10, top + fifth * i - fifth / 2);
  }
}

range.addEventListener('input', () => {
  const n = parseInt(range.value);
  val.textContent = n;
  draw(n);
});

draw(7);
</script>
</body>
</html>
