<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова (Расширенное редактирование)</title>
<style>
  :root {
    --bg: #141419; --panel: #1e1e26; --panel-2: #262630;
    --accent: #e8b04b; --text: #e8e8f0; --muted: #8a8a99;
    --border: #33333f; --danger: #e85b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at top, #1c1c26 0%, var(--bg) 70%);
    color: var(--text); font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; gap: 20px;
  }
  header { text-align: center; }
  header h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; letter-spacing: .3px; }
  header p { margin: 0; font-size: .8rem; color: var(--muted); }
  .app {
    display: flex; gap: 24px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center;
    width: 100%; max-width: 900px;
  }
  .controls {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px 20px;
    width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    max-height: 85vh; overflow-y: auto;
  }
  .controls h2 {
    font-size: .7rem; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted);
    margin: 8px 0 4px; font-weight: 600;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .control { display: flex; flex-direction: column; gap: 4px; }
  .control-head { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; }
  .badge {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--accent); font-variant-numeric: tabular-nums;
    font-size: .7rem; font-weight: 600; padding: 1px 6px;
    border-radius: 999px; min-width: 40px; text-align: center;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%;
    height: 4px; border-radius: 2px; background: #33333f;
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; border: 2px solid var(--accent);
    box-shadow: 0 1px 3px rgba(0,0,0,.4); cursor: pointer; margin-top: -5px;
  }
  .actions {
    display: flex; justify-content: flex-end; align-items: center;
    padding-top: 12px; border-top: 1px solid var(--border); margin-top: 8px;
  }
  .btn-reset {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: .75rem; transition: all .2s;
  }
  .btn-reset:hover { border-color: var(--danger); color: var(--danger); }
  .stage { position: relative; }
  canvas {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    display: block;
  }
</style>
</head>
<body>

<header>
  <h1>Построение головы</h1>
  <p>С расширенными настройками формы</p>
</header>

<div class="app">
  <div class="controls" id="controls-container"></div>
  <div class="stage">
    <canvas id="canvas" width="450" height="800"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Ползунки из loomis.js (плюс твои старые для шеи)
const PARAMS = [
  { key: 'parts',      label: 'Частей (голов)',      min: 3,   max: 10,  step: 1,    def: 7, group: 'Общее' },
  { key: 'radius',     label: 'Размер круга',        min: 1.0, max: 2.0, step: 0.1,  def: 1.5, group: 'Форма черепа' },
  { key: 'attach',     label: 'Крепление челюсти',   min: 1.0, max: 3.0, step: 0.1,  def: 2.0 },
  { key: 'jaw_tilt',   label: 'Наклон челюсти',      min: -40, max: 70,  step: 1,    def: 10, unit: '°', group: 'Челюсть' },
  { key: 'chinW',      label: 'Ширина подбородка',   min: 0.05,max: 1.0, step: 0.05, def: 0.5, group: 'Подбородок' },
  { key: 'chinH',      label: 'Высота подбородка',   min: 3.0, max: 5.0, step: 0.1,  def: 4.0 },
  { key: 'round',      label: 'Округлость',          min: 0,   max: 1,   step: 0.01, def: 0.5 },
  { key: 'neckW',      label: 'Ширина шеи',          min: 0.1, max: 2.0, step: 0.1,  def: 0.6, group: 'Шея' },
  { key: 'neckL',      label: 'Длина шеи',           min: 0.2, max: 3.0, step: 0.1,  def: 1.5 },
  { key: 'neckX',      label: 'Смещение шеи',        min: -1.0,max: 1.0, step: 0.1,  def: 0.0 }
];

let params = {};
PARAMS.forEach(p => params[p.key] = p.def);

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const parts = params.parts;
  const radiusMultiplier = params.radius;
  const attachPos = params.attach;
  const jawTilt = params.jaw_tilt;
  const chinWidthMul = params.chinW;
  const chinHeightPos = params.chinH;
  const roundness = params.round;
  
  const neckW = params.neckW;
  const neckL = params.neckL;
  const neckX = params.neckX;

  const pad = 20, top = pad, bottom = canvas.height - pad;
  const height = bottom - top, step = height / parts;
  const left = 20, right = canvas.width - 20, cx = (left + right) / 2;

  // Сетка
  ctx.strokeStyle = '#3a3a46'; ctx.lineWidth = 1;
  ctx.font = '11px system-ui'; ctx.fillStyle = '#8a8a99';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, right - 16, y + step / 2);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, bottom); ctx.stroke(); ctx.setLineDash([]);

  // Геометрия
  const fifth = step / 5;
  const y0 = top;
  const yAttach = top + fifth * attachPos;
  const y3 = top + fifth * 3;
  const yChin = top + fifth * chinHeightPos;

  const r = fifth * radiusMultiplier;
  const cy = y0 + r;

  const yAttachOffset = Math.abs(yAttach - cy);
  const jawWidthTop = yAttachOffset < r ? 2 * Math.sqrt(r*r - yAttachOffset*yAttachOffset) : r * 2;
  const jawWidthBot = jawWidthTop * chinWidthMul;

  // Вспомогательные линии
  ctx.strokeStyle = 'rgba(232,176,75,0.22)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  for (let i = 1; i <= 5; i++) {
    const y = top + fifth * i;
    ctx.beginPath(); ctx.moveTo(cx - r - 40, y); ctx.lineTo(cx + r + 40, y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // --- ШЕЯ (под челюстью) ---
  const neckHalfW = (jawWidthBot / 2) * neckW;
  const neckShift = (jawWidthTop / 2) * neckX;
  const neckTopY = yChin - 2;
  const neckBotY = yChin + (fifth * neckL);

  ctx.fillStyle = 'rgba(232,176,75,0.1)';
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(cx - neckHalfW + neckShift, neckTopY);
  ctx.lineTo(cx - neckHalfW + neckShift, neckBotY);
  ctx.lineTo(cx + neckHalfW + neckShift, neckBotY);
  ctx.lineTo(cx + neckHalfW + neckShift, neckTopY);
  ctx.stroke();
  ctx.fill();

  // --- ЧЕРЕП ---
  ctx.strokeStyle = '#e8b04b'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

  // --- ЧЕЛЮСТЬ ---
  ctx.beginPath();
  ctx.strokeStyle = '#e8b04b';
  
  // Точка A (крепление)
  const halfTop = jawWidthTop / 2;
  const halfBot = jawWidthBot / 2;
  const ptTopL = { x: cx - halfTop, y: yAttach };
  const ptTopR = { x: cx + halfTop, y: yAttach };
  
  // Наклон челюсти влияет на ширину B (как в твоем коде, но через угол)
  const tiltRad = jawTilt * Math.PI / 180;
  const tiltFactor = Math.cos(tiltRad); 
  const jawWidthB = halfTop * tiltFactor;
  
  const ptBotL = { x: cx - (halfBot * tiltFactor), y: yChin };
  const ptBotR = { x: cx + (halfBot * tiltFactor), y: yChin };

  ctx.moveTo(ptTopL.x, ptTopL.y);
  const yBreak = Math.min(y3, yChin); 
  ctx.lineTo(cx - halfTop, yBreak);

  if (roundness > 0) {
    const cp1x = cx - ptBotL.x - (halfTop - ptBotL.x) * 0.4;
    const cp1y = yBreak + (yChin - yBreak) * 0.3;
    const cp2x = cx - ptBotL.x;
    const cp2y = yBreak + (yChin - yBreak) * 0.8;
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, ptBotL.x, ptBotL.y);
  } else {
    ctx.lineTo(ptBotL.x, ptBotL.y);
  }

  if (roundness > 0) {
    const dip = (yChin - yBreak) * 0.4 * roundness;
    ctx.quadraticCurveTo(cx, yChin + dip, ptBotR.x, ptBotR.y);
  } else {
    ctx.lineTo(ptBotR.x, ptBotR.y);
  }

  if (roundness > 0) {
    const cp1x = cx + ptBotR.x;
    const cp1y = yBreak + (yChin - yBreak) * 0.8;
    const cp2x = cx + ptBotR.x + (halfTop - ptBotR.x) * 0.4;
    const cp2y = yBreak + (yChin - yBreak) * 0.3;
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, ptTopR.x, yBreak);
  } else {
    ctx.lineTo(ptTopR.x, yBreak);
  }

  ctx.lineTo(ptTopR.x, ptTopR.y);
  ctx.stroke();

  // Подписи долей
  ctx.fillStyle = '#8a8a99'; ctx.font = '10px system-ui';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i++) {
    ctx.fillText(`${i}/5`, cx + r + 10, top + fifth * i - fifth / 2);
  }
}

// ================= UI =================
const container = document.getElementById('controls-container');
let currentGroup = '';

PARAMS.forEach(p => {
  if (p.group && p.group !== currentGroup) {
    currentGroup = p.group;
    const h = document.createElement('h2');
    h.textContent = currentGroup;
    container.appendChild(h);
  }

  const row = document.createElement('div');
  row.className = 'control';
  row.innerHTML = `
    <div class="control-head">
      <label>${p.label}</label>
      <span class="badge" id="val-${p.key}">${p.unit ? Math.round(p.def) + p.unit : p.def.toFixed(2)}</span>
    </div>
    <input id="range-${p.key}" type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}">
  `;
  container.appendChild(row);

  const input = row.querySelector('input');
  const badge = row.querySelector('.badge');
  
  const updateFill = () => {
    const val = parseFloat(input.value);
    const pct = ((val - p.min) / (p.max - p.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
    badge.textContent = p.unit ? `${Math.round(val)}${p.unit}` : (p.key === 'chinW' || p.key === 'round' ? val.toFixed(2) : val.toFixed(1));
  };

  input.addEventListener('input', () => {
    params[p.key] = parseFloat(input.value);
    // Логические ограничители для подбородка
    if (p.key === 'attach' && params.attach > params.chinH - 0.5) {
      params.attach = params.chinH - 0.5;
      input.value = params.attach;
    }
    if (p.key === 'chinH' && params.chinH < params.attach + 0.5) {
      params.chinH = params.attach + 0.5;
      input.value = params.chinH;
    }
    updateFill();
    draw();
  });
  updateFill();
});

const actions = document.createElement('div');
actions.className = 'actions';
actions.innerHTML = `<button class="btn-reset" id="btnReset">Сбросить</button>`;
container.appendChild(actions);

document.getElementById('btnReset').addEventListener('click', () => {
  PARAMS.forEach(p => {
    params[p.key] = p.def;
    const input = document.getElementById(`range-${p.key}`);
    const badge = document.getElementById(`val-${p.key}`);
    input.value = p.def;
    const pct = ((p.def - p.min) / (p.max - p.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
    badge.textContent = p.unit ? `${Math.round(p.def)}${p.unit}` : (p.key === 'chinW' || p.key === 'round' ? p.def.toFixed(2) : p.def.toFixed(1));
  });
  draw();
});

draw();
</script>
</body>
</html>
