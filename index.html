<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Фигура: Голова + Торс + Таз (Лайн-арт)</title>
<style>
  :root {
    --guide-red: #f03e6e;
    --guide-blue: #3b7cff;
    --guide-ink: #2a2430;
    --bg: #faf8fc;
    --panel: #ffffff;
    --muted: #8a8394;
    --line: #e5e1eb;
    --accent: #7a4dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--guide-ink);
    background: var(--bg);
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    overflow: hidden;
  }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center;
    padding: 0 16px; gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .view-name {
    font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  #stage {
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, var(--bg) 70%);
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; user-select: none; }
  
  #stage .label {
    font-size: 13px; font-weight: 600;
    paint-order: stroke; stroke: #fff;
    stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none; user-select: none;
  }
  .label--red  { fill: var(--guide-red); }
  .label--blue { fill: var(--guide-blue); }
  .label--ink  { fill: var(--guide-ink); }

  #drop-cover {
    position: absolute; inset: 0;
    background: rgba(122, 77, 255, 0.15);
    border: 2px dashed var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; color: var(--accent);
    pointer-events: none;
  }
  #drop-cover[hidden] { display: none; }
  aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 0;
  }
  section { padding: 0 16px 12px; }
  section h2 {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
    font-weight: 600; margin: 14px 0 8px;
  }
  .btn {
    font: inherit; font-size: 12px;
    padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--guide-ink);
    cursor: pointer; transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .slider {
    display: grid;
    grid-template-columns: 1fr 52px;
    gap: 2px 8px; margin-bottom: 10px;
    align-items: center;
  }
  .slider label { grid-column: 1 / -1; font-size: 12px; }
  .slider input[type="range"] { width: 100%; height: 20px; accent-color: var(--accent); }
  .slider output {
    text-align: right; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 8px; }
  
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 48px 1fr auto; height: 100dvh; }
    aside { border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Фигура (Голова + Торс + Таз)</h1>
  <span class="view-name" id="view-name">Анфас · 0°</span>
</header>

<main id="stage">
  <svg id="canvas" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="drop-cover" hidden>Отпустите, чтобы вставить</div>
</main>

<aside>
  <section>
    <h2>Отображение</h2>
    <div class="row">
      <button class="btn" id="toggle-lineart" aria-pressed="false" type="button" style="width: 100%; font-weight: bold; border-color: var(--guide-ink);">Режим: Каркас</button>
    </div>
    <div class="slider">
      <label>Толщина линии</label>
      <input type="range" id="line" min="0.002" max="0.015" step="0.001" value="0.005">
      <output id="line-out">0.005</output>
    </div>
    <div class="row">
      <button class="btn" id="toggle-hidden" aria-pressed="true" type="button">Скрытые линии</button>
      <button class="btn" id="toggle-labels" aria-pressed="true" type="button">Подписи</button>
    </div>
  </section>

  <section>
    <h2>Поворот</h2>
    <div class="slider">
      <label>Yaw</label>
      <input type="range" id="yaw" min="-180" max="180" step="1" value="0">
      <output id="yaw-out">0°</output>
    </div>
    <div class="slider">
      <label>Pitch</label>
      <input type="range" id="pitch" min="-60" max="60" step="1" value="0">
      <output id="pitch-out">0°</output>
    </div>
  </section>

  <section>
    <h2>Пропорции</h2>
    <div class="slider">
      <label>Ведущий размер W</label>
      <input type="range" id="W" min="0.8" max="1.6" step="0.01" value="1.15">
      <output id="W-out">1.15</output>
    </div>
  </section>

  <section>
    <h2>Голова</h2>
    <div id="head-sliders"></div>
  </section>

  <section>
    <h2>Торс</h2>
    <div id="egg-sliders"></div>
  </section>

  <section>
    <h2>Таз</h2>
    <div id="pelvis-sliders"></div>
  </section>
</aside>

<script type="module">
/* ==================================================================
 * БАЗОВАЯ МАТЕМАТИКА
 * ================================================================== */
const rad = (d) => (d * Math.PI) / 180;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

const SEG = 96;
const CX = 300, CY = 300;
const SCALE = 180;

/* ==================================================================
 * ПАРАМЕТРЫ (ГОЛОВА, ТОРС, ТАЗ)
 * ================================================================== */
const HEAD_PARAMS = [
  { key: 'cut',        label: 'Ширина головы',       min: 0.4,  max: 0.95, step: 0.01, def: 0.73 },
  { key: 'r0',         label: 'Размер черепа',       min: 0.3,  max: 0.95, step: 0.01, def: 0.68 },
  { key: 'jaw_len',    label: 'Длина челюсти',       min: 0,    max: 1.2,  step: 0.01, def: 0.4 },
  { key: 'chin_len',   label: 'Высота подбородка',   min: 0.5,  max: 1.5,  step: 0.01, def: 1.0 },
  { key: 'chin_front', label: 'Выступ подбородка',   min: 0.4,  max: 1.4,  step: 0.01, def: 0.85 },
];

const EGG_PARAMS = [
  { key: 'egg_top',    label: 'Сужение верха',       min: 0.3, max: 0.9,  step: 0.01, def: 0.55 },
  { key: 'egg_bottom', label: 'Ширина низа',         min: 0.7, max: 1.1,  step: 0.01, def: 0.95 },
  { key: 'egg_depth',  label: 'Глубина',             min: 0.5, max: 1.0,  step: 0.01, def: 0.72 },
  { key: 'egg_round',  label: 'Скругление',          min: 0.3, max: 1.0,  step: 0.01, def: 0.6  },
];

const PELVIS_PARAMS = [
  { key: 'p_w',     label: 'Ширина (×W)',            min: 0.7, max: 1.3,  step: 0.01, def: 1.0 },
  { key: 'p_h',     label: 'Высота (×W)',            min: 0.7, max: 1.3,  step: 0.01, def: 1.0 },
  { key: 'p_d',     label: 'Глубина (×W)',           min: 0.5, max: 1.0,  step: 0.01, def: 0.72 },
  { key: 'p_n',     label: 'Квадратность',           min: 2.0, max: 8.0,  step: 0.1,  def: 4.0 },
  { key: 'p_taper', label: 'Сужение книзу',          min: 0.7, max: 1.0,  step: 0.01, def: 0.92 },
];

const state = {
  W: 1.15,
  head: Object.fromEntries(HEAD_PARAMS.map(p => [p.key, p.def])),
  egg: Object.fromEntries(EGG_PARAMS.map(p => [p.key, p.def])),
  pelvis: Object.fromEntries(PELVIS_PARAMS.map(p => [p.key, p.def])),
  line: 0.005,
  lineArt: false,
  view: { yaw: 0, pitch: 0 },
  display: { hidden: true, labels: true },
};

/* ==================================================================
 * МАТЕМАТИКА ГОЛОВЫ
 * ================================================================== */
function makeHead(W, p) {
  const R = W * 0.5; // Масштабируем голову относительно W
  const ball = {
    width: R * (p.cut / Math.sqrt(1 - p.r0 * p.r0)),
    cut: R * p.cut, r0: p.r0,
    sy: (y) => 1, sz: (z) => 1,
    stretch: (x, y, z) => [x, y, z],
  };
  
  const surf = (pt) => pt;
  const rim = (t) => {
    const y = ball.r0 * R * Math.cos(t);
    const z = ball.r0 * R * Math.sin(t);
    return [ball.cut, y, z];
  };

  const lines = [];
  const add = (pts, closed = false) => lines.push({ pts, closed });

  // 1. Центральная линия
  const central = [];
  for (let i = 0; i < SEG; i++) {
    const t = (i / SEG) * Math.PI * 2;
    central.push([0, ball.r0 * R * Math.cos(t), ball.r0 * R * Math.sin(t)]);
  }
  add(central, true);

  // 2. Боковые круги
  const sideCircle = [];
  for (let i = 0; i < SEG; i++) sideCircle.push(rim((i / SEG) * Math.PI * 2));
  add(sideCircle, true);

  // 3. Челюсть
  const zChin = -ball.r0 * R - R * p.chin_len;
  const A = [ball.cut, 0, -ball.r0 * R];
  const B = [R * 0.5, A[1] - R * p.jaw_len * 0.5, A[2] - R * p.jaw_len * 0.86];
  const Cf = [0, -R * p.chin_front, zChin];
  
  const jawR = [A, B, Cf, [-B[0], B[1], B[2]], [-A[0], A[1], A[2]]];
  add(jawR, false);
  
  return { lines };
}

/* ==================================================================
 * МАТЕМАТИКА ТЕЛА
 * ================================================================== */
function makeEgg(W, p) {
  const h = W;
  const wBottom = W * p.egg_bottom;
  const wTop = W * p.egg_top;
  const depth = W * p.egg_depth;
  const k = p.egg_round;

  const profile = (t) => Math.pow(Math.max(0, 1 - t * t), k);
  const widthAt = (t) => ((wBottom + (wTop - wBottom) * (t + 1) / 2) / 2) * profile(t);
  const depthAt = (t) => (depth / 2) * profile(t);

  const point = (phi, t) => [widthAt(t) * Math.cos(phi), depthAt(t) * Math.sin(phi), (h / 2) * t];
  return { h, point, widthAt, depthAt, depth };
}

function makePelvis(W, p) {
  const w = W * p.p_w;
  const h = W * p.p_h;
  const d = W * p.p_d;
  const n = p.p_n;
  const taper = p.p_taper;

  const scaleAt = (t) => 1 - (1 - taper) * (1 - t) / 2;
  const superX = (phi, a) => a * Math.sign(Math.cos(phi)) * Math.pow(Math.abs(Math.cos(phi)), 2 / n);
  const superY = (phi, b) => b * Math.sign(Math.sin(phi)) * Math.pow(Math.abs(Math.sin(phi)), 2 / n);

  const point = (phi, t) => [
    superX(phi, (w / 2) * scaleAt(t)),
    superY(phi, (d / 2) * scaleAt(t)),
    (h / 2) * t,
  ];
  return { h, w, d, point, widthAt: (t) => (w/2)*scaleAt(t), depthAt: (t) => (d/2)*scaleAt(t) };
}

/* ==================================================================
 * СБОРКА ВСЕЙ ФИГУРЫ
 * ================================================================== */
function buildFigure() {
  const W = state.W;
  const headObj = makeHead(W, state.head);
  const egg = makeEgg(W, state.egg);
  const pelvis = makePelvis(W, state.pelvis);

  // Уровни по Z (снизу вверх)
  const pelvisBottom = -pelvis.h;
  const pelvisTop = 0;
  const eggBottom = pelvisTop + W * 0.1;
  const eggTop = eggBottom + egg.h;
  const eggCenterZ = (eggTop + eggBottom) / 2;
  
  const neckBottom = eggTop;
  const neckTop = neckBottom + W * 0.25;
  const headBottom = neckTop + W * 0.15; // Подбородок

  const lines = [];
  const labels = [];
  const addLine = (id, color, pts, closed = false, width = 1, isBody = true) =>
    lines.push({ id, color, pts, closed, width, isBody });

  const eggAt = (phi, t) => {
    const p = egg.point(phi, t);
    return [p[0], p[1], p[2] + eggCenterZ];
  };
  const pelvisAt = (phi, t) => {
    const p = pelvis.point(phi, t);
    return [p[0], p[1], p[2] + pelvisTop];
  };

  /* ---------- ГОЛОВА ---------- */
  // Смещаем голову наверх
  const offsetHead = (pts) => pts.map(p => [p[0], p[1], p[2] + headBottom + (state.head.r0 * W * 0.5)]);
  for (const l of headObj.lines) {
    addLine('head', 'ink', offsetHead(l.pts), l.closed, 1);
  }

  /* ---------- ШЕЯ ---------- */
  const neckW = W * 0.3;
  for (const z of [neckBottom, neckTop]) {
    const pts = [];
    for (let i = 0; i < SEG; i++) {
      const phi = (i / SEG) * Math.PI * 2;
      pts.push([neckW/2 * Math.cos(phi), neckW/2 * Math.sin(phi), z]);
    }
    addLine('neck', 'red', pts, true);
  }

  /* ---------- ТОРС (ЯЙЦО) ---------- */
  for (const t of [-0.85, -0.5, 0, 0.5, 0.85]) {
    const pts = [];
    for (let i = 0; i < SEG; i++) pts.push(eggAt((i / SEG) * Math.PI * 2, t));
    addLine('torso', 'red', pts, true);
  }
  // Центральная линия торса и грудины
  addLine('torso', 'red', [eggAt(0, -0.99), eggAt(0, 0.99)]);
  addLine('torso', 'red', [eggAt(Math.PI, -0.99), eggAt(Math.PI, 0.99)]);

  // Плечи
  const shoulderX = W * 0.85;
  const shoulderZ = eggTop - W * 0.1;
  const clavicle = (sx) => {
    const pts = [];
    for(let i=0; i<=16; i++) {
      const f = i/16;
      pts.push([sx * shoulderX * f, -egg.depth * 0.4 * (1-f) - W * 0.1 * Math.sin(f*Math.PI), shoulderZ - W*0.05 * Math.sin(f*Math.PI)]);
    }
    addLine('clavicle', 'blue', pts);
  };
  clavicle(1); clavicle(-1);

  /* ---------- ТАЗ ---------- */
  for (const t of [-0.85, 0, 0.85]) {
    const pts = [];
    for (let i = 0; i < SEG; i++) pts.push(pelvisAt((i / SEG) * Math.PI * 2, t));
    addLine('pelvis', 'blue', pts, true);
  }
  // Пах
  const crotchZ = pelvisBottom + pelvis.h * 0.2;
  addLine('pelvis', 'blue', [
    [pelvis.w * 0.3, -pelvis.d * 0.8, pelvisBottom + pelvis.h * 0.6],
    [0, -pelvis.d * 0.9, crotchZ],
    [-pelvis.w * 0.3, -pelvis.d * 0.8, pelvisBottom + pelvis.h * 0.6]
  ]);

  return { lines };
}

/* ==================================================================
 * КАМЕРА И ПРОЕКЦИЯ
 * ================================================================== */
function rotate(p) {
  const yaw = rad(state.view.yaw), pitch = rad(state.view.pitch);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = p[0] * cy - p[1] * sy;
  const y1 = p[0] * sy + p[1] * cy;
  const x2 = x1;
  const y2 = y1 * cp - p[2] * sp;
  const z2 = y1 * sp + p[2] * cp;
  return [x2, y2, z2];
}

function project(p) {
  const r = rotate(p);
  // Смещаем центр камеры вниз, чтобы фигура влезла
  return { x: CX + r[0] * SCALE, y: CY + 50 - r[2] * SCALE };
}

/* ==================================================================
 * РЕНДЕР
 * ================================================================== */
const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('canvas');
const gHidden = document.createElementNS(SVG_NS, 'g');
const gVisible = document.createElementNS(SVG_NS, 'g');
svg.appendChild(gHidden);
svg.appendChild(gVisible);

const COLOR_MAP = { red: 'var(--guide-red)', blue: 'var(--guide-blue)', ink: 'var(--guide-ink)' };

function computeNormal(pts, i) {
  const prev = pts[Math.max(0, i - 1)];
  const next = pts[Math.min(pts.length - 1, i + 1)];
  const tangent = sub(next, prev);
  const p = pts[i];
  const radial = [p[0], p[1], 0];
  const n0 = [
    tangent[1] * radial[2] - tangent[2] * radial[1],
    tangent[2] * radial[0] - tangent[0] * radial[2],
    tangent[0] * radial[1] - tangent[1] * radial[0],
  ];
  if (len(n0) < 1e-6) return norm(radial);
  const sign = (n0[0] * radial[0] + n0[1] * radial[1]) >= 0 ? 1 : -1;
  return norm([n0[0] * sign, n0[1] * sign, n0[2] * sign]);
}

function render() {
  const fig = buildFigure();
  gHidden.innerHTML = '';
  gVisible.innerHTML = '';

  const sw = state.line * SCALE;

  for (const l of fig.lines) {
    // В режиме лайн-арта показываем ТОЛЬКО контуры (замкнутые линии)
    if (state.lineArt && !l.closed) continue;

    const projected = l.pts.map(project);
    
    // Разбиваем линию на видимые/скрытые части
    const parts = [];
    let cur = { vis: null, pts: [] };

    for (let i = 0; i < l.pts.length; i++) {
      // Для головы нормаль считать сложнее, поэтому просто делаем её видимой
      const n = l.id === 'head' ? [0, -1, 0] : computeNormal(l.pts, i);
      const v = rotate(n)[1] < 0;

      if (cur.vis === null) {
        cur.vis = v; cur.pts.push(projected[i]);
      } else if (cur.vis === v) {
        cur.pts.push(projected[i]);
      } else {
        cur.pts.push(projected[i]);
        parts.push(cur);
        cur = { vis: v, pts: [projected[i]] };
      }
    }
    if (cur.pts.length) parts.push(cur);

    for (const part of parts) {
      if (part.pts.length < 2) continue;
      const path = document.createElementNS(SVG_NS, 'path');
      let d = `M${part.pts[0].x.toFixed(1)},${part.pts[0].y.toFixed(1)}`;
      for (let i = 1; i < part.pts.length; i++) d += `L${part.pts[i].x.toFixed(1)},${part.pts[i].y.toFixed(1)}`;
      if (l.closed && part.pts === parts[0].pts && parts.length === 1) d += 'Z';
      
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      
      // В режиме лайн-арта всё рисуем чёрным и чуть толще
      const strokeColor = state.lineArt ? 'var(--guide-ink)' : (COLOR_MAP[l.color] || 'var(--guide-ink)');
      const strokeWidth = state.lineArt ? sw * 1.5 : sw;
      
      path.setAttribute('stroke', strokeColor);
      path.setAttribute('stroke-width', strokeWidth.toFixed(2));
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');

      if (!part.vis) {
        if (!state.display.hidden) continue;
        path.setAttribute('stroke-opacity', '0.2');
        path.setAttribute('stroke-dasharray', `${sw * 2} ${sw * 3}`);
        gHidden.appendChild(path);
      } else {
        gVisible.appendChild(path);
      }
    }
  }
}

/* ==================================================================
 * UI ИНТЕРФЕЙС
 * ================================================================== */
const $ = (id) => document.getElementById(id);

function buildSlider(host, param, get, set) {
  const row = document.createElement('div');
  row.className = 'slider';
  const id = `s-${param.key}`;
  row.innerHTML = `<label for="${id}">${param.label}</label>
    <input type="range" id="${id}" min="${param.min}" max="${param.max}" step="${param.step}">
    <output for="${id}"></output>`;
  host.appendChild(row);
  const input = row.querySelector('input');
  const out = row.querySelector('output');
  const sync = () => { input.value = get(); out.textContent = Number(get()).toFixed(2); };
  input.addEventListener('input', () => {
    set(Number(input.value));
    out.textContent = Number(input.value).toFixed(2);
    render();
  });
  sync();
}

HEAD_PARAMS.forEach(p => buildSlider($('head-sliders'), p, () => state.head[p.key], v => state.head[p.key] = v));
EGG_PARAMS.forEach(p => buildSlider($('egg-sliders'), p, () => state.egg[p.key], v => state.egg[p.key] = v));
PELVIS_PARAMS.forEach(p => buildSlider($('pelvis-sliders'), p, () => state.pelvis[p.key], v => state.pelvis[p.key] = v));

$('toggle-lineart').addEventListener('click', (e) => {
  state.lineArt = !state.lineArt;
  e.target.textContent = state.lineArt ? 'Режим: Лайн-арт' : 'Режим: Каркас';
  e.target.setAttribute('aria-pressed', String(state.lineArt));
  e.target.style.background = state.lineArt ? 'var(--guide-ink)' : '#fff';
  e.target.style.color = state.lineArt ? '#fff' : 'var(--guide-ink)';
  render();
});

$('toggle-hidden').addEventListener('click', (e) => {
  state.display.hidden = !state.display.hidden;
  e.target.setAttribute('aria-pressed', String(state.display.hidden));
  render();
});

// Вращение и зум
const yawInput = $('yaw'), pitchInput = $('pitch');
yawInput.addEventListener('input', () => { state.view.yaw = Number(yawInput.value); render(); updateViewName(); });
pitchInput.addEventListener('input', () => { state.view.pitch = Number(pitchInput.value); render(); updateViewName(); });

$('W').addEventListener('input', (e) => {
  state.W = Number(e.target.value);
  $('W-out').textContent = state.W.toFixed(2);
  render();
});

function updateViewName() {
  const y = state.view.yaw;
  const ay = Math.abs(y);
  let name = 'Анфас';
  if (ay > 22 && ay <= 68) name = '3/4';
  else if (ay > 68 && ay <= 112) name = 'Профиль';
  else if (ay > 112) name = 'Спина';
  $('view-name').textContent = `${name} · ${Math.round(y)}°`;
}

let drag = null;
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, yaw: state.view.yaw, pitch: state.view.pitch };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  state.view.yaw = clamp(drag.yaw + (e.clientX - drag.x) * 0.5, -180, 180);
  state.view.pitch = clamp(drag.pitch - (e.clientY - drag.y) * 0.3, -60, 60);
  yawInput.value = state.view.yaw;
  pitchInput.value = state.view.pitch;
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  $('pitch-out').textContent = Math.round(state.view.pitch) + '°';
  render(); updateViewName();
});
stage.addEventListener('pointerup', () => drag = null);

render();
updateViewName();
</script>
</body>
</html>
