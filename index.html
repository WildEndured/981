<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Детектор границ без OpenCV</title>
    <style>
        body { font-family: Arial; background: #1e1e1e; color: #fff; text-align: center; padding: 20px; }
        .wrapper { display: inline-block; position: relative; border: 2px solid #444; border-radius: 8px; overflow: hidden; }
        canvas { display: block; max-width: 100%; }
        input, button { margin: 10px; padding: 8px 16px; font-size: 16px; cursor: pointer; }
        button { background: #ff4d4d; color: white; border: none; border-radius: 5px; }
        button:hover { background: #cc0000; }
        .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .box { display: flex; flex-direction: column; align-items: center; }
        .label { font-size: 14px; color: #aaa; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>Детектор границ (без OpenCV)</h1>
    <p id="status">Выберите изображение</p>
    
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="process()">Найти границы</button>
    
    <div class="row">
        <div class="box">
            <span class="label">Оригинал</span>
            <div class="wrapper"><canvas id="srcCanvas"></canvas></div>
        </div>
        <div class="box">
            <span class="label">Границы (белые линии)</span>
            <div class="wrapper"><canvas id="outCanvas"></canvas></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const srcCanvas = document.getElementById('srcCanvas');
        const outCanvas = document.getElementById('outCanvas');
        const status = document.getElementById('status');
        let imageLoaded = false;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => {
                // Ограничиваем размер для скорости
                const maxSize = 800;
                let w = img.width, h = img.height;
                if (w > maxSize || h > maxSize) {
                    const scale = maxSize / Math.max(w, h);
                    w = Math.round(w * scale);
                    h = Math.round(h * scale);
                }
                srcCanvas.width = w; srcCanvas.height = h;
                outCanvas.width = w; outCanvas.height = h;
                
                const ctx = srcCanvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                
                imageLoaded = true;
                status.textContent = "Изображение загружено. Нажмите 'Найти границы'.";
            };
            img.src = URL.createObjectURL(file);
        });

        function process() {
            if (!imageLoaded) { alert("Сначала загрузите картинку!"); return; }
            status.textContent = "Обработка...";
            
            setTimeout(() => {
                const w = srcCanvas.width;
                const h = srcCanvas.height;
                
                const srcCtx = srcCanvas.getContext('2d');
                const outCtx = outCanvas.getContext('2d');
                
                const srcData = srcCtx.getImageData(0, 0, w, h);
                const gray = new Uint8ClampedArray(w * h);
                
                // 1. Переводим в оттенки серого
                for (let i = 0; i < srcData.data.length; i += 4) {
                    gray[i / 4] = (srcData.data[i] * 0.299 + 
                                   srcData.data[i+1] * 0.587 + 
                                   srcData.data[i+2] * 0.114);
                }
                
                // 2. Размытие (убираем шум)
                const blurred = new Uint8ClampedArray(w * h);
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        let sum = 0;
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                sum += gray[(y + dy) * w + (x + dx)];
                            }
                        }
                        blurred[y * w + x] = sum / 9;
                    }
                }
                
                // 3. Оператор Собеля — определяем границы
                const edges = new Uint8ClampedArray(w * h);
                const threshold = 60; // Порог чувствительности (можно менять)
                
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        // Градиент по X
                        const gx = 
                            -1 * blurred[(y-1)*w + (x-1)] + 1 * blurred[(y-1)*w + (x+1)] +
                            -2 * blurred[y*w + (x-1)]     + 2 * blurred[y*w + (x+1)] +
                            -1 * blurred[(y+1)*w + (x-1)] + 1 * blurred[(y+1)*w + (x+1)];
                        // Градиент по Y
                        const gy = 
                            -1 * blurred[(y-1)*w + (x-1)] - 2 * blurred[(y-1)*w + x] - 1 * blurred[(y-1)*w + (x+1)] +
                             1 * blurred[(y+1)*w + (x-1)] + 2 * blurred[(y+1)*w + x] + 1 * blurred[(y+1)*w + (x+1)];
                        
                        const mag = Math.sqrt(gx * gx + gy * gy);
                        edges[y * w + x] = mag > threshold ? 255 : 0;
                    }
                }
                
                // 4. Рисуем результат
                const outData = outCtx.createImageData(w, h);
                for (let i = 0; i < edges.length; i++) {
                    // Инвертируем: черные линии на белом фоне
                    const val = 255 - edges[i];
                    outData.data[i*4]     = val;
                    outData.data[i*4 + 1] = val;
                    outData.data[i*4 + 2] = val;
                    outData.data[i*4 + 3] = 255;
                }
                outCtx.putImageData(outData, 0, 0);
                
                status.textContent = "Готово!";
            }, 50); // Небольшая задержка, чтобы UI обновился
        }
    </script>
</body>
</html>
