<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Грудная клетка Лумиса — 2D (360°)</title>
<style>
  :root {
    --guide-red: #f03e6e;
    --guide-blue: #3b7cff;
    --guide-green: #14b87a;
    --guide-orange: #ff8a3d;
    --bg: #faf8fc;
    --panel: #ffffff;
    --text: #2a2430;
    --muted: #8a8394;
    --line: #e5e1eb;
    --accent: #7a4dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    overflow: hidden;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .view-name {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  header .btn { font-size: 13px; padding: 6px 10px; }
  #stage {
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, var(--bg) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; user-select: none; }
  #stage .label {
    font-size: 13px;
    font-weight: 600;
    paint-order: stroke;
    stroke: #fff;
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }
  .label--red { fill: var(--guide-red); }
  .label--blue { fill: var(--guide-blue); }
  .label--green { fill: var(--guide-green); }
  .label--orange { fill: var(--guide-orange); }
  .label--ink { fill: var(--text); }
  #drop-cover {
    position: absolute;
    inset: 0;
    background: rgba(122, 77, 255, 0.15);
    border: 2px dashed var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    pointer-events: none;
  }
  #drop-cover[hidden] { display: none; }
  aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 0;
  }
  section { padding: 0 16px 12px; }
  section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 14px 0 8px;
  }
  .btn {
    font: inherit;
    font-size: 12px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .slider {
    display: grid;
    grid-template-columns: 1fr 52px;
    grid-template-rows: auto auto;
    gap: 2px 8px;
    margin-bottom: 10px;
    align-items: center;
  }
  .slider label { grid-column: 1 / -1; font-size: 12px; color: var(--text); }
  .slider input[type="range"] { width: 100%; height: 20px; accent-color: var(--accent); }
  .slider output {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .group-h {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 12px 0 6px;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i {
    width: 10px; height: 10px; border-radius: 3px; display: inline-block;
  }
  @media (max-width: 800px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: 48px 1fr auto;
      height: 100dvh;
    }
    aside { border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Грудная клетка Лумиса — 2D</h1>
  <span class="view-name" id="view-name">Анфас · 0°</span>
  <button class="btn" id="about-btn" type="button">О методе</button>
</header>

<main id="stage">
  <svg id="canvas" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="drop-cover" hidden>Отпустите, чтобы вставить</div>
</main>

<aside>
  <section>
    <h2>Поворот</h2>
    <div class="slider">
      <label>Yaw (вокруг вертикали)</label>
      <input type="range" id="yaw" min="-180" max="180" step="1" value="0">
      <output id="yaw-out">0°</output>
    </div>
    <div class="slider">
      <label>Pitch (вверх-вниз)</label>
      <input type="range" id="pitch" min="-60" max="60" step="1" value="0">
      <output id="pitch-out">0°</output>
    </div>
    <div class="row">
      <button class="btn" data-angle="front" type="button">Анфас</button>
      <button class="btn" data-angle="three" type="button">3/4</button>
      <button class="btn" data-angle="side" type="button">Профиль</button>
      <button class="btn" data-angle="back" type="button">Спина</button>
    </div>
    <div class="row">
      <button class="btn" id="spin" type="button" aria-pressed="false">↻ Крутить</button>
      <button class="btn" id="reset-view" type="button">Сброс</button>
    </div>
  </section>

  <section>
    <h2>Пресеты формы</h2>
    <div class="row" id="presets"></div>
  </section>

  <section>
    <h2>Форма</h2>
    <div id="shape-sliders"></div>
  </section>

  <section>
    <h2>Отображение</h2>
    <div class="slider">
      <label>Толщина линии</label>
      <input type="range" id="line" min="0.002" max="0.03" step="0.001" value="0.008">
      <output id="line-out">0.008</output>
    </div>
    <div class="row">
      <button class="btn" id="toggle-hidden" aria-pressed="true" type="button">Скрытые линии</button>
      <button class="btn" id="toggle-labels" aria-pressed="true" type="button">Подписи</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--guide-red)"></i>средняя линия</span>
      <span><i style="background:var(--guide-blue)"></i>грудная клетка</span>
      <span><i style="background:var(--guide-green)"></i>плечи</span>
      <span><i style="background:var(--guide-orange)"></i>талия</span>
    </div>
  </section>

  <section>
    <h2>Подложка</h2>
    <p class="hint" id="underlay-hint">Перетащи файл, вставь из буфера или выбери ниже</p>
    <div class="row">
      <button class="btn" id="underlay-pick" type="button">Выбрать</button>
      <button class="btn" id="underlay-remove" type="button" hidden>Удалить</button>
      <input type="file" id="underlay-input" accept="image/*" hidden>
    </div>
    <div class="slider">
      <label>Прозрачность</label>
      <input type="range" id="underlay-opacity" min="0.1" max="0.9" step="0.05" value="0.4">
      <output id="underlay-opacity-out">40%</output>
    </div>
    <div class="slider">
      <label>Масштаб</label>
      <input type="range" id="underlay-scale" min="0.3" max="2" step="0.01" value="1">
      <output id="underlay-scale-out">100%</output>
    </div>
  </section>

  <section>
    <h2>Экспорт</h2>
    <div class="row">
      <button class="btn" id="save-png" type="button">PNG</button>
      <button class="btn" id="save-svg" type="button">SVG</button>
    </div>
  </section>
</aside>

<script type="module">
/* ==================================================================
 * torso.js — яйцевидная грудная клетка (метод Лумиса)
 * ================================================================== */

const rad = (d) => (d * Math.PI) / 180;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const addv = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mulv = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mirrorX = (a) => [-a[0], a[1], a[2]];
const lerp = (a, b, t) => [
  a[0] + (b[0] - a[0]) * t,
  a[1] + (b[1] - a[1]) * t,
  a[2] + (b[2] - a[2]) * t,
];
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const smooth = (t) => t * t * (3 - 2 * t);

const SHAPE_PARAMS = [
  { key: 'width_top',   label: 'Ширина сверху (ключицы)', min: 0.20, max: 0.90, step: 0.01, def: 0.46 },
  { key: 'width_mid',   label: 'Ширина середины',         min: 0.30, max: 1.10, step: 0.01, def: 0.72 },
  { key: 'width_bot',   label: 'Ширина снизу (дуга)',     min: 0.30, max: 1.10, step: 0.01, def: 0.62 },
  { key: 'height',      label: 'Высота торса',            min: 0.80, max: 1.60, step: 0.01, def: 1.20 },
  { key: 'depth',       label: 'Глубина (толщина)',       min: 0.30, max: 1.00, step: 0.01, def: 0.50 },
  { key: 'front_flat',  label: 'Плоскость переда',        min: 0.00, max: 0.60, step: 0.01, def: 0.28 },
  { key: 'back_round',  label: 'Округлость спины',        min: 0.00, max: 0.60, step: 0.01, def: 0.18 },
  { key: 'egg_bias',    label: 'Смещение яйца вниз',      min: 0.00, max: 0.60, step: 0.01, def: 0.22 },
  { key: 'ribs',        label: 'Количество рёбер',        min: 4,    max: 10,   step: 1,    def: 6 },
  { key: 'rib_bulge',   label: 'Выпуклость рёбер',        min: 0.00, max: 0.30, step: 0.01, def: 0.08 },
  { key: 'sternum_w',   label: 'Ширина грудины',          min: 0.02, max: 0.25, step: 0.01, def: 0.08 },
  { key: 'clavicle',    label: 'Ширина ключиц',           min: 0.20, max: 1.20, step: 0.01, def: 0.78 },
  { key: 'clav_h',      label: 'Высота ключиц',           min: -0.20, max: 0.20, step: 0.01, def: 0.02 },
  { key: 'waist',       label: 'Уровень талии',           min: -0.30, max: 0.40, step: 0.01, def: 0.02 },
  { key: 'waist_w',     label: 'Ширина талии',            min: 0.30, max: 1.00, step: 0.01, def: 0.60 },
  { key: 'nipple_h',    label: 'Уровень сосков',          min: -0.10, max: 0.40, step: 0.01, def: 0.12 },
  { key: 'nipple_w',    label: 'Расстояние сосков',       min: 0.10, max: 0.60, step: 0.01, def: 0.28 },
  { key: 'shoulder_y',  label: 'Посадка плеч',            min: -0.20, max: 0.20, step: 0.01, def: 0.04 },
  { key: 'tilt',        label: 'Наклон торса',            min: -30,  max: 30,   step: 1,    def: 0,   unit: '°' },
];

const LINE_PARAM = { min: 0.002, max: 0.03, step: 0.001, def: 0.008 };
const RED = 'red', BLUE = 'blue', GREEN = 'green', ORANGE = 'orange';
const RIB_SEG = 48;

function defaultShape() {
  const s = {};
  for (const p of SHAPE_PARAMS) s[p.key] = p.def;
  return s;
}

function clampShape(input) {
  const s = {};
  for (const p of SHAPE_PARAMS) {
    const v = Number(input?.[p.key]);
    s[p.key] = Number.isFinite(v) ? clamp(v, p.min, p.max) : p.def;
  }
  return s;
}

/* ==================================================================
 * Яйцевидный профиль
 * ==================================================================
 *
 * Форма яйца:
 *   - сверху узко (ключицы),
 *   - максимальная ширина в нижней трети (рёберная дуга),
 *   - снизу снова чуть уже.
 *
 * Параметр egg_bias смещает «широкую» часть яйца вниз.
 * front_flat уменьшает выпуклость передней стенки (z > 0),
 * back_round увеличивает выпуклость спины (z < 0).
 */

function makeTorso(s) {
  const H = s.height;
  const Wtop = s.width_top;
  const Wmid = s.width_mid;
  const Wbot = s.width_bot;
  const D = s.depth;

  const yTop = H * 0.5;
  const yBot = -H * 0.5;

  // t = 0 внизу, 1 сверху
  function tOf(y) {
    return clamp((y - yBot) / (yTop - yBot), 0, 1);
  }

  // яйцевидная ширина: смещаем «максимум» вниз через egg_bias
  function widthAt(y) {
    const t = tOf(y);
    // сдвигаем параметр так, чтобы максимум ширины был не в середине,
    // а ниже — в районе рёберной дуги
    const bias = s.egg_bias;
    const u = clamp((t + bias) / (1 + bias), 0, 1);
    // яйцо: sqrt-профиль с более плавным верхом
    const egg = Math.sqrt(Math.max(0, 1 - u * u));
    // три опорных значения — интерполируем по t
    // нижняя треть — широкая (дуга), середина — максимум, верх — узко
    const wBotMix = Wbot;
    const wMidMix = Wmid;
    const wTopMix = Wtop;
    // базовая линия по t: снизу вверх
    let base;
    if (t < 0.33) {
      const k = smooth(t / 0.33);
      base = wBotMix + (wMidMix - wBotMix) * k;
    } else {
      const k = smooth((t - 0.33) / 0.67);
      base = wMidMix + (wTopMix - wMidMix) * k;
    }
    // добавляем яйцевидную поправку: сверху сужаем сильнее
    const eggFactor = 0.55 + 0.45 * egg;
    return base * eggFactor;
  }

  // глубина: перед плоский, спина округлая
  function depthAt(y) {
    const t = tOf(y);
    const bulge = Math.sin(t * Math.PI) * s.rib_bulge;
    return D * 0.5 + bulge * 0.5;
  }

  // поперечное сечение — «яйцо», а не эллипс:
  // θ = 0 → +z (перёд), θ = π → -z (спина)
  // f(θ) даёт более плоский фронт и более округлый тыл
  function crossSection(theta) {
    const c = Math.cos(theta); // 1 спереди, -1 сзади
    const s2 = Math.sin(theta);
    // фронт сжимаем (плоскость), тыл растягиваем (округлость)
    const front = s.front_flat;
    const back = s.back_round;
    let zScale;
    if (c >= 0) {
      // передняя половина: сжимаем к плоскости
      zScale = 1 - front * (c * c);
    } else {
      // задняя половина: расширяем
      zScale = 1 + back * (c * c);
    }
    return { x: Math.cos(theta), z: Math.sin(theta) * zScale };
  }

  // точка на поверхности по углу θ и высоте y
  function surf(theta, y) {
    const w = widthAt(y);
    const d = depthAt(y);
    const cs = crossSection(theta);
    // x умножаем на ширину, z — на глубину
    // при этом x = cos, z = sin * zScale
    return [w * cs.x, y, d * cs.z];
  }

  // нормаль — численно через частные производные
  function normalAt(theta, y) {
    const eps = 1e-3;
    const p0 = surf(theta, y);
    const pT = surf(theta + eps, y);
    const pY = surf(theta, y + eps);
    const dT = sub(pT, p0);
    const dY = sub(pY, p0);
    const n = [
      dT[1] * dY[2] - dT[2] * dY[1],
      dT[2] * dY[0] - dT[0] * dY[2],
      dT[0] * dY[1] - dT[1] * dY[0],
    ];
    // направляем наружу
    const outward = [p0[0], 0, p0[2]];
    if (n[0] * outward[0] + n[2] * outward[2] < 0) {
      return norm([-n[0], -n[1], -n[2]]);
    }
    return norm(n);
  }

  return { H, yTop, yBot, widthAt, depthAt, surf, normalAt, crossSection };
}

/* ==================================================================
 * Построение грудной клетки
 * ================================================================== */

function buildTorso(input) {
  const s = clampShape(input);
  const T = makeTorso(s);
  const { H, yTop, yBot, widthAt, depthAt, surf, normalAt } = T;

  const lines = [];
  const labels = {};

  function add(id, color, pts, closed = false) {
    lines.push({ id, color, closed, pts });
  }

  // точки с нормалями через параметризацию (θ, y)
  function surfWithNormal(theta, y) {
    const p = surf(theta, y);
    const n = normalAt(theta, y);
    return { p, n };
  }

  /* ---------- ① Средняя линия (перед и спина) ---------- */
  {
    const front = [];
    const back = [];
    for (let i = 0; i <= 32; i++) {
      const y = yBot + (H * i) / 32;
      const pf = surf(0, y);         // θ = 0 → перед
      const pb = surf(Math.PI, y);   // θ = π → спина
      front.push({ p: pf, n: norm([0, 0, 1]) });
      back.push({ p: pb, n: norm([0, 0, -1]) });
    }
    add('1f', RED, front);
    add('1b', RED, back);
    labels['1'] = [
      { p: surf(0, yTop * 0.9), n: [0, 0, 1] },
      { p: surf(0, yBot * 0.9), n: [0, 0, 1] },
    ];
  }

  /* ---------- ② Ключичная линия ---------- */
  {
    const y = yTop - 0.02;
    const w = s.clavicle;
    const pts = [];
    const STEPS = 24;
    for (let i = 0; i <= STEPS; i++) {
      const t = i / STEPS;
      const x = -w + 2 * w * t;
      const arc = Math.sin(t * Math.PI) * 0.02;
      // берём z с передней стенки через угол
      const theta = Math.asin(clamp(x / Math.max(widthAt(y), 1e-4), -1, 1));
      const pf = surf(theta, y);
      pts.push({ p: [x, y + arc + s.clav_h, pf[2] * 0.98], n: norm([0, 0.2, 1]) });
    }
    add('2', RED, pts);
    labels['2'] = [{ p: [0, y + s.clav_h + 0.02, surf(0, y)[2]], n: [0, 0.2, 1] }];
  }

  /* ---------- ③ Контур яйца (передний силуэт) ---------- */
  {
    // передний контур: правый и левый край яйца по высоте
    const rightEdge = [];
    const leftEdge = [];
    for (let i = 0; i <= 24; i++) {
      const y = yBot + (H * i) / 24;
      const w = widthAt(y);
      // крайняя точка при θ ≈ 0 и θ ≈ π даёт z, а x=0;
      // крайняя по x — при θ = ±π/2, но там z=0.
      // Для силуэта «яйца» спереди берём θ = π/2 и -π/2.
      const pr = surf(Math.PI / 2, y);
      const pl = surf(-Math.PI / 2, y);
      rightEdge.push({ p: [w, y, pr[2] * 0.2], n: norm([1, 0, 0]) });
      leftEdge.push({ p: [-w, y, pl[2] * 0.2], n: norm([-1, 0, 0]) });
    }
    add('3', BLUE, rightEdge);
    add('3', BLUE, leftEdge);

    // нижняя рёберная дуга (по передней полуплоскости)
    const ribArch = [];
    const ARCH = 40;
    for (let i = 0; i <= ARCH; i++) {
      const th = -Math.PI / 2 + Math.PI * (i / ARCH);
      const sw = surfWithNormal(th, yBot);
      ribArch.push(sw);
    }
    add('3', BLUE, ribArch);

    // верхняя ключичная дуга (по передней полуплоскости)
    const topArch = [];
    for (let i = 0; i <= ARCH; i++) {
      const th = -Math.PI / 2 + Math.PI * (i / ARCH);
      const sw = surfWithNormal(th, yTop);
      topArch.push(sw);
    }
    add('3', BLUE, topArch);

    labels['3'] = [
      { p: [widthAt(0) * 0.9, 0, 0], n: [1, 0, 0] },
      { p: [-widthAt(0) * 0.9, 0, 0], n: [-1, 0, 0] },
      { p: surf(0, yBot), n: [0, -1, 0.3] },
    ];
  }

  /* ---------- ④ Рёбра ---------- */
  {
    const nRib = Math.round(s.ribs);
    const yRibTop = yTop - 0.08;
    const yRibBot = yBot + 0.14;
    const ribPts = [];
    for (let r = 0; r < nRib; r++) {
      const t = nRib === 1 ? 0.5 : r / (nRib - 1);
      const y = yRibTop + (yRibBot - yRibTop) * t;
      // переднее ребро: θ от 0 (середина) до ±π/2 (бок)
      const rightPts = [];
      const leftPts = [];
      for (let i = 0; i <= RIB_SEG / 2; i++) {
        const a = (i / (RIB_SEG / 2)) * Math.PI / 2;
        const sr = surfWithNormal(a, y);
        const sl = surfWithNormal(-a, y);
        rightPts.push(sr);
        leftPts.push(sl);
      }
      ribPts.push(rightPts);
      add('4', BLUE, rightPts);
      add('4', BLUE, leftPts);
    }
    labels['4'] = ribPts.length
      ? [
          { p: ribPts[0][Math.floor(ribPts[0].length / 2)].p, n: [0.3, 0, 1] },
          { p: ribPts[ribPts.length - 1][Math.floor(ribPts[0].length / 2)].p, n: [0.3, 0, 1] },
        ]
      : [];
  }

  /* ---------- ⑤ Грудина ---------- */
  {
    const sw = s.sternum_w;
    const top = yTop - 0.08;
    const bot = yBot + 0.20;
    const left = [];
    const right = [];
    const STEPS = 16;
    for (let i = 0; i <= STEPS; i++) {
      const t = i / STEPS;
      const y = top + (bot - top) * t;
      const pf = surf(0, y);
      const half = sw * (0.5 + 0.5 * Math.sin(t * Math.PI));
      left.push({ p: [-half, y, pf[2] * 1.01], n: [0, 0, 1] });
      right.push({ p: [half, y, pf[2] * 1.01], n: [0, 0, 1] });
    }
    add('5', RED, left);
    add('5', RED, right);
    add('5', RED, [left[0], right[0]]);
    add('5', RED, [left[left.length - 1], right[right.length - 1]]);
    labels['5'] = [{ p: [0, (top + bot) / 2, surf(0, (top + bot) / 2)[2] * 1.05], n: [0, 0, 1] }];
  }

  /* ---------- ⑥ Линия сосков ---------- */
  {
    const y = s.nipple_h;
    const w = s.nipple_w;
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const x = -w + 2 * w * t;
      // определяем θ по x и берём z на поверхности
      const theta = Math.asin(clamp(x / Math.max(widthAt(y), 1e-4), -1, 1));
      const pf = surf(theta, y);
      const droop = -Math.sin(t * Math.PI) * 0.015;
      pts.push({ p: [x, y + droop, pf[2] * 0.99], n: [0, 0, 1] });
    }
    add('6', RED, pts);
    for (const sx of [1, -1]) {
      const circle = [];
      const thetaN = sx > 0 ? Math.PI / 2 : -Math.PI / 2;
      const base = surf(thetaN * 0.5, y);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        circle.push({
          p: [sx * w + Math.cos(a) * 0.015, y + Math.sin(a) * 0.015, base[2]],
          n: [0, 0, 1],
        });
      }
      add('6', RED, circle, true);
    }
    labels['6'] = [{ p: surf(0, y), n: [0, 0, 1] }];
  }

  /* ---------- ⑦ Талия ---------- */
  {
    const y = yBot + s.waist * 0.3;
    const w = s.waist_w;
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const a = Math.PI * t;
      const x = -w + 2 * w * t;
      const theta = -Math.PI / 2 + a;
      const sf = surf(theta, y);
      pts.push({ p: [x, y, sf[2]], n: norm([x * 0.3, 0, sf[2]]) });
    }
    add('7', ORANGE, pts);
    labels['7'] = [{ p: surf(0, y), n: [0, 0, 1] }];
  }

  /* ---------- ⑧ Плечи ---------- */
  {
    const y = yTop + s.shoulder_y;
    const w = widthAt(yTop) + 0.02;
    const d = depthAt(yTop) * 0.7;

    const pts = [];
    for (let i = 0; i <= 32; i++) {
      const t = i / 32;
      const x = -w + 2 * w * t;
      const arch = Math.cos(t * Math.PI - Math.PI / 2);
      pts.push({ p: [x, y + arch * 0.03, d * 0.5], n: [0, 0, 1] });
    }
    add('8', GREEN, pts);

    for (const sx of [1, -1]) {
      const circle = [];
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        circle.push({
          p: [sx * w + Math.cos(a) * 0.03, y + Math.sin(a) * 0.03, d * 0.6],
          n: [0, 0, 1],
        });
      }
      add('8', GREEN, circle, true);
    }
    labels['8'] = [
      { p: [w, y + 0.03, d * 0.6], n: [1, 0.3, 0] },
      { p: [-w, y + 0.03, d * 0.6], n: [-1, 0.3, 0] },
    ];
  }

  /* ---------- Ⓐ Ось наклона ---------- */
  {
    const top = [0, yTop, 0];
    const bot = [0, yBot, 0];
    add('A', ORANGE, [
      { p: bot, n: [1, 0, 0] },
      { p: top, n: [1, 0, 0] },
    ]);
    labels['A'] = [{ p: lerp(bot, top, 0.5), n: [1, 0, 0] }];
  }

  /* ---------- Ⓑ Угол рёбер ---------- */
  {
    const y = yBot + 0.1;
    const w = widthAt(y);
    const d = depthAt(y);
    const angleR = { p: [w, y, d * 0.2], n: norm([1, 0, 0.2]) };
    const angleL = { p: [-w, y, d * 0.2], n: norm([-1, 0, 0.2]) };
    add('B', ORANGE, [angleR, angleL]);
    labels['B'] = [angleR, angleL];
  }

  /* ---------- Ⓒ Пупок ---------- */
  {
    const y = yBot + 0.05;
    const pf = surf(0, y);
    const circle = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      circle.push({
        p: [Math.cos(a) * 0.02, y + Math.sin(a) * 0.02, pf[2]],
        n: [0, 0, 1],
      });
    }
    add('C', ORANGE, circle, true);
    labels['C'] = [{ p: [0, y, pf[2] * 1.05], n: [0, 0, 1] }];
  }

  /* ---------- Ⓓ Ключичные точки ---------- */
  {
    const y = yTop - 0.02;
    const w = s.clavicle;
    const pf = surf(0, y);
    labels['D'] = [
      { p: [w, y, pf[2] * 0.9], n: norm([1, 0.5, 0]) },
      { p: [-w, y, pf[2] * 0.9], n: norm([-1, 0.5, 0]) },
    ];
  }

  return { lines, labels };
}

const STORE_KEY = 'loomis-torso:v2';
const state = loadState();

function wrapYaw(y) { return ((((y + 180) % 360) + 360) % 360) - 180; }

function loadState() {
  const def = {
    shape: defaultShape(),
    preset: 'male',
    line: LINE_PARAM.def,
    view: { yaw: 0, pitch: 0 },
    display: { hidden: true, labels: true },
    underlay: { opacity: 0.4, scale: 1 },
  };
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (!raw) return def;
    return {
      ...def,
      shape: clampShape(raw.shape),
      preset: PRESETS.some((p) => p.id === raw.preset) ? raw.preset : null,
      line: Number.isFinite(raw.line)
        ? clamp(raw.line, LINE_PARAM.min, LINE_PARAM.max)
        : def.line,
      view: {
        yaw: Number.isFinite(raw.view?.yaw) ? wrapYaw(raw.view.yaw) : 0,
        pitch: Number.isFinite(raw.view?.pitch) ? clamp(raw.view.pitch, -60, 60) : 0,
      },
      display: {
        hidden: raw.display?.hidden !== false,
        labels: raw.display?.labels !== false,
      },
      underlay: { opacity: 0.4, scale: 1 },
    };
  } catch {
    return def;
  }
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
  }, 300);
}

const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('canvas');
const stage = document.getElementById('stage');
const VIEW_SIZE = 600;
const CX = VIEW_SIZE / 2;
const CY = VIEW_SIZE / 2;
const SCALE = 170;

const gUnderlay = document.createElementNS(SVG_NS, 'g');
const gHidden = document.createElementNS(SVG_NS, 'g');

underlayImg.setAttribute('width', SCALE * 2);
underlayImg.setAttribute('height', SCALE * 2);
underlayImg.style.display = 'none';
gUnderlay.appendChild(underlayImg);

const LABEL_TEXT = {
  '1': '①', '2': '②', '3': '③', '4': '④', '5': '⑤',
  '6': '⑥', '7': '⑦', '8': '⑧',
  A: 'Ⓐ', B: 'Ⓑ', C: 'Ⓒ', D: 'Ⓓ',
};
const LABEL_COLOR = {
  '1': 'red', '2': 'red', '3': 'blue', '4': 'blue', '5': 'red',
  '6': 'red', '7': 'orange', '8': 'green',
  A: 'orange', B: 'orange', C: 'orange', D: 'ink',
};

function rotatePoint(p) {
  const yaw = rad(state.view.yaw);
  const pitch = rad(state.view.pitch);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = p[0] * cy - p[2] * sy;
  const z1 = p[0] * sy + p[2] * cy;
  const y1 = p[1];
  const x2 = x1;
  const y2 = y1 * cp - z1 * sp;
  const z2 = y1 * sp + z1 * cp;
  return [x2, y2, z2];
}

function project(p) {
  const r = rotatePoint(p);
  return { x: CX + r[0] * SCALE, y: CY - r[1] * SCALE, depth: r[2] };
}

function isVisible(n) {
  const rn = rotatePoint(n);
  return rn[2] > 0;
}

function lineToPath(pts, closed) {
  if (!pts.length) return '';
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) d += `L${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;
  if (closed) d += 'Z';
  return d;
}

function splitByVisibility(items) {
  const result = [];
  if (!items.length) return result;
  let cur = null;
  for (let i = 0; i < items.length; i++) {
    const vis = isVisible(items[i].n);
    if (!cur || cur.visible !== vis) {
      if (cur && cur.pts.length > 1) result.push(cur);
      cur = { visible: vis, pts: [project(items[i].p)] };
    } else {
      cur.pts.push(project(items[i].p));
    }
  }
  if (cur && cur.pts.length > 1) result.push(cur);
  return result;
}

function colorVar(c) {
  return c === RED ? 'var(--guide-red)'
    : c === BLUE ? 'var(--guide-blue)'
    : c === GREEN ? 'var(--guide-green)'
    : 'var(--guide-orange)';
}

function render() {
  const torso = buildTorso(state.shape);
  gVisible.innerHTML = '';
  gHidden.innerHTML = '';
  gLabels.innerHTML = '';

  const strokeW = state.line * SCALE;

  for (const l of torso.lines) {
    const parts = splitByVisibility(l.pts);
    for (const part of parts) {
      if (part.pts.length < 2) continue;
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', lineToPath(part.pts, l.closed));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', colorVar(l.color));
      path.setAttribute('stroke-width', strokeW.toFixed(2));
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      if (!part.visible) {
        if (!state.display.hidden) continue;
        path.setAttribute('stroke-opacity', '0.22');
        path.setAttribute('stroke-dasharray', `${(strokeW * 1.5).toFixed(1)} ${(strokeW * 2.5).toFixed(1)}`);
        gHidden.appendChild(path);
      } else {
        gVisible.appendChild(path);
      }
    }
  }

  if (state.display.labels) {
    for (const [id, cands] of Object.entries(torso.labels)) {
      let best = null;
      for (const c of cands) {
        if (!isVisible(c.n)) continue;
        best = c;
        break;
      }
      if (!best) continue;
      const proj = project(best.p);
      const nProj = project(addv(best.p, mulv(norm(best.n), 0.2)));
      let dx = nProj.x - proj.x;
      let dy = nProj.y - proj.y;
      const dl = Math.hypot(dx, dy) || 1;
      dx /= dl; dy /= dl;
      const t = document.createElementNS(SVG_NS, 'text');
      t.setAttribute('x', (proj.x + dx * 14).toFixed(1));
      t.setAttribute('y', (proj.y + dy * 14).toFixed(1));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('class', `label label--${LABEL_COLOR[id]}`);
      t.textContent = LABEL_TEXT[id];
      gLabels.appendChild(t);
    }
  }
}

const $ = (id) => document.getElementById(id);

function viewName() {
  const y = state.view.yaw;
  const ay = Math.abs(y);
  if (ay <= 22) return 'Анфас';
  if (ay <= 68) return y > 0 ? '3/4 влево' : '3/4 вправо';
  if (ay <= 112) return y > 0 ? 'Профиль влево' : 'Профиль вправо';
  if (ay <= 158) return 'Задний 3/4';
  return 'Спина';
}

function updateViewName() {
  const p = state.view.pitch;
  const sign = p > 0 ? ` · ↑${Math.round(p)}°` : p < 0 ? ` · ↓${Math.round(-p)}°` : '';
  $('view-name').textContent = `${viewName()} · ${Math.round(state.view.yaw)}°${sign}`;
}

const yawInput = $('yaw');
const pitchInput = $('pitch');

yawInput.addEventListener('input', () => {
  stopSpin();
  state.view.yaw = wrapYaw(Number(yawInput.value));
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  render();
  updateViewName();
  save();
});

pitchInput.addEventListener('input', () => {
  state.view.pitch = Number(pitchInput.value);
  $('pitch-out').textContent = Math.round(state.view.pitch) + '°';
  render();
  updateViewName();
  save();
});

document.querySelectorAll('[data-angle]').forEach((b) => {
  b.addEventListener('click', () => {
    stopSpin();
    const angles = { front: [0, 0], three: [45, 0], side: [90, 0], back: [180, 0] };
    const [yaw, pitch] = angles[b.dataset.angle] || [0, 0];
    state.view.yaw = yaw;
    state.view.pitch = pitch;
    yawInput.value = yaw;
    pitchInput.value = pitch;
    $('yaw-out').textContent = yaw + '°';
    $('pitch-out').textContent = pitch + '°';
    render();
    updateViewName();
    save();
  });
});

$('reset-view').addEventListener('click', () => {
  stopSpin();
  state.view.yaw = 0;
  state.view.pitch = 0;
  yawInput.value = 0;
  pitchInput.value = 0;
  $('yaw-out').textContent = '0°';
  $('pitch-out').textContent = '0°';
  render();
  updateViewName();
  save();
});

let spinRAF = 0;
const spinBtn = $('spin');

function stopSpin() {
  if (spinRAF) {
    cancelAnimationFrame(spinRAF);
    spinRAF = 0;
  }
  spinBtn.setAttribute('aria-pressed', 'false');
}

spinBtn.addEventListener('click', () => {
  const on = spinBtn.getAttribute('aria-pressed') !== 'true';
  spinBtn.setAttribute('aria-pressed', String(on));
  if (on) {
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(64, now - last);
      last = now;
      state.view.yaw = wrapYaw(state.view.yaw + dt * 0.04);
      yawInput.value = state.view.yaw;
      $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
      render();
      updateViewName();
      spinRAF = requestAnimationFrame(tick);
    };
    spinRAF = requestAnimationFrame(tick);
  } else {
    stopSpin();
    save();
  }
});

    <input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}">
    <output for="${id}"></output>`;
  shapeHost.appendChild(row);
  const input = row.querySelector('input');
  const out = row.querySelector('output');
  const fmt = (v) =>
    p.unit === '°' ? `${Math.round(v)}°` : p.key === 'ribs' ? String(Math.round(v)) : v.toFixed(2);
  const sync = () => {
    input.value = state.shape[p.key];
    out.textContent = fmt(state.shape[p.key]);

    state.shape[p.key] = Number(input.value);
    state.preset = null;
    out.textContent = fmt(Number(input.value));
    renderPresets();
    render();
    save();
  });
  sync();
  shapeSyncers.push(sync);
}

function syncShapeSliders() {

  underlayImg.style.display = 'none';
  underlayRemove.hidden = true;
  $('underlay-hint').textContent = 'Перетащи файл, вставь из буфера или выбери ниже';
  try { localStorage.removeItem(STORE_KEY + ':img'); } catch {}
});

underlayOpacity.addEventListener('input', () => {
  state.underlay.opacity = Number(underlayOpacity.value);
  $('underlay-opacity-out').textContent = Math.round(state.underlay.opacity * 100) + '%';
  underlayImg.style.opacity = state.underlay.opacity;
  save();
});

underlayScale.addEventListener('input', () => {
  state.underlay.scale = Number(underlayScale.value);
  $('underlay-scale-out').textContent = Math.round(state.underlay.scale * 100) + '%';
  applyUnderlayTransform();
  save();
});

underlayOpacity.value = state.underlay.opacity;
underlayScale.value = state.underlay.scale;
$('underlay-opacity-out').textContent = Math.round(state.underlay.opacity * 100) + '%';
$('underlay-scale-out').textContent = Math.round(state.underlay.scale * 100) + '%';

function applyUnderlayTransform() {
  const s = state.underlay.scale;
  underlayImg.setAttribute(
    'transform',
    `translate(${CX} ${CY}) scale(${s}) translate(${-CX} ${-CY})`
  );
  underlayImg.style.opacity = state.underlay.opacity;
}

function loadUnderlay(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    underlayImg.setAttribute('href', dataUrl);
    underlayImg.style.display = '';
    underlayRemove.hidden = false;
    $('underlay-hint').textContent = file.name;
    applyUnderlayTransform();
    try { localStorage.setItem(STORE_KEY + ':img', dataUrl); } catch {}
  };
  reader.readAsDataURL(file);
}

try {
  const saved = localStorage.getItem(STORE_KEY + ':img');
  if (saved) {
    underlayImg.setAttribute('href', saved);
    underlayImg.style.display = '';
    underlayRemove.hidden = false;
    $('underlay-hint').textContent = 'Сохранённая подложка';
    applyUnderlayTransform();
  }
} catch {}

let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes('Files');

window.addEventListener('dragenter', (e) => {
  if (!hasFiles(e)) return;
  dragDepth++;
  $('drop-cover').hidden = false;
});

window.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) {
    dragDepth = 0;
    $('drop-cover').hidden = true;
  }
});

window.addEventListener('dragover', (e) => {
  if (hasFiles(e)) e.preventDefault();
});

window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('drop-cover').hidden = true;
  const f = e.dataTransfer.files?.[0];
  if (f) loadUnderlay(f);
});

document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items ?? [])].find((i) =>
    i.type.startsWith('image/')
  );
  if (item) {
    e.preventDefault();
    loadUnderlay(item.getAsFile());
  }
});

/* ==================================================================
 * Экспорт
 * ================================================================== */

$('save-png').addEventListener('click', async () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVG_NS);
  const bg = document.createElementNS(SVG_NS, 'rect');
  bg.setAttribute('width', VIEW_SIZE);
  bg.setAttribute('height', VIEW_SIZE);
  bg.setAttribute('fill', '#ffffff');
  clone.insertBefore(bg, clone.firstChild);

  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 1200;
    canvas.height = 1200;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob((b) => download(b, 'loomis-torso.png'));
  };
  img.src = url;
});

$('save-svg').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVG_NS);
  const xml =
    '<?xml version="1.0" encoding="UTF-8"?>\n' +
    new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  download(blob, 'loomis-torso.svg');
});

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ==================================================================
 * Перетаскивание мышью
 * ================================================================== */

let dragStart = null;

stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('aside')) return;
  stopSpin();
  dragStart = {
    x: e.clientX,
    y: e.clientY,
    yaw: state.view.yaw,
    pitch: state.view.pitch,
  };
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener('pointermove', (e) => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  state.view.yaw = wrapYaw(dragStart.yaw + dx * 0.5);
  state.view.pitch = clamp(dragStart.pitch - dy * 0.3, -60, 60);
  yawInput.value = state.view.yaw;
  pitchInput.value = state.view.pitch;
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  $('pitch-out').textContent = Math.round(state.view.pitch) + '°';
  render();
  updateViewName();
});

stage.addEventListener('pointerup', () => {
  dragStart = null;
  save();
});

stage.addEventListener('pointercancel', () => {
  dragStart = null;
  save();
});

/* ==================================================================
 * Горячие клавиши
 * ================================================================== */

window.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  const step = e.shiftKey ? 15 : 5;
  if (e.key === 'ArrowLeft') {
    stopSpin();
    state.view.yaw = wrapYaw(state.view.yaw - step);
  } else if (e.key === 'ArrowRight') {
    stopSpin();
    state.view.yaw = wrapYaw(state.view.yaw + step);
  } else if (e.key === 'ArrowUp') {
    state.view.pitch = clamp(state.view.pitch + step, -60, 60);
  } else if (e.key === 'ArrowDown') {
    state.view.pitch = clamp(state.view.pitch - step, -60, 60);
  } else if (e.key === 'r' || e.key === 'R') {
    state.view.yaw = 0;
    state.view.pitch = 0;
  } else {
    return;
  }
  yawInput.value = state.view.yaw;
  pitchInput.value = state.view.pitch;
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  $('pitch-out').textContent = Math.round(state.view.pitch) + '°';
  render();
  updateViewName();
  save();
});

/* ==================================================================
 * Запуск
 * ================================================================== */

syncShapeSliders();
renderPresets();
render();
updateViewName();
