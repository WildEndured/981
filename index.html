<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Удаление фона — Color Key + Flood Fill + Fill Holes</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
    min-height: 100vh;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; opacity: .8; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: center; padding: 12px 16px;
    background: #1d2027; border-radius: 12px;
    max-width: min(96vw, 980px);
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  .controls label {
    font-size: 13px; display: flex; gap: 6px; align-items: center;
    user-select: none;
  }
  input[type="file"] { font-size: 13px; max-width: 220px; }
  input[type="range"] { width: 160px; accent-color: #ff5a7a; }
  .val {
    display: inline-block; min-width: 30px; text-align: right;
    font-variant-numeric: tabular-nums; opacity: .8;
  }
  button {
    background: #2a2f3a; color: #e6e6e6; border: 1px solid #3a4150;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #343b48; }
  button.primary { background: #ff5a7a; border-color: #ff5a7a; color: #fff; }
  button.primary:hover { background: #ff738c; }
  .colorSwatch {
    width: 22px; height: 22px; border-radius: 5px;
    border: 1px solid #3a4150; display: inline-block; vertical-align: middle;
  }
  .stage {
    position: relative; display: inline-block;
    border: 1px solid #2b2f37; background: #0b0c0f; line-height: 0;
    border-radius: 8px; overflow: hidden;
    max-width: min(96vw, 980px);
  }
  .stage canvas { display: block; max-width: 100%; height: auto; }
  .stage canvas#overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    width: 100%; height: 100%;
  }
  .stage.picking { cursor: crosshair; }
  .stage.picking canvas#overlay { pointer-events: auto; cursor: crosshair; }
  .status { font-size: 12px; opacity: .6; min-height: 16px; }
  .legend { display: flex; gap: 14px; font-size: 12px; opacity: .75; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  @media (max-width: 640px) {
    .controls { flex-direction: column; align-items: stretch; }
    input[type="range"] { width: 100%; }
  }
</style>
</head>
<body>

<h1>Удаление фона: Color Key + Flood Fill + Fill Holes</h1>

<div class="controls">
  <label>🖼 Изображение
    <input id="file" type="file" accept="image/*" />
  </label>

  <label>🎚 Толерантность
    <input id="tol" type="range" min="5" max="120" value="45" />
    <span class="val" id="tolVal">45</span>
  </label>

  <label>🖌 Растушёвка краёв
    <input id="feather" type="range" min="0" max="4" value="1" />
    <span class="val" id="featherVal">1</span>
  </label>

  <label title="Кликните по картинке, чтобы взять цвет фона вручную">
    🎯 Цвет фона:
    <span class="colorSwatch" id="swatch"></span>
    <button id="pickBtn" type="button">Пипетка</button>
    <button id="autoBtn" type="button">Авто</button>
  </label>

  <label>👁 <input id="showMask" type="checkbox" checked /> Маска</label>
  <label>🙈 <input id="hideImage" type="checkbox" /> Скрыть оригинал</label>

  <button id="exportBtn" class="primary" type="button">💾 Экспорт PNG</button>
</div>

<div class="stage" id="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div class="legend">
  <span><span class="dot" style="background:#ff3c5c"></span> Персонаж</span>
  <span><span class="dot" style="background:#4ade80"></span> Заполненные дырки</span>
  <span><span class="dot" style="background:#ffd166"></span> Растушёвка</span>
</div>
<div class="status" id="status">Загрузите изображение, чтобы начать.</div>

<script>
/* =========================================================
   Элементы
   ========================================================= */
const fileInput   = document.getElementById('file');
const baseCanvas  = document.getElementById('base');
const overlay     = document.getElementById('overlay');
const stageEl     = document.getElementById('stage');
const tolEl       = document.getElementById('tol');
const tolVal      = document.getElementById('tolVal');
const featherEl   = document.getElementById('feather');
const featherVal  = document.getElementById('featherVal');
const swatchEl    = document.getElementById('swatch');
const pickBtn     = document.getElementById('pickBtn');
const autoBtn     = document.getElementById('autoBtn');
const showMaskEl  = document.getElementById('showMask');
const hideImgEl   = document.getElementById('hideImage');
const exportBtn   = document.getElementById('exportBtn');
const statusEl    = document.getElementById('status');

const baseCtx    = baseCanvas.getContext('2d', { willReadFrequently: true });
const overlayCtx = overlay.getContext('2d', { willReadFrequently: true });

/* =========================================================
   Состояние
   ========================================================= */
let imgW = 0, imgH = 0;
let sourceData = null;   // Uint8ClampedArray RGBA оригинала
let mask = null;         // Uint8Array: 0=персонаж, 1=фон, 2=дырка (фон), 3=растушёвка
let bgColor = { r: 250, g: 240, b: 240 };
let picking = false;

/* =========================================================
   Загрузка изображения
   ========================================================= */
fileInput.addEventListener('change', e => {
  const file = e.target.files?.[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    imgW = img.naturalWidth;
    imgH = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width = imgW; c.height = imgH;
    });

    baseCtx.clearRect(0, 0, imgW, imgH);
    baseCtx.drawImage(img, 0, 0);

    const id = baseCtx.getImageData(0, 0, imgW, imgH);
    sourceData = id.data;

    // Автоматически подобрать цвет фона
    autoDetectBgColor();

    process();
    URL.revokeObjectURL(url);
    statusEl.textContent = `Загружено ${imgW}×${imgH}. Пипетка/ползунок — для подстройки.`;
  };
  img.onerror = () => {
    statusEl.textContent = 'Не удалось загрузить изображение.';
  };
  img.src = url;
});

/* =========================================================
   Автоопределение цвета фона по 4 углам (медиана)
   ========================================================= */
function autoDetectBgColor() {
  if (!sourceData) return;
  const w = imgW, h = imgH;

  // Небольшие площадки в углах (5×5), чтобы усреднить шум
  const sampleSize = 5;
  const corners = [
    { x: 0,           y: 0 },
    { x: w - sampleSize, y: 0 },
    { x: 0,           y: h - sampleSize },
    { x: w - sampleSize, y: h - sampleSize },
  ];

  const rs = [], gs = [], bs = [];
  for (const { x, y } of corners) {
    for (let dy = 0; dy < sampleSize; dy++) {
      for (let dx = 0; dx < sampleSize; dx++) {
        const px = Math.min(w - 1, x + dx);
        const py = Math.min(h - 1, y + dy);
        const i = (py * w + px) * 4;
        rs.push(sourceData[i]);
        gs.push(sourceData[i + 1]);
        bs.push(sourceData[i + 2]);
      }
    }
  }
  const med = arr => arr.slice().sort((a, b) => a - b)[arr.length >> 1];
  bgColor = { r: med(rs), g: med(gs), b: med(bs) };
  updateSwatch();
}

function updateSwatch() {
  swatchEl.style.background = `rgb(${bgColor.r},${bgColor.g},${bgColor.b})`;
}

/* =========================================================
   ПИПЕТКА: клик по изображению
   ========================================================= */
pickBtn.addEventListener('click', () => {
  if (!sourceData) return;
  picking = !picking;
  stageEl.classList.toggle('picking', picking);
  pickBtn.textContent = picking ? 'Отмена' : 'Пипетка';
  statusEl.textContent = picking
    ? 'Кликните по фону на изображении.'
    : 'Готово.';
});

overlay.addEventListener('click', e => {
  if (!picking || !sourceData) return;
  const rect = overlay.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / rect.width  * imgW);
  const y = Math.floor((e.clientY - rect.top)  / rect.height * imgH);
  const i = (y * imgW + x) * 4;
  bgColor = { r: sourceData[i], g: sourceData[i + 1], b: sourceData[i + 2] };
  updateSwatch();
  picking = false;
  stageEl.classList.remove('picking');
  pickBtn.textContent = 'Пипетка';
  process();
  statusEl.textContent = `Цвет фона: rgb(${bgColor.r}, ${bgColor.g}, ${bgColor.b})`;
});

autoBtn.addEventListener('click', () => {
  autoDetectBgColor();
  process();
  statusEl.textContent = 'Цвет фона определён автоматически.';
});

/* =========================================================
   Ползунки
   ========================================================= */
tolEl.addEventListener('input', () => {
  tolVal.textContent = tolEl.value;
  process();
});
featherEl.addEventListener('input', () => {
  featherVal.textContent = featherEl.value;
  process();
});
showMaskEl.addEventListener('change', () => process());
hideImgEl.addEventListener('change', () => {
  baseCanvas.style.opacity = hideImgEl.checked ? '0' : '1';
  stageEl.style.background = hideImgEl.checked ? '#fff' : '#0b0c0f';
});

/* =========================================================
   ОСНОВНОЙ КОНВЕЙЕР
   1) color key  →  isBgRaw
   2) flood fill от краёв по «фоноподобным» пикселям
   3) fill holes — внутренние замкнутые области → фон
   4) морфология + растушёвка
   ========================================================= */
function process() {
  if (!sourceData) return;

  const w = imgW, h = imgH;
  const N = w * h;
  const tol = +tolEl.value;

  /* --- Шаг 1. Цветовое расстояние в RGB --- */
  // Квадрат расстояния — быстрее
  const tol2 = tol * tol;
  const { r: br, g: bg, b: bb } = bgColor;
  const isBgRaw = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const p = i * 4;
    const dr = sourceData[p]     - br;
    const dg = sourceData[p + 1] - bg;
    const db = sourceData[p + 2] - bb;
    if (dr * dr + dg * dg + db * db <= tol2) isBgRaw[i] = 1;
  }

  /* --- Шаг 2. Flood fill фона от краёв ---
     Только фоноподобные пиксели, связанные с границей,
     образуют «внешний» фон. */
  const isBg = new Uint8Array(N); // 1 = точно фон
  const queue = new Int32Array(N);
  let qh = 0, qt = 0;

  const tryPush = (i) => {
    if (i < 0 || i >= N) return;
    if (isBg[i] || !isBgRaw[i]) return;
    isBg[i] = 1;
    queue[qt++] = i;
  };

  // Края
  for (let x = 0; x < w; x++) { tryPush(x); tryPush((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { tryPush(y * w); tryPush(y * w + w - 1); }

  while (qh < qt) {
    const i = queue[qh++];
    const x = i % w;
    const y = (i / w) | 0;
    if (x > 0)     tryPush(i - 1);
    if (x < w - 1) tryPush(i + 1);
    if (y > 0)     tryPush(i - w);
    if (y < h - 1) tryPush(i + w);
  }

  /* --- Шаг 3. FILL HOLES ---
     Ищем компоненты «не-фон», связанные с краем изображения.
     Всё, что не связано, — это замкнутые внутренние области,
     которые тоже на самом деле фон. Помечаем как фон. */
  const reachable = new Uint8Array(N); // достижимо от края через не-фон
  qh = 0; qt = 0;
  const pushR = (i) => {
    if (i < 0 || i >= N) return;
    if (reachable[i] || isBg[i]) return;
    reachable[i] = 1;
    queue[qt++] = i;
  };
  for (let x = 0; x < w; x++) { pushR(x); pushR((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { pushR(y * w); pushR(y * w + w - 1); }
  while (qh < qt) {
    const i = queue[qh++];
    const x = i % w;
    const y = (i / w) | 0;
    if (x > 0)     pushR(i - 1);
    if (x < w - 1) pushR(i + 1);
    if (y > 0)     pushR(i - w);
    if (y < h - 1) pushR(i + w);
  }

  // Маска 0=персонаж, 1=фон, 2=дырка
  mask = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    if (isBg[i]) mask[i] = 1;
    else if (!reachable[i]) mask[i] = 2; // дырка → тоже фон
    else mask[i] = 0;                    // персонаж
  }

  /* --- Шаг 4. Морфологическое сглаживание ---
     Убираем бахрому: 1 проход erode+dilate (open) на маске персонажа. */
  mask = morphologyOpen(mask, w, h, 1);

  /* --- Шаг 5. Растушёвка краёв ---
     Пиксели персонажа, соседствующие с фоном, помечаем как 3 (feather). */
  const feather = +featherEl.value;
  if (feather > 0) {
    for (let pass = 0; pass < feather; pass++) {
      const next = mask.slice();
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          if (mask[i] !== 0) continue;
          const n =
            mask[i - 1] === 1 || mask[i - 1] === 2 || mask[i - 1] === 3 ||
            mask[i + 1] === 1 || mask[i + 1] === 2 || mask[i + 1] === 3 ||
            mask[i - w] === 1 || mask[i - w] === 2 || mask[i - w] === 3 ||
            mask[i + w] === 1 || mask[i + w] === 2 || mask[i + w] === 3;
          if (n) next[i] = 3;
        }
      }
      mask = next;
    }
  }

  drawOverlay();
}

/* =========================================================
   Морфология: open = erode → dilate (для маски персонажа)
   mask: 0=персонаж, 1/2=фон, 3=feather
   ========================================================= */
function morphologyOpen(m, w, h, r) {
  const isChar = v => v === 0;
  let cur = m;

  for (let pass = 0; pass < r; pass++) cur = erode(cur, w, h, isChar);
  for (let pass = 0; pass < r; pass++) cur = dilate(cur, w, h, isChar);
  return cur;
}

function erode(m, w, h, isChar) {
  const out = m.slice();
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      if (!isChar(m[i])) continue;
      // если хоть один сосед — не персонаж, стираем
      if (!isChar(m[i - 1]) || !isChar(m[i + 1]) ||
          !isChar(m[i - w]) || !isChar(m[i + w])) {
        out[i] = 1;
      }
    }
  }
  return out;
}

function dilate(m, w, h, isChar) {
  const out = m.slice();
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      if (isChar(m[i])) continue;
      if (isChar(m[i - 1]) || isChar(m[i + 1]) ||
          isChar(m[i - w]) || isChar(m[i + w])) {
        out[i] = 0;
      }
    }
  }
  return out;
}

/* =========================================================
   Отрисовка маски поверх оригинала
   ========================================================= */
function drawOverlay() {
  if (!mask) return;
  const w = imgW, h = imgH;
  const img = overlayCtx.createImageData(w, h);
  const d = img.data;

  const showMask = showMaskEl.checked;
  const hideImg  = hideImgEl.checked;

  for (let i = 0, p = 0; i < w * h; i++, p += 4) {
    const m = mask[i];

    if (hideImg) {
      // Белый фон, персонаж — исходный цвет, дырки — зелёные
      if (m === 0) {
        const q = i * 4;
        d[p]     = sourceData[q];
        d[p + 1] = sourceData[q + 1];
        d[p + 2] = sourceData[q + 2];
        d[p + 3] = 255;
      } else if (m === 2) {
        d[p] = 74; d[p + 1] = 222; d[p + 2] = 128; d[p + 3] = 255;
      } else if (m === 3) {
        d[p] = 255; d[p + 1] = 209; d[p + 2] = 102; d[p + 3] = 255;
      } else {
        d[p] = 255; d[p + 1] = 255; d[p + 2] = 255; d[p + 3] = 255;
      }
    } else if (showMask) {
      // Полупрозрачная заливка поверх оригинала
      if (m === 0)      { d[p] = 255; d[p + 1] = 60;  d[p + 2] = 92;  d[p + 3] = 110; }
      else if (m === 2) { d[p] = 74;  d[p + 1] = 222; d[p + 2] = 128; d[p + 3] = 150; }
      else if (m === 3) { d[p] = 255; d[p + 1] = 209; d[p + 2] = 102; d[p + 3] = 140; }
    }
  }
  overlayCtx.putImageData(img, 0, 0);
}

/* =========================================================
   Экспорт PNG с прозрачным фоном
   ========================================================= */
exportBtn.addEventListener('click', () => {
  if (!sourceData) {
    statusEl.textContent = 'Сначала загрузите изображение.';
    return;
  }
  const w = imgW, h = imgH;
  const out = new ImageData(w, h);
  const d = out.data;

  for (let i = 0, p = 0; i < w * h; i++, p += 4) {
    const m = mask[i];
    const q = i * 4;

    d[p]     = sourceData[q];
    d[p + 1] = sourceData[q + 1];
    d[p + 2] = sourceData[q + 2];

    if (m === 0) {
      d[p + 3] = 255;
    } else if (m === 3) {
      // растушёвка: полупрозрачный пиксель
      d[p + 3] = 140;
    } else {
      d[p + 3] = 0; // фон и дырки → прозрачно
    }
  }

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').putImageData(out, 0, 0);

  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'no-bg.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    statusEl.textContent = 'PNG сохранён.';
  }, 'image/png');
});

/* Инициализация */
updateSwatch();
</script>

</body>
</html>
