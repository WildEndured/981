<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Штриховка до силуэта персонажа</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    background: #1d2027;
    border-radius: 10px;
    max-width: 100%;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; max-width: 160px; }
  input[type="color"] {
    width: 32px; height: 24px; border: none; border-radius: 4px;
    background: none; cursor: pointer; padding: 0;
  }
  button {
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #333a44;
    background: #232830;
    color: #e6e6e6;
    cursor: pointer;
  }
  button:hover { background: #2c323c; }
  button.active { background: #2b6cb0; border-color: #2b6cb0; }
  .stage {
    position: relative;
    display: inline-block;
    border: 1px solid #2b2f37;
    background: #0b0c0f;
    line-height: 0;
  }
  .stage canvas {
    display: block;
    max-width: min(92vw, 900px);
    height: auto;
    cursor: crosshair;
  }
  .stage canvas#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hint {
    font-size: 12px; color: #8b93a1; max-width: 780px;
    text-align: center; line-height: 1.5;
  }
  .bg-swatch {
    display: inline-block; width: 14px; height: 14px;
    border: 1px solid #555; border-radius: 3px; vertical-align: middle;
  }
  @media (max-width: 600px) {
    input[type="range"] { width: 120px; height: 24px; }
    .controls { flex-direction: column; align-items: stretch; }
    .stage canvas { max-width: 96vw; }
  }
</style>
</head>
<body>

<h1>Штриховка до силуэта</h1>

<div class="controls">
  <label>Изображение:
    <input id="file" type="file" accept="image/*" />
  </label>

  <label>Порог фона:
    <input id="bgTol" type="range" min="3" max="120" value="25" />
    <span id="bgTolVal">25</span>
  </label>

  <label>Зазор:
    <input id="gap" type="range" min="0" max="10" value="0" />
    <span id="gapVal">0</span>
  </label>

  <label>Шаг:
    <input id="step" type="range" min="3" max="30" value="7" />
    <span id="stepVal">7</span>
  </label>

  <label>Толщина:
    <input id="thickness" type="range" min="0.3" max="3" step="0.1" value="1" />
    <span id="thicknessVal">1</span>
  </label>

  <label>Прозрачность:
    <input id="alpha" type="range" min="0.1" max="1" step="0.05" value="0.7" />
    <span id="alphaVal">0.7</span>
  </label>

  <label>Цвет:
    <input id="color" type="color" value="#1e4a8a" />
  </label>

  <label>
    <input id="showGrid" type="checkbox" checked />
    Разметка 4 части
  </label>

  <label>
    <input id="showMask" type="checkbox" />
    Маска силуэта
  </label>

  <button id="pickBg">🎯 Фон кликом</button>
  <button id="reset">↺ Сброс</button>

  <span>Фон: <span id="bgSwatch" class="bg-swatch" style="background:#888"></span>
    <span id="bgRGB">—</span></span>
</div>

<div class="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<p class="hint">
  Штриховка идёт от краёв и доходит до самого контура персонажа.
  Ползунок «Зазор» добавляет визуальный отступ, если он нужен.
  Ползунок «Порог фона» регулирует, насколько точно определяется граница силуэта.
</p>

<script>
const fileInput    = document.getElementById('file');
const baseCanvas   = document.getElementById('base');
const overlay      = document.getElementById('overlay');
const bgTolEl      = document.getElementById('bgTol');
const gapEl        = document.getElementById('gap');
const stepEl       = document.getElementById('step');
const thicknessEl  = document.getElementById('thickness');
const alphaEl      = document.getElementById('alpha');
const colorEl      = document.getElementById('color');
const showGridEl   = document.getElementById('showGrid');
const showMaskEl   = document.getElementById('showMask');
const bgTolVal     = document.getElementById('bgTolVal');
const gapVal       = document.getElementById('gapVal');
const stepVal      = document.getElementById('stepVal');
const thicknessVal = document.getElementById('thicknessVal');
const alphaVal     = document.getElementById('alphaVal');
const pickBgBtn    = document.getElementById('pickBg');
const resetBtn     = document.getElementById('reset');
const bgSwatch     = document.getElementById('bgSwatch');
const bgRGB        = document.getElementById('bgRGB');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imageData = null;
let imgWidth = 0, imgHeight = 0;
let srcImage = null;
let bgColor = { r: 255, g: 255, b: 255 };
let silhouette = null;   // 1 = фон (штрихуем), 0 = персонаж (не штрихуем)
let pickBgMode = false;

// ---------- Загрузка ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    srcImage  = img;
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width = imgWidth; c.height = imgHeight;
    });

    baseCtx.clearRect(0, 0, imgWidth, imgHeight);
    baseCtx.drawImage(img, 0, 0);
    imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);

    detectBgColor();
    updateBgUI();
    buildSilhouette();
    drawGrid();
    redrawOverlay();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- Автоопределение цвета фона ----------
function detectBgColor() {
  const d = imageData.data;
  const w = imgWidth, h = imgHeight;
  const padX = Math.max(3, Math.round(w * 0.06));
  const padY = Math.max(3, Math.round(h * 0.06));

  const rs = [], gs = [], bs = [];
  const take = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const i = (y * w + x) * 4;
    if (d[i + 3] < 20) return;
    rs.push(d[i]); gs.push(d[i + 1]); bs.push(d[i + 2]);
  };
  for (let x = padX; x < w - padX; x++) { take(x, padY); take(x, h - padY); }
  for (let y = padY; y < h - padY; y++) { take(padX, y); take(w - padX, y); }

  if (!rs.length) { bgColor = { r: 255, g: 255, b: 255 }; return; }
  const median = a => (a.sort((x, y) => x - y), a[a.length >> 1]);
  bgColor = { r: median(rs), g: median(gs), b: median(bs) };
}

function updateBgUI() {
  const { r, g, b } = bgColor;
  bgSwatch.style.background = `rgb(${r|0},${g|0},${b|0})`;
  bgRGB.textContent = `${r|0}, ${g|0}, ${b|0}`;
}

// ---------- Маска силуэта: 1 = ФОН (штрихуем), 0 = ПЕРСОНАЖ ----------
function buildSilhouette() {
  const w = imgWidth, h = imgHeight;
  const d = imageData.data;
  const tol = +bgTolEl.value;
  const tol2 = tol * tol * 3;

  // По умолчанию считаем всё ПЕРСОНАЖЕМ (не штрихуем).
  // Flood fill от краёв помечает ФОН (штрихуем).
  silhouette = new Uint8Array(w * h); // 0 = персонаж, 1 = фон

  const isBg = (x, y) => {
    const i = (y * w + x) * 4;
    if (d[i + 3] < 20) return true;
    const dr = d[i]     - bgColor.r;
    const dg = d[i + 1] - bgColor.g;
    const db = d[i + 2] - bgColor.b;
    return (dr * dr + dg * dg + db * db) < tol2;
  };

  const queue = [];
  const visited = new Uint8Array(w * h);
  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const idx = y * w + x;
    if (visited[idx]) return;
    if (!isBg(x, y)) return;
    visited[idx] = 1;
    silhouette[idx] = 1;   // это фон
    queue.push(idx);
  };

  // старт — вся рамка изображения
  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }

  let head = 0;
  while (head < queue.length) {
    const idx = queue[head++];
    const x = idx % w;
    const y = (idx / w) | 0;
    push(x + 1, y);
    push(x - 1, y);
    push(x, y + 1);
    push(x, y - 1);
  }

  // Если включён зазор — расширяем область ПЕРСОНАЖА,
  // то есть «закрываем» фон на N пикселей вокруг силуэта.
  const gap = +gapEl.value;
  if (gap > 0) erodeBackground(gap);
}

// Делает фон уже: пиксели фона, которые рядом с персонажем, помечает как персонаж.
function erodeBackground(radius) {
  const w = imgWidth, h = imgHeight;
  const src = silhouette.slice();
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (src[idx] === 0) continue; // уже персонаж
      // если рядом (в радиусе) есть персонаж — становимся персонажем
      let nearChar = false;
      for (let dy = -radius; dy <= radius && !nearChar; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          if (src[ny * w + nx] === 0) { nearChar = true; break; }
        }
      }
      if (nearChar) silhouette[idx] = 0;
    }
  }
}

// ---------- Разметка на 4 части ----------
function drawGrid() {
  if (!imageData) return;
  baseCtx.clearRect(0, 0, imgWidth, imgHeight);
  baseCtx.drawImage(srcImage, 0, 0);

  if (!showGridEl.checked) return;

  baseCtx.save();
  baseCtx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
  baseCtx.lineWidth = Math.max(2, Math.round(imgWidth / 400));
  baseCtx.setLineDash([12, 8]);
  const mx = imgWidth / 2, my = imgHeight / 2;
  baseCtx.beginPath(); baseCtx.moveTo(mx, 0); baseCtx.lineTo(mx, imgHeight); baseCtx.stroke();
  baseCtx.beginPath(); baseCtx.moveTo(0, my); baseCtx.lineTo(imgWidth, my); baseCtx.stroke();
  baseCtx.restore();
}

// ---------- Штриховка ----------
function redrawOverlay() {
  if (!imageData || !silhouette) return;

  const step      = +stepEl.value;
  const thickness = +thicknessEl.value;
  const alpha     = +alphaEl.value;
  const hex       = colorEl.value;

  const w = imgWidth, h = imgHeight;
  overlayCtx.clearRect(0, 0, w, h);

  // Отладка: показать фон красным
  if (showMaskEl.checked) {
    const tmp = overlayCtx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      if (silhouette[i]) { // фон
        const j = i * 4;
        tmp.data[j]     = 255;
        tmp.data[j + 1] = 80;
        tmp.data[j + 2] = 80;
        tmp.data[j + 3] = 90;
      }
    }
    overlayCtx.putImageData(tmp, 0, 0);
  }

  const rr = parseInt(hex.slice(1, 3), 16);
  const gg = parseInt(hex.slice(3, 5), 16);
  const bb = parseInt(hex.slice(5, 7), 16);
  const strokeStyle = `rgba(${rr},${gg},${bb},${alpha})`;

  overlayCtx.save();
  overlayCtx.strokeStyle = strokeStyle;
  overlayCtx.lineWidth = thickness;
  overlayCtx.lineCap = 'round';

  // Луч идёт от края, пока пиксель — ФОН (silhouette[idx] === 1).
  // Останавливается, как только встретит ПЕРСОНАЖ (silhouette[idx] === 0).

  // Горизонтальные лучи
  for (let y = 0; y < h; y += step) {
    const yy = y + 0.5;

    // слева → вправо
    let xL = 0;
    while (xL < w && silhouette[y * w + xL] === 1) xL++;
    if (xL > 0) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(0, yy);
      overlayCtx.lineTo(xL, yy);
      overlayCtx.stroke();
    }

    // справа → влево
    let xR = w - 1;
    while (xR >= 0 && silhouette[y * w + xR] === 1) xR--;
    if (xR < w - 1) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(w, yy);
      overlayCtx.lineTo(xR + 1, yy);
      overlayCtx.stroke();
    }
  }

  // Вертикальные лучи
  for (let x = 0; x < w; x += step) {
    const xx = x + 0.5;

    // сверху → вниз
    let yT = 0;
    while (yT < h && silhouette[yT * w + x] === 1) yT++;
    if (yT > 0) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(xx, 0);
      overlayCtx.lineTo(xx, yT);
      overlayCtx.stroke();
    }

    // снизу → вверх
    let yB = h - 1;
    while (yB >= 0 && silhouette[yB * w + x] === 1) yB--;
    if (yB < h - 1) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(xx, h);
      overlayCtx.lineTo(xx, yB + 1);
      overlayCtx.stroke();
    }
  }

  overlayCtx.restore();
}

// ---------- Ручной выбор цвета фона кликом ----------
pickBgBtn.addEventListener('click', () => {
  pickBgMode = !pickBgMode;
  pickBgBtn.classList.toggle('active', pickBgMode);
});

baseCanvas.addEventListener('click', e => {
  if (!pickBgMode || !imageData) return;
  const rect = baseCanvas.getBoundingClientRect();
  const scaleX = imgWidth / rect.width;
  const scaleY = imgHeight / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX);
  const y = Math.floor((e.clientY - rect.top)  * scaleY);
  const i = (y * imgWidth + x) * 4;
  const d = imageData.data;
  bgColor = { r: d[i], g: d[i + 1], b: d[i + 2] };
  updateBgUI();
  buildSilhouette();
  redrawOverlay();
  pickBgMode = false;
  pickBgBtn.classList.remove('active');
});

// ---------- Сброс ----------
resetBtn.addEventListener('click', () => {
  bgTolEl.value = 25;   bgTolVal.textContent     = 25;
  gapEl.value   = 0;    gapVal.textContent       = 0;
  stepEl.value  = 7;    stepVal.textContent      = 7;
  thicknessEl.value = 1; thicknessVal.textContent = 1;
  alphaEl.value = 0.7;  alphaVal.textContent     = 0.7;
  colorEl.value = '#1e4a8a';
  showGridEl.checked = true;
  showMaskEl.checked = false;
  if (imageData) {
    detectBgColor();
    updateBgUI();
    buildSilhouette();
    drawGrid();
    redrawOverlay();
  }
});

// ---------- Реакции на контролы ----------
bgTolEl.addEventListener('input', () => {
  bgTolVal.textContent = bgTolEl.value;
  if (imageData) { buildSilhouette(); redrawOverlay(); }
});
gapEl.addEventListener('input', () => {
  gapVal.textContent = gapEl.value;
  if (imageData) { buildSilhouette(); redrawOverlay(); }
});
stepEl.addEventListener('input', () => {
  stepVal.textContent = stepEl.value;
  redrawOverlay();
});
thicknessEl.addEventListener('input', () => {
  thicknessVal.textContent = thicknessEl.value;
  redrawOverlay();
});
alphaEl.addEventListener('input', () => {
  alphaVal.textContent = alphaEl.value;
  redrawOverlay();
});
colorEl.addEventListener('input', redrawOverlay);
showGridEl.addEventListener('change', drawGrid);
showMaskEl.addEventListener('change', redrawOverlay);
</script>

</body>
</html>
