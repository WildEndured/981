<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #1e1e24; color: #e6e6e6;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; box-sizing: border-box;
  }
  .controls { 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    margin-bottom: 16px; 
    font-size: .85rem;
    background: #2a2a33;
    padding: 12px 16px;
    border-radius: 8px;
    width: 100%;
    max-width: 420px;
  }
  .control-row { display: flex; align-items: center; justify-content: space-between; }
  input[type="range"] { width: 160px; accent-color: #e8b04b; }
  span.val { display: inline-block; width: 30px; text-align: right; }
  canvas { background: #2a2a33; border-radius: 8px; }
</style>
</head>
<body>

<div class="controls">
  <div class="control-row">
    <label>Частей (голов):</label>
    <div><input id="rangeParts" type="range" min="3" max="10" value="7" step="1"> <span class="val" id="valParts">7</span></div>
  </div>
  <div class="control-row">
    <label>Размер круга:</label>
    <div><input id="rangeRadius" type="range" min="1.0" max="2.0" value="1.5" step="0.1"> <span class="val" id="valRadius">1.5</span></div>
  </div>
  <div class="control-row">
    <label>Крепление челюсти:</label>
    <div><input id="rangeAttach" type="range" min="1.0" max="3.0" value="2.0" step="0.1"> <span class="val" id="valAttach">2.0</span></div>
  </div>
  <div class="control-row">
    <label>Ширина подбородка:</label>
    <div><input id="rangeChinW" type="range" min="0.05" max="1.0" value="0.5" step="0.05"> <span class="val" id="valChinW">0.5</span></div>
  </div>
  <div class="control-row">
    <label>Высота подбородка:</label>
    <div><input id="rangeChinH" type="range" min="3.0" max="5.0" value="4.0" step="0.1"> <span class="val" id="valChinH">4.0</span></div>
  </div>
  <div class="control-row">
    <label>Округлость:</label>
    <div><input id="rangeRound" type="range" min="0" max="1" value="0" step="0.05"> <span class="val" id="valRound">0</span></div>
  </div>
</div>

<canvas id="canvas" width="400" height="700"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Получаем элементы управления
const rangeParts = document.getElementById('rangeParts');
const valParts = document.getElementById('valParts');
const rangeRadius = document.getElementById('rangeRadius');
const valRadius = document.getElementById('valRadius');
const rangeAttach = document.getElementById('rangeAttach');
const valAttach = document.getElementById('valAttach');
const rangeChinW = document.getElementById('rangeChinW');
const valChinW = document.getElementById('valChinW');
const rangeChinH = document.getElementById('rangeChinH');
const valChinH = document.getElementById('valChinH');
const rangeRound = document.getElementById('rangeRound');
const valRound = document.getElementById('valRound');

function draw() {
  const parts = parseInt(rangeParts.value);
  const radiusMultiplier = parseFloat(rangeRadius.value);
  const attachPos = parseFloat(rangeAttach.value);     // 1.0 - 3.0 (по умолчанию 2.0)
  const chinWidthMul = parseFloat(rangeChinW.value);
  const chinHeightPos = parseFloat(rangeChinH.value);  // 3.0 - 5.0
  const roundness = parseFloat(rangeRound.value);      // 0 - 1

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20;
  const top = pad;
  const bottom = canvas.height - pad;
  const height = bottom - top;
  const step = height / parts;          
  const left = 20;
  const right = canvas.width - 20;
  const cx = (left + right) / 2;

  // ================= ШАГ 1: сетка =================
  ctx.strokeStyle = '#4a4a5a';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#b8b8c0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, right - 16, y + step / 2);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(cx, bottom);
  ctx.stroke();
  ctx.setLineDash([]);

  // ================= ШАГ 2: голова =================
  const fifth = step / 5;
  
  const y0 = top; 
  const yAttach = top + fifth * attachPos;    // Уровень крепления (динамический)
  const y3 = top + fifth * 3;                 // 3/5 (уровень перехода в скос)
  const yChin = top + fifth * chinHeightPos;  // Уровень подбородка (динамический)

  // Круг черепа
  const r = fifth * radiusMultiplier;
  const cy = y0 + r;                

  // Ширина на уровне крепления (высчитываем по формуле окружности)
  const yAttachOffset = Math.abs(yAttach - cy);
  // Если точка крепления выходит за пределы круга, берем максимальную ширину (диаметр)
  const jawWidthTop = yAttachOffset < r ? 2 * Math.sqrt(r*r - yAttachOffset*yAttachOffset) : r * 2;
  
  // Ширина подбородка
  const jawWidthBot = jawWidthTop * chinWidthMul;      

  // Вспомогательные пунктирные линии
  ctx.strokeStyle = 'rgba(232,176,75,0.30)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  for (let i = 1; i <= 5; i++) {
    const y = top + fifth * i;
    ctx.beginPath();
    ctx.moveTo(cx - r - 40, y);
    ctx.lineTo(cx + r + 40, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 1. Круг черепа
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Челюсть
  ctx.strokeStyle = '#e8b04b'; 
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  
  const halfTop = jawWidthTop / 2;
  const halfBot = jawWidthBot / 2;

  // Левая сторона
  ctx.moveTo(cx - halfTop, yAttach);
  ctx.lineTo(cx - halfTop, y3);
  
  // Скос к подбородку с учетом округлости
  if (roundness > 0) {
    const cpX = cx - halfBot - (halfTop - halfBot) * 0.5;
    const cpY = y3 + (yChin - y3) * 0.5;
    ctx.quadraticCurveTo(cpX, cpY, cx - halfBot, yChin);
  } else {
    ctx.lineTo(cx - halfBot, yChin);
  }

  // Линия подбородка с учетом округлости
  if (roundness > 0) {
    const dip = (yChin - y3) * 0.4 * roundness;
    ctx.quadraticCurveTo(cx, yChin + dip, cx + halfBot, yChin);
  } else {
    ctx.lineTo(cx + halfBot, yChin);
  }

  // Правая сторона (зеркально)
  if (roundness > 0) {
    const cpX = cx + halfBot + (halfTop - halfBot) * 0.5;
    const cpY = y3 + (yChin - y3) * 0.5;
    ctx.quadraticCurveTo(cpX, cpY, cx + halfTop, y3);
  } else {
    ctx.lineTo(cx + halfTop, y3);
  }
  
  ctx.lineTo(cx + halfTop, yAttach);
  
  ctx.stroke();

  // Подписи долей
  ctx.fillStyle = '#b8b8c0';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i++) {
    ctx.fillText(`${i}/5`, cx + r + 10, top + fifth * i - fifth / 2);
  }
}

// Обработчики
function updateVal(el, target) { target.textContent = el.value; }

rangeParts.addEventListener('input', () => { updateVal(rangeParts, valParts); draw(); });
rangeRadius.addEventListener('input', () => { updateVal(rangeRadius, valRadius); draw(); });
rangeAttach.addEventListener('input', () => { updateVal(rangeAttach, valAttach); draw(); });
rangeChinW.addEventListener('input', () => { updateVal(rangeChinW, valChinW); draw(); });
rangeChinH.addEventListener('input', () => { updateVal(rangeChinH, valChinH); draw(); });
rangeRound.addEventListener('input', () => { updateVal(rangeRound, valRound); draw(); });

// Старт
draw();
</script>
</body>
</html>
