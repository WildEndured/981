<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова (настройка)</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #1e1e24; color: #e6e6e6;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; box-sizing: border-box;
  }
  .controls {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 16px; font-size: .9rem;
    background: #2a2a33; padding: 12px 16px; border-radius: 8px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { width: 160px; }
  input[type="range"] { width: 150px; accent-color: #e8b04b; }
  span.val { width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  canvas { background: #2a2a33; border-radius: 8px; }
</style>
</head>
<body>

<div class="controls">
  <div class="row">
    <label>Частей (голов):</label>
    <input id="rangeParts" type="range" min="3" max="10" value="7" step="1">
    <span class="val" id="valParts">7</span>
  </div>
  <div class="row">
    <label>Размер круга (головы):</label>
    <input id="rangeRadius" type="range" min="0.8" max="2.0" value="1.5" step="0.1">
    <span class="val" id="valRadius">1.5</span>
  </div>
  <div class="row">
    <label>Длина подбородка:</label>
    <input id="rangeChin" type="range" min="3.0" max="4.8" value="4.0" step="0.1">
    <span class="val" id="valChin">4.0</span>
  </div>
</div>

<canvas id="canvas" width="400" height="700"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const elParts = document.getElementById('rangeParts');
const elRadius = document.getElementById('rangeRadius');
const elChin = document.getElementById('rangeChin');
const valParts = document.getElementById('valParts');
const valRadius = document.getElementById('valRadius');
const valChin = document.getElementById('valChin');

function draw() {
  const parts = parseInt(elParts.value);
  const rMult = parseFloat(elRadius.value);   // множитель радиуса (в долях)
  const chinMult = parseFloat(elChin.value);  // уровень подбородка (в долях)

  valParts.textContent = parts;
  valRadius.textContent = rMult.toFixed(1);
  valChin.textContent = chinMult.toFixed(1);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20;
  const top = pad;
  const bottom = canvas.height - pad;
  const height = bottom - top;
  const step = height / parts;
  const left = 20;
  const right = canvas.width - 20;
  const cx = (left + right) / 2;

  // ================= ШАГ 1: сетка =================
  ctx.strokeStyle = '#4a4a5a';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#b8b8c0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, right - 16, y + step / 2);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(cx, bottom);
  ctx.stroke();
  ctx.setLineDash([]);

  // ================= ШАГ 2: голова =================
  const fifth = step / 5;
  
  const y0 = top;
  const y4 = top + fifth * chinMult; // Уровень подбородка (по ползунку)

  // Радиус круга
  const r = fifth * rMult;
  const cy = y0 + r;                

  // Челюсть начинается от экватора круга (самое широкое место)
  const jawWidthTop = r * 2;        
  // Ширина подбородка (сужается относительно ширины круга)
  const jawWidthBot = r * 1.1;      

  // Вспомогательные пунктирные линии (5 долей)
  ctx.strokeStyle = 'rgba(232,176,75,0.30)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  for (let i = 1; i <= 5; i++) {
    const y = top + fifth * i;
    ctx.beginPath();
    ctx.moveTo(cx - 100, y);
    ctx.lineTo(cx + 100, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 1. Круг черепа
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Челюсть
  ctx.strokeStyle = '#e8b04b'; 
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(cx - jawWidthTop / 2, cy);
  ctx.lineTo(cx - jawWidthBot / 2, y4);
  ctx.lineTo(cx + jawWidthBot / 2, y4);
  ctx.lineTo(cx + jawWidthTop / 2, cy);
  ctx.stroke();

  // Подписи долей
  ctx.fillStyle = '#b8b8c0';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i++) {
    ctx.fillText(`${i}/5`, cx + 110, top + fifth * i - fifth / 2);
  }
}

elParts.addEventListener('input', draw);
elRadius.addEventListener('input', draw);
elChin.addEventListener('input', draw);

draw();
</script>
</body>
</html>
