<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Круг черепа</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #1e1e24; color: #e6e6e6;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; box-sizing: border-box;
  }
  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: .9rem; }
  input[type="range"] { width: 200px; accent-color: #e8b04b; }
  canvas { background: #2a2a33; border-radius: 8px; }
</style>
</head>
<body>

<div class="controls">
  <label>Частей (голов): <span id="val">7</span></label>
  <input id="range" type="range" min="3" max="10" value="7" step="1">
</div>

<canvas id="canvas" width="400" height="700"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const range = document.getElementById('range');
const val = document.getElementById('val');

function draw(parts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20;
  const top = pad;
  const bottom = canvas.height - pad;
  const height = bottom - top;
  const step = height / parts;          // 1 голова
  const left = 20;
  const right = canvas.width - 20;
  const cx = (left + right) / 2;

  // ================= ШАГ 1: сетка =================
  ctx.strokeStyle = '#4a4a5a';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#b8b8c0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, right - 16, y + step / 2);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(cx, bottom);
  ctx.stroke();
  ctx.setLineDash([]);

  // ================= ШАГ 2: круг черепа =================
  // Голова = первая часть сетки, делится на 5 долей
  const fifth = step / 5;

  // Радиус = 3 доли
  const r = fifth * 3;

  // Центр круга — на верхней границе головы, по оси
  const cy = top;

  // Вспомогательные линии долей внутри головы (пунктир)
  ctx.strokeStyle = 'rgba(232,176,75,0.30)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  for (let i = 1; i <= 5; i++) {
    const y = top + fifth * i;
    ctx.beginPath();
    ctx.moveTo(cx - r - 20, y);
    ctx.lineTo(cx + r + 20, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Круг
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // Подписи долей
  ctx.fillStyle = '#b8b8c0';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i++) {
    ctx.fillText(`${i}/5`, cx + r + 6, top + fifth * i - fifth / 2);
  }
}

range.addEventListener('input', () => {
  const n = parseInt(range.value);
  val.textContent = n;
  draw(n);
});

draw(7);
</script>
</body>
</html>
