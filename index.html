<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова и шея</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #1e1e24;
    color: #e6e6e6;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: .9rem;
  }
  input[type="range"] { width: 200px; accent-color: #e8b04b; }
  canvas { background: #2a2a33; border-radius: 8px; }
</style>
</head>
<body>

<div class="controls">
  <label>Частей (голов): <span id="val">7</span></label>
  <input id="range" type="range" min="3" max="10" value="7" step="1">
</div>

<canvas id="canvas" width="340" height="600"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const range = document.getElementById('range');
const val = document.getElementById('val');

function draw(parts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20;
  const top = pad;
  const bottom = canvas.height - pad;
  const height = bottom - top;
  const step = height / parts;      // 1 голова
  const left = 20;
  const right = canvas.width - 20;
  const cx = (left + right) / 2;

  // ---------- Шаг 1: сетка из N равных частей ----------
  ctx.strokeStyle = '#4a4a5a';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#b8b8c0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();

    if (i < parts) {
      ctx.fillText(i + 1, right - 16, y + step / 2);
    }
  }

  // Осевая вертикаль
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(cx, bottom);
  ctx.stroke();
  ctx.setLineDash([]);

  // ---------- Шаг 2: голова и шея ----------
  // Первая часть (top .. top+step) делится на 5 долей
  const headTop = top;
  const headH = step;          // вся первая часть = 1 голова
  const sub = headH / 5;       // пятая доля головы

  // Уровни внутри головы
  const chinY   = headTop + sub * 3;   // 3/5 — линия подбородка
  const eyesY   = headTop + headH / 2; // центр — линия глаз
  const neckTop = chinY;               // шея начинается с подбородка
  const neckBot = headTop + headH;     // до низа первой части

  // Радиус черепа: 3/5 высоты головы = диаметр круга
  const skullR = (sub * 3) / 2;
  const skullCy = headTop + skullR;    // центр круга черепа

  // Вспомогательные горизонтали внутри головы (пунктир)
  ctx.strokeStyle = 'rgba(232,176,75,0.35)';
  ctx.setLineDash([3, 4]);
  ctx.lineWidth = 1;

  [headTop + sub, headTop + sub * 2, chinY, headTop + sub * 4].forEach(y => {
    ctx.beginPath();
    ctx.moveTo(cx - 90, y);
    ctx.lineTo(cx + 90, y);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // ---- Основная масса черепа (круг) ----
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(cx, skullCy, skullR, 0, Math.PI * 2);
  ctx.stroke();

  // ---- Подбородок: дуга, замыкающая череп снизу ----
  // Черепок снизу = chinY (у круга низ на skullCy + skullR = headTop + sub*3 = chinY)
  // Рисуем линию подбородка слегка суженной
  const chinW = skullR * 0.75;
  ctx.beginPath();
  ctx.moveTo(cx - skullR, chinY);
  ctx.quadraticCurveTo(cx, chinY + sub * 0.9, cx + skullR, chinY);
  ctx.stroke();

  // ---- Линия глаз (по центру головы) ----
  ctx.strokeStyle = '#7fb4e8';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx - skullR - 6, eyesY);
  ctx.lineTo(cx + skullR + 6, eyesY);
  ctx.stroke();

  // Метка "глаза"
  ctx.fillStyle = '#7fb4e8';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('глаза', cx - skullR - 10, eyesY);

  // ---- Шея (последняя пятая часть головы) ----
  const neckW = skullR * 0.55;
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(cx - neckW, neckTop);
  ctx.lineTo(cx - neckW, neckBot);
  ctx.moveTo(cx + neckW, neckTop);
  ctx.lineTo(cx + neckW, neckBot);
  ctx.stroke();

  // Подписи уровней головы
  ctx.fillStyle = '#b8b8c0';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('1/5', cx + skullR + 4, headTop + sub * 0.5);
  ctx.fillText('3/5 — подбородок', cx + skullR + 4, chinY);
  ctx.fillText('5/5 — шея', cx + skullR + 4, headTop + headH - sub * 0.5);
}

range.addEventListener('input', () => {
  const n = parseInt(range.value);
  val.textContent = n;
  draw(n);
});

draw(7);
</script>
</body>
</html>
