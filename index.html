<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Фон и персонаж</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: center; padding: 10px 14px;
    background: #1d2027; border-radius: 10px;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; }
  input[type="range"] { width: 160px; }
  button {
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid #333a44; background: #232830; color: #e6e6e6;
    cursor: pointer;
  }
  button:hover { background: #2c323c; }
  button.active { background: #2b6cb0; border-color: #2b6cb0; }
  .stage {
    position: relative; display: inline-block;
    border: 1px solid #2b2f37; background: #0b0c0f; line-height: 0;
  }
  .stage.hide canvas#base { opacity: 0; }
  .stage.hide { background: #fff; }
  .stage canvas { display: block; max-width: min(92vw, 900px); height: auto; }
  .stage canvas#base { transition: opacity 0.15s; cursor: crosshair; }
  .stage canvas#overlay { position: absolute; inset: 0; pointer-events: none; }
  .hint {
    font-size: 12px; color: #8b93a1; max-width: 720px;
    text-align: center; line-height: 1.5;
  }
  @media (max-width: 600px) {
    .controls { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="controls">
  <label>Изображение: <input id="file" type="file" accept="image/*" /></label>
  <label>Яркость фона:
    <input id="bgLum" type="range" min="200" max="255" value="200" />
    <span id="bgLumVal">200</span>
  </label>
  <button id="addPointBtn">🎯 Добавить точку фона</button>
  <button id="clearPointsBtn">✕ Очистить точки</button>
  <label><input id="hideImage" type="checkbox" /> Скрыть изображение</label>
</div>

<div class="stage" id="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<p class="hint">
  По умолчанию фон ищется от рамки изображения.
  Нажми «Добавить точку фона» и кликни по картинке — поиск пойдёт от этой точки.
  Можно поставить несколько точек. Если точек нет — снова работает рамка.
</p>

<script>
const fileInput      = document.getElementById('file');
const baseCanvas     = document.getElementById('base');
const overlay        = document.getElementById('overlay');
const stageEl        = document.getElementById('stage');
const bgLumEl        = document.getElementById('bgLum');
const bgLumVal       = document.getElementById('bgLumVal');
const hideImageEl    = document.getElementById('hideImage');
const addPointBtn    = document.getElementById('addPointBtn');
const clearPointsBtn = document.getElementById('clearPointsBtn');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imgWidth = 0, imgHeight = 0;
let lum = null;
let isBg = null;

// Точки-источники фона (в координатах изображения)
let sourcePoints = [];
let addPointMode = false;

// ---------- Загрузка ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width = imgWidth; c.height = imgHeight;
    });

    // Включаем pointer-events для overlay, чтобы клики работали
    overlay.style.pointerEvents = 'none';
    baseCanvas.style.pointerEvents = 'auto';

    baseCtx.drawImage(img, 0, 0);
    const data = baseCtx.getImageData(0, 0, imgWidth, imgHeight);
    computeLuminance(data);

    sourcePoints = []; // сброс точек при новой картинке
    buildMask();
    drawOverlay();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- Яркость ----------
function computeLuminance(data) {
  const d = data.data;
  const N = imgWidth * imgHeight;
  lum = new Float32Array(N);
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    if (d[p + 3] < 20) { lum[i] = 255; continue; }
    lum[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
  }
}

// ---------- Маска фона ----------
function buildMask() {
  const w = imgWidth, h = imgHeight;
  const N = w * h;
  const threshold = +bgLumEl.value;

  isBg = new Uint8Array(N);
  const queue = [];
  const isBright = i => lum[i] >= threshold;

  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const idx = y * w + x;
    if (isBg[idx]) return;
    if (!isBright(idx)) return;
    isBg[idx] = 1;
    queue.push(idx);
  };

  if (sourcePoints.length > 0) {
    // Если есть точки-источники — заливка идёт от них
    for (const p of sourcePoints) push(p.x, p.y);
  } else {
    // Иначе — от рамки изображения
    for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
    for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
  }

  let head = 0;
  while (head < queue.length) {
    const idx = queue[head++];
    const x = idx % w;
    const y = (idx / w) | 0;
    push(x + 1, y);
    push(x - 1, y);
    push(x, y + 1);
    push(x, y - 1);
  }
}

// ---------- Отрисовка ----------
function drawOverlay() {
  const w = imgWidth, h = imgHeight;
  if (!w) return;
  overlayCtx.clearRect(0, 0, w, h);

  const img = overlayCtx.createImageData(w, h);
  const data = img.data;

  for (let i = 0, j = 0; i < w * h; i++, j += 4) {
    if (!isBg[i]) {
      data[j]     = 255;
      data[j + 1] = 60;
      data[j + 2] = 60;
      data[j + 3] = 140;
    }
  }
  overlayCtx.putImageData(img, 0, 0);

  // Рисуем точки-источники поверх
  for (const p of sourcePoints) {
    overlayCtx.beginPath();
    overlayCtx.arc(p.x, p.y, 8, 0, Math.PI * 2);
    overlayCtx.fillStyle = '#ffcc00';
    overlayCtx.fill();
    overlayCtx.lineWidth = 2;
    overlayCtx.strokeStyle = '#000';
    overlayCtx.stroke();
  }
}

// ---------- Режим добавления точек ----------
addPointBtn.addEventListener('click', () => {
  addPointMode = !addPointMode;
  addPointBtn.classList.toggle('active', addPointMode);
  baseCanvas.style.cursor = addPointMode ? 'crosshair' : 'default';
});

clearPointsBtn.addEventListener('click', () => {
  sourcePoints = [];
  if (!lum) return;
  buildMask();
  drawOverlay();
});

baseCanvas.addEventListener('click', e => {
  if (!lum) return;

  const rect = baseCanvas.getBoundingClientRect();
  const scaleX = imgWidth / rect.width;
  const scaleY = imgHeight / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX);
  const y = Math.floor((e.clientY - rect.top)  * scaleY);

  if (x < 0 || y < 0 || x >= imgWidth || y >= imgHeight) return;

  if (addPointMode) {
    // Добавляем новую точку
    sourcePoints.push({ x, y });
    buildMask();
    drawOverlay();
  } else {
    // Проверяем клик рядом с существующей точкой — удаляем её
    let removed = false;
    for (let i = sourcePoints.length - 1; i >= 0; i--) {
      const p = sourcePoints[i];
      const dx = p.x - x, dy = p.y - y;
      if (dx * dx + dy * dy < 15 * 15) {
        sourcePoints.splice(i, 1);
        removed = true;
        break;
      }
    }
    if (removed) {
      buildMask();
      drawOverlay();
    }
  }
});

// ---------- Реакции ----------
bgLumEl.addEventListener('input', () => {
  bgLumVal.textContent = bgLumEl.value;
  if (!lum) return;
  buildMask();
  drawOverlay();
});

hideImageEl.addEventListener('change', () => {
  stageEl.classList.toggle('hide', hideImageEl.checked);
});
</script>

</body>
</html>
