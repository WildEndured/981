<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова (Исправленная проекция)</title>
<style>
  :root {
    --bg: #141419;
    --panel: #1e1e26;
    --panel-2: #262630;
    --accent: #e8b04b;
    --text: #e8e8f0;
    --muted: #8a8a99;
    --border: #33333f;
    --danger: #e85b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at top, #1c1c26 0%, var(--bg) 70%);
    color: var(--text); font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; gap: 20px;
  }
  header { text-align: center; }
  header h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  header p { margin: 0; font-size: .8rem; color: var(--muted); }
  .app {
    display: flex; gap: 24px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center;
    width: 100%; max-width: 950px;
  }
  .controls {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px 20px;
    width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    max-height: 85vh; overflow-y: auto;
  }
  .controls h2 {
    font-size: .75rem; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted);
    margin: 8px 0 4px; font-weight: 600;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .control { display: flex; flex-direction: column; gap: 6px; }
  .control-head { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; }
  .badge {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--accent); font-variant-numeric: tabular-nums;
    font-size: .75rem; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
    min-width: 46px; text-align: center;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 3px;
    background: #33333f; outline: none; cursor: pointer; position: relative;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 0%), #33333f var(--fill, 0%), #33333f 100%);
    height: 6px; border-radius: 3px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent);
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
    cursor: pointer; transition: transform .15s; margin-top: -5px;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  .actions {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 12px; border-top: 1px solid var(--border); margin-top: 8px;
  }
  .btn-reset {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: .75rem; transition: all .2s;
  }
  .btn-reset:hover { border-color: var(--danger); color: var(--danger); }
  canvas {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    max-width: 100%; height: auto;
  }
</style>
</head>
<body>

<header>
  <h1>Голова: 3D-математика на 2D</h1>
  <p>Проекция сферы и челюсти на сетку</p>
</header>

<div class="app">
  <div class="controls">
    <h2>Общие пропорции</h2>
    <div class="control">
      <div class="control-head"><label>Частей (голов)</label><span class="badge" id="valParts">7</span></div>
      <input id="rangeParts" type="range" min="3" max="10" value="7" step="1">
    </div>
    
    <h2>Форма черепа (сфера)</h2>
    <div class="control">
      <div class="control-head"><label>Ширина головы</label><span class="badge" id="valCut">0.73</span></div>
      <input id="rangeCut" type="range" min="0.4" max="0.95" value="0.73" step="0.01">
    </div>
    <div class="control">
      <div class="control-head"><label>Высота (верх)</label><span class="badge" id="valTop">1.0</span></div>
      <input id="rangeTop" type="range" min="0.8" max="1.4" value="1.0" step="0.01">
    </div>
    <div class="control">
      <div class="control-head"><label>Затылок</label><span class="badge" id="valBack">1.0</span></div>
      <input id="rangeBack" type="range" min="0.8" max="1.4" value="1.0" step="0.01">
    </div>

    <h2>Глаза и лицо</h2>
    <div class="control">
      <div class="control-head"><label>Высота глаз</label><span class="badge" id="valEye">0.0</span></div>
      <input id="rangeEye" type="range" min="-0.9" max="0.9" value="0.0" step="0.01">
    </div>

    <h2>Челюсть</h2>
    <div class="control">
      <div class="control-head"><label>Ширина челюсти (эла)</label><span class="badge" id="valJawX">0.62</span></div>
      <input id="rangeJawX" type="range" min="0.2" max="0.95" value="0.62" step="0.01">
    </div>
    <div class="control">
      <div class="control-head"><label>Длина челюсти</label><span class="badge" id="valJawLen">0.40</span></div>
      <input id="rangeJawLen" type="range" min="0" max="1.2" value="0.4" step="0.01">
    </div>
    <div class="control">
      <div class="control-head"><label>Наклон челюсти</label><span class="badge" id="valJawTilt">10°</span></div>
      <input id="rangeJawTilt" type="range" min="-40" max="70" value="10" step="1">
    </div>

    <h2>Подбородок</h2>
    <div class="control">
      <div class="control-head"><label>Высота подбородка</label><span class="badge" id="valChinLen">1.0</span></div>
      <input id="rangeChinLen" type="range" min="0.5" max="1.5" value="1.0" step="0.01">
    </div>
    <div class="control">
      <div class="control-head"><label>Ширина подбородка</label><span class="badge" id="valChinW">0.22</span></div>
      <input id="rangeChinW" type="range" min="0.03" max="0.6" value="0.22" step="0.01">
    </div>
    <div class="control">
      <div class="control-head"><label>Выступ вперед</label><span class="badge" id="valChinFront">0.85</span></div>
      <input id="rangeChinFront" type="range" min="0.4" max="1.4" value="0.85" step="0.01">
    </div>
    <div class="control">
      <div class="control-head"><label>Округлость</label><span class="badge" id="valChinRound">0.50</span></div>
      <input id="rangeChinRound" type="range" min="0" max="1" value="0.5" step="0.01">
    </div>

    <h2>Шея</h2>
    <div class="control">
      <div class="control-head"><label>Ширина шеи</label><span class="badge" id="valNeckW">0.4</span></div>
      <input id="rangeNeckW" type="range" min="0.1" max="1.0" value="0.4" step="0.05">
    </div>
    <div class="control">
      <div class="control-head"><label>Длина шеи</label><span class="badge" id="valNeckL">1.0</span></div>
      <input id="rangeNeckL" type="range" min="0.2" max="2.0" value="1.0" step="0.1">
    </div>

    <h2>Камера</h2>
    <div class="control">
      <div class="control-head"><label>Поворот (Y)</label><span class="badge" id="valRotY">0°</span></div>
      <input id="rangeRotY" type="range" min="-90" max="90" value="0" step="1">
    </div>
    <div class="control">
      <div class="control-head"><label>Наклон (Z)</label><span class="badge" id="valRotZ">0°</span></div>
      <input id="rangeRotZ" type="range" min="-45" max="45" value="0" step="1">
    </div>

    <div class="actions">
      <button class="btn-reset" id="btnReset">Сбросить всё</button>
    </div>
  </div>

  <canvas id="canvas" width="500" height="800"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- МАТЕМАТИКА (АДАПТИРОВАННАЯ) ---
const rad = (d) => (d * Math.PI) / 180;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mirror = (a) => [-a[0], a[1], a[2]];

function makeBall({ cut, r0, top = 1, back = 1 }) {
  const width = cut / Math.sqrt(1 - r0 * r0);
  const sy = (y) => (y > 0 ? back : 1);
  const sz = (z) => (z > 0 ? top : 1);
  return {
    width, cut, r0, top, back, sy, sz,
    stretch: (x, y, z) => [x, y * sy(y), z * sz(z)],
    normal: (x, y, z) => norm([x / (width * width), y / (sy(y) ** 2), z / (sz(z) ** 2)]),
  };
}

function buildHead3D(p) {
  const r0 = 0.68; 
  const ball = makeBall({ cut: p.cut, r0, top: p.top, back: p.back });
  const { width, cut, stretch, normal } = ball;
  
  const zEye = p.eye * r0;
  const zChin = -r0 - r0 * p.chin_len;
  const xPlane = cut;

  const surf = (pt) => pt; // без lift
  const rim = (t, x = xPlane) => {
    const [, y, z] = stretch(0, r0 * Math.cos(t), r0 * Math.sin(t));
    return [x, y, z];
  };

  const lines = [];

  // 1. Центральная линия (профиль)
  const pts1 = [];
  for (let i = 0; i < 64; i++) {
    const t = (i / 64) * Math.PI * 2;
    pts1.push(surf(stretch(0, Math.cos(t), Math.sin(t))));
  }
  lines.push({ id: '1', pts: pts1, closed: true, color: '#e8b04b', isBackLine: false });

  // 2. Линия глаз
  const pts2 = [];
  const zu = zEye / ball.sz(zEye);
  const rho = Math.sqrt(Math.max(0, 1 - zu * zu));
  const half2 = width * rho;
  for (let i = 0; i < 64; i++) {
    const t = (i / 64) * Math.PI * 2;
    pts2.push(surf(stretch(half2 * Math.cos(t), rho * Math.sin(t), zu)));
  }
  lines.push({ id: '2', pts: pts2, closed: true, color: '#e8b04b', isBackLine: true });

  // 3. Боковые круги
  for (const sx of [1, -1]) {
    const x = sx * xPlane;
    const circle = [];
    for (let i = 0; i < 64; i++) circle.push(rim((i / 64) * Math.PI * 2, x));
    lines.push({ id: '3', pts: circle, closed: true, color: 'rgba(232,176,75,0.4)', isBackLine: false });
  }

  // 7. Челюсть
  const A = rim(rad(-90)); 
  const tilt = rad(p.jaw_tilt);
  const B = [p.jaw_x, A[1] - p.jaw_len * Math.sin(tilt), A[2] - p.jaw_len * Math.cos(tilt)];
  const Cf = [p.chin_w, -p.chin_front, zChin];
  
  const rightSide = [A, B, Cf, mirror(B), mirror(A)];
  lines.push({ id: '7', pts: rightSide, closed: false, color: '#7fb4e8', isBackLine: false });
  
  // 8. Щеки
  const zEyeU = zEye / ball.sz(zEye);
  const eyeEdge = [xPlane, -Math.sqrt(Math.max(0, r0 * r0 - zEyeU * zEyeU)), zEye];
  lines.push({ id: '8', pts: [Cf, eyeEdge], closed: false, color: '#7fb4e8', isBackLine: false });
  lines.push({ id: '8', pts: [mirror(Cf), mirror(eyeEdge)], closed: false, color: '#7fb4e8', isBackLine: false });

  // 6. Центр лица
  const front = surf(stretch(0, -Math.sqrt(Math.max(0, 1 - zEyeU * zEyeU)), zEyeU));
  const chinMid = [0, -p.chin_front, zChin];
  lines.push({ id: '6', pts: [front, chinMid], closed: false, color: '#e8b04b', isBackLine: false });

  return { lines, chinMid };
}

// --- ПРОЕКЦИЯ ---
let params = {
  parts: 7, cut: 0.73, top: 1.0, back: 1.0, eye: 0.0,
  jaw_x: 0.62, jaw_len: 0.40, jaw_tilt: 10,
  chin_len: 1.0, chin_w: 0.22, chin_front: 0.85,
  neckW: 0.4, neckL: 1.0, rotY: 0, rotZ: 0
};

// Функция проекции 3D в 2D, привязанная к сетке
function project(x, y, z, scale, cx, cy) {
  // Вращение Y (влево/вправо)
  const radY = rad(params.rotY);
  const cosY = Math.cos(radY), sinY = Math.sin(radY);
  let x1 = x * cosY - y * sinY; // В твоем коде Y - это глубина (перед/зад)
  let y1 = x * sinY + y * cosY;
  let z1 = z; // Высота не меняется при повороте Y

  // Вращение Z (наклон)
  const radZ = rad(params.rotZ);
  const cosZ = Math.cos(radZ), sinZ = Math.sin(radZ);
  let x2 = x1 * cosZ - z1 * sinZ;
  let z2 = x1 * sinZ + z1 * cosZ;
  
  // В твоем коде Z - это верх/низ. В Canvas Y растет вниз, поэтому инвертируем.
  return {
    x: cx + x2 * scale,
    y: cy - z2 * scale, 
    z: y1 // Глубина (для сортировки)
  };
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const pad = 20;
  const top = pad;
  const bottom = canvas.height - pad;
  const height = bottom - top;
  const step = height / params.parts;
  
  // Размер головы = 1 часть сетки. 
  // В 3D-модели диаметр сферы равен 2 (от -1 до 1). Значит scale = step / 2.
  const scale = step / 2;
  const cx = canvas.width / 2;
  // Центр сферы по вертикали должен быть в начале второй части сетки (top + step).
  // Но сфера имеет радиус 1, значит её центр смещен вниз на 1 единицу от верха.
  const cy = top + step; 

  // Сетка
  ctx.strokeStyle = '#3a3a46';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#8a8a99';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  
  for (let i = 0; i <= params.parts; i++) {
    const y = top + i * step;
    ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(canvas.width - 20, y); ctx.stroke();
    if (i < params.parts) ctx.fillText(i + 1, canvas.width - 40, y + step / 2);
  }
  
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, bottom); ctx.stroke();
  ctx.setLineDash([]);

  // Строим 3D
  const head3D = buildHead3D(params);
  
  // Проецируем и сортируем по глубине (Z)
  const allLines = [];
  head3D.lines.forEach(line => {
    const projected = line.pts.map(p => project(p[0], p[1], p[2], scale, cx, cy));
    const avgZ = projected.reduce((sum, p) => sum + p.z, 0) / projected.length;
    allLines.push({ ...line, projected, avgZ });
  });
  allLines.sort((a, b) => a.avgZ - b.avgZ); // Рисуем сначала задние

  // Рисуем линии
  allLines.forEach(line => {
    ctx.beginPath();
    // Если линия ушла на затылок, делаем её полупрозрачной
    const isBack = line.avgZ > 0.1; 
    ctx.strokeStyle = isBack ? 'rgba(138,138,153,0.3)' : line.color;
    ctx.lineWidth = isBack ? 1 : 2;
    
    line.projected.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    if (line.closed) ctx.closePath();
    ctx.stroke();
  });

  // Шея (2D упрощенно от подбородка вниз)
  const chinPt = project(head3D.chinMid[0], head3D.chinMid[1], head3D.chinMid[2], scale, cx, cy);
  
  // Ширина шеи в пикселях (зависит от scale)
  const neckWidthPx = params.neckW * scale;
  const neckLenPx = params.neckL * scale;
  
  ctx.fillStyle = 'rgba(232,176,75,0.1)';
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(chinPt.x - neckWidthPx / 2, chinPt.y);
  ctx.lineTo(chinPt.x - neckWidthPx / 2, chinPt.y + neckLenPx);
  ctx.lineTo(chinPt.x + neckWidthPx / 2, chinPt.y + neckLenPx);
  ctx.lineTo(chinPt.x + neckWidthPx / 2, chinPt.y);
  ctx.fill();
  ctx.stroke();
}

// --- UI ---
const inputs = ['parts', 'cut', 'top', 'back', 'eye', 'jawX', 'jawLen', 'jawTilt', 'chinLen', 'chinW', 'chinFront', 'chinRound', 'neckW', 'neckL', 'rotY', 'rotZ'];
const paramMap = { parts: 'parts', cut: 'cut', top: 'top', back: 'back', eye: 'eye', jawX: 'jaw_x', jawLen: 'jaw_len', jawTilt: 'jaw_tilt', chinLen: 'chin_len', chinW: 'chin_w', chinFront: 'chin_front', chinRound: 'chin_round', neckW: 'neckW', neckL: 'neckL', rotY: 'rotY', rotZ: 'rotZ' };

inputs.forEach(id => {
  const el = document.getElementById('range' + id.charAt(0).toUpperCase() + id.slice(1));
  const valEl = document.getElementById('val' + id.charAt(0).toUpperCase() + id.slice(1));
  if (!el) return;
  
  const update = () => {
    const val = parseFloat(el.value);
    params[paramMap[id]] = val;
    if (valEl) {
      if (id === 'jawTilt' || id === 'rotY' || id === 'rotZ') valEl.textContent = val + '°';
      else if (id === 'parts') valEl.textContent = val;
      else valEl.textContent = val.toFixed(2);
    }
    draw();
  };
  
  el.addEventListener('input', update);
  
  if (id === 'parts') el.value = params.parts;
  else el.value = params[paramMap[id]];
  update();
});

document.getElementById('btnReset').addEventListener('click', () => location.reload());
draw();
</script>
</body>
</html>
