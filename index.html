<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Обтекающая штриховка вокруг персонажа</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: center; padding: 10px 14px;
    background: #1d2027; border-radius: 10px; max-width: 100%;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; max-width: 160px; }
  input[type="color"] {
    width: 32px; height: 24px; border: none; border-radius: 4px;
    background: none; cursor: pointer; padding: 0;
  }
  button {
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid #333a44; background: #232830; color: #e6e6e6;
    cursor: pointer;
  }
  button:hover { background: #2c323c; }
  button.active { background: #2b6cb0; border-color: #2b6cb0; }
  .stage {
    position: relative; display: inline-block;
    border: 1px solid #2b2f37; background: #0b0c0f; line-height: 0;
  }
  .stage canvas {
    display: block; max-width: min(92vw, 900px); height: auto;
    cursor: crosshair;
  }
  .stage canvas#overlay {
    position: absolute; inset: 0; pointer-events: none;
  }
  .hint {
    font-size: 12px; color: #8b93a1; max-width: 780px;
    text-align: center; line-height: 1.5;
  }
  .bg-swatch {
    display: inline-block; width: 14px; height: 14px;
    border: 1px solid #555; border-radius: 3px; vertical-align: middle;
  }
  @media (max-width: 600px) {
    input[type="range"] { width: 120px; height: 24px; }
    .controls { flex-direction: column; align-items: stretch; }
    .stage canvas { max-width: 96vw; }
  }
</style>
</head>
<body>

<h1>Обтекающая штриховка вокруг персонажа</h1>

<div class="controls">
  <label>Изображение:
    <input id="file" type="file" accept="image/*" />
  </label>

  <label>Сдвиг порога яркости:
    <input id="shift" type="range" min="-20" max="20" value="0" />
    <span id="shiftVal">0</span>
  </label>

  <label>Плотность у контура:
    <input id="step" type="range" min="2" max="20" value="5" />
    <span id="stepVal">5</span>
  </label>

  <label>Затухание:
    <input id="falloff" type="range" min="0" max="3" step="0.1" value="0.6" />
    <span id="falloffVal">0.6</span>
  </label>

  <label>Толщина:
    <input id="thickness" type="range" min="0.3" max="3" step="0.1" value="1" />
    <span id="thicknessVal">1</span>
  </label>

  <label>Прозрачность:
    <input id="alpha" type="range" min="0.1" max="1" step="0.05" value="0.7" />
    <span id="alphaVal">0.7</span>
  </label>

  <label>Цвет:
    <input id="color" type="color" value="#1e4a8a" />
  </label>

  <label>
    <input id="showGrid" type="checkbox" checked />
    Разметка 4 части
  </label>

  <label>
    <input id="showMaskBg" type="checkbox" />
    Маска фона
  </label>

  <label>
    <input id="showMaskChar" type="checkbox" />
    Маска персонажа
  </label>

  <label>
    <input id="showMaskWin" type="checkbox" />
    Маска окон
  </label>

  <button id="reset">↺ Сброс</button>

  <span>Порог: <span id="threshOut">—</span></span>
</div>

<div class="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<p class="hint">
  Фон определяется по яркости: всё, что ярче порога — фон,
  всё, что темнее — персонаж. Внутренние окна — отдельный этап
  внутри маски персонажа.
</p>

<script>
const fileInput      = document.getElementById('file');
const baseCanvas     = document.getElementById('base');
const overlay        = document.getElementById('overlay');
const shiftEl        = document.getElementById('shift');
const stepEl         = document.getElementById('step');
const falloffEl      = document.getElementById('falloff');
const thicknessEl    = document.getElementById('thickness');
const alphaEl        = document.getElementById('alpha');
const colorEl        = document.getElementById('color');
const showGridEl     = document.getElementById('showGrid');
const showMaskBgEl   = document.getElementById('showMaskBg');
const showMaskCharEl = document.getElementById('showMaskChar');
const showMaskWinEl  = document.getElementById('showMaskWin');
const shiftVal       = document.getElementById('shiftVal');
const stepVal        = document.getElementById('stepVal');
const falloffVal     = document.getElementById('falloffVal');
const thicknessVal   = document.getElementById('thicknessVal');
const alphaVal       = document.getElementById('alphaVal');
const resetBtn       = document.getElementById('reset');
const threshOut      = document.getElementById('threshOut');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imageData = null;
let imgWidth = 0, imgHeight = 0;
let srcImage = null;

let lum = null;          // Float32Array яркости
let lumThreshold = 248;  // порог яркости (>= = фон)
let autoThreshold = 248; // авто-порог (без сдвига)

let isBgExt = null;
let isChar  = null;
let isWin   = null;
let isBg    = null;
let distMap = null;

// ---------- Загрузка ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    srcImage  = img;
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width = imgWidth; c.height = imgHeight;
    });

    baseCtx.clearRect(0, 0, imgWidth, imgHeight);
    baseCtx.drawImage(img, 0, 0);
    imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);

    computeLuminance();
    detectThreshold();
    applyShift();
    buildAllMasks();
    buildDistanceMap();
    drawGrid();
    redrawOverlay();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- Яркость всех пикселей ----------
function computeLuminance() {
  const d = imageData.data;
  const N = imgWidth * imgHeight;
  lum = new Float32Array(N);
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    if (d[p + 3] < 20) { lum[i] = 255; continue; }
    lum[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
  }
}

// ---------- Автоопределение порога по гистограмме яркости ----------
// Идея: фон — самая яркая большая мода.
// 1. Строим гистограмму 256 значений.
// 2. Смотрим верхнюю половину (128..255).
// 3. Ищем пик — значение с максимумом.
// 4. Порог = пик - 4.
function detectThreshold() {
  const N = imgWidth * imgHeight;
  const hist = new Uint32Array(256);
  for (let i = 0; i < N; i++) {
    const v = Math.max(0, Math.min(255, Math.round(lum[i])));
    hist[v]++;
  }

  // Ищем самый яркий существенный пик в диапазоне 128..255
  // "Существенный" — не менее 0.5% от всех пикселей.
  const minCount = Math.max(1, Math.floor(N * 0.005));
  let bestBin = -1;
  let bestCount = 0;

  // Сглаживание гистограммы окном 5 для устойчивости
  const smooth = new Uint32Array(256);
  for (let v = 0; v < 256; v++) {
    let s = 0;
    for (let k = -2; k <= 2; k++) {
      const vv = v + k;
      if (vv >= 0 && vv < 256) s += hist[vv];
    }
    smooth[v] = s;
  }

  for (let v = 255; v >= 128; v--) {
    if (smooth[v] >= minCount && smooth[v] > bestCount) {
      bestCount = smooth[v];
      bestBin = v;
    }
  }

  // Если пик не найден в верхней половине — ищем максимум вообще
  if (bestBin < 0) {
    bestCount = 0;
    for (let v = 255; v >= 0; v--) {
      if (hist[v] > bestCount) { bestCount = hist[v]; bestBin = v; }
    }
  }

  if (bestBin < 0) bestBin = 248;

  // Порог = пик - 4 (соседние "шумные" значения фона чуть ниже пика)
  autoThreshold = Math.max(0, Math.min(255, bestBin - 4));
}

function applyShift() {
  const shift = +shiftEl.value;
  lumThreshold = Math.max(0, Math.min(255, autoThreshold + shift));
  threshOut.textContent = `${lumThreshold} (авто ${autoThreshold})`;
}

// ============================================================
//  ТРИ МАСКИ ПО ЯРКОСТИ
// ============================================================
// isBgExt  — flood fill от рамки по пикселям с lum >= порога
// isChar   — всё, что не isBgExt
// isWin    — flood fill ВНУТРИ isChar по пикселям с lum >= порога
// isBg     — isBgExt | isWin
// ============================================================
function buildAllMasks() {
  const w = imgWidth, h = imgHeight;
  const N = w * h;

  const isBright = (i) => lum[i] >= lumThreshold;

  // --- Этап 1: внешний фон ---
  isBgExt = new Uint8Array(N);
  const visited = new Uint8Array(N);
  const queue = [];

  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const idx = y * w + x;
    if (visited[idx]) return;
    if (!isBright(idx)) return;
    visited[idx] = 1;
    isBgExt[idx] = 1;
    queue.push(idx);
  };

  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }

  let head = 0;
  while (head < queue.length) {
    const idx = queue[head++];
    const x = idx % w;
    const y = (idx / w) | 0;
    push(x + 1, y);
    push(x - 1, y);
    push(x, y + 1);
    push(x, y - 1);
  }

  // --- Этап 2: персонаж ---
  isChar = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    if (!isBgExt[i]) isChar[i] = 1;
  }

  // --- Этап 3: внутренние окна ---
  isWin = new Uint8Array(N);
  const visitedWin = new Uint8Array(N);
  const MIN_WINDOW_AREA = 30;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (visitedWin[idx]) continue;
      if (!isChar[idx]) continue;
      if (!isBright(idx)) continue;

      // Локальный flood fill внутри isChar
      const pixels = [idx];
      const localSeen = new Uint8Array(N); // проще и надёжнее; для больших картинок можно заменить
      localSeen[idx] = 1;

      let hh = 0;
      while (hh < pixels.length) {
        const ci = pixels[hh++];
        const cx = ci % w;
        const cy = (ci / w) | 0;

        const tryPush = (nx, ny) => {
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) return;
          const ni = ny * w + nx;
          if (localSeen[ni]) return;
          if (!isChar[ni]) return;
          if (!isBright(ni)) return;
          localSeen[ni] = 1;
          pixels.push(ni);
        };
        tryPush(cx + 1, cy);
        tryPush(cx - 1, cy);
        tryPush(cx, cy + 1);
        tryPush(cx, cy - 1);
      }

      if (pixels.length >= MIN_WINDOW_AREA) {
        for (const p of pixels) {
          visitedWin[p] = 1;
          isWin[p] = 1;
        }
      } else {
        for (const p of pixels) visitedWin[p] = 1;
      }
    }
  }

  // --- Итоговая маска фона ---
  isBg = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    if (isBgExt[i] || isWin[i]) isBg[i] = 1;
  }
}

// ---------- Карта расстояний ----------
function buildDistanceMap() {
  const w = imgWidth, h = imgHeight;
  distMap = new Int32Array(w * h).fill(-1);

  const queue = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (!isBg[idx]) continue;
      let nearChar = false;
      if (x > 0     && !isBg[idx - 1]) nearChar = true;
      else if (x < w - 1 && !isBg[idx + 1]) nearChar = true;
      else if (y > 0     && !isBg[idx - w]) nearChar = true;
      else if (y < h - 1 && !isBg[idx + w]) nearChar = true;
      if (nearChar) {
        distMap[idx] = 1;
        queue.push(idx);
      }
    }
  }

  let head = 0;
  while (head < queue.length) {
    const idx = queue[head++];
    const x = idx % w;
    const y = (idx / w) | 0;
    const cd = distMap[idx];

    const tryPush = (nx, ny) => {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) return;
      const nIdx = ny * w + nx;
      if (!isBg[nIdx]) return;
      if (distMap[nIdx] !== -1) return;
      distMap[nIdx] = cd + 1;
      queue.push(nIdx);
    };
    tryPush(x + 1, y);
    tryPush(x - 1, y);
    tryPush(x, y + 1);
    tryPush(x, y - 1);
  }
}

// ---------- Разметка на 4 части ----------
function drawGrid() {
  if (!imageData) return;
  baseCtx.clearRect(0, 0, imgWidth, imgHeight);
  baseCtx.drawImage(srcImage, 0, 0);

  if (!showGridEl.checked) return;

  baseCtx.save();
  baseCtx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
  baseCtx.lineWidth = Math.max(2, Math.round(imgWidth / 400));
  baseCtx.setLineDash([12, 8]);
  const mx = imgWidth / 2, my = imgHeight / 2;
  baseCtx.beginPath(); baseCtx.moveTo(mx, 0); baseCtx.lineTo(mx, imgHeight); baseCtx.stroke();
  baseCtx.beginPath(); baseCtx.moveTo(0, my); baseCtx.lineTo(imgWidth, my); baseCtx.stroke();
  baseCtx.restore();
}

// ---------- Штриховка + три маски ----------
function redrawOverlay() {
  if (!imageData || !distMap) return;

  const step0     = +stepEl.value;
  const falloff   = +falloffEl.value;
  const thickness = +thicknessEl.value;
  const alpha     = +alphaEl.value;
  const hex       = colorEl.value;

  const w = imgWidth, h = imgHeight;
  overlayCtx.clearRect(0, 0, w, h);

  if (showMaskBgEl.checked || showMaskCharEl.checked || showMaskWinEl.checked) {
    const mask = overlayCtx.createImageData(w, h);
    const md = mask.data;
    for (let i = 0; i < w * h; i++) {
      const j = i * 4;
      if (showMaskWinEl.checked && isWin[i] === 1) {
        md[j] = 60;  md[j + 1] = 180; md[j + 2] = 255; md[j + 3] = 120;
      } else if (showMaskBgEl.checked && isBgExt[i] === 1) {
        md[j] = 255; md[j + 1] = 60;  md[j + 2] = 60;  md[j + 3] = 100;
      } else if (showMaskCharEl.checked && isChar[i] === 1 && isWin[i] === 0) {
        md[j] = 60;  md[j + 1] = 220; md[j + 2] = 120; md[j + 3] = 120;
      }
    }
    overlayCtx.putImageData(mask, 0, 0);
  }

  const rr = parseInt(hex.slice(1, 3), 16);
  const gg = parseInt(hex.slice(3, 5), 16);
  const bb = parseInt(hex.slice(5, 7), 16);

  const thresholds = [];
  let d = step0;
  let add = step0;
  while (d < Math.max(w, h)) {
    thresholds.push(d);
    add = Math.max(1, add + falloff);
    d += Math.round(add);
  }

  const maxDist = thresholds.length ? thresholds[thresholds.length - 1] : 0;
  const linePx = Math.max(1, Math.round(thickness));
  const isLine = new Uint8Array(maxDist + 2);
  for (let i = 0; i < thresholds.length; i++) {
    const t = thresholds[i];
    for (let k = 0; k < linePx; k++) {
      if (t - k >= 0 && t - k < isLine.length) isLine[t - k] = 1;
    }
  }

  const img = overlayCtx.getImageData(0, 0, w, h);
  const data = img.data;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      const dist = distMap[idx];
      if (dist <= 0) continue;
      if (dist >= isLine.length) continue;
      if (!isLine[dist]) continue;

      const j = idx * 4;
      data[j] = rr; data[j + 1] = gg; data[j + 2] = bb;
      data[j + 3] = Math.round(alpha * 255);
    }
  }

  overlayCtx.putImageData(img, 0, 0);
}

// ---------- Сброс ----------
resetBtn.addEventListener('click', () => {
  shiftEl.value = 0;      shiftVal.textContent      = 0;
  stepEl.value  = 5;      stepVal.textContent       = 5;
  falloffEl.value = 0.6;  falloffVal.textContent    = 0.6;
  thicknessEl.value = 1;  thicknessVal.textContent  = 1;
  alphaEl.value = 0.7;    alphaVal.textContent      = 0.7;
  colorEl.value = '#1e4a8a';
  showGridEl.checked = true;
  showMaskBgEl.checked = false;
  showMaskCharEl.checked = false;
  showMaskWinEl.checked = false;
  if (imageData) {
    applyShift();
    buildAllMasks();
    buildDistanceMap();
    drawGrid();
    redrawOverlay();
  }
});

// ---------- Реакции ----------
shiftEl.addEventListener('input', () => {
  shiftVal.textContent = shiftEl.value;
  if (imageData) {
    applyShift();
    buildAllMasks();
    buildDistanceMap();
    redrawOverlay();
  }
});
stepEl.addEventListener('input', () => {
  stepVal.textContent = stepEl.value;
  redrawOverlay();
});
falloffEl.addEventListener('input', () => {
  falloffVal.textContent = falloffEl.value;
  redrawOverlay();
});
thicknessEl.addEventListener('input', () => {
  thicknessVal.textContent = thicknessEl.value;
  redrawOverlay();
});
alphaEl.addEventListener('input', () => {
  alphaVal.textContent = alphaEl.value;
  redrawOverlay();
});
colorEl.addEventListener('input', redrawOverlay);
showGridEl.addEventListener('change', drawGrid);
showMaskBgEl.addEventListener('change', redrawOverlay);
showMaskCharEl.addEventListener('change', redrawOverlay);
showMaskWinEl.addEventListener('change', redrawOverlay);
</script>

</body>
</html>
