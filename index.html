<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Силуэт персонажа</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: center;
    padding: 10px 14px;
    background: #1d2027; border-radius: 10px;
  }
  .controls label {
    font-size: 13px;
    display: flex; gap: 6px; align-items: center;
  }
  input[type="file"] { font-size: 13px; }
  input[type="range"] { width: 160px; }
  .stage {
    position: relative;
    display: inline-block;
    border: 1px solid #2b2f37;
    background: #0b0c0f;
  }
  .stage.hide canvas#base { opacity: 0; }
  .stage.hide { background: #ffffff; }
  .stage canvas {
    display: block;
    max-width: min(92vw, 900px);
    height: auto;
  }
  .stage canvas#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .info {
    font-size: 13px;
    color: #b9c3d1;
    text-align: center;
  }
  .info b { color: #e6e6e6; }
</style>
</head>
<body>

<div class="controls">
  <label>Файл:
    <input id="file" type="file" accept="image/*" />
  </label>
  <label>Порог яркости:
    <input id="bgLum" type="range" min="0" max="255" value="200" />
    <span id="bgLumVal">200</span>
  </label>
  <label>
    <input id="hideImage" type="checkbox" />
    Скрыть изображение
  </label>
</div>

<div class="stage" id="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div class="info" id="info">
  Загрузите изображение
</div>

<script src="app.js"></script>
</body>
</html>
