<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Определение фона и границы персонажа</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    justify-content: center; padding: 10px 14px;
    background: #1d2027; border-radius: 10px; max-width: 100%;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; max-width: 180px; }
  input[type="range"] { width: 160px; }
  button {
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid #333a44; background: #232830; color: #e6e6e6;
    cursor: pointer;
  }
  button:hover { background: #2c323c; }
  .stage {
    position: relative; display: inline-block;
    border: 1px solid #2b2f37; background: #0b0c0f; line-height: 0;
  }
  .stage canvas {
    display: block; max-width: min(92vw, 900px); height: auto;
  }
  .stage canvas#overlay {
    position: absolute; inset: 0; pointer-events: none;
  }
  .hint {
    font-size: 12px; color: #8b93a1; max-width: 760px;
    text-align: center; line-height: 1.5;
  }
  .stats {
    font-size: 13px; color: #b9c3d1;
    display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
  }
  .stats b { color: #e6e6e6; }
  @media (max-width: 600px) {
    .controls { flex-direction: column; align-items: stretch; }
    .stage canvas { max-width: 96vw; }
  }
</style>
</head>
<body>

<h1>Определение фона и границы персонажа</h1>

<div class="controls">
  <label>Изображение:
    <input id="file" type="file" accept="image/*" />
  </label>

  <label>Яркость фона:
    <input id="bgLum" type="range" min="200" max="255" value="250" />
    <span id="bgLumVal">250</span>
  </label>

  <label>
    <input id="showBorder" type="checkbox" checked />
    Показать границу
  </label>

  <label>
    <input id="showMask" type="checkbox" checked />
    Показать маску персонажа
  </label>

  <button id="reset">↺ Сброс</button>
</div>

<div class="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div class="stats">
  <span>Порог: <b id="statThreshold">—</b></span>
  <span>Фон: <b id="statBg">—</b></span>
  <span>Персонаж: <b id="statChar">—</b></span>
  <span>Граница: <b id="statBorder">—</b></span>
</div>

<p class="hint">
  Фон — всё, что ярче порога И соединено с рамкой изображения через такие же яркие пиксели.
  Граница — красная линия по контуру, где фон соседствует с персонажем.
</p>

<script>
const fileInput    = document.getElementById('file');
const baseCanvas   = document.getElementById('base');
const overlay      = document.getElementById('overlay');
const bgLumEl      = document.getElementById('bgLum');
const bgLumVal     = document.getElementById('bgLumVal');
const showBorderEl = document.getElementById('showBorder');
const showMaskEl   = document.getElementById('showMask');
const resetBtn     = document.getElementById('reset');
const statThreshold = document.getElementById('statThreshold');
const statBg       = document.getElementById('statBg');
const statChar     = document.getElementById('statChar');
const statBorder   = document.getElementById('statBorder');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imageData = null;
let imgWidth = 0, imgHeight = 0;
let srcImage = null;
let lum = null;
let isBg = null;
let isBorder = null;

// ---------- Загрузка ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    srcImage  = img;
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width = imgWidth; c.height = imgHeight;
    });

    baseCtx.clearRect(0, 0, imgWidth, imgHeight);
    baseCtx.drawImage(img, 0, 0);
    imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);

    computeLuminance();
    buildMask();
    buildBorder();
    drawOverlay();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- 1. Яркость всех пикселей ----------
function computeLuminance() {
  const d = imageData.data;
  const N = imgWidth * imgHeight;
  lum = new Float32Array(N);
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    if (d[p + 3] < 20) { lum[i] = 255; continue; } // прозрачное = фон
    lum[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
  }
}

// ---------- 2. Маска фона: flood fill от рамки по ярким пикселям ----------
function buildMask() {
  const w = imgWidth, h = imgHeight;
  const N = w * h;
  const threshold = +bgLumEl.value;

  isBg = new Uint8Array(N);
  const visited = new Uint8Array(N);
  const queue = [];

  const isBright = (i) => lum[i] >= threshold;

  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const idx = y * w + x;
    if (visited[idx]) return;
    if (!isBright(idx)) return;
    visited[idx] = 1;
    isBg[idx] = 1;
    queue.push(idx);
  };

  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }

  let head = 0;
  while (head < queue.length) {
    const idx = queue[head++];
    const x = idx % w;
    const y = (idx / w) | 0;
    push(x + 1, y);
    push(x - 1, y);
    push(x, y + 1);
    push(x, y - 1);
  }
}

// ---------- 3. Граница персонажа ----------
// Пиксель границы — это фон, у которого хотя бы один сосед — персонаж.
function buildBorder() {
  const w = imgWidth, h = imgHeight;
  const N = w * h;
  isBorder = new Uint8Array(N);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (!isBg[idx]) continue; // граница только по фоновым пикселям

      const hasCharNeighbor =
        (x > 0     && !isBg[idx - 1]) ||
        (x < w - 1 && !isBg[idx + 1]) ||
        (y > 0     && !isBg[idx - w]) ||
        (y < h - 1 && !isBg[idx + w]);

      if (hasCharNeighbor) isBorder[idx] = 1;
    }
  }
}

// ---------- 4. Отрисовка поверх ----------
function drawOverlay() {
  if (!imageData) return;

  const w = imgWidth, h = imgHeight;
  overlayCtx.clearRect(0, 0, w, h);

  const showMask   = showMaskEl.checked;
  const showBorder = showBorderEl.checked;
  if (!showMask && !showBorder) {
    updateStats();
    return;
  }

  const img = overlayCtx.createImageData(w, h);
  const data = img.data;

  for (let i = 0, j = 0; i < w * h; i++, j += 4) {
    let r = 0, g = 0, b = 0, a = 0;

    if (showMask && !isBg[i]) {
      // персонаж — зелёная полупрозрачная заливка
      r = 60; g = 220; b = 120; a = 90;
    }
    if (showBorder && isBorder[i]) {
      // граница — красная непрозрачная
      r = 255; g = 40; b = 40; a = 230;
    }

    data[j]     = r;
    data[j + 1] = g;
    data[j + 2] = b;
    data[j + 3] = a;
  }

  overlayCtx.putImageData(img, 0, 0);
  updateStats();
}

// ---------- 5. Статистика ----------
function updateStats() {
  if (!isBg) return;
  const N = imgWidth * imgHeight;
  let bg = 0, char_ = 0, border = 0;
  for (let i = 0; i < N; i++) {
    if (isBg[i]) bg++; else char_++;
    if (isBorder[i]) border++;
  }
  const pct = (n) => ((n / N) * 100).toFixed(1) + '%';
  statThreshold.textContent = bgLumEl.value;
  statBg.textContent        = pct(bg);
  statChar.textContent      = pct(char_);
  statBorder.textContent    = border.toLocaleString('ru-RU');
}

// ---------- 6. Реакции на контролы ----------
bgLumEl.addEventListener('input', () => {
  bgLumVal.textContent = bgLumEl.value;
  if (!imageData) return;
  buildMask();
  buildBorder();
  drawOverlay();
});

showBorderEl.addEventListener('change', drawOverlay);
showMaskEl.addEventListener('change', drawOverlay);

resetBtn.addEventListener('click', () => {
  bgLumEl.value = 250;
  bgLumVal.textContent = 250;
  showBorderEl.checked = true;
  showMaskEl.checked = true;
  if (imageData) {
    buildMask();
    buildBorder();
    drawOverlay();
  }
});
</script>

</body>
</html>
