<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Простая маска силуэта</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: #14161a; color: #e6e6e6;
    font-family: system-ui, sans-serif; display: flex; flex-direction: column;
    align-items: center; gap: 10px;
  }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  button, label.btn {
    height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid #333a44;
    background: #232830; color: #e6e6e6; font-size: 13px; cursor: pointer;
  }
  button:hover, button.active, label.btn:hover { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
  input[type=file] { display: none; }
  .wrap {
    position: relative; background: #0b0c0f; border: 1px solid #2b2f37;
    border-radius: 8px; overflow: hidden; max-width: 96vw;
  }
  canvas { display: block; max-width: 100%; height: auto; cursor: crosshair; }
  canvas.hide-img { background: #000; }
  .row { display: flex; align-items: center; gap: 10px; width: min(96vw, 800px); }
  input[type=range] { flex: 1; accent-color: #2b6cb0; }
  .hint { font-size: 12px; color: #8b93a1; text-align: center; }
</style>
</head>
<body>

<div class="bar">
  <label class="btn">📷 Открыть<input id="file" type="file" accept="image/*"></label>
  <button id="autoBtn">⚡ Авто</button>
  <button id="pointBtn">🎯 Точка</button>
  <button id="invertBtn">⇄ Инверт</button>
  <button id="maskBtn">👁 Маска</button>
  <button id="saveBtn">💾 Маска PNG</button>
  <button id="clearBtn">✕ Точки</button>
</div>

<div class="row">
  <span style="font-size:13px;color:#8b93a1;white-space:nowrap">Порог яркости</span>
  <input id="thr" type="range" min="0" max="255" value="200">
  <span id="thrVal" style="font-size:13px;width:32px;text-align:right">200</span>
</div>

<div class="wrap">
  <canvas id="view"></canvas>
</div>

<p class="hint">
  ЛКМ — добавить точку-источник (клик по точке — удалить). Без точек фон ищется автоматически.
</p>

<script>
// ---------- элементы ----------
const fileInput = document.getElementById('file');
const view = document.getElementById('view');
const ctx = view.getContext('2d', { willReadFrequently: true });
const thr = document.getElementById('thr');
const thrVal = document.getElementById('thrVal');
const autoBtn = document.getElementById('autoBtn');
const pointBtn = document.getElementById('pointBtn');
const invertBtn = document.getElementById('invertBtn');
const maskBtn = document.getElementById('maskBtn');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');

// ---------- состояние ----------
let W = 0, H = 0;
let imgData = null;       // исходные пиксели
let lum = null;           // яркость Float32Array
let hist = null;          // гистограмма
let mask = null;          // Uint8Array, 1 = фон
let points = [];          // точки-источники {x, y}
let invert = false;
let pointMode = false;
let hideImage = false;

// ---------- загрузка ----------
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    W = img.naturalWidth; H = img.naturalHeight;
    view.width = W; view.height = H;
    ctx.drawImage(img, 0, 0);
    imgData = ctx.getImageData(0, 0, W, H);
    computeLum();
    computeHist();
    points = [];
    autoThreshold();
    rebuild();
  };
  img.src = URL.createObjectURL(f);
});

// ---------- яркость + гистограмма ----------
function computeLum() {
  const d = imgData.data;
  lum = new Float32Array(W * H);
  hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < W * H; i++, j += 4) {
    const v = Math.round(0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2]);
    lum[i] = v;
    hist[v]++;
  }
}

// ---------- метод Оцу ----------
function autoThreshold() {
  const N = W * H;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, maxVar = 0;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = N - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) ** 2;
    if (v > maxVar) { maxVar = v; best = t; }
  }
  thr.value = best;
  thrVal.textContent = best;
}

// ---------- построение маски ----------
function rebuild() {
  if (!lum) return;
  const N = W * H, th = +thr.value;
  mask = new Uint8Array(N);
  const queue = new Int32Array(N);
  let head = 0, tail = 0;

  const isBg = idx => {
    const m = lum[idx] >= th;
    return invert ? !m : m;
  };

  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = y * W + x;
    if (mask[i] || !isBg(i)) return;
    mask[i] = 1;
    queue[tail++] = i;
  };

  // семена: точки пользователя или автоматические
  if (points.length) {
    points.forEach(p => push(p.x, p.y));
  } else {
    // авто: связные светлые области, не касающиеся краёв
    const visited = new Uint8Array(N);
    for (let s = 0; s < N; s++) {
      if (visited[s] || !isBg(s)) continue;
      let qh = 0, qt = 0;
      const q = new Int32Array(N);
      q[qt++] = s; visited[s] = 1;
      const region = [];
      let border = false;
      while (qh < qt) {
        const cur = q[qh++]; region.push(cur);
        const cx = cur % W, cy = (cur / W) | 0;
        if (cx === 0 || cy === 0 || cx === W - 1 || cy === H - 1) border = true;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => {
          const nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
          const ni = ny * W + nx;
          if (!visited[ni] && isBg(ni)) { visited[ni] = 1; q[qt++] = ni; }
        });
      }
      if (!border && region.length >= 30) {
        const c = region[region.length >> 1];
        push(c % W, (c / W) | 0);
      }
    }
  }

  // заливка от краёв
  for (let x = 0; x < W; x++) { push(x, 0); push(x, H - 1); }
  for (let y = 0; y < H; y++) { push(0, y); push(W - 1, y); }

  while (head < tail) {
    const i = queue[head++];
    const x = i % W, y = (i / W) | 0;
    push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1);
  }

  draw();
}

// ---------- отрисовка ----------
function draw() {
  if (!W) return;
  if (hideImage) {
    // показываем только маску (чёрное/белое)
    const out = ctx.createImageData(W, H);
    const d = out.data;
    for (let i = 0, j = 0; i < W * H; i++, j += 4) {
      const v = mask[i] ? 0 : 255;
      d[j] = d[j+1] = d[j+2] = v; d[j+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  } else {
    // исходник + красная подсветка фона
    ctx.putImageData(imgData, 0, 0);
    const ov = ctx.createImageData(W, H);
    const d = ov.data;
    for (let i = 0, j = 0; i < W * H; i++, j += 4) {
      if (mask[i]) { d[j] = 255; d[j+1] = 60; d[j+2] = 60; d[j+3] = 100; }
    }
    // накладываем через временный canvas
    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    tmp.getContext('2d').putImageData(ov, 0, 0);
    ctx.drawImage(tmp, 0, 0);
  }

  // точки
  points.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#ffcc00';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000';
    ctx.stroke();
  });
}

// ---------- клики ----------
view.addEventListener('click', e => {
  if (!W) return;
  const r = view.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) * (W / r.width));
  const y = Math.floor((e.clientY - r.top) * (H / r.height));

  if (pointMode) {
    points.push({ x, y });
  } else {
    // клик по существующей точке — удалить
    const r2 = 12;
    for (let i = points.length - 1; i >= 0; i--) {
      const dx = points[i].x - x, dy = points[i].y - y;
      if (dx * dx + dy * dy < r2 * r2) { points.splice(i, 1); break; }
    }
  }
  rebuild();
});

// ---------- кнопки ----------
thr.addEventListener('input', () => {
  thrVal.textContent = thr.value;
  rebuild();
});

autoBtn.addEventListener('click', () => {
  if (!lum) return;
  autoThreshold();
  rebuild();
});

pointBtn.addEventListener('click', () => {
  pointMode = !pointMode;
  pointBtn.classList.toggle('active', pointMode);
});

invertBtn.addEventListener('click', () => {
  invert = !invert;
  invertBtn.classList.toggle('active', invert);
  rebuild();
});

maskBtn.addEventListener('click', () => {
  hideImage = !hideImage;
  maskBtn.classList.toggle('active', hideImage);
  draw();
});

saveBtn.addEventListener('click', () => {
  if (!mask) return;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const cx = c.getContext('2d');
  const out = cx.createImageData(W, H);
  const d = out.data;
  for (let i = 0, j = 0; i < W * H; i++, j += 4) {
    const v = mask[i] ? 0 : 255;
    d[j] = d[j+1] = d[j+2] = v; d[j+3] = 255;
  }
  cx.putImageData(out, 0, 0);
  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'mask.png';
    a.click();
    URL.revokeObjectURL(a.href);
  });
});

clearBtn.addEventListener('click', () => {
  points = [];
  if (lum) rebuild();
});
</script>
</body>
</html>
