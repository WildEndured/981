<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineart Highlighter (Final Fix)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { font-size: 1.1rem; text-align: center; margin-bottom: 15px; }
        .controls { margin-bottom: 20px; }

        input[type="file"] { display: none; }

        .upload-btn {
            background-color: #ff4757;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            max-width: 100%;
            max-height: 80vh;
            border: 2px solid #333;
            background: #000;
            display: none;
            overflow: hidden;
        }

        #imageCanvas, #overlayCanvas {
            display: block;
            max-width: 100%;
            max-height: 80vh;
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .loader { display: none; color: #ff4757; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Авто-штриховка (Финальная версия)</h1>

    <div class="controls">
        <label for="imageInput" class="upload-btn">Выбрать изображение</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="loader" id="loader">Обработка...</div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const imageCanvas = document.getElementById('imageCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const loader = document.getElementById('loader');

        const imgCtx = imageCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');

        // --- НАСТРОЙКИ ---
        // Порог яркости. Увеличьте, если линии светлые. Уменьшите, если фон темный.
        const DARKNESS_THRESHOLD = 160; 
        
        // Порог насыщенности. Если пиксель сильно цветной (красный, синий), он тоже считается границей.
        const COLOR_THRESHOLD = 50;

        const STRIPE_COLOR = '#ff4757';
        const STRIPE_WIDTH = 4;     
        const STRIPE_GAP = 18;      
        const SCAN_STEP = 2;        

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loader.style.display = 'block';
            canvasContainer.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => processImage(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processImage(img) {
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.floor(height * (MAX_WIDTH / width));
                width = MAX_WIDTH;
            }

            imageCanvas.width = width;
            imageCanvas.height = height;
            overlayCanvas.width = width;
            overlayCanvas.height = height;

            imgCtx.drawImage(img, 0, 0, width, height);
            const imageData = imgCtx.getImageData(0, 0, width, height);
            const data = imageData.data;

            overlayCtx.clearRect(0, 0, width, height);
            
            // Рисуем из 4 углов
            drawFromCorner(data, width, height, 'top-left');
            drawFromCorner(data, width, height, 'top-right');
            drawFromCorner(data, width, height, 'bottom-left');
            drawFromCorner(data, width, height, 'bottom-right');

            loader.style.display = 'none';
            canvasContainer.style.display = 'block';
        }

        // Проверка: является ли пиксель границей (темный или сильно цветной)?
        function isBoundary(data, width, height, x, y) {
            if (x < 0 || x >= width || y < 0 || y >= height) return true; // Край холста

            const index = (y * width + x) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];
            const a = data[index + 3];

            if (a < 50) return false; // Прозрачный

            // 1. Проверка на темноту
            const brightness = (r + g + b) / 3;
            if (brightness < DARKNESS_THRESHOLD) return true;

            // 2. Проверка на насыщенность (цветные линии)
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            const saturation = max - min;
            if (saturation > COLOR_THRESHOLD) return true;

            return false;
        }

        function drawFromCorner(data, width, height, corner) {
            overlayCtx.strokeStyle = STRIPE_COLOR;
            overlayCtx.lineCap = 'butt'; 
            overlayCtx.lineWidth = STRIPE_WIDTH;

            const step = STRIPE_WIDTH + STRIPE_GAP;
            
            let startX, startY, dx, dy, limitY;

            switch(corner) {
                case 'top-left':
                    startX = -height; startY = 0; dx = 1; dy = 1; limitY = height / 2; break;
                case 'top-right':
                    startX = width + height; startY = 0; dx = -1; dy = 1; limitY = height / 2; break;
                case 'bottom-left':
                    startX = -height; startY = height; dx = 1; dy = -1; limitY = height / 2; break;
                case 'bottom-right':
                    startX = width + height; startY = height; dx = -1; dy = -1; limitY = height / 2; break;
            }

            const numLines = Math.ceil((width + height) / step) + 2;

            for (let i = 0; i < numLines; i++) {
                let currentX = startX + i * step;
                let currentY = startY;

                if (dx === 1 && currentX < 0) {
                    currentY = -currentX;
                    currentX = 0;
                } else if (dx === -1 && currentX > width) {
                    currentY = currentX - width;
                    currentX = width;
                }

                if (currentX < 0 || currentX > width || currentY < 0 || currentY > height) continue;

                // Ограничение треугольником
                if (corner.includes('top') && currentY > limitY) continue;
                if (corner.includes('bottom') && currentY < limitY) continue;

                // Пропускаем, если старт на границе
                if (isBoundary(data, width, height, Math.floor(currentX), Math.floor(currentY))) {
                    continue;
                }

                overlayCtx.beginPath();
                overlayCtx.moveTo(currentX, currentY);

                let hitBoundary = false;
                let x = currentX;
                let y = currentY;

                while (x >= 0 && x <= width && y >= 0 && y <= height) {
                    if (isBoundary(data, width, height, Math.floor(x), Math.floor(y))) {
                        hitBoundary = true;
                        break;
                    }
                    x += dx * SCAN_STEP;
                    y += dy * SCAN_STEP;

                    if (corner.includes('top') && y > limitY) break;
                    if (corner.includes('bottom') && y < limitY) break;
                }

                if (hitBoundary) {
                    overlayCtx.lineTo(x, y);
                    overlayCtx.stroke();
                }
            }
        }
    </script>
</body>
</html>
