<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Голова Лумиса — 2D (360°)</title>
<style>
  :root {
    --guide-red: #f03e6e;
    --guide-blue: #3b7cff;
    --guide-gray: #cdc7d6;
    --bg: #faf8fc;
    --panel: #ffffff;
    --text: #2a2430;
    --muted: #8a8394;
    --line: #e5e1eb;
    --accent: #7a4dff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .view-name {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  header .btn { font-size: 13px; padding: 6px 10px; }

  #stage {
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, var(--bg) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; user-select: none; }

  #stage .label {
    font-size: 13px;
    font-weight: 600;
    paint-order: stroke;
    stroke: #fff;
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }
  .label--red  { fill: var(--guide-red); }
  .label--blue { fill: var(--guide-blue); }
  .label--ink  { fill: var(--text); }

  #drop-cover {
    position: absolute;
    inset: 0;
    background: rgba(122, 77, 255, 0.15);
    border: 2px dashed var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    pointer-events: none;
  }
  #drop-cover[hidden] { display: none; }

  aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 0;
  }
  section { padding: 0 16px 12px; }
  section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 14px 0 8px;
  }

  .btn {
    font: inherit;
    font-size: 12px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

  .slider {
    display: grid;
    grid-template-columns: 1fr 52px;
    grid-template-rows: auto auto;
    gap: 2px 8px;
    margin-bottom: 10px;
    align-items: center;
  }
  .slider label { grid-column: 1 / -1; font-size: 12px; color: var(--text); }
  .slider input[type="range"] { width: 100%; height: 20px; accent-color: var(--accent); }
  .slider output {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .group-h {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 12px 0 6px;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 8px;
  }

  @media (max-width: 800px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: 48px 1fr auto;
      height: 100dvh;
    }
    aside { border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Голова Лумиса — 2D</h1>
  <span class="view-name" id="view-name">Анфас · 0°</span>
  <button class="btn" id="about-btn" type="button">О методе</button>
</header>

<main id="stage">
  <svg id="canvas" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="drop-cover" hidden>Отпустите, чтобы вставить</div>
</main>

<aside>
  <section>
    <h2>Поворот</h2>
    <div class="slider">
      <label>Yaw (вокруг вертикали)</label>
      <input type="range" id="yaw" min="-180" max="180" step="1" value="0">
      <output id="yaw-out">0°</output>
    </div>
    <div class="slider">
      <label>Pitch (вверх-вниз)</label>
      <input type="range" id="pitch" min="-60" max="60" step="1" value="0">
      <output id="pitch-out">0°</output>
    </div>
    <div class="row">
      <button class="btn" data-angle="front" type="button">Анфас</button>
      <button class="btn" data-angle="three" type="button">3/4</button>
      <button class="btn" data-angle="side" type="button">Профиль</button>
      <button class="btn" data-angle="back" type="button">Спина</button>
    </div>
    <div class="row">
      <button class="btn" id="spin" type="button" aria-pressed="false">↻ Крутить</button>
      <button class="btn" id="reset-view" type="button">Сброс</button>
    </div>
  </section>

  <section>
    <h2>Пресеты формы</h2>
    <div class="row" id="presets"></div>
  </section>

  <section>
    <h2>Форма</h2>
    <div id="shape-sliders"></div>
  </section>

  <section>
    <h2>Отображение</h2>
    <div class="slider">
      <label>Толщина линии</label>
      <input type="range" id="line" min="0.004" max="0.04" step="0.001" value="0.012">
      <output id="line-out">0.012</output>
    </div>
    <div class="row">
      <button class="btn" id="toggle-hidden" aria-pressed="true" type="button">Скрытые линии</button>
      <button class="btn" id="toggle-labels" aria-pressed="true" type="button">Подписи</button>
    </div>
  </section>

  <section>
    <h2>Подложка</h2>
    <p class="hint" id="underlay-hint">Перетащи файл, вставь из буфера или выбери ниже</p>
    <div class="row">
      <button class="btn" id="underlay-pick" type="button">Выбрать</button>
      <button class="btn" id="underlay-remove" type="button" hidden>Удалить</button>
      <input type="file" id="underlay-input" accept="image/*" hidden>
    </div>
    <div class="slider">
      <label>Прозрачность</label>
      <input type="range" id="underlay-opacity" min="0.1" max="0.9" step="0.05" value="0.4">
      <output id="underlay-opacity-out">40%</output>
    </div>
    <div class="slider">
      <label>Масштаб</label>
      <input type="range" id="underlay-scale" min="0.3" max="2" step="0.01" value="1">
      <output id="underlay-scale-out">100%</output>
    </div>
  </section>

  <section>
    <h2>Экспорт</h2>
    <div class="row">
      <button class="btn" id="save-png" type="button">PNG</button>
      <button class="btn" id="save-svg" type="button">SVG</button>
    </div>
  </section>
</aside>

<script type="module">
/* ==================================================================
 * loomis.js — математика формы
 * ================================================================== */

const SHAPE_PARAMS = [
  { key: 'cut',        label: 'Ширина головы',           min: 0.4,  max: 0.95, step: 0.01, def: 0.73 },
  { key: 'top',        label: 'Высота макушки',          min: 0.8,  max: 1.4,  step: 0.01, def: 1 },
  { key: 'back',       label: 'Выступ затылка',          min: 0.8,  max: 1.4,  step: 0.01, def: 1 },
  { key: 'r0',         label: '③ Размер круга',          min: 0.3,  max: 0.95, step: 0.01, def: 0.68 },
  { key: 'eye',        label: '② Уровень глаз',          min: -0.9, max: 0.9,  step: 0.01, def: 0 },
  { key: 'forehead',   label: '④ Линия волос',           min: 0.3,  max: 1.4,  step: 0.01, def: 1 },
  { key: 'jaw_start',  label: 'Ⓐ Начало челюсти',        min: -60,  max: 60,   step: 1,    def: 0,  unit: '°' },
  { key: 'jaw_len',    label: '⑦ Длина челюсти',         min: 0,    max: 1.2,  step: 0.01, def: 0.4 },
  { key: 'jaw_tilt',   label: '⑦ Наклон челюсти',        min: -40,  max: 70,   step: 1,    def: 10, unit: '°' },
  { key: 'jaw_x',      label: 'Ⓑ Ширина скулы',          min: 0.2,  max: 0.95, step: 0.01, def: 0.62 },
  { key: 'chin_len',   label: 'Ⓒ Высота подбородка',     min: 0.5,  max: 1.5,  step: 0.01, def: 1 },
  { key: 'chin_front', label: 'Ⓒ Выступ подбородка',     min: 0.4,  max: 1.4,  step: 0.01, def: 0.85 },
  { key: 'chin_w',     label: 'Ⓒ Ширина подбородка',     min: 0.03, max: 0.6,  step: 0.01, def: 0.22 },
  { key: 'chin_round', label: 'Ⓒ Скругление подбородка', min: 0,    max: 1,    step: 0.01, def: 0.5 },
];

const LINE_PARAM = { min: 0.004, max: 0.04, step: 0.001, def: 0.012 };
const RED = 'red', BLUE = 'blue';
const CORNER = 0.05;
const MAX_Z = 0.98;
const LOOP_SEGMENTS = 96;

const rad = (d) => (d * Math.PI) / 180;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mirror = (a) => [-a[0], a[1], a[2]];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function defaultShape() {
  const s = {};
  for (const p of SHAPE_PARAMS) s[p.key] = p.def;
  return s;
}

function clampShape(input) {
  const s = {};
  for (const p of SHAPE_PARAMS) {
    const v = Number(input?.[p.key]);
    s[p.key] = Number.isFinite(v) ? Math.min(p.max, Math.max(p.min, v)) : p.def;
  }
  return s;
}

function makeBall({ cut, r0, top = 1, back = 1 }) {
  const width = cut / Math.sqrt(1 - r0 * r0);
  const sy = (y) => (y > 0 ? back : 1);
  const sz = (z) => (z > 0 ? top : 1);
  return {
    width, cut, r0, top, back, sy, sz,
    stretch: (x, y, z) => [x, y * sy(y), z * sz(z)],
    normal: (x, y, z) => norm([x / (width * width), y / (sy(y) ** 2), z / (sz(z) ** 2)]),
  };
}

function rounded(items, radius) {
  const pts0 = [];
  for (const it of items) {
    if (!pts0.length || len(sub(it.p, pts0[pts0.length - 1].p)) > 1e-6) pts0.push(it);
  }
  if (pts0.length < 3) return { pts: pts0.map((it) => it.p), corners: [] };

  const out = [pts0[0].p];
  const corners = [];
  for (let i = 1; i < pts0.length - 1; i++) {
    const P = pts0[i - 1].p, V = pts0[i].p, N = pts0[i + 1].p;
    const kk = pts0[i].k ?? 0;
    const d1 = sub(V, P), d2 = sub(N, V);
    const L1 = len(d1), L2 = len(d2);
    const u1 = norm(d1), u2 = norm(d2);
    const cos = Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1] + u1[2] * u2[2]));
    const turn = Math.acos(cos);
    if (turn < 1e-3) { out.push(V); corners.push({ v: V, p: V }); continue; }
    const base = radius * Math.tan(Math.min(turn, Math.PI * 0.95) / 2);
    const t1 = Math.min(Math.max(base, kk * 0.5 * L1), L1 * 0.5);
    const t2 = Math.min(Math.max(base, kk * 0.5 * L2), L2 * 0.5);
    const T1 = [V[0] - u1[0] * t1, V[1] - u1[1] * t1, V[2] - u1[2] * t1];
    const T2 = [V[0] + u2[0] * t2, V[1] + u2[1] * t2, V[2] + u2[2] * t2];
    const STEPS = 2 * (3 + Math.round(kk * 9));
    for (let j = 0; j <= STEPS; j++) {
      const s = j / STEPS, a = (1 - s) * (1 - s), b = 2 * s * (1 - s), c = s * s;
      out.push([a * T1[0] + b * V[0] + c * T2[0], a * T1[1] + b * V[1] + c * T2[1], a * T1[2] + b * V[2] + c * T2[2]]);
    }
    corners.push({ v: V, p: [0.25 * T1[0] + 0.5 * V[0] + 0.25 * T2[0], 0.25 * T1[1] + 0.5 * V[1] + 0.25 * T2[1], 0.25 * T1[2] + 0.5 * V[2] + 0.25 * T2[2]] });
  }
  out.push(pts0[pts0.length - 1].p);
  return { pts: out, corners };
}

function buildHead(input, lift = 0) {
  const s = clampShape(input);
  const ball = makeBall(s);
  const { width, cut, r0, stretch, normal } = ball;

  const zEye = s.eye * r0;
  const zHair = Math.min(s.forehead * r0, MAX_Z * s.top);
  const zNose = -r0;
  const zChin = -r0 - r0 * s.chin_len;
  const xPlane = cut + lift;

  const surf = (p) => {
    const n = normal(...p);
    return [p[0] + n[0] * lift, p[1] + n[1] * lift, p[2] + n[2] * lift];
  };
  const rim = (t, x = xPlane) => {
    const [, y, z] = stretch(0, r0 * Math.cos(t), r0 * Math.sin(t));
    return [x, y, z];
  };

  const lines = [];
  const labels = {};
  const add = (id, color, pts, closed = false) => lines.push({ id, color, closed, pts });

  const ring = (z) => {
    const zu = z / ball.sz(z);
    const rho = Math.sqrt(Math.max(0, 1 - zu * zu));
    const half = width * rho;
    const at = (t) => surf(stretch(half * Math.cos(t), rho * Math.sin(t), zu));
    if (half <= cut * (1 + 1e-6)) {
      const pts = [];
      for (let i = 0; i < LOOP_SEGMENTS; i++) pts.push(at((i / LOOP_SEGMENTS) * Math.PI * 2));
      return [{ pts, closed: true }];
    }
    const t0 = Math.acos(cut / half);
    const arc = (a, b) => {
      const n = Math.max(8, Math.round((LOOP_SEGMENTS * (b - a)) / (Math.PI * 2)));
      const pts = [];
      for (let i = 0; i <= n; i++) pts.push(at(a + ((b - a) * i) / n));
      return { pts, closed: false };
    };
    return [arc(-Math.PI + t0, -t0), arc(t0, Math.PI - t0)];
  };

  const ringLabels = (parts) => {
    const out = [];
    for (const part of parts) {
      const fr = part.closed ? [0.125, 0.375, 0.625, 0.875] : [0.28, 0.72];
      const last = part.pts.length - 1;
      for (const f of fr) {
        const i = Math.round(f * last);
        const p = part.pts[i];
        out.push({ p, n: normal(...p), t: sub(part.pts[Math.min(last, i + 1)], part.pts[Math.max(0, i - 1)]) });
      }
    }
    return out;
  };

  // ① центральная линия
  {
    const pts = [];
    for (let i = 0; i < LOOP_SEGMENTS; i++) {
      const t = (i / LOOP_SEGMENTS) * Math.PI * 2;
      pts.push(surf(stretch(0, Math.cos(t), Math.sin(t))));
    }
    add('1', RED, pts, true);
    labels['1'] = [22.5, 67.5, 112.5, 157.5].map((d) => {
      const t = rad(d);
      const p = surf(stretch(0, Math.cos(t), Math.sin(t)));
      return { p, n: normal(...p), t: stretch(0, -Math.sin(t), Math.cos(t)) };
    });
  }

  // ② ④ ⑤
  for (const [id, color, z] of [['2', RED, zEye], ['4', BLUE, zHair], ['5', BLUE, zNose]]) {
    const parts = ring(z);
    for (const part of parts) add(id, color, part.pts, part.closed);
    labels[id] = ringLabels(parts);
  }

  // ③ боковые круги и кресты
  labels['3'] = [];
  for (const sx of [1, -1]) {
    const x = sx * xPlane;
    const circle = [];
    for (let i = 0; i < LOOP_SEGMENTS; i++) circle.push(rim((i / LOOP_SEGMENTS) * Math.PI * 2, x));
    add('3', RED, circle, true);
    add('3', RED, [rim(Math.PI / 2, x), rim(-Math.PI / 2, x)]);
    add('3', RED, [rim(Math.PI, x), rim(0, x)]);
    labels['3'].push({ p: rim(Math.PI / 4, x), n: [sx, 0, 0], t: [0, -1, 1] });
  }

  // контрольные точки челюсти
  const A = rim(rad(-90 - s.jaw_start));
  const tilt = rad(s.jaw_tilt);
  const B = [s.jaw_x, A[1] - s.jaw_len * Math.sin(tilt), A[2] - s.jaw_len * Math.cos(tilt)];
  const Cf = [s.chin_w, -s.chin_front, zChin];

  // ⑦ челюсть
  const k = s.chin_round;
  const jaw = rounded([
    { p: A }, { p: B, k: 0 }, { p: Cf, k },
    { p: mirror(Cf), k }, { p: mirror(B), k: 0 }, { p: mirror(A) },
  ], CORNER);
  add('7', BLUE, jaw.pts);
  const cornerOf = (v) => jaw.corners.find((c) => c.v === v)?.p ?? v;
  const CfR = cornerOf(Cf);
  const CfL = mirror(CfR);

  // ⑧ скула
  const zEyeU = zEye / ball.sz(zEye);
  const eyeEdge = [xPlane, -Math.sqrt(Math.max(0, r0 * r0 - zEyeU * zEyeU)), zEye];
  add('8', BLUE, [CfR, eyeEdge]);
  add('8', BLUE, [CfL, mirror(eyeEdge)]);

  // ⑥ центральная линия лица
  const front = surf(stretch(0, -Math.sqrt(Math.max(0, 1 - zEyeU * zEyeU)), zEyeU));
  const chinMid = [0, -s.chin_front, zChin];
  add('6', RED, [front, chinMid]);

  // метки
  const out = (p) => norm(p);
  const BR = cornerOf(B);
  const jawMid = lerp(BR, CfR, 0.5);
  const jawDir = sub(CfR, BR);
  const cheek = lerp(CfR, eyeEdge, 0.5);
  const cheekDir = sub(eyeEdge, CfR);
  labels['6'] = [{ p: lerp(front, chinMid, 0.8), n: [0, -1, 0], t: sub(chinMid, front) }];
  labels['7'] = [{ p: jawMid, n: out(jawMid), t: jawDir }, { p: mirror(jawMid), n: out(mirror(jawMid)), t: mirror(jawDir) }];
  labels['8'] = [{ p: cheek, n: out(cheek), t: cheekDir }, { p: mirror(cheek), n: out(mirror(cheek)), t: mirror(cheekDir) }];
  labels['A'] = [{ p: A, n: norm([1, 0, -0.4]) }, { p: mirror(A), n: norm([-1, 0, -0.4]) }];
  labels['B'] = [{ p: BR, n: out(BR) }, { p: mirror(BR), n: out(mirror(BR)) }];
  labels['C'] = [{ p: chinMid, n: norm([0, -1, -1]) }];

  return { lines, labels, solid: { width, cut, r0, top: s.top, back: s.back } };
}

/* ==================================================================
 * Пресеты формы — оригинальные значения из presets.js 3D-версии
 * ================================================================== */

const PRESETS = [
  { id: 'standard', label: 'Стандарт',  values: { r0: 0.68, eye: 0.0,   jaw_len: 0.40, jaw_x: 0.62, chin_len: 1.0,  chin_w: 0.22 } },
  { id: 'youth',    label: 'Юноша',     values: { r0: 0.70, eye: -0.1,  jaw_len: 0.45, jaw_x: 0.60, chin_len: 1.05, chin_w: 0.18 } },
  { id: 'girl',     label: 'Девушка',   values: { r0: 0.64, eye: -0.35, jaw_len: 0.30, jaw_x: 0.55, chin_len: 0.85, chin_w: 0.16 } },
  { id: 'child',    label: 'Ребёнок',   values: { r0: 0.58, eye: -0.6,  jaw_len: 0.20, jaw_x: 0.60, chin_len: 0.65, chin_w: 0.25 } },
];

function presetShape(id) {
  const p = PRESETS.find((x) => x.id === id) ?? PRESETS[0];
  return { ...defaultShape(), ...p.values };
}

/* ==================================================================
 * Состояние
 * ================================================================== */

const STORE_KEY = 'loomis-2d:v1';
const state = loadState();

function wrapYaw(y) { return ((((y + 180) % 360) + 360) % 360) - 180; }

function loadState() {
  const def = {
    shape: defaultShape(),
    preset: 'standard',
    line: LINE_PARAM.def,
    view: { yaw: 0, pitch: 0 },
    display: { hidden: true, labels: true },
    underlay: { opacity: 0.4, scale: 1 },
  };
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (!raw) return def;
    return {
      ...def,
      shape: clampShape(raw.shape),
      preset: PRESETS.some((p) => p.id === raw.preset) ? raw.preset : null,
      line: Number.isFinite(raw.line) ? Math.min(LINE_PARAM.max, Math.max(LINE_PARAM.min, raw.line)) : def.line,
      view: {
        yaw: Number.isFinite(raw.view?.yaw) ? wrapYaw(raw.view.yaw) : 0,
        pitch: Number.isFinite(raw.view?.pitch) ? Math.min(60, Math.max(-60, raw.view.pitch)) : 0,
      },
      display: { hidden: raw.display?.hidden !== false, labels: raw.display?.labels !== false },
      underlay: { opacity: 0.4, scale: 1 },
    };
  } catch { return def; }
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
  }, 300);
}

/* ==================================================================
 * Рендер SVG
 * ================================================================== */

const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('canvas');
const stage = document.getElementById('stage');
const VIEW_SIZE = 600;
const CX = VIEW_SIZE / 2, CY = VIEW_SIZE / 2;
const SCALE = 200;

const gUnderlay = document.createElementNS(SVG_NS, 'g');
const gHidden = document.createElementNS(SVG_NS, 'g');
const gVisible = document.createElementNS(SVG_NS, 'g');
const gLabels = document.createElementNS(SVG_NS, 'g');
svg.appendChild(gUnderlay);
svg.appendChild(gHidden);
svg.appendChild(gVisible);
svg.appendChild(gLabels);

const underlayImg = document.createElementNS(SVG_NS, 'image');
underlayImg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
underlayImg.setAttribute('x', CX - SCALE);
underlayImg.setAttribute('y', CY - SCALE);
underlayImg.setAttribute('width', SCALE * 2);
underlayImg.setAttribute('height', SCALE * 2);
underlayImg.style.display = 'none';
gUnderlay.appendChild(underlayImg);

const LABEL_TEXT = { 1: '①', 2: '②', 3: '③', 4: '④', 5: '⑤', 6: '⑥', 7: '⑦', 8: '⑧', A: 'Ⓐ', B: 'Ⓑ', C: 'Ⓒ' };
const LABEL_COLOR = { 1: 'red', 2: 'red', 3: 'red', 6: 'red', 4: 'blue', 5: 'blue', 7: 'blue', 8: 'blue', A: 'ink', B: 'ink', C: 'ink' };

function rotate(p) {
  const yaw = rad(state.view.yaw), pitch = rad(state.view.pitch);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = p[0] * cy - p[1] * sy;
  const y1 = p[0] * sy + p[1] * cy;
  const z1 = p[2];
  const x2 = x1;
  const y2 = y1 * cp - z1 * sp;
  const z2 = y1 * sp + z1 * cp;
  return [x2, y2, z2];
}

function project(p) {
  const r = rotate(p);
  return { x: CX + r[0] * SCALE, y: CY - r[2] * SCALE, depth: r[1] };
}

function isVisiblePoint(p, n) {
  const rn = rotate(n);
  return rn[1] < 0;
}

function lineToPath(pts, closed) {
  if (!pts.length) return '';
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) d += `L${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;
  if (closed) d += 'Z';
  return d;
}

function splitByVisibility(pts, projected) {
  const result = [];
  if (!pts.length) return result;
  let cur = { visible: null, pts2d: [] };
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const n = norm(p);
    const vis = isVisiblePoint(p, n);
    if (cur.visible === null) {
      cur.visible = vis;
      cur.pts2d.push(projected[i]);
    } else if (cur.visible === vis) {
      cur.pts2d.push(projected[i]);
    } else {
      cur.pts2d.push(projected[i]);
      result.push(cur);
      cur = { visible: vis, pts2d: [projected[i]] };
    }
  }
  if (cur.pts2d.length) result.push(cur);
  return result;
}

function render() {
  const head = buildHead(state.shape, state.line);
  gVisible.innerHTML = '';
  gHidden.innerHTML = '';
  gLabels.innerHTML = '';

  const strokeW = state.line * SCALE;

  for (const l of head.lines) {
    const projected = l.pts.map((p) => project(p));
    const parts = splitByVisibility(l.pts, projected);

    for (const part of parts) {
      if (part.pts2d.length < 2) continue;
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', lineToPath(part.pts2d, false));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', l.color === RED ? 'var(--guide-red)' : 'var(--guide-blue)');
      path.setAttribute('stroke-width', strokeW.toFixed(2));
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      if (!part.visible) {
        if (!state.display.hidden) continue;
        path.setAttribute('stroke-opacity', '0.22');
        path.setAttribute('stroke-dasharray', `${(strokeW * 1.5).toFixed(1)} ${(strokeW * 2.5).toFixed(1)}`);
        gHidden.appendChild(path);
      } else {
        gVisible.appendChild(path);
      }
    }
  }

  if (state.display.labels) {
    for (const [id, cands] of Object.entries(head.labels)) {
      let best = null;
      for (const c of cands) {
        if (!isVisiblePoint(c.p, c.n)) continue;
        const proj = project(c.p);
        if (!best) best = { proj, c };
      }
      if (!best) continue;
      const t = document.createElementNS(SVG_NS, 'text');
      const nProj = project([
        best.c.p[0] + best.c.n[0] * 0.15,
        best.c.p[1] + best.c.n[1] * 0.15,
        best.c.p[2] + best.c.n[2] * 0.15,
      ]);
      let dx = nProj.x - best.proj.x;
      let dy = nProj.y - best.proj.y;
      const dl = Math.hypot(dx, dy) || 1;
      dx /= dl; dy /= dl;
      const x = best.proj.x + dx * 14;
      const y = best.proj.y + dy * 14;
      t.setAttribute('x', x.toFixed(1));
      t.setAttribute('y', y.toFixed(1));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('class', `label label--${LABEL_COLOR[id]}`);
      t.textContent = LABEL_TEXT[id];
      gLabels.appendChild(t);
    }
  }
}

/* ==================================================================
 * UI
 * ================================================================== */

const $ = (id) => document.getElementById(id);

function viewName() {
  const y = state.view.yaw;
  const ay = Math.abs(y);
  if (ay <= 22) return 'Анфас';
  if (ay <= 68) return y > 0 ? '3/4 влево' : '3/4 вправо';
  if (ay <= 112) return y > 0 ? 'Профиль влево' : 'Профиль вправо';
  if (ay <= 158) return 'Задний 3/4';
  return 'Спина';
}

function updateViewName() {
  const p = state.view.pitch;
  const sign = p > 0 ? ` · ↑${Math.round(p)}°` : p < 0 ? ` · ↓${Math.round(-p)}°` : '';
  $('view-name').textContent = `${viewName()} · ${Math.round(state.view.yaw)}°${sign}`;
}

const yawInput = $('yaw'), pitchInput = $('pitch');
yawInput.addEventListener('input', () => {
  stopSpin();
  state.view.yaw = wrapYaw(Number(yawInput.value));
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  render(); updateViewName(); save();
});
pitchInput.addEventListener('input', () => {
  state.view.pitch = Number(pitchInput.value);
  $('pitch-out').textContent = Math.round(state.view.pitch) + '°';
  render(); updateViewName(); save();
});

document.querySelectorAll('[data-angle]').forEach((b) => {
  b.addEventListener('click', () => {
    stopSpin();
    const angles = { front: [0, 0], three: [45, 0], side: [90, 0], back: [180, 0] };
    const [yaw, pitch] = angles[b.dataset.angle] || [0, 0];
    state.view.yaw = yaw;
    state.view.pitch = pitch;
    yawInput.value = yaw;
    pitchInput.value = pitch;
    $('yaw-out').textContent = yaw + '°';
    $('pitch-out').textContent = pitch + '°';
    render(); updateViewName(); save();
  });
});

$('reset-view').addEventListener('click', () => {
  stopSpin();
  state.view.yaw = 0;
  state.view.pitch = 0;
  yawInput.value = 0;
  pitchInput.value = 0;
  $('yaw-out').textContent = '0°';
  $('pitch-out').textContent = '0°';
  render(); updateViewName(); save();
});

let spinRAF = 0;
const spinBtn = $('spin');
function stopSpin() {
  if (spinRAF) { cancelAnimationFrame(spinRAF); spinRAF = 0; }
  spinBtn.setAttribute('aria-pressed', 'false');
}
spinBtn.addEventListener('click', () => {
  const on = spinBtn.getAttribute('aria-pressed') !== 'true';
  spinBtn.setAttribute('aria-pressed', String(on));
  if (on) {
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(64, now - last);
      last = now;
      state.view.yaw = wrapYaw(state.view.yaw + dt * 0.04);
      yawInput.value = state.view.yaw;
      $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
      render(); updateViewName();
      spinRAF = requestAnimationFrame(tick);
    };
    spinRAF = requestAnimationFrame(tick);
  } else {
    stopSpin(); save();
  }
});

// пресеты
const presetButtons = PRESETS.map((p) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn';
  b.textContent = p.label;
  b.addEventListener('click', () => {
    state.preset = p.id;
    state.shape = presetShape(p.id);
    syncShapeSliders();
    renderPresets(); render(); save();
  });
  $('presets').appendChild(b);
  return b;
});
function renderPresets() {
  PRESETS.forEach((p, i) => presetButtons[i].setAttribute('aria-pressed', String(state.preset === p.id)));
}

// слайдеры формы
const shapeSyncers = [];
const shapeHost = $('shape-sliders');
const SHAPE_GROUPS = { cut: 'Голова', eye: 'Лицо', jaw_start: 'Челюсть', chin_len: 'Подбородок' };
for (const p of SHAPE_PARAMS) {
  if (SHAPE_GROUPS[p.key]) {
    const h = document.createElement('div');
    h.className = 'group-h';
    h.textContent = SHAPE_GROUPS[p.key];
    shapeHost.appendChild(h);
  }
  const row = document.createElement('div');
  row.className = 'slider';
  const id = `shape-${p.key}`;
  row.innerHTML = `<label for="${id}">${p.label}</label>
    <input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}">
    <output for="${id}"></output>`;
  shapeHost.appendChild(row);
  const input = row.querySelector('input');
  const out = row.querySelector('output');
  const fmt = (v) => p.unit ? `${Math.round(v)}${p.unit}` : v.toFixed(2);
  const sync = () => {
    input.value = state.shape[p.key];
    out.textContent = fmt(state.shape[p.key]);
  };
  input.addEventListener('input', () => {
    state.shape[p.key] = Number(input.value);
    state.preset = null;
    out.textContent = fmt(Number(input.value));
    renderPresets(); render(); save();
  });
  sync();
  shapeSyncers.push(sync);
}

function syncShapeSliders() { for (const s of shapeSyncers) s(); }

// толщина линии
const lineInput = $('line'), lineOut = $('line-out');
lineInput.value = state.line;
lineOut.textContent = state.line.toFixed(3);
lineInput.addEventListener('input', () => {
  state.line = Number(lineInput.value);
  lineOut.textContent = state.line.toFixed(3);
  render(); save();
});

// переключатели
const toggleHidden = $('toggle-hidden');
const toggleLabels = $('toggle-labels');
toggleHidden.setAttribute('aria-pressed', String(state.display.hidden));
toggleLabels.setAttribute('aria-pressed', String(state.display.labels));
toggleHidden.addEventListener('click', () => {
  state.display.hidden = !state.display.hidden;
  toggleHidden.setAttribute('aria-pressed', String(state.display.hidden));
  render(); save();
});
toggleLabels.addEventListener('click', () => {
  state.display.labels = !state.display.labels;
  toggleLabels.setAttribute('aria-pressed', String(state.display.labels));
  render(); save();
});

/* ==================================================================
 * Подложка
 * ================================================================== */

const underlayPick = $('underlay-pick');
const underlayInput = $('underlay-input');
const underlayRemove = $('underlay-remove');
const underlayOpacity = $('underlay-opacity');
const underlayScale = $('underlay-scale');

underlayPick.addEventListener('click', () => underlayInput.click());
underlayInput.addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  if (f) loadUnderlay(f);
  e.target.value = '';
});
underlayRemove.addEventListener('click', () => {
  underlayImg.removeAttribute('href');
  underlayImg.style.display = 'none';
  underlayRemove.hidden = true;
  $('underlay-hint').textContent = 'Перетащи файл, вставь из буфера или выбери ниже';
  try { localStorage.removeItem(STORE_KEY + ':img'); } catch {}
});

underlayOpacity.addEventListener('input', () => {
  state.underlay.opacity = Number(underlayOpacity.value);
  $('underlay-opacity-out').textContent = Math.round(state.underlay.opacity * 100) + '%';
  underlayImg.style.opacity = state.underlay.opacity;
  save();
});
underlayScale.addEventListener('input', () => {
  state.underlay.scale = Number(underlayScale.value);
  $('underlay-scale-out').textContent = Math.round(state.underlay.scale * 100) + '%';
  applyUnderlayTransform(); save();
});
underlayOpacity.value = state.underlay.opacity;
underlayScale.value = state.underlay.scale;
$('underlay-opacity-out').textContent = Math.round(state.underlay.opacity * 100) + '%';
$('underlay-scale-out').textContent = Math.round(state.underlay.scale * 100) + '%';

function applyUnderlayTransform() {
  const s = state.underlay.scale;
  underlayImg.setAttribute('transform',
    `translate(${CX} ${CY}) scale(${s}) translate(${-CX} ${-CY})`);
  underlayImg.style.opacity = state.underlay.opacity;
}

function loadUnderlay(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    underlayImg.setAttribute('href', dataUrl);
    underlayImg.style.display = '';
    underlayRemove.hidden = false;
    $('underlay-hint').textContent = file.name;
    applyUnderlayTransform();
    try { localStorage.setItem(STORE_KEY + ':img', dataUrl); } catch {}
  };
  reader.readAsDataURL(file);
}

try {
  const saved = localStorage.getItem(STORE_KEY + ':img');
  if (saved) {
    underlayImg.setAttribute('href', saved);
    underlayImg.style.display = '';
    underlayRemove.hidden = false;
    $('underlay-hint').textContent = 'Сохранённая подложка';
    applyUnderlayTransform();
  }
} catch {}

let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes('Files');
window.addEventListener('dragenter', (e) => {
  if (!hasFiles(e)) return;
  dragDepth++;
  $('drop-cover').hidden = false;
});
window.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; $('drop-cover').hidden = true; }
});
window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('drop-cover').hidden = true;
  const f = e.dataTransfer.files?.[0];
  if (f) loadUnderlay(f);
});
document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); loadUnderlay(item.getAsFile()); }
});

/* ==================================================================
 * Экспорт
 * ================================================================== */

$('save-png').addEventListener('click', async () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVG_NS);
  const bg = document.createElementNS(SVG_NS, 'rect');
  bg.setAttribute('width', VIEW_SIZE);
  bg.setAttribute('height', VIEW_SIZE);
  bg.setAttribute('fill', '#ffffff');
  clone.insertBefore(bg, clone.firstChild);

  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 1200;
    canvas.height = 1200;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob((b) => download(b, 'loomis-head.png'));
  };
  img.src = url;
});

$('save-svg').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVG_NS);
  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  download(blob, 'loomis-head.svg');
});

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ==================================================================
 * О методе
 * ================================================================== */

$('about-btn').addEventListener('click', () => {
  alert(
    'Голова Лумиса (2D, 360°)\n\n' +
    '① — центральная линия\n' +
    '② — уровень бровей / глаз\n' +
    '③ — боковой круг (висок → затылок)\n' +
    '④ — линия волос\n' +
    '⑤ — линия носа\n' +
    '⑥ — центральная линия лица\n' +
    '⑦ — линия челюсти Ⓐ→Ⓑ→Ⓒ\n' +
    '⑧ — линия скулы\n\n' +
    'Перетаскивай мышью — вращение по кругу (yaw) и наклон (pitch).\n' +
    'Кнопка «Крутить» — плавный автоповорот.\n' +
    'Скрытые линии — приглушённый пунктир на обратной стороне.'
  );
});

/* ==================================================================
 * Перетаскивание мышью
 * ================================================================== */

let dragStart = null;
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('aside')) return;
  stopSpin();
  dragStart = { x: e.clientX, y: e.clientY, yaw: state.view.yaw, pitch: state.view.pitch };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  state.view.yaw = wrapYaw(dragStart.yaw + dx * 0.5);
  state.view.pitch = Math.max(-60, Math.min(60, dragStart.pitch - dy * 0.3));
  yawInput.value = state.view.yaw;
  pitchInput.value = state.view.pitch;
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  $('pitch-out').textContent = Math.round(state.view.pitch) + '°';
  render(); updateViewName();
});
stage.addEventListener('pointerup', () => { dragStart = null; save(); });
stage.addEventListener('pointercancel', () => { dragStart = null; save(); });

/* ==================================================================
 * Запуск
 * ================================================================== */

syncShapeSliders();
renderPresets();
render();
updateViewName();
</script>
</body>
