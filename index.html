<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineart Highlighter (Edge Detection)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { font-size: 1.1rem; text-align: center; margin-bottom: 15px; }
        .controls { margin-bottom: 20px; }

        input[type="file"] { display: none; }

        .upload-btn {
            background-color: #ff4757;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            max-width: 100%;
            max-height: 80vh;
            border: 2px solid #333;
            background: #000;
            display: none;
            overflow: hidden;
        }

        #imageCanvas, #overlayCanvas {
            display: block;
            max-width: 100%;
            max-height: 80vh;
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .loader { display: none; color: #ff4757; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Авто-штриховка (Поиск контуров)</h1>

    <div class="controls">
        <label for="imageInput" class="upload-btn">Выбрать изображение</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="loader" id="loader">Обработка...</div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const imageCanvas = document.getElementById('imageCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const loader = document.getElementById('loader');

        const imgCtx = imageCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');

        // --- НАСТРОЙКИ ---
        // Чувствительность к контурам. Чем МЕНЬШЕ число, тем больше линий найдет.
        // Если полосы пробивают персонажа - уменьшите (например, до 30).
        // Если полосы останавливаются слишком рано на фоне - увеличьте (до 80-100).
        const EDGE_THRESHOLD = 45; 
        
        const STRIPE_COLOR = '#ff4757';
        const STRIPE_WIDTH = 4;     // Толщина полос
        const STRIPE_GAP = 18;      // Расстояние между полосами
        const SCAN_STEP = 2;        // Шаг сканирования

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loader.style.display = 'block';
            canvasContainer.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => processImage(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processImage(img) {
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.floor(height * (MAX_WIDTH / width));
                width = MAX_WIDTH;
            }

            imageCanvas.width = width;
            imageCanvas.height = height;
            overlayCanvas.width = width;
            overlayCanvas.height = height;

            imgCtx.drawImage(img, 0, 0, width, height);
            const imageData = imgCtx.getImageData(0, 0, width, height);
            const data = imageData.data;

            overlayCtx.clearRect(0, 0, width, height);
            drawDiagonalStripes(data, width, height);

            loader.style.display = 'none';
            canvasContainer.style.display = 'block';
        }

        // Функция получения цвета пикселя
        function getPixel(data, width, height, x, y) {
            if (x < 0 || x >= width || y < 0 || y >= height) return null;
            const index = (y * width + x) * 4;
            return {
                r: data[index],
                g: data[index + 1],
                b: data[index + 2],
                a: data[index + 3]
            };
        }

        // Проверка: является ли текущая точка контуром?
        // Мы сравниваем текущий пиксель с пикселем, который находится на несколько шагов ВПЕРЕД по диагонали.
        function isEdge(data, width, height, x, y) {
            const p1 = getPixel(data, width, height, x, y);
            // Смотрим на 3 пикселя вперед по диагонали
            const p2 = getPixel(data, width, height, x + 3, y + 3); 

            if (!p1 || !p2) return false;

            // Если один из пикселей прозрачный, пропускаем
            if (p1.a < 50 || p2.a < 50) return false;

            // Вычисляем разницу в яркости и цвете
            const diff = Math.abs(p1.r - p2.r) + Math.abs(p1.g - p2.g) + Math.abs(p1.b - p2.b);

            // Если разница больше порога, значит мы наткнулись на линию
            return diff > EDGE_THRESHOLD;
        }

        function drawDiagonalStripes(data, width, height) {
            overlayCtx.strokeStyle = STRIPE_COLOR;
            overlayCtx.lineCap = 'butt'; 
            overlayCtx.lineWidth = STRIPE_WIDTH;

            const step = STRIPE_WIDTH + STRIPE_GAP;

            // Проходим по верхнему и левому краям
            for (let startX = -height; startX < width + height; startX += step) {
                
                let startY = 0;
                let currentX = startX;

                if (currentX < 0) {
                    startY = -currentX;
                    currentX = 0;
                }

                overlayCtx.beginPath();
                overlayCtx.moveTo(currentX, startY);

                let hitEdge = false;
                let x = currentX;
                let y = startY;

                // Сканируем диагональ
                while (x < width && y < height) {
                    if (isEdge(data, width, height, Math.floor(x), Math.floor(y))) {
                        hitEdge = true;
                        break;
                    }
                    x += SCAN_STEP;
                    y += SCAN_STEP;
                }

                // Рисуем полосу только если нашли контур
                if (hitEdge) {
                    overlayCtx.lineTo(x, y);
                    overlayCtx.stroke();
                }
            }
        }
    </script>
</body>
</html>
