<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова</title>
<style>
  :root {
    --bg: #141419;
    --panel: #1e1e26;
    --panel-2: #262630;
    --accent: #e8b04b;
    --text: #e8e8f0;
    --muted: #8a8a99;
    --border: #33333f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1c1c26 0%, var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 20px;
  }

  header {
    text-align: center;
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: .3px;
  }
  header p {
    margin: 0;
    font-size: .8rem;
    color: var(--muted);
  }

  .app {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 900px;
  }

  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  .controls h2 {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 4px;
    font-weight: 600;
  }

  .control {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .control-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: .85rem;
  }

  .control-head label {
    color: var(--text);
  }

  .badge {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-size: .75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    min-width: 42px;
    text-align: center;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--fill, 50%), #33333f var(--fill, 50%), #33333f 100%);
    outline: none;
    cursor: pointer;
    transition: opacity .2s;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
    cursor: pointer;
    transition: transform .15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
    cursor: pointer;
  }

  canvas {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    max-width: 100%;
    height: auto;
  }

  .hint {
    font-size: .75rem;
    color: var(--muted);
    line-height: 1.5;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>Построение головы</h1>
  <p>Настрой пропорции черепа, челюсти и подбородка</p>
</header>

<div class="app">
  <div class="controls">
    <h2>Параметры</h2>

    <div class="control">
      <div class="control-head">
        <label>Частей (голов)</label>
        <span class="badge" id="valParts">7</span>
      </div>
      <input id="rangeParts" type="range" min="3" max="10" value="7" step="1">
    </div>

    <div class="control">
      <div class="control-head">
        <label>Размер круга головы</label>
        <span class="badge" id="valRadius">1.5</span>
      </div>
      <input id="rangeRadius" type="range" min="1.0" max="2.0" value="1.5" step="0.1">
    </div>

    <div class="control">
      <div class="control-head">
        <label>Крепление челюсти</label>
        <span class="badge" id="valAttach">2.0</span>
      </div>
      <input id="rangeAttach" type="range" min="1.0" max="3.0" value="2.0" step="0.1">
    </div>

    <div class="control">
      <div class="control-head">
        <label>Ширина подбородка</label>
        <span class="badge" id="valChinW">0.50</span>
      </div>
      <input id="rangeChinW" type="range" min="0.05" max="1.0" value="0.5" step="0.05">
    </div>

    <div class="control">
      <div class="control-head">
        <label>Высота подбородка</label>
        <span class="badge" id="valChinH">4.0</span>
      </div>
      <input id="rangeChinH" type="range" min="3.0" max="5.0" value="4.0" step="0.1">
    </div>

    <div class="control">
      <div class="control-head">
        <label>Округлость</label>
        <span class="badge" id="valRound">0.00</span>
      </div>
      <input id="rangeRound" type="range" min="0" max="1" value="0" step="0.05">
    </div>

    <div class="hint">
      Значения подбородка измеряются в долях головы (от 3/5 до 5/5).
      Округлость 0 — угловатая челюсть, 1 — мягкая дуга.
    </div>
  </div>

  <canvas id="canvas" width="400" height="700"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const els = {
  parts:  { r: document.getElementById('rangeParts'),  v: document.getElementById('valParts')  },
  radius: { r: document.getElementById('rangeRadius'), v: document.getElementById('valRadius') },
  attach: { r: document.getElementById('rangeAttach'), v: document.getElementById('valAttach') },
  chinW:  { r: document.getElementById('rangeChinW'),  v: document.getElementById('valChinW')  },
  chinH:  { r: document.getElementById('rangeChinH'),  v: document.getElementById('valChinH')  },
  round:  { r: document.getElementById('rangeRound'),  v: document.getElementById('valRound')  }
};

// Обновление полосы заполнения ползунка
function updateFill(el) {
  const min = parseFloat(el.min);
  const max = parseFloat(el.max);
  const val = parseFloat(el.value);
  const pct = ((val - min) / (max - min)) * 100;
  el.style.setProperty('--fill', pct + '%');
}

Object.values(els).forEach(({ r, v }) => {
  r.addEventListener('input', () => {
    v.textContent = r.id === 'rangeChinW' || r.id === 'rangeRound' 
      ? parseFloat(r.value).toFixed(2) 
      : parseFloat(r.value).toFixed(1).replace('.0', '');
    updateFill(r);
    draw();
  });
  updateFill(r);
});

function draw() {
  const parts = parseInt(els.parts.r.value);
  const radiusMultiplier = parseFloat(els.radius.r.value);
  const attachPos = parseFloat(els.attach.r.value);
  const chinWidthMul = parseFloat(els.chinW.r.value);
  const chinHeightPos = parseFloat(els.chinH.r.value);
  const roundness = parseFloat(els.round.r.value);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20;
  const top = pad;
  const bottom = canvas.height - pad;
  const height = bottom - top;
  const step = height / parts;
  const left = 20;
  const right = canvas.width - 20;
  const cx = (left + right) / 2;

  // ================= Сетка =================
  ctx.strokeStyle = '#3a3a46';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#8a8a99';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, right - 16, y + step / 2);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(cx, bottom);
  ctx.stroke();
  ctx.setLineDash([]);

  // ================= Голова =================
  const fifth = step / 5;
  const y0 = top;
  const yAttach = top + fifth * attachPos;
  const y3 = top + fifth * 3;
  const yChin = top + fifth * chinHeightPos;

  const r = fifth * radiusMultiplier;
  const cy = y0 + r;

  const yAttachOffset = Math.abs(yAttach - cy);
  const jawWidthTop = yAttachOffset < r ? 2 * Math.sqrt(r*r - yAttachOffset*yAttachOffset) : r * 2;
  const jawWidthBot = jawWidthTop * chinWidthMul;

  // Вспомогательные линии
  ctx.strokeStyle = 'rgba(232,176,75,0.22)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  for (let i = 1; i <= 5; i++) {
    const y = top + fifth * i;
    ctx.beginPath();
    ctx.moveTo(cx - r - 40, y);
    ctx.lineTo(cx + r + 40, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Череп
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // Челюсть
  ctx.beginPath();
  const halfTop = jawWidthTop / 2;
  const halfBot = jawWidthBot / 2;

  ctx.moveTo(cx - halfTop, yAttach);
  ctx.lineTo(cx - halfTop, y3);

  if (roundness > 0) {
    const cpX = cx - halfBot - (halfTop - halfBot) * 0.5;
    const cpY = y3 + (yChin - y3) * 0.5;
    ctx.quadraticCurveTo(cpX, cpY, cx - halfBot, yChin);
  } else {
    ctx.lineTo(cx - halfBot, yChin);
  }

  if (roundness > 0) {
    const dip = (yChin - y3) * 0.4 * roundness;
    ctx.quadraticCurveTo(cx, yChin + dip, cx + halfBot, yChin);
  } else {
    ctx.lineTo(cx + halfBot, yChin);
  }

  if (roundness > 0) {
    const cpX = cx + halfBot + (halfTop - halfBot) * 0.5;
    const cpY = y3 + (yChin - y3) * 0.5;
    ctx.quadraticCurveTo(cpX, cpY, cx + halfTop, y3);
  } else {
    ctx.lineTo(cx + halfTop, y3);
  }

  ctx.lineTo(cx + halfTop, yAttach);
  ctx.stroke();

  // Подписи долей
  ctx.fillStyle = '#8a8a99';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i++) {
    ctx.fillText(`${i}/5`, cx + r + 10, top + fifth * i - fifth / 2);
  }
}

draw();
</script>
</body>
</html>
