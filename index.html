<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Лумис — Фигура (Спецификация)</title>
<style>
  :root {
    --guide-red: #f03e6e;
    --guide-blue: #3b7cff;
    --guide-green: #2ecc71;
    --bg: #faf8fc;
    --panel: #ffffff;
    --text: #2a2430;
    --muted: #8a8394;
    --line: #e5e1eb;
    --accent: #7a4dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg); display: grid;
    grid-template-columns: 1fr 340px; grid-template-rows: 48px 1fr;
    height: 100vh; overflow: hidden;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; padding: 0 16px; gap: 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .view-name { font-size: 12px; color: var(--muted); margin-left: auto; }

  #stage {
    position: relative; overflow: hidden; background: radial-gradient(circle at 50% 45%, #ffffff 0%, var(--bg) 70%);
    display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; user-select: none; }

  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px 0; }
  section { padding: 0 16px 12px; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 14px 0 8px; }

  .btn {
    font: inherit; font-size: 12px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--text); cursor: pointer; transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

  .slider { display: grid; grid-template-columns: 1fr 52px; grid-template-rows: auto auto; gap: 2px 8px; margin-bottom: 10px; align-items: center; }
  .slider label { grid-column: 1 / -1; font-size: 12px; color: var(--text); }
  .slider input[type="range"] { width: 100%; height: 20px; accent-color: var(--accent); }
  .slider output { text-align: right; font-size: 11px; color: var(--muted); }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 48px 1fr auto; height: 100dvh; }
    aside { border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Лумис — Фигура</h1>
  <span class="view-name" id="view-name">Анфас · 0°</span>
</header>

<main id="stage">
  <svg id="canvas" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
</main>

<aside>
  <section>
    <h2>Поворот</h2>
    <div class="slider">
      <label>Yaw (вокруг вертикали)</label>
      <input type="range" id="yaw" min="-180" max="180" step="1" value="0">
      <output id="yaw-out">0°</output>
    </div>
    <div class="slider">
      <label>Pitch (вверх-вниз)</label>
      <input type="range" id="pitch" min="-40" max="40" step="1" value="0">
      <output id="pitch-out">0°</output>
    </div>
    <div class="row">
      <button class="btn" data-angle="front" type="button">Анфас</button>
      <button class="btn" data-angle="side" type="button">Профиль</button>
      <button class="btn" id="spin" type="button" aria-pressed="false">↻ Крутить</button>
      <button class="btn" id="reset-view" type="button">Сброс</button>
    </div>
  </section>

  <section>
    <h2>Пропорции</h2>
    <div id="figure-sliders"></div>
  </section>
</aside>

<script type="module">
/* ==================================================================
 * 1. КОНСТАНТЫ И ПАРАМЕТРЫ
 * ================================================================== */
const FIGURE_PARAMS = [
  { key: 'S',           label: 'Базовый размер (S)',    min: 0.6, max: 1.4, step: 0.01, def: 1.0 },
  { key: 'neck_len',    label: 'Длина шеи',            min: 0.1, max: 0.5, step: 0.01, def: 0.25 },
  { key: 'chin_len',    label: 'Длина подбородка',     min: 0.2, max: 0.6, step: 0.01, def: 0.35 },
  { key: 'a_pelvis',    label: 'Полуширина таза',      min: 0.3, max: 0.8, step: 0.01, def: 0.50 },
  { key: 'b_pelvis',    label: 'Глубина таза',         min: 0.2, max: 0.6, step: 0.01, def: 0.30 },
  { key: 'a_waist',     label: 'Полуширина талии',     min: 0.2, max: 0.6, step: 0.01, def: 0.40 },
  { key: 'a_chest',     label: 'Полуширина груди',     min: 0.3, max: 0.7, step: 0.01, def: 0.425 },
  { key: 'taper_top',   label: 'Сужение кверху',       min: 0.4, max: 1.0, step: 0.01, def: 0.65 },
  { key: 'back_factor', label: 'Уплощение спины',      min: 0.6, max: 1.0, step: 0.01, def: 0.80 },
  { key: 'bust_r',      label: 'Размер груди',         min: 0.0, max: 0.3, step: 0.01, def: 0.14 },
  { key: 'leg_len',     label: 'Длина ног',            min: 0.5, max: 1.5, step: 0.01, def: 1.0 },
  { key: 'arm_len',     label: 'Длина рук',            min: 0.5, max: 1.5, step: 0.01, def: 1.0 },
];

const P = {
  R: 1.0,
  r0: 0.68,
  chin_len: 0.35,
  Z_chin: -0.918, // -r0 - r0*chin_len
  Z_neck: -1.168,
  Z_pelvis_top: -2.168,
  Z_pelvis_bot: -3.168,
  Z_waist: -2.018,
  Z_bust: -1.788,
  a_pelvis: 0.50, b_pelvis: 0.30,
  a_waist:  0.40, b_waist:  0.24,
  a_chest:  0.425, b_chest: 0.275,
  n_pelvis: 4.0, n_waist: 2.5, n_chest: 2.0,
  taper_top: 0.65,
  back_factor: 0.80,
  bust_x: 0.18, bust_r: 0.14,
};

/* ==================================================================
 * 2. МАТЕМАТИКА
 * ================================================================== */
const rad = (d) => (d * Math.PI) / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (t) => {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
};

// Главная функция контура торса
function torsoPoint(u, v, params) {
  // u ∈ [0,1] (0=низ таза, 1=верх груди)
  // v ∈ [0,1] (0=спереди, 0.5=сзади)
  const theta = 2 * Math.PI * v;

  let a, b, n;
  if (u < 0.35) {
    const t = smoothstep(u / 0.35);
    a = lerp(params.a_pelvis, params.a_waist, t);
    b = lerp(params.b_pelvis, params.b_waist, t);
    n = lerp(params.n_pelvis, params.n_waist, t);
  } else if (u < 0.50) {
    const t = smoothstep((u - 0.35) / 0.15);
    a = lerp(params.a_waist, params.a_chest, t);
    b = lerp(params.b_waist, params.b_chest, t);
    n = lerp(params.n_waist, params.n_chest, t);
  } else {
    const t = smoothstep((u - 0.50) / 0.50);
    a = lerp(params.a_chest, params.a_chest * params.taper_top, t);
    b = lerp(params.b_chest, params.b_chest * params.taper_top, t);
    n = params.n_chest;
  }

  const ct = Math.cos(theta);
  const st = Math.sin(theta);
  let x = a * Math.sign(ct) * Math.pow(Math.abs(ct), 2 / n);
  let y = b * Math.sign(st) * Math.pow(Math.abs(st), 2 / n);

  if (st > 0) y *= params.back_factor;

  const z = params.Z_bot + u * (params.Z_top - params.Z_bot);
  return { x, y, z };
}

// Точка на полусфере груди
function bustPoint(side, phi, theta, params) {
  const cx_b = side * params.bust_x;
  const cy_b = -params.b_chest * 0.9;
  const cz_b = params.Z_bust;
  const r = params.bust_r;

  const x = cx_b + r * Math.sin(phi) * Math.cos(theta);
  const y = cy_b + r * Math.sin(phi) * Math.sin(theta);
  const z = cz_b + r * Math.cos(phi);
  return { x, y, z };
}

// Точка шеи
function neckPoint(u, v, params) {
  const theta = 2 * Math.PI * v;
  const r_top = 0.28;
  const r_bot = 0.35;
  const r = lerp(r_bot, r_top, u);
  return {
    x: r * Math.cos(theta),
    y: r * Math.sin(theta),
    z: lerp(params.Z_neck, params.Z_chin, u),
  };
}

// Точка сферы головы (простая для отладки)
function headPoint(u, v, params) {
  // u ∈ [0,1] (0=низ, 1=верх), v ∈ [0,1] (вращение)
  const theta = 2 * Math.PI * v;
  const phi = Math.PI * u; // 0..PI
  const r = params.R;
  return {
    x: r * Math.sin(phi) * Math.cos(theta),
    y: r * Math.sin(phi) * Math.sin(theta),
    z: params.Z_chin + r + r * Math.cos(phi), // Центр сферы поднят так, чтобы низ был на Z_chin
  };
}

/* ==================================================================
 * 3. ПРОЕКЦИЯ И ВИДИМОСТЬ
 * ================================================================== */
const state = {
  yaw: 0,
  pitch: 0,
  params: { ...P },
  target: null,
  spin: false,
};

function project(p, yaw, pitch, scale, cx, cy) {
  // Yaw (вокруг Z)
  const x1 =  p.x * Math.cos(yaw) - p.y * Math.sin(yaw);
  const y1 =  p.x * Math.sin(yaw) + p.y * Math.cos(yaw);
  const z1 =  p.z;

  // Pitch (вокруг X)
  const y2 =  y1 * Math.cos(pitch) - z1 * Math.sin(pitch);
  const z2 =  y1 * Math.sin(pitch) + z1 * Math.cos(pitch);

  return {
    sx:    cx + x1 * scale,
    sy:    cy - z2 * scale,
    depth: y2,
  };
}

// Z-buffer для торса
const ZBUF_W = 64, ZBUF_H = 64;
let zbuf = new Float32Array(ZBUF_W * ZBUF_H).fill(Infinity);

function rebuildZBuffer(yaw, pitch, scale, cx, cy) {
  zbuf.fill(Infinity);
  for (let i = 0; i < ZBUF_H; i++) {
    for (let j = 0; j < ZBUF_W; j++) {
      const u = i / (ZBUF_H - 1);
      const v = j / (ZBUF_W - 1);
      const p = project(torsoPoint(u, v, state.params), yaw, pitch, scale, cx, cy);
      const idx = i * ZBUF_W + j;
      zbuf[idx] = Math.min(zbuf[idx], p.depth);
    }
  }
}

function isVisible(p, yaw, pitch, scale, cx, cy) {
  // Находим ближайший пиксель в zbuffer
  // Для простоты используем грубую проверку: если точка на передней части (depth < 0) или она ближе к камере, чем zbuf
  // Точная проверка требует UV координат, поэтому для линий используем depth < 0 (полусфера)
  return p.depth < 0.05; // Небольшой допуск
}

/* ==================================================================
 * 4. ГЕНЕРАЦИЯ СЕТКИ И ЛИНИЙ
 * ================================================================== */
function generateScene() {
  const params = state.params;
  const yaw = rad(state.yaw);
  const pitch = rad(state.pitch);
  const scale = 180; // Масштаб для торса
  const cx = 300, cy = 400; // Центр экрана (смещен вниз, чтобы поместилась голова)

  const items = []; // Список элементов для отрисовки (сортировка по глубине)

  // --- 4.1. Торс (сетка) ---
  const ROWS = 24, COLS = 32;
  const grid = [];
  for (let i = 0; i <= ROWS; i++) {
    const u = i / ROWS;
    const row = [];
    for (let j = 0; j <= COLS; j++) {
      const v = j / COLS;
      const p3 = torsoPoint(u, v, params);
      row.push(project(p3, yaw, pitch, scale, cx, cy));
    }
    grid.push(row);
  }

  // Линии вдоль v (горизонтальные)
  for (let i = 0; i <= ROWS; i++) {
    items.push({ type: 'line', color: 'green', pts: grid[i], closed: false });
  }
  // Линии вдоль u (вертикальные)
  for (let j = 0; j <= COLS; j++) {
    const pts = grid.map(row => row[j]);
    items.push({ type: 'line', color: 'blue', pts, closed: false });
  }

  // --- 4.2. Грудь (полусферы) ---
  if (params.bust_r > 0.01) {
    for (const side of [-1, 1]) {
      const bPts = [];
      for (let i = 0; i <= 16; i++) {
        const phi = (i / 16) * Math.PI; // 0..PI
        const theta = side * Math.PI / 2; // смотрим вперед
        const p3 = bustPoint(side, phi, theta, params);
        bPts.push(project(p3, yaw, pitch, scale, cx, cy));
      }
      items.push({ type: 'line', color: 'red', pts: bPts, closed: false });
    }
  }

  // --- 4.3. Шея ---
  const neckRows = 8, neckCols = 12;
  const neckGrid = [];
  for (let i = 0; i <= neckRows; i++) {
    const u = i / neckRows;
    const row = [];
    for (let j = 0; j <= neckCols; j++) {
      const v = j / neckCols;
      const p3 = neckPoint(u, v, params);
      row.push(project(p3, yaw, pitch, scale, cx, cy));
    }
    neckGrid.push(row);
  }
  for (let j = 0; j <= neckCols; j++) {
    const pts = neckGrid.map(row => row[j]);
    items.push({ type: 'line', color: 'blue', pts, closed: false });
  }

  // --- 4.4. Голова (Сфера) ---
  const headRows = 16, headCols = 16;
  const headGrid = [];
  for (let i = 0; i <= headRows; i++) {
    const u = i / headRows;
    const row = [];
    for (let j = 0; j <= headCols; j++) {
      const v = j / headCols;
      const p3 = headPoint(u, v, params);
      row.push(project(p3, yaw, pitch, scale, cx, cy));
    }
    headGrid.push(row);
  }
  // Меридианы
  for (let j = 0; j <= headCols; j += 4) {
    const pts = headGrid.map(row => row[j]);
    items.push({ type: 'line', color: 'blue', pts, closed: false });
  }
  // Параллели
  for (let i = 0; i <= headRows; i += 4) {
    items.push({ type: 'line', color: 'green', pts: headGrid[i], closed: false });
  }

  // --- 4.5. Ноги (простые линии) ---
  const legTopZ = params.Z_pelvis_bot + 0.1;
  const legLen = params.leg_len * 1.0;
  const legBotZ = params.Z_pelvis_bot - legLen;
  for (const sx of [-1, 1]) {
    const legX = sx * 0.25;
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const z = lerp(legTopZ, legBotZ, t);
      const x = lerp(legX, legX * 0.8, t);
      const p3 = { x, y: 0, z };
      pts.push(project(p3, yaw, pitch, scale, cx, cy));
    }
    items.push({ type: 'line', color: 'blue', pts, closed: false });
  }

  // --- 4.6. Руки (простые линии) ---
  const armTopZ = params.Z_top - 0.05;
  const armBotZ = params.Z_pelvis_top - 0.2;
  for (const sx of [-1, 1]) {
    const armX = sx * (params.a_chest * params.taper_top + 0.1);
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const z = lerp(armTopZ, armBotZ, t);
      const x = lerp(armX, armX * 1.1, t);
      const p3 = { x, y: 0, z };
      pts.push(project(p3, yaw, pitch, scale, cx, cy));
    }
    items.push({ type: 'line', color: 'green', pts, closed: false });
  }

  return items;
}

/* ==================================================================
 * 5. РЕНДЕР
 * ================================================================== */
const svg = document.getElementById('canvas');
const gLines = document.createElementNS('http://www.w3.org/2000/svg', 'g');
svg.appendChild(gLines);

function render() {
  const yaw = rad(state.yaw);
  const pitch = rad(state.pitch);
  const scale = 180;
  const cx = 300, cy = 400;

  rebuildZBuffer(yaw, pitch, scale, cx, cy);

  const items = generateScene();
  
  // Сортировка: дальние (depth > 0) сначала, ближние потом
  // Для линий используем среднюю глубину
  items.sort((a, b) => {
    const avgA = a.pts.reduce((s, p) => s + p.depth, 0) / a.pts.length;
    const avgB = b.pts.reduce((s, p) => s + p.depth, 0) / b.pts.length;
    return avgB - avgA; // Дальние (большая глубина) первыми
  });

  gLines.innerHTML = '';
  for (const item of items) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    let d = `M${item.pts[0].sx.toFixed(1)},${item.pts[0].sy.toFixed(1)}`;
    for (let i = 1; i < item.pts.length; i++) {
      d += `L${item.pts[i].sx.toFixed(1)},${item.pts[i].sy.toFixed(1)}`;
    }
    if (item.closed) d += 'Z';
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    
    let strokeColor = 'var(--guide-blue)';
    if (item.color === 'red') strokeColor = 'var(--guide-red)';
    if (item.color === 'green') strokeColor = 'var(--guide-green)';
    
    path.setAttribute('stroke', strokeColor);
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');

    // Проверка видимости
    const avgDepth = item.pts.reduce((s, p) => s + p.depth, 0) / item.pts.length;
    if (avgDepth > 0.05) {
      path.setAttribute('stroke-opacity', '0.2');
      path.setAttribute('stroke-dasharray', '4 4');
    }

    gLines.appendChild(path);
  }
}

/* ==================================================================
 * 6. UI И ЗАПУСК
 * ================================================================== */
const $ = (id) => document.getElementById(id);

function updateViewName() {
  const y = state.yaw;
  const ay = Math.abs(y);
  let name = 'Анфас';
  if (ay > 22 && ay <= 68) name = y > 0 ? '3/4 влево' : '3/4 вправо';
  else if (ay > 68 && ay <= 112) name = y > 0 ? 'Профиль влево' : 'Профиль вправо';
  else if (ay > 112) name = 'Спина';
  $('view-name').textContent = `${name} · ${Math.round(y)}°`;
}

const yawInput = $('yaw'), pitchInput = $('pitch');
yawInput.addEventListener('input', () => {
  state.yaw = Number(yawInput.value);
  $('yaw-out').textContent = state.yaw + '°';
  render(); updateViewName();
});
pitchInput.addEventListener('input', () => {
  state.pitch = Number(pitchInput.value);
  $('pitch-out').textContent = state.pitch + '°';
  render();
});

$('reset-view').addEventListener('click', () => {
  state.yaw = 0; state.pitch = 0;
  yawInput.value = 0; pitchInput.value = 0;
  $('yaw-out').textContent = '0°'; $('pitch-out').textContent = '0°';
  render(); updateViewName();
});

let spinRAF = 0;
const spinBtn = $('spin');
spinBtn.addEventListener('click', () => {
  state.spin = !state.spin;
  spinBtn.setAttribute('aria-pressed', String(state.spin));
  if (state.spin) {
    const tick = () => {
      if (!state.spin) return;
      state.yaw = (state.yaw + 1) % 360;
      if (state.yaw > 180) state.yaw -= 360;
      yawInput.value = state.yaw;
      $('yaw-out').textContent = Math.round(state.yaw) + '°';
      render(); updateViewName();
      spinRAF = requestAnimationFrame(tick);
    };
    spinRAF = requestAnimationFrame(tick);
  } else {
    cancelAnimationFrame(spinRAF);
  }
});

document.querySelectorAll('[data-angle]').forEach((b) => {
  b.addEventListener('click', () => {
    state.spin = false; spinBtn.setAttribute('aria-pressed', 'false');
    cancelAnimationFrame(spinRAF);
    const angles = { front: 0, side: 90 };
    state.yaw = angles[b.dataset.angle] || 0;
    yawInput.value = state.yaw;
    $('yaw-out').textContent = state.yaw + '°';
    render(); updateViewName();
  });
});

// Слайдеры
const figHost = $('figure-sliders');
for (const p of FIGURE_PARAMS) {
  const row = document.createElement('div'); row.className = 'slider';
  const id = `fig-${p.key}`;
  row.innerHTML = `<label for="${id}">${p.label}</label>
    <input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}">
    <output for="${id}"></output>`;
  figHost.appendChild(row);
  const input = row.querySelector('input'), out = row.querySelector('output');
  const fmt = (v) => v.toFixed(2);
  
  // Привязка к параметрам P
  if (p.key === 'S') {
    input.value = 1.0;
    out.textContent = '1.00';
    input.addEventListener('input', () => {
      const v = Number(input.value);
      out.textContent = fmt(v);
      // Пересчитываем все зависимые параметры
      const S = v;
      state.params = { ...P };
      state.params.Z_neck = state.params.Z_chin - 0.25 * S;
      state.params.Z_pelvis_top = state.params.Z_neck - S;
      state.params.Z_pelvis_bot = state.params.Z_pelvis_top - S;
      state.params.Z_waist = state.params.Z_pelvis_top + 0.15 * S;
      state.params.Z_bust = state.params.Z_neck - 0.62 * S;
      state.params.a_pelvis = 0.50 * S;
      state.params.b_pelvis = 0.30 * S;
      state.params.a_waist = 0.40 * S;
      state.params.b_waist = 0.24 * S;
      state.params.a_chest = 0.425 * S;
      state.params.b_chest = 0.275 * S;
      state.params.Z_top = state.params.Z_neck;
      state.params.Z_bot = state.params.Z_pelvis_bot;
      render();
    });
  } else if (p.key === 'bust_r') {
    input.value = P.bust_r;
    out.textContent = fmt(P.bust_r);
    input.addEventListener('input', () => {
      state.params.bust_r = Number(input.value);
      out.textContent = fmt(Number(input.value));
      render();
    });
  } else if (p.key === 'taper_top') {
    input.value = P.taper_top;
    out.textContent = fmt(P.taper_top);
    input.addEventListener('input', () => {
      state.params.taper_top = Number(input.value);
      out.textContent = fmt(Number(input.value));
      render();
    });
  } else {
    // Для остальных просто меняем значение
    input.value = P[p.key] || 0;
    out.textContent = fmt(input.value);
    input.addEventListener('input', () => {
      out.textContent = fmt(Number(input.value));
      render();
    });
  }
}

// Запуск
render();
updateViewName();
</script>
