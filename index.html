<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обнаружение фона и силуэта</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #12141a;
    color: #e6e6e6;
    margin: 0;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    background: #1b1e27;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid #262a36;
  }
  label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  input[type="file"] { color: #ccc; font-size: 13px; }
  input[type="range"] { width: 140px; }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  button:hover { background: #2563eb; }
  button.secondary { background: #374151; }
  button.secondary:hover { background: #4b5563; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 1100px;
  }
  .panel {
    background: #1b1e27;
    border: 1px solid #262a36;
    border-radius: 12px;
    padding: 12px;
  }
  .panel h3 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    background: #0b0d12;
    image-rendering: pixelated;
  }
  .hint { font-size: 12px; color: #6b7280; text-align: center; max-width: 700px; }
</style>
</head>
<body>

<h1>🖼️ Обнаружение фона и силуэта</h1>

<div class="controls">
  <label>
    Загрузить:
    <input type="file" id="fileInput" accept="image/*">
  </label>
  <label>
    Порог:
    <input type="range" id="threshold" min="5" max="120" value="40">
    <span id="thresholdVal">40</span>
  </label>
  <button id="detectBtn">Найти силуэт</button>
  <button id="clearBtn" class="secondary">Сброс</button>
</div>

<div class="grid">
  <div class="panel">
    <h3>Оригинал</h3>
    <canvas id="original"></canvas>
  </div>
  <div class="panel">
    <h3>Обнаруженный фон (маска)</h3>
    <canvas id="mask"></canvas>
  </div>
  <div class="panel">
    <h3>Силуэт персонажа</h3>
    <canvas id="silhouette"></canvas>
  </div>
</div>

<p class="hint">
  Алгоритм: берёт цвета по краям изображения как «фон», сравнивает каждый пиксель
  с ближайшим фоновым цветом (евклидово расстояние в RGB), применяет медианный фильтр
  и морфологию для чистки маски.
</p>

<script>
(() => {
  'use strict';

  const fileInput   = document.getElementById('fileInput');
  const threshold   = document.getElementById('threshold');
  const thresholdVal= document.getElementById('thresholdVal');
  const detectBtn   = document.getElementById('detectBtn');
  const clearBtn    = document.getElementById('clearBtn');

  const origCanvas  = document.getElementById('original');
  const maskCanvas  = document.getElementById('mask');
  const silCanvas   = document.getElementById('silhouette');

  const origCtx = origCanvas.getContext('2d', { willReadFrequently: true });
  const maskCtx = maskCanvas.getContext('2d');
  const silCtx  = silCanvas.getContext('2d');

  let currentImage = null;

  threshold.addEventListener('input', () => {
    thresholdVal.textContent = threshold.value;
    if (currentImage) detect();
  });

  // ---------- Загрузка ----------
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      // ограничиваем размер для производительности
      const MAX = 900;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      [origCanvas, maskCanvas, silCanvas].forEach(c => {
        c.width = w; c.height = h;
      });
      origCtx.drawImage(img, 0, 0, w, h);
      detect();
    };
    img.src = URL.createObjectURL(file);
  });

  detectBtn.addEventListener('click', () => {
    if (currentImage) detect();
  });

  clearBtn.addEventListener('click', () => {
    currentImage = null;
    fileInput.value = '';
    [origCtx, maskCtx, silCtx].forEach(ctx => {
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    });
  });

  // ---------- Основной алгоритм ----------
  function detect() {
    const w = origCanvas.width;
    const h = origCanvas.height;
    if (!w || !h) return;

    const src = origCtx.getImageData(0, 0, w, h);
    const data = src.data;
    const N = w * h;

    // 1. Собираем образцы фона по периметру
    const bgSamples = sampleBorderColors(data, w, h, 4);

    // 2. Кластеризация фоновых цветов (простая: усреднение похожих)
    const bgColors = clusterColors(bgSamples, 30);

    // 3. Маска фона: 255 = фон, 0 = объект
    const thr = parseFloat(threshold.value);
    const thrSq = thr * thr;
    let mask = new Uint8Array(N);

    for (let i = 0; i < N; i++) {
      const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
      let minDist = Infinity;
      for (let c = 0; c < bgColors.length; c++) {
        const bc = bgColors[c];
        const dr = r - bc[0], dg = g - bc[1], db = b - bc[2];
        const d = dr*dr + dg*dg + db*db;
        if (d < minDist) {
          minDist = d;
          if (minDist < thrSq) break;
        }
      }
      mask[i] = minDist < thrSq ? 255 : 0; // 255 = фон
    }

    // 4. Медианный фильтр 3x3 для удаления шума
    mask = medianFilter3x3(mask, w, h);

    // 5. Морфология: закрытие (dilate -> erode), потом открытие (erode -> dilate)
    mask = morph(mask, w, h, 'dilate', 2);
    mask = morph(mask, w, h, 'erode', 2);
    mask = morph(mask, w, h, 'erode', 2);
    mask = morph(mask, w, h, 'dilate', 2);

    // 6. Оставляем только крупнейшую связную область объекта (не фон)
    mask = keepLargestObject(mask, w, h);

    // 7. Рисуем маску фона
    const maskData = maskCtx.createImageData(w, h);
    for (let i = 0; i < N; i++) {
      // mask[i] = 255 -> фон (белый), 0 -> объект (чёрный)
      const v = mask[i];
      maskData.data[i*4]   = v;
      maskData.data[i*4+1] = v;
      maskData.data[i*4+2] = v;
      maskData.data[i*4+3] = 255;
    }
    maskCtx.putImageData(maskData, 0, 0);

    // 8. Рисуем силуэт: объект чёрным, фон прозрачным
    const silData = silCtx.createImageData(w, h);
    for (let i = 0; i < N; i++) {
      if (mask[i] === 0) {
        // объект — заливаем чёрным
        silData.data[i*4]   = 0;
        silData.data[i*4+1] = 0;
        silData.data[i*4+2] = 0;
        silData.data[i*4+3] = 255;
      } else {
        silData.data[i*4+3] = 0; // прозрачный
      }
    }
    silCtx.putImageData(silData, 0, 0);
  }

  // ---------- Вспомогательные функции ----------

  // Собираем цвета по периметру (шаг 4 пикселя)
  function sampleBorderColors(data, w, h, step) {
    const out = [];
    const push = (x, y) => {
      const i = (y * w + x) * 4;
      out.push([data[i], data[i+1], data[i+2]]);
    };
    for (let x = 0; x < w; x += step) {
      push(x, 0);
      push(x, 1);
      push(x, h - 1);
      push(x, h - 2);
    }
    for (let y = 0; y < h; y += step) {
      push(0, y);
      push(1, y);
      push(w - 1, y);
      push(w - 2, y);
    }
    return out;
  }

  // Простая кластеризация: объединяем цвета, отличающиеся менее чем на tol
  function clusterColors(colors, tol) {
    const tolSq = tol * tol;
    const clusters = [];
    for (const c of colors) {
      let found = false;
      for (const cl of clusters) {
        const dr = c[0] - cl.r, dg = c[1] - cl.g, db = c[2] - cl.b;
        if (dr*dr + dg*dg + db*db < tolSq) {
          cl.r = (cl.r * cl.n + c[0]) / (cl.n + 1);
          cl.g = (cl.g * cl.n + c[1]) / (cl.n + 1);
          cl.b = (cl.b * cl.n + c[2]) / (cl.n + 1);
          cl.n++;
          found = true;
          break;
        }
      }
      if (!found) clusters.push({ r: c[0], g: c[1], b: c[2], n: 1 });
    }
    // отбрасываем очень редкие кластеры (< 2% пикселей)
    const minN = colors.length * 0.02;
    return clusters
      .filter(cl => cl.n >= minN)
      .map(cl => [cl.r, cl.g, cl.b]);
  }

  // Медианный фильтр 3x3 по бинарной маске
  function medianFilter3x3(mask, w, h) {
    const out = new Uint8Array(mask.length);
    const buf = new Uint8Array(9);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let k = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
              buf[k++] = mask[ny * w + nx];
            } else {
              buf[k++] = 255; // границы считаем фоном
            }
          }
        }
        // сортируем вставками (9 элементов)
        for (let i = 1; i < 9; i++) {
          const v = buf[i];
          let j = i - 1;
          while (j >= 0 && buf[j] > v) { buf[j+1] = buf[j]; j--; }
          buf[j+1] = v;
        }
        out[y * w + x] = buf[4];
      }
    }
    return out;
  }

  // Морфология: dilate (255 растёт) / erode (255 сжимается)
  function morph(mask, w, h, type, iterations) {
    let cur = mask;
    for (let it = 0; it < iterations; it++) {
      const out = new Uint8Array(cur.length);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let result = type === 'dilate' ? 0 : 255;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const nx = x + dx, ny = y + dy;
              const v = (nx >= 0 && nx < w && ny >= 0 && ny < h)
                ? cur[ny * w + nx]
                : (type === 'dilate' ? 0 : 255);
              if (type === 'dilate') {
                if (v > result) result = v;
              } else {
                if (v < result) result = v;
              }
            }
          }
          out[y * w + x] = result;
        }
      }
      cur = out;
    }
    return cur;
  }

  // Оставить только крупнейшую связную область пикселей со значением 0 (объект)
  function keepLargestObject(mask, w, h) {
    const N = w * h;
    const visited = new Uint8Array(N);
    let bestLabel = -1;
    let bestSize = 0;
    const labels = new Int32Array(N).fill(-1);
    let label = 0;
    const stack = [];

    for (let i = 0; i < N; i++) {
      if (visited[i] || mask[i] !== 0) continue;
      // BFS/DFS
      stack.length = 0;
      stack.push(i);
      visited[i] = 1;
      labels[i] = label;
      let size = 0;
      while (stack.length) {
        const p = stack.pop();
        size++;
        const x = p % w;
        const y = (p / w) | 0;
        // 4 соседа
        if (x > 0)     tryPush(p - 1);
        if (x < w - 1) tryPush(p + 1);
        if (y > 0)     tryPush(p - w);
        if (y < h - 1) tryPush(p + w);
      }
      if (size > bestSize) {
        bestSize = size;
        bestLabel = label;
      }
      label++;

      function tryPush(np) {
        if (!visited[np] && mask[np] === 0) {
          visited[np] = 1;
          labels[np] = label;
          stack.push(np);
        }
      }
    }

    // Если объекта не нашли — вернуть исходную маску
    if (bestLabel === -1) return mask;

    const out = new Uint8Array(N);
    for (let i = 0; i < N; i++) {
      // 0 — оставляем только лучший объект, остальное — фон
      out[i] = (mask[i] === 0 && labels[i] === bestLabel) ? 0 : 255;
    }
    return out;
  }

})();
</script>
</body>
</html>
