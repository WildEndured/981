<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 2. Голова (Расширенная)</title>
<style>
  :root {
    --bg: #141419; --panel: #1e1e26; --panel-2: #262630;
    --accent: #e8b04b; --text: #e8e8f0; --muted: #8a8a99;
    --border: #33333f; --danger: #e85b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at top, #1c1c26 0%, var(--bg) 70%);
    color: var(--text); font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; gap: 20px;
  }
  header { text-align: center; }
  header h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; letter-spacing: .3px; }
  header p { margin: 0; font-size: .8rem; color: var(--muted); }
  .app {
    display: flex; gap: 24px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center;
    width: 100%; max-width: 900px;
  }
  .controls {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px 20px;
    width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    max-height: 85vh; overflow-y: auto;
  }
  .controls h2 {
    font-size: .75rem; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted);
    margin: 8px 0 4px; font-weight: 600;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .control { display: flex; flex-direction: column; gap: 6px; }
  .control-head { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; }
  .badge {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--accent); font-variant-numeric: tabular-nums;
    font-size: .75rem; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; min-width: 46px; text-align: center;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%;
    height: 6px; border-radius: 3px; background: #33333f;
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; border: 3px solid var(--accent);
    box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer; transition: transform .15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  .actions {
    display: flex; justify-content: flex-end; align-items: center;
    padding-top: 12px; border-top: 1px solid var(--border); margin-top: 8px;
  }
  .btn-reset {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: .75rem; transition: all .2s;
  }
  .btn-reset:hover { border-color: var(--danger); color: var(--danger); }
  .stage { position: relative; }
  canvas {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    display: block;
  }
</style>
</head>
<body>

<header>
  <h1>Построение головы</h1>
  <p>Расширенные настройки формы</p>
</header>

<div class="app">
  <div class="controls" id="controls-container">
    <!-- Сюда будут добавлены ползунки через JS -->
  </div>

  <div class="stage">
    <canvas id="canvas" width="450" height="800"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Конфигурация параметров (взята из loomis.js + твои старые)
const SHAPE_PARAMS = [
  { key: 'parts',      label: 'Частей (голов)',      min: 3,   max: 10,  step: 1,    def: 7 },
  { key: 'cut',        label: 'Ширина головы',       min: 0.4, max: 0.95, step: 0.01, def: 0.73 },
  { key: 'top',        label: 'Высота верха',        min: 0.8, max: 1.4,  step: 0.01, def: 1.0 },
  { key: 'r0',         label: 'Размер кругов (r0)',  min: 0.3, max: 0.95, step: 0.01, def: 0.68 },
  { key: 'eye',        label: 'Высота глаз',         min: -0.9, max: 0.9, step: 0.01, def: 0.0 },
  { key: 'jaw_start',  label: 'Начало челюсти',      min: -60,  max: 60,  step: 1,    def: 0, unit: '°' },
  { key: 'jaw_len',    label: 'Длина челюсти',       min: 0,   max: 1.2,  step: 0.01, def: 0.4 },
  { key: 'jaw_tilt',   label: 'Наклон челюсти',      min: -40,  max: 70,  step: 1,    def: 10, unit: '°' },
  { key: 'jaw_x',      label: 'Ширина эла (B)',      min: 0.2, max: 0.95, step: 0.01, def: 0.62 },
  { key: 'chin_len',   label: 'Высота подбородка',   min: 0.5, max: 1.5,  step: 0.01, def: 1.0 },
  { key: 'chin_front', label: 'Выступ подбородка',   min: 0.4, max: 1.4,  step: 0.01, def: 0.85 },
  { key: 'chin_w',     label: 'Ширина подбородка',   min: 0.03, max: 0.6, step: 0.01, def: 0.22 },
  { key: 'chin_round', label: 'Округлость',          min: 0,   max: 1,    step: 0.01, def: 0.5 }
];

let params = {};
SHAPE_PARAMS.forEach(p => params[p.key] = p.def);

// ================= МАТЕМАТИКА =================
const rad = (d) => (d * Math.PI) / 180;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mirror = (a) => [-a[0], a[1], a[2]];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function rounded(items, radius) {
  const pts0 = [];
  for (const it of items) {
    if (!pts0.length || len(sub(it.p, pts0[pts0.length - 1].p)) > 1e-6) pts0.push(it);
  }
  if (pts0.length < 3) return { pts: pts0.map((it) => it.p), corners: [] };
  const out = [pts0[0].p];
  const corners = [];
  for (let i = 1; i < pts0.length - 1; i++) {
    const P = pts0[i - 1].p, V = pts0[i].p, N = pts0[i + 1].p;
    const kk = pts0[i].k ?? 0;
    const d1 = sub(V, P), d2 = sub(N, V);
    const L1 = len(d1), L2 = len(d2);
    const u1 = norm(d1), u2 = norm(d2);
    const cos = Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1] + u1[2] * u2[2]));
    const turn = Math.acos(cos);
    if (turn < 1e-3) { out.push(V); corners.push({ v: V, p: V }); continue; }
    const base = radius * Math.tan(Math.min(turn, Math.PI * 0.95) / 2);
    const t1 = Math.min(Math.max(base, kk * 0.5 * L1), L1 * 0.5);
    const t2 = Math.min(Math.max(base, kk * 0.5 * L2), L2 * 0.5);
    const T1 = [V[0] - u1[0] * t1, V[1] - u1[1] * t1, V[2] - u1[2] * t1];
    const T2 = [V[0] + u2[0] * t2, V[1] + u2[1] * t2, V[2] + u2[2] * t2];
    const STEPS = 2 * (3 + Math.round(kk * 9));
    for (let j = 0; j <= STEPS; j++) {
      const s = j / STEPS, a = (1 - s) * (1 - s), b = 2 * s * (1 - s), c = s * s;
      out.push([a * T1[0] + b * V[0] + c * T2[0], a * T1[1] + b * V[1] + c * T2[1], a * T1[2] + b * V[2] + c * T2[2]]);
    }
    corners.push({ v: V, p: [0.25 * T1[0] + 0.5 * V[0] + 0.25 * T2[0], 0.25 * T1[1] + 0.5 * V[1] + 0.25 * T2[1], 0.25 * T1[2] + 0.5 * V[2] + 0.25 * T2[2]] });
  }
  out.push(pts0[pts0.length - 1].p);
  return { pts: out, corners };
}

function draw() {
  const parts = params.parts;
  const cut = params.cut;
  const top = params.top;
  const r0 = params.r0;
  const eye = params.eye;
  const jaw_start = params.jaw_start;
  const jaw_len = params.jaw_len;
  const jaw_tilt = params.jaw_tilt;
  const jaw_x = params.jaw_x;
  const chin_len = params.chin_len;
  const chin_front = params.chin_front;
  const chin_w = params.chin_w;
  const chin_round = params.chin_round;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20, topPad = pad, bottom = canvas.height - pad;
  const height = bottom - topPad, step = height / parts;
  const left = 20, right = canvas.width - 20, cx = (left + right) / 2;

  // Сетка
  ctx.strokeStyle = '#3a3a46'; ctx.lineWidth = 1;
  ctx.font = '11px system-ui'; ctx.fillStyle = '#8a8a99';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= parts; i++) {
    const y = topPad + i * step;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, right - 16, y + step / 2);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(cx, topPad); ctx.lineTo(cx, bottom); ctx.stroke(); ctx.setLineDash([]);

  // Масштаб: R=1 в 3D. 1 часть сетки = 2 единицы.
  const scale = step / 2;
  const cy = topPad + step;

  // --- ЧЕРЕП (Сфера) ---
  const width = cut / Math.sqrt(1 - r0 * r0);
  ctx.beginPath();
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 2;
  for (let i = 0; i <= 64; i++) {
    const t = (i / 64) * Math.PI * 2;
    const x = width * Math.sin(t);
    const z = Math.cos(t) * (Math.cos(t) > 0 ? top : 1);
    const px = cx + x * scale;
    const py = cy - z * scale;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();

  const zEye = eye * r0;
  const zChin = -r0 - r0 * chin_len;

  // --- ЛИНИИ (2D проекция) ---
  // 1. Вертикаль
  ctx.beginPath();
  ctx.strokeStyle = '#f03e6e'; ctx.lineWidth = 2;
  ctx.moveTo(cx, cy - top * scale);
  ctx.lineTo(cx, cy - (-r0) * scale);
  ctx.stroke();

  // 2. Линия глаз
  ctx.beginPath();
  ctx.moveTo(cx - cut * scale, cy - zEye * scale);
  ctx.lineTo(cx + cut * scale, cy - zEye * scale);
  ctx.stroke();

  // 3. Боковые линии
  ctx.beginPath();
  ctx.moveTo(cx - cut * scale, cy - top * scale);
  ctx.lineTo(cx - cut * scale, cy - (-r0) * scale);
  ctx.moveTo(cx + cut * scale, cy - top * scale);
  ctx.lineTo(cx + cut * scale, cy - (-r0) * scale);
  ctx.stroke();

  // 7. Челюсть
  const A_r = [cut, 0, -r0];
  const A_l = [-cut, 0, -r0];
  const tilt = rad(jaw_tilt);
  const B_r = [jaw_x, 0, -r0 - jaw_len * Math.cos(tilt)];
  const B_l = [-jaw_x, 0, -r0 - jaw_len * Math.cos(tilt)];
  const C_r = [chin_w, 0, zChin];
  const C_l = [-chin_w, 0, zChin];

  const jaw = rounded([
    { p: A_r }, { p: B_r, k: 0 }, { p: C_r, k: chin_round },
    { p: C_l, k: chin_round }, { p: B_l, k: 0 }, { p: A_l }
  ], 0.05);

  ctx.beginPath();
  ctx.strokeStyle = '#3b7cff';
  jaw.pts.forEach((pt, i) => {
    const px = cx + pt[0] * scale;
    const py = cy - pt[2] * scale;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  ctx.stroke();

  // 8. Щеки
  ctx.beginPath();
  const cheekR = [cut, 0, zEye];
  const cheekL = [-cut, 0, zEye];
  const Cr_r = jaw.corners.find(c => c.v[0] === chin_w && c.v[2] === zChin)?.p || C_r;
  const Cr_l = jaw.corners.find(c => c.v[0] === -chin_w && c.v[2] === zChin)?.p || C_l;
  
  ctx.moveTo(cx + Cr_r[0] * scale, cy - Cr_r[2] * scale);
  ctx.lineTo(cx + cheekR[0] * scale, cy - cheekR[2] * scale);
  ctx.moveTo(cx + Cr_l[0] * scale, cy - Cr_l[2] * scale);
  ctx.lineTo(cx + cheekL[0] * scale, cy - cheekL[2] * scale);
  ctx.stroke();

  // 6. Центр лица (переносица -> подбородок)
  ctx.beginPath();
  ctx.strokeStyle = '#f03e6e';
  ctx.moveTo(cx, cy - zEye * scale);
  ctx.lineTo(cx, cy - zChin * scale);
  ctx.stroke();

  // --- ШЕЯ ---
  const chinPtY = cy - zChin * scale;
  const neckWidthPx = 60;
  const neckLenPx = 120;
  ctx.fillStyle = 'rgba(232,176,75,0.1)';
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - neckWidthPx / 2, chinPtY);
  ctx.lineTo(cx - neckWidthPx / 2, chinPtY + neckLenPx);
  ctx.lineTo(cx + neckWidthPx / 2, chinPtY + neckLenPx);
  ctx.lineTo(cx + neckWidthPx / 2, chinPtY);
  ctx.fill(); ctx.stroke();
}

// ================= UI =================
const container = document.getElementById('controls-container');
const inputs = {};

SHAPE_PARAMS.forEach(p => {
  const row = document.createElement('div');
  row.className = 'control';
  
  let labelGroup = '';
  if (p.key === 'cut') labelGroup = '<h2>Форма черепа</h2>';
  if (p.key === 'eye') labelGroup = '<h2>Глаза</h2>';
  if (p.key === 'jaw_start') labelGroup = '<h2>Челюсть</h2>';
  if (p.key === 'chin_len') labelGroup = '<h2>Подбородок</h2>';
  
  row.innerHTML = `
    ${labelGroup}
    <div class="control-head">
      <label>${p.label}</label>
      <span class="badge" id="val-${p.key}">${p.def}</span>
    </div>
    <input id="range-${p.key}" type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}">
  `;
  container.appendChild(row);

  const input = row.querySelector('input');
  const badge = row.querySelector('.badge');
  
  const updateFill = () => {
    const val = parseFloat(input.value);
    const pct = ((val - p.min) / (p.max - p.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
    badge.textContent = p.unit ? `${Math.round(val)}${p.unit}` : val.toFixed(2);
  };

  input.addEventListener('input', () => {
    params[p.key] = parseFloat(input.value);
    updateFill();
    draw();
  });

  updateFill();
});

const actions = document.createElement('div');
actions.className = 'actions';
actions.innerHTML = `<button class="btn-reset" id="btnReset">Сбросить</button>`;
container.appendChild(actions);

document.getElementById('btnReset').addEventListener('click', () => {
  SHAPE_PARAMS.forEach(p => {
    params[p.key] = p.def;
    const input = document.getElementById(`range-${p.key}`);
    const badge = document.getElementById(`val-${p.key}`);
    input.value = p.def;
    const pct = ((p.def - p.min) / (p.max - p.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
    badge.textContent = p.unit ? `${Math.round(p.def)}${p.unit}` : p.def.toFixed(2);
  });
  draw();
});

draw();
</script>
</body>
</html>
