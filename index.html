<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loomis 2D (Исправленная сфера)</title>
<style>
  :root {
    --bg: #141419; --panel: #1e1e26; --accent: #e8b04b;
    --text: #e8e8f0; --muted: #8a8a99; --border: #33333f;
    --danger: #e85b5b; --red: #f03e6e; --blue: #3b7cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #1c1c26 0%, var(--bg) 70%);
    color: var(--text); font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 20px;
  }
  header { text-align: center; }
  header h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  header p { margin: 0; font-size: .8rem; color: var(--muted); }
  .app { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1050px; }
  .controls {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px;
    width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); max-height: 85vh; overflow-y: auto;
  }
  .controls h2 { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 8px 0 4px; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .control { display: flex; flex-direction: column; gap: 2px; }
  .control-head { display: flex; justify-content: space-between; align-items: center; font-size: .75rem; }
  .badge { background: var(--panel); border: 1px solid var(--border); color: var(--accent); font-variant-numeric: tabular-nums; font-size: .7rem; font-weight: 600; padding: 1px 6px; border-radius: 999px; min-width: 38px; text-align: center; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #33333f; outline: none; cursor: pointer; position: relative; }
  input[type="range"]::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 0%), #33333f var(--fill, 0%), #33333f 100%); height: 4px; border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.4); cursor: pointer; margin-top: -5px; }
  .actions { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); margin-top: 8px; }
  .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: .75rem; transition: all .2s; }
  .btn-reset:hover { border-color: var(--danger); color: var(--danger); }
  .stage { position: relative; width: 500px; height: 800px; max-width: 100%; }
  canvas { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .label-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
  .guide-label { position: absolute; top: 0; left: 0; font-family: monospace; font-weight: bold; font-size: 14px; text-shadow: 0 1px 3px #000; }
  .label-red { color: var(--red); } .label-blue { color: var(--blue); } .label-ink { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Loomis 2D</h1>
  <p>Нормальная сфера и челюсть</p>
</header>

<div class="app">
  <div class="controls" id="controls"></div>
  <div class="stage">
    <canvas id="canvas" width="500" height="800"></canvas>
    <div class="label-layer" id="labelLayer"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const labelLayer = document.getElementById('labelLayer');

// ================= МАТЕМАТИКА (по спецификации) =================
const rad = (d) => (d * Math.PI) / 180;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mirror = (a) => [-a[0], a[1], a[2]];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

const SHAPE_PARAMS = [
  { key: 'cut',        label: 'Ширина головы',       min: 0.4,  max: 0.95, step: 0.01, def: 0.73 },
  { key: 'top',        label: 'Высота верха',        min: 0.8,  max: 1.4,  step: 0.01, def: 1 },
  { key: 'r0',         label: 'Размер кругов',       min: 0.3,  max: 0.95, step: 0.01, def: 0.68 },
  { key: 'eye',        label: 'Высота глаз',         min: -0.9, max: 0.9,  step: 0.01, def: 0 },
  { key: 'jaw_start',  label: 'Начало челюсти',      min: -60,  max: 60,   step: 1,    def: 0,  unit: '°' },
  { key: 'jaw_len',    label: 'Длина челюсти',       min: 0,    max: 1.2,  step: 0.01, def: 0.4 },
  { key: 'jaw_tilt',   label: 'Наклон челюсти',      min: -40,  max: 70,   step: 1,    def: 10, unit: '°' },
  { key: 'jaw_x',      label: 'Ширина эла',          min: 0.2,  max: 0.95, step: 0.01, def: 0.62 },
  { key: 'chin_len',   label: 'Высота подбородка',   min: 0.5,  max: 1.5,  step: 0.01, def: 1 },
  { key: 'chin_front', label: 'Выступ подбородка',   min: 0.4,  max: 1.4,  step: 0.01, def: 0.85 },
  { key: 'chin_w',     label: 'Ширина подбородка',   min: 0.03, max: 0.6,  step: 0.01, def: 0.22 },
  { key: 'chin_round', label: 'Округлость',          min: 0,    max: 1,    step: 0.01, def: 0.5 },
];

let params = {};
SHAPE_PARAMS.forEach(p => params[p.key] = p.def);

function makeBall({ cut, r0, top = 1 }) {
  const width = cut / Math.sqrt(1 - r0 * r0);
  return {
    width, cut, r0, top,
    sz: (z) => (z > 0 ? top : 1),
  };
}

function rounded(items, radius) {
  const pts0 = [];
  for (const it of items) {
    if (!pts0.length || len(sub(it.p, pts0[pts0.length - 1].p)) > 1e-6) pts0.push(it);
  }
  if (pts0.length < 3) return { pts: pts0.map((it) => it.p), corners: [] };
  const out = [pts0[0].p];
  const corners = [];
  for (let i = 1; i < pts0.length - 1; i++) {
    const P = pts0[i - 1].p, V = pts0[i].p, N = pts0[i + 1].p;
    const kk = pts0[i].k ?? 0;
    const d1 = sub(V, P), d2 = sub(N, V);
    const L1 = len(d1), L2 = len(d2);
    const u1 = norm(d1), u2 = norm(d2);
    const cos = Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1] + u1[2] * u2[2]));
    const turn = Math.acos(cos);
    if (turn < 1e-3) { out.push(V); corners.push({ v: V, p: V }); continue; }
    const base = radius * Math.tan(Math.min(turn, Math.PI * 0.95) / 2);
    const t1 = Math.min(Math.max(base, kk * 0.5 * L1), L1 * 0.5);
    const t2 = Math.min(Math.max(base, kk * 0.5 * L2), L2 * 0.5);
    const T1 = [V[0] - u1[0] * t1, V[1] - u1[1] * t1, V[2] - u1[2] * t1];
    const T2 = [V[0] + u2[0] * t2, V[1] + u2[1] * t2, V[2] + u2[2] * t2];
    const STEPS = 2 * (3 + Math.round(kk * 9));
    for (let j = 0; j <= STEPS; j++) {
      const s = j / STEPS, a = (1 - s) * (1 - s), b = 2 * s * (1 - s), c = s * s;
      out.push([a * T1[0] + b * V[0] + c * T2[0], a * T1[1] + b * V[1] + c * T2[1], a * T1[2] + b * V[2] + c * T2[2]]);
    }
    corners.push({ v: V, p: [0.25 * T1[0] + 0.5 * V[0] + 0.25 * T2[0], 0.25 * T1[1] + 0.5 * V[1] + 0.25 * T2[1], 0.25 * T1[2] + 0.5 * V[2] + 0.25 * T2[2]] });
  }
  out.push(pts0[pts0.length - 1].p);
  return { pts: out, corners };
}

function buildHead(p) {
  const ball = makeBall(p);
  const { width, cut, r0 } = ball;

  const zEye = p.eye * r0;
  const zChin = -r0 - r0 * p.chin_len;
  const xPlane = cut;

  const lines = [];
  const labels = {};

  // 1. Меридиан (вертикальная ось)
  lines.push({ id: '1', color: 'red', closed: false, pts: [[0, -r0, -r0 * p.top], [0, -r0, r0 * p.top]] });
  labels['1'] = [{ p: [0, -r0, r0 * p.top * 0.8] }];

  // 2. Линия глаз
  lines.push({ id: '2', color: 'red', closed: false, pts: [[-xPlane, -r0, zEye], [xPlane, -r0, zEye]] });
  labels['2'] = [{ p: [xPlane, -r0, zEye] }];

  // 3. Боковые круги (проекция)
  for (const sx of [1, -1]) {
    const x = sx * xPlane;
    const circle = [];
    for (let i = 0; i < 64; i++) {
      const t = (i / 64) * Math.PI * 2;
      circle.push([x, r0 * Math.cos(t), r0 * Math.sin(t) * (Math.sin(t) > 0 ? p.top : 1)]);
    }
    lines.push({ id: '3', color: 'red', closed: true, pts: circle });
  }
  labels['3'] = [{ p: [xPlane, -r0 * 0.7, r0 * 0.7] }];

  // 7. Челюсть
  const A = [xPlane, -r0 * Math.cos(rad(-90 - p.jaw_start)), r0 * Math.sin(rad(-90 - p.jaw_start))];
  const tilt = rad(p.jaw_tilt);
  const B = [p.jaw_x, A[1], A[2] - p.jaw_len * Math.cos(tilt)];
  const Cf = [p.chin_w, -p.chin_front, zChin];
  const k = p.chin_round;

  const jaw = rounded([
    { p: A }, { p: B, k: 0 }, { p: Cf, k },
    { p: mirror(Cf), k }, { p: mirror(B), k: 0 }, { p: mirror(A) },
  ], 0.05);

  lines.push({ id: '7', color: 'blue', closed: false, pts: jaw.pts });
  labels['7'] = [{ p: B }, { p: mirror(B) }];

  // 8. Щеки
  const CfR = jaw.corners.find(c => Math.abs(c.v[0] - Cf[0]) < 1e-6 && Math.abs(c.v[2] - Cf[2]) < 1e-6)?.p ?? Cf;
  const eyeEdge = [xPlane, -r0, zEye];
  lines.push({ id: '8', color: 'blue', closed: false, pts: [CfR, eyeEdge] });
  lines.push({ id: '8', color: 'blue', closed: false, pts: [mirror(CfR), mirror(eyeEdge)] });
  labels['8'] = [{ p: lerp(CfR, eyeEdge, 0.5) }];

  // 6. Центр лица
  const front = [0, -r0, zEye];
  const chinMid = [0, -p.chin_front, zChin];
  lines.push({ id: '6', color: 'red', closed: false, pts: [front, chinMid] });
  labels['6'] = [{ p: lerp(front, chinMid, 0.8) }];

  // Череп — эллипс по формуле (X = width * sin, Z = cos)
  const skullPts = [];
  for (let i = 0; i < 64; i++) {
    const t = (i / 64) * Math.PI * 2;
    const x = width * Math.sin(t);
    const z = Math.cos(t) * (Math.cos(t) > 0 ? p.top : 1);
    skullPts.push([x, 0, z]);
  }

  return { lines, labels, skullPts };
}

// ================= ПРОЕКЦИЯ В 2D =================
function project(pt, scale, cx, cy) {
  // pt = [X, Y, Z]. X - ширина, Z - высота, Y - глубина (игнорируем для вида спереди).
  return { x: cx + pt[0] * scale, y: cy - pt[2] * scale };
}

const LABELS = { '1': '①', '2': '②', '3': '③', '6': '⑥', '7': '⑦', '8': '⑧' };
const labelEls = {};
Object.keys(LABELS).forEach(id => {
  const el = document.createElement('div');
  el.className = `guide-label label-${['1','2','6'].includes(id) ? 'red' : 'blue'}`;
  el.textContent = LABELS[id];
  el.style.display = 'none';
  labelLayer.appendChild(el);
  labelEls[id] = el;
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20;
  const top = pad;
  const height = canvas.height - pad * 2;
  const parts = 7;
  const step = height / parts;

  // Масштаб: R=1. 1 часть = 2 единицы (диаметр).
  const scale = step / 2;
  const cx = canvas.width / 2;
  const cy = top + step;

  // Сетка
  ctx.strokeStyle = '#3a3a46'; ctx.lineWidth = 1;
  ctx.font = '11px system-ui'; ctx.fillStyle = '#8a8a99';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(canvas.width - 20, y); ctx.stroke();
    if (i < parts) ctx.fillText(i + 1, canvas.width - 40, y + step / 2);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, canvas.height - pad); ctx.stroke(); ctx.setLineDash([]);

  const head = buildHead(params);

  // Череп
  ctx.beginPath();
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 2;
  head.skullPts.forEach((pt, i) => {
    const p = project(pt, scale, cx, cy);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.stroke();

  // Линии
  head.lines.forEach(line => {
    ctx.beginPath();
    ctx.strokeStyle = line.color === 'red' ? '#f03e6e' : '#3b7cff';
    ctx.lineWidth = 2;
    line.pts.forEach((pt, i) => {
      const p = project(pt, scale, cx, cy);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    if (line.closed) ctx.closePath();
    ctx.stroke();
  });

  // Шея
  const chinPt = project(head.labels['6'][0].p, scale, cx, cy);
  const neckW = 60;
  const neckL = 120;
  ctx.fillStyle = 'rgba(232,176,75,0.1)';
  ctx.strokeStyle = '#e8b04b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(chinPt.x - neckW / 2, chinPt.y);
  ctx.lineTo(chinPt.x - neckW / 2, chinPt.y + neckL);
  ctx.lineTo(chinPt.x + neckW / 2, chinPt.y + neckL);
  ctx.lineTo(chinPt.x + neckW / 2, chinPt.y);
  ctx.fill(); ctx.stroke();

  // Метки
  Object.keys(labelEls).forEach(id => { labelEls[id].style.display = 'none'; });
  Object.entries(head.labels).forEach(([id, cands]) => {
    if (!cands || cands.length === 0) return;
    const p = project(cands[0].p, scale, cx, cy);
    const el = labelEls[id];
    if (!el) return;
    el.style.display = 'block';
    el.style.transform = `translate(${p.x + 15}px, ${p.y - 15}px) translate(-50%, -50%)`;
  });
}

// ================= UI =================
const controlsHost = document.getElementById('controls');
SHAPE_PARAMS.forEach(p => {
  const row = document.createElement('div');
  row.className = 'control';
  row.innerHTML = `
    <div class="control-head">
      <label>${p.label}</label>
      <span class="badge" id="val-${p.key}">${p.def.toFixed(2)}</span>
    </div>
    <input id="range-${p.key}" type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}">
  `;
  controlsHost.appendChild(row);

  const input = row.querySelector('input');
  const badge = row.querySelector('.badge');
  
  const updateFill = () => {
    const val = parseFloat(input.value);
    const pct = ((val - p.min) / (p.max - p.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
    badge.textContent = p.unit ? `${Math.round(val)}${p.unit}` : val.toFixed(2);
  };
  
  input.addEventListener('input', () => {
    params[p.key] = parseFloat(input.value);
    updateFill();
    draw();
  });
  
  updateFill();
});

const actions = document.createElement('div');
actions.className = 'actions';
actions.innerHTML = `<button class="btn-reset" id="btnReset">Сбросить</button>`;
controlsHost.appendChild(actions);

document.getElementById('btnReset').addEventListener('click', () => {
  SHAPE_PARAMS.forEach(p => {
    params[p.key] = p.def;
    const input = document.getElementById(`range-${p.key}`);
    const badge = document.getElementById(`val-${p.key}`);
    input.value = p.def;
    const pct = ((p.def - p.min) / (p.max - p.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
    badge.textContent = p.unit ? `${Math.round(p.def)}${p.unit}` : p.def.toFixed(2);
  });
  draw();
});

draw();
</script>
</body>
</html>
