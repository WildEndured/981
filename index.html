<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Обтекающая штриховка вокруг персонажа</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: center; padding: 10px 14px;
    background: #1d2027; border-radius: 10px; max-width: 100%;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; max-width: 160px; }
  input[type="color"] {
    width: 32px; height: 24px; border: none; border-radius: 4px;
    background: none; cursor: pointer; padding: 0;
  }
  button {
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid #333a44; background: #232830; color: #e6e6e6;
    cursor: pointer;
  }
  button:hover { background: #2c323c; }
  button.active { background: #2b6cb0; border-color: #2b6cb0; }
  .stage {
    position: relative; display: inline-block;
    border: 1px solid #2b2f37; background: #0b0c0f; line-height: 0;
  }
  .stage canvas {
    display: block; max-width: min(92vw, 900px); height: auto;
    cursor: crosshair;
  }
  .stage canvas#overlay {
    position: absolute; inset: 0; pointer-events: none;
  }
  .hint {
    font-size: 12px; color: #8b93a1; max-width: 780px;
    text-align: center; line-height: 1.5;
  }
  .bg-swatch {
    display: inline-block; width: 14px; height: 14px;
    border: 1px solid #555; border-radius: 3px; vertical-align: middle;
  }
  @media (max-width: 600px) {
    input[type="range"] { width: 120px; height: 24px; }
    .controls { flex-direction: column; align-items: stretch; }
    .stage canvas { max-width: 96vw; }
  }
</style>
</head>
<body>

<h1>Обтекающая штриховка вокруг персонажа</h1>

<div class="controls">
  <label>Изображение:
    <input id="file" type="file" accept="image/*" />
  </label>

  <label>Порог фона:
    <input id="bgTol" type="range" min="5" max="120" value="15" />
    <span id="bgTolVal">15</span>
  </label>

  <label>Плотность у контура:
    <input id="step" type="range" min="2" max="20" value="5" />
    <span id="stepVal">5</span>
  </label>

  <label>Затухание:
    <input id="falloff" type="range" min="0" max="3" step="0.1" value="0.6" />
    <span id="falloffVal">0.6</span>
  </label>

  <label>Толщина:
    <input id="thickness" type="range" min="0.3" max="3" step="0.1" value="1" />
    <span id="thicknessVal">1</span>
  </label>

  <label>Прозрачность:
    <input id="alpha" type="range" min="0.1" max="1" step="0.05" value="0.7" />
    <span id="alphaVal">0.7</span>
  </label>

  <label>Цвет:
    <input id="color" type="color" value="#1e4a8a" />
  </label>

  <label>
    <input id="showGrid" type="checkbox" checked />
    Разметка 4 части
  </label>

  <label>
    <input id="showMaskBg" type="checkbox" />
    Маска фона
  </label>

  <label>
    <input id="showMaskChar" type="checkbox" />
    Маска персонажа
  </label>

  <button id="pickBg">🎯 Фон кликом</button>
  <button id="reset">↺ Сброс</button>

  <span>Фон: <span id="bgSwatch" class="bg-swatch" style="background:#888"></span>
    <span id="bgRGB">—</span></span>
</div>

<div class="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<p class="hint">
  Фон определяется автоматически как самый частый цвет изображения.
  Порог фона подбирается автоматически — так, чтобы светлая кожа
  не попадала в маску фона.
</p>

<script>
const fileInput      = document.getElementById('file');
const baseCanvas     = document.getElementById('base');
const overlay        = document.getElementById('overlay');
const bgTolEl        = document.getElementById('bgTol');
const stepEl         = document.getElementById('step');
const falloffEl      = document.getElementById('falloff');
const thicknessEl    = document.getElementById('thickness');
const alphaEl        = document.getElementById('alpha');
const colorEl        = document.getElementById('color');
const showGridEl     = document.getElementById('showGrid');
const showMaskBgEl   = document.getElementById('showMaskBg');
const showMaskCharEl = document.getElementById('showMaskChar');
const bgTolVal       = document.getElementById('bgTolVal');
const stepVal        = document.getElementById('stepVal');
const falloffVal     = document.getElementById('falloffVal');
const thicknessVal   = document.getElementById('thicknessVal');
const alphaVal       = document.getElementById('alphaVal');
const pickBgBtn      = document.getElementById('pickBg');
const resetBtn       = document.getElementById('reset');
const bgSwatch       = document.getElementById('bgSwatch');
const bgRGB          = document.getElementById('bgRGB');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imageData = null;
let imgWidth = 0, imgHeight = 0;
let srcImage = null;
let bgColor = { r: 255, g: 255, b: 255 };
let isBg = null;
let distMap = null;
let pickBgMode = false;

// ---------- Загрузка ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    srcImage  = img;
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width = imgWidth; c.height = imgHeight;
    });

    baseCtx.clearRect(0, 0, imgWidth, imgHeight);
    baseCtx.drawImage(img, 0, 0);
    imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);

    detectBgColor();
    autoPickThreshold();
    updateBgUI();
    buildMask();
    buildDistanceMap();
    drawGrid();
    redrawOverlay();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- Автоопределение цвета фона ----------
// Самый частый цвет среди всех пикселей (квантование 5 бит на канал).
function detectBgColor() {
  const d = imageData.data;
  const w = imgWidth, h = imgHeight;
  const N = w * h;

  const SHIFT = 3;
  const buckets = new Map();
  let total = 0;

  const stepPx = Math.max(1, Math.round(Math.sqrt(N / 250000)));
  for (let y = 0; y < h; y += stepPx) {
    for (let x = 0; x < w; x += stepPx) {
      const i = (y * w + x) * 4;
      const a = d[i + 3];
      if (a < 20) continue;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const key = ((r >> SHIFT) << 10) | ((g >> SHIFT) << 5) | (b >> SHIFT);
      let e = buckets.get(key);
      if (!e) { e = { n: 0, r: 0, g: 0, b: 0 }; buckets.set(key, e); }
      e.n++; e.r += r; e.g += g; e.b += b;
      total++;
    }
  }

  if (total === 0) { bgColor = { r: 255, g: 255, b: 255 }; return; }

  let best = null;
  for (const e of buckets.values()) {
    if (!best || e.n > best.n) best = e;
  }
  const br = best.r / best.n, bg = best.g / best.n, bb = best.b / best.n;
  const qbr = Math.round(br) >> SHIFT;
  const qbg = Math.round(bg) >> SHIFT;
  const qbb = Math.round(bb) >> SHIFT;

  let sr = 0, sg = 0, sb = 0, sn = 0;
  for (const [key, e] of buckets) {
    const qr = (key >> 10) & 31;
    const qg = (key >> 5)  & 31;
    const qb =  key        & 31;
    if (Math.abs(qr - qbr) <= 1 && Math.abs(qg - qbg) <= 1 && Math.abs(qb - qbb) <= 1) {
      sr += e.r; sg += e.g; sb += e.b; sn += e.n;
    }
  }
  bgColor = { r: Math.round(sr / sn), g: Math.round(sg / sn), b: Math.round(sb / sn) };
}

// ---------- Автоподбор порога фона ----------
// Идея: у фона и у кожи похожие цвета, но фон "плотнее". Считаем
// распределение квадратов расстояний от цвета фона среди пикселей
// и находим первый "провал" в распределении — там где фон заканчивается.
// Это эвристика, но она даёт разумный порог за один проход.
function autoPickThreshold() {
  const d = imageData.data;
  const w = imgWidth, h = imgHeight;
  const N = w * h;

  const stepPx = Math.max(1, Math.round(Math.sqrt(N / 200000)));
  const dists = [];

  for (let y = 0; y < h; y += stepPx) {
    for (let x = 0; x < w; x += stepPx) {
      const i = (y * w + x) * 4;
      if (d[i + 3] < 20) continue;
      const dr = d[i]     - bgColor.r;
      const dg = d[i + 1] - bgColor.g;
      const db = d[i + 2] - bgColor.b;
      const dist2 = dr * dr + dg * dg + db * db;
      dists.push(dist2);
    }
  }
  if (!dists.length) return;

  dists.sort((a, b) => a - b);

  // Ищем точку, где накопленная кривая перестаёт быстро расти.
  // Это значит: большая часть "фона" сосредоточена в начале.
  // Возьмём 30-й процентиль от конца пикселей и переведём в порог.
  const idx = Math.floor(dists.length * 0.30);
  const ref = dists[idx];

  // Порог по RGB: sqrt(ref / 3), округляем и зажимаем в [6..60].
  let tol = Math.round(Math.sqrt(ref / 3));
  if (tol < 6)  tol = 6;
  if (tol > 60) tol = 60;

  bgTolEl.value = tol;
  bgTolVal.textContent = tol;
}

function updateBgUI() {
  const { r, g, b } = bgColor;
  bgSwatch.style.background = `rgb(${r|0},${g|0},${b|0})`;
  bgRGB.textContent = `${r|0}, ${g|0}, ${b|0}`;
}

// ---------- Маска: 1 = фон, 0 = персонаж ----------
function buildMask() {
  const w = imgWidth, h = imgHeight;
  const d = imageData.data;
  const tol = +bgTolEl.value;
  const tol2 = tol * tol * 3;

  isBg = new Uint8Array(w * h);

  const looksLikeBg = (x, y) => {
    const i = (y * w + x) * 4;
    if (d[i + 3] < 20) return true;
    const dr = d[i]     - bgColor.r;
    const dg = d[i + 1] - bgColor.g;
    const db = d[i + 2] - bgColor.b;
    return (dr * dr + dg * dg + db * db) < tol2;
  };

  const visited = new Uint8Array(w * h);

  const floodFrom = (sx, sy) => {
    const queue = [sy * w + sx];
    visited[sy * w + sx] = 1;
    isBg[sy * w + sx] = 1;
    let head = 0;
    while (head < queue.length) {
      const idx = queue[head++];
      const x = idx % w;
      const y = (idx / w) | 0;

      const tryPush = (nx, ny) => {
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) return;
        const nIdx = ny * w + nx;
        if (visited[nIdx]) return;
        if (!looksLikeBg(nx, ny)) return;
        visited[nIdx] = 1;
        isBg[nIdx] = 1;
        queue.push(nIdx);
      };
      tryPush(x + 1, y);
      tryPush(x - 1, y);
      tryPush(x, y + 1);
      tryPush(x, y - 1);
    }
  };

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (visited[idx]) continue;
      if (!looksLikeBg(x, y)) continue;
      floodFrom(x, y);
    }
  }
}

// ---------- Карта расстояний от фона до силуэта (BFS) ----------
function buildDistanceMap() {
  const w = imgWidth, h = imgHeight;
  distMap = new Int32Array(w * h).fill(-1);

  const queue = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (!isBg[idx]) continue;
      let nearChar = false;
      if (x > 0     && !isBg[idx - 1]) nearChar = true;
      else if (x < w - 1 && !isBg[idx + 1]) nearChar = true;
      else if (y > 0     && !isBg[idx - w]) nearChar = true;
      else if (y < h - 1 && !isBg[idx + w]) nearChar = true;
      if (nearChar) {
        distMap[idx] = 1;
        queue.push(idx);
      }
    }
  }

  let head = 0;
  while (head < queue.length) {
    const idx = queue[head++];
    const x = idx % w;
    const y = (idx / w) | 0;
    const cd = distMap[idx];

    const tryPush = (nx, ny) => {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) return;
      const nIdx = ny * w + nx;
      if (!isBg[nIdx]) return;
      if (distMap[nIdx] !== -1) return;
      distMap[nIdx] = cd + 1;
      queue.push(nIdx);
    };
    tryPush(x + 1, y);
    tryPush(x - 1, y);
    tryPush(x, y + 1);
    tryPush(x, y - 1);
  }
}

// ---------- Разметка на 4 части ----------
function drawGrid() {
  if (!imageData) return;
  baseCtx.clearRect(0, 0, imgWidth, imgHeight);
  baseCtx.drawImage(srcImage, 0, 0);

  if (!showGridEl.checked) return;

  baseCtx.save();
  baseCtx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
  baseCtx.lineWidth = Math.max(2, Math.round(imgWidth / 400));
  baseCtx.setLineDash([12, 8]);
  const mx = imgWidth / 2, my = imgHeight / 2;
  baseCtx.beginPath(); baseCtx.moveTo(mx, 0); baseCtx.lineTo(mx, imgHeight); baseCtx.stroke();
  baseCtx.beginPath(); baseCtx.moveTo(0, my); baseCtx.lineTo(imgWidth, my); baseCtx.stroke();
  baseCtx.restore();
}

// ---------- Обтекающая штриховка + две маски ----------
function redrawOverlay() {
  if (!imageData || !distMap) return;

  const step0     = +stepEl.value;
  const falloff   = +falloffEl.value;
  const thickness = +thicknessEl.value;
  const alpha     = +alphaEl.value;
  const hex       = colorEl.value;

  const w = imgWidth, h = imgHeight;
  overlayCtx.clearRect(0, 0, w, h);

  if (showMaskBgEl.checked || showMaskCharEl.checked) {
    const mask = overlayCtx.createImageData(w, h);
    const md = mask.data;
    for (let i = 0; i < w * h; i++) {
      const j = i * 4;
      if (showMaskBgEl.checked && isBg[i] === 1) {
        md[j] = 255; md[j + 1] = 60; md[j + 2] = 60; md[j + 3] = 100;
      } else if (showMaskCharEl.checked && isBg[i] === 0) {
        md[j] = 60;  md[j + 1] = 220; md[j + 2] = 120; md[j + 3] = 120;
      }
    }
    overlayCtx.putImageData(mask, 0, 0);
  }

  const rr = parseInt(hex.slice(1, 3), 16);
  const gg = parseInt(hex.slice(3, 5), 16);
  const bb = parseInt(hex.slice(5, 7), 16);

  const thresholds = [];
  let d = step0;
  let add = step0;
  while (d < Math.max(w, h)) {
    thresholds.push(d);
    add = Math.max(1, add + falloff);
    d += Math.round(add);
  }

  const maxDist = thresholds.length ? thresholds[thresholds.length - 1] : 0;
  const linePx = Math.max(1, Math.round(thickness));
  const isLine = new Uint8Array(maxDist + 2);
  for (let i = 0; i < thresholds.length; i++) {
    const t = thresholds[i];
    for (let k = 0; k < linePx; k++) {
      if (t - k >= 0 && t - k < isLine.length) isLine[t - k] = 1;
    }
  }

  const img = overlayCtx.getImageData(0, 0, w, h);
  const data = img.data;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      const dist = distMap[idx];
      if (dist <= 0) continue;
      if (dist >= isLine.length) continue;
      if (!isLine[dist]) continue;

      const j = idx * 4;
      data[j] = rr; data[j + 1] = gg; data[j + 2] = bb;
      data[j + 3] = Math.round(alpha * 255);
    }
  }

  overlayCtx.putImageData(img, 0, 0);
}

// ---------- Ручной выбор цвета фона ----------
pickBgBtn.addEventListener('click', () => {
  pickBgMode = !pickBgMode;
  pickBgBtn.classList.toggle('active', pickBgMode);
});

baseCanvas.addEventListener('click', e => {
  if (!pickBgMode || !imageData) return;
  const rect = baseCanvas.getBoundingClientRect();
  const scaleX = imgWidth / rect.width;
  const scaleY = imgHeight / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX);
  const y = Math.floor((e.clientY - rect.top)  * scaleY);
  const i = (y * imgWidth + x) * 4;
  const d = imageData.data;
  bgColor = { r: d[i], g: d[i + 1], b: d[i + 2] };
  autoPickThreshold();
  updateBgUI();
  buildMask();
  buildDistanceMap();
  redrawOverlay();
  pickBgMode = false;
  pickBgBtn.classList.remove('active');
});

// ---------- Сброс ----------
resetBtn.addEventListener('click', () => {
  bgTolEl.value = 15;    bgTolVal.textContent     = 15;
  stepEl.value  = 5;     stepVal.textContent      = 5;
  falloffEl.value = 0.6; falloffVal.textContent   = 0.6;
  thicknessEl.value = 1; thicknessVal.textContent = 1;
  alphaEl.value = 0.7;   alphaVal.textContent     = 0.7;
  colorEl.value = '#1e4a8a';
  showGridEl.checked = true;
  showMaskBgEl.checked = false;
  showMaskCharEl.checked = false;
  if (imageData) {
    detectBgColor();
    autoPickThreshold();
    updateBgUI();
    buildMask();
    buildDistanceMap();
    drawGrid();
    redrawOverlay();
  }
});

// ---------- Реакции на контролы ----------
bgTolEl.addEventListener('input', () => {
  bgTolVal.textContent = bgTolEl.value;
  if (imageData) { buildMask(); buildDistanceMap(); redrawOverlay(); }
});
stepEl.addEventListener('input', () => {
  stepVal.textContent = stepEl.value;
  redrawOverlay();
});
falloffEl.addEventListener('input', () => {
  falloffVal.textContent = falloffEl.value;
  redrawOverlay();
});
thicknessEl.addEventListener('input', () => {
  thicknessVal.textContent = thicknessEl.value;
  redrawOverlay();
});
alphaEl.addEventListener('input', () => {
  alphaVal.textContent = alphaEl.value;
  redrawOverlay();
});
colorEl.addEventListener('input', redrawOverlay);
showGridEl.addEventListener('change', drawGrid);
showMaskBgEl.addEventListener('change', redrawOverlay);
showMaskCharEl.addEventListener('change', redrawOverlay);
</script>

</body>
</html>
