<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Разметка на 4 части + штриховка до контура</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 14px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    background: #1d2027;
    border-radius: 10px;
  }
  .controls label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 13px; }
  .stage {
    position: relative;
    display: inline-block;
    border: 1px solid #2b2f37;
    background: #0b0c0f;
    line-height: 0;
  }
  .stage canvas {
    display: block;
    max-width: min(90vw, 900px);
    height: auto;
  }
  .stage canvas#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hint { font-size: 12px; color: #8b93a1; max-width: 700px; text-align: center; }
</style>
</head>
<body>

<h1>Загрузите изображение персонажа</h1>

<div class="controls">
  <label>Изображение:
    <input id="file" type="file" accept="image/*" />
  </label>
  <label>Порог контура:
    <input id="threshold" type="range" min="20" max="200" value="90" />
    <span id="thresholdVal">90</span>
  </label>
  <label>Шаг штриховки:
    <input id="step" type="range" min="2" max="20" value="6" />
    <span id="stepVal">6</span>
  </label>
  <label>
    <input id="showGrid" type="checkbox" checked />
    Показать разметку на 4 части
  </label>
</div>

<div class="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<p class="hint">
  Штриховка идёт от краёв к центру и останавливается, когда встречает тёмный пиксель —
  то есть line art персонажа. Порог яркости и шаг штриховки можно регулировать.
</p>

<script>
const fileInput   = document.getElementById('file');
const baseCanvas  = document.getElementById('base');
const overlay     = document.getElementById('overlay');
const thresholdEl = document.getElementById('threshold');
const stepEl      = document.getElementById('step');
const showGridEl  = document.getElementById('showGrid');
const thresholdVal= document.getElementById('thresholdVal');
const stepVal     = document.getElementById('stepVal');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imageData   = null;   // ImageData исходного изображения
let imgWidth = 0, imgHeight = 0;
let srcImage = null;

// ---------- Шаг 1: загрузка изображения ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    srcImage  = img;
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    // размеры канвасов
    [baseCanvas, overlay].forEach(c => {
      c.width  = imgWidth;
      c.height = imgHeight;
    });

    // рисуем изображение и сохраняем пиксели
    baseCtx.clearRect(0, 0, imgWidth, imgHeight);
    baseCtx.drawImage(img, 0, 0);
    imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);

    // Шаг 2: разметка на 4 части
    drawGrid();

    // Шаг 3: слой штриховки
    drawHatching();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- Шаг 2: разметка на 4 части ----------
function drawGrid() {
  if (!imageData) return;
  // перерисовываем базовый слой: изображение + линии
  baseCtx.clearRect(0, 0, imgWidth, imgHeight);
  baseCtx.drawImage(srcImage, 0, 0);

  if (!showGridEl.checked) return;

  baseCtx.save();
  baseCtx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
  baseCtx.lineWidth = Math.max(2, Math.round(imgWidth / 400));
  baseCtx.setLineDash([12, 8]);

  const mx = imgWidth / 2;
  const my = imgHeight / 2;

  // вертикальная линия
  baseCtx.beginPath();
  baseCtx.moveTo(mx, 0);
  baseCtx.lineTo(mx, imgHeight);
  baseCtx.stroke();

  // горизонтальная линия
  baseCtx.beginPath();
  baseCtx.moveTo(0, my);
  baseCtx.lineTo(imgWidth, my);
  baseCtx.stroke();

  baseCtx.restore();
}

// ---------- проверка "тёмный ли пиксель" (line art) ----------
function isDark(x, y, threshold) {
  if (x < 0 || y < 0 || x >= imgWidth || y >= imgHeight) return true;
  const i = (y * imgWidth + x) * 4;
  const d = imageData.data;
  const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3];
  if (a < 20) return false; // прозрачное — не контур
  // воспринимаемая яркость
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  return lum < threshold;
}

// ---------- Шаг 3 + 4: штриховка от краёв к центру до контура ----------
function drawHatching() {
  if (!imageData) return;

  const threshold = +thresholdEl.value;
  const step      = +stepEl.value;

  overlayCtx.clearRect(0, 0, imgWidth, imgHeight);

  const cx = imgWidth / 2;
  const cy = imgHeight / 2;

  overlayCtx.save();
  overlayCtx.strokeStyle = 'rgba(80, 200, 255, 0.85)';
  overlayCtx.lineWidth = 1;

  const maxLen = Math.hypot(cx, cy);

  // Горизонтальные линии: слева и справа к центру
  for (let y = 0; y < imgHeight; y += step) {
    // слева → к центру: стоп у первого тёмного пикселя
    let xL = 0;
    while (xL < cx && !isDark(xL, y, threshold)) xL++;
    if (xL > 0) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(0, y);
      overlayCtx.lineTo(xL, y);
      overlayCtx.stroke();
    }

    // справа → к центру
    let xR = imgWidth - 1;
    while (xR > cx && !isDark(xR, y, threshold)) xR--;
    if (xR < imgWidth - 1) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(imgWidth, y);
      overlayCtx.lineTo(xR, y);
      overlayCtx.stroke();
    }
  }

  // Вертикальные линии: сверху и снизу к центру
  for (let x = 0; x < imgWidth; x += step) {
    // сверху → к центру
    let yT = 0;
    while (yT < cy && !isDark(x, yT, threshold)) yT++;
    if (yT > 0) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(x, 0);
      overlayCtx.lineTo(x, yT);
      overlayCtx.stroke();
    }

    // снизу → к центру
    let yB = imgHeight - 1;
    while (yB > cy && !isDark(x, yB, threshold)) yB--;
    if (yB < imgHeight - 1) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(x, imgHeight);
      overlayCtx.lineTo(x, yB);
      overlayCtx.stroke();
    }
  }

  overlayCtx.restore();
}

// ---------- перерисовка при изменении параметров ----------
thresholdEl.addEventListener('input', () => {
  thresholdVal.textContent = thresholdEl.value;
  drawHatching();
});
stepEl.addEventListener('input', () => {
  stepVal.textContent = stepEl.value;
  drawHatching();
});
showGridEl.addEventListener('change', drawGrid);
</script>

</body>
</html>
