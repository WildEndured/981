<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Этап 1 · Умный захват фона</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a; --panel: #1d2027; --panel-2: #14161a;
    --border: #2b2f37; --accent: #2b6cb0;
    --text: #e6e6e6; --muted: #8b93a1; --muted-2: #b9c3d1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 8px 8px 40px; gap: 10px; min-height: 100vh; }
  .topbar {
    width: 100%; max-width: 1100px; display: flex; gap: 6px; align-items: center;
    background: var(--panel); border-radius: 12px; padding: 6px 8px; overflow-x: auto; scrollbar-width: none;
  }
  .topbar::-webkit-scrollbar { display: none; }
  .topbar .file-label {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    padding: 0 12px; height: 38px; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .topbar input[type="file"] { display: none; }
  .topbar button {
    flex-shrink: 0; height: 38px; padding: 0 12px; font-size: 13px;
    border-radius: 8px; border: 1px solid #333a44; background: #232830; color: var(--text); cursor: pointer;
  }
  .topbar button:hover, .topbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stage-wrap {
    position: relative; width: min(96vw, 1100px); height: min(70vh, 800px);
    background: #0b0c0f; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: grab;
  }
  .stage-wrap.dragging { cursor: grabbing; }
  .stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; line-height: 0; will-change: transform; }
  .stage canvas { display: block; }
  .stage canvas#overlay { position: absolute; inset: 0; pointer-events: none; }
  
  .progress-overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.6); z-index: 10; font-size: 14px; color: #fff; gap: 12px;
  }
  .progress-overlay.visible { display: flex; }
  .spinner { width: 22px; height: 22px; border: 3px solid #444; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .panel { width: 100%; max-width: 1100px; background: var(--panel); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); text-transform: uppercase; }
  .panel-section { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .panel-section h3 { margin: 0 0 10px; font-size: 13px; color: #ffcc00; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  input[type="range"] { width: 100%; height: 28px; background: transparent; -webkit-appearance: none; }
  input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: #2b2f37; border-radius: 3px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; margin-top: -8px; cursor: pointer; }
  .slider-row { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
  .label-line { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted-2); }
  .seg { display: inline-flex; border: 1px solid #333a44; border-radius: 8px; overflow: hidden; }
  .seg button { background: #232830; color: var(--text); border: none; padding: 0 12px; height: 30px; font-size: 12px; cursor: pointer; border-right: 1px solid #333a44; }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<div class="topbar">
  <label class="file-label">📷 Файл <input id="file" type="file" accept="image/*" /></label>
  <button id="modeLum" class="active">Яркость</button>
  <button id="modeColor">Цвет (HSV)</button>
  <button id="autoThresholdBtn">⚡ Авто</button>
  <button id="pickBgColorBtn">🎨 Пипетка</button>
  <button id="addPointBtn">🎯 Точка</button>
  <button id="toggleImageBtn">👁 Маска</button>
  <button id="exportMaskBtn">💾 Маска</button>
</div>

<div class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage">
    <canvas id="base"></canvas>
    <canvas id="overlay"></canvas>
  </div>
  <div class="progress-overlay" id="progressOverlay"><div class="spinner"></div><span>Обработка…</span></div>
</div>

<div class="panel">
  <h2>Настройки захвата</h2>
  <div class="panel-section">
    <div class="seg" id="modeSeg">
      <button data-mode="lum" class="active">По яркости</button>
      <button data-mode="color">По цвету (HSV)</button>
    </div>
  </div>

  <div class="panel-section">
    <h3>Пороги</h3>
    <div class="slider-row" id="lumSliderRow">
      <div class="label-line"><span>Порог яркости</span><span id="bgLumVal">200</span></div>
      <input id="bgLum" type="range" min="0" max="255" value="200" />
    </div>
    <div class="slider-row" id="colorSliderRow" style="display:none;">
      <div class="label-line"><span>Порог насыщенности (S)</span><span id="bgSatVal">30</span></div>
      <input id="bgSat" type="range" min="1" max="255" value="30" />
    </div>
    <div class="slider-row">
      <div class="label-line"><span>Учет градиента (допуск)</span><span id="gradTolVal">15</span></div>
      <input id="gradTol" type="range" min="0" max="50" value="15" />
    </div>
  </div>

  <div class="panel-section">
    <h3>Постобработка</h3>
    <div class="row"><label><input id="useSmooth" type="checkbox" checked /> Сглаживание краев</label></div>
    <div class="slider-row">
      <div class="label-line"><span>Сила сглаживания</span><span id="smoothIterVal">1</span></div>
      <input id="smoothIter" type="range" min="0" max="4" value="1" />
    </div>
  </div>
</div>

<script>
// DOM
const fileInput = document.getElementById('file');
const baseCanvas = document.getElementById('base');
const overlay = document.getElementById('overlay');
const stageEl = document.getElementById('stage');
const stageWrap = document.getElementById('stageWrap');
const progressOverlay = document.getElementById('progressOverlay');

const bgLumEl = document.getElementById('bgLum');
const bgLumVal = document.getElementById('bgLumVal');
const bgSatEl = document.getElementById('bgSat');
const bgSatVal = document.getElementById('bgSatVal');
const gradTolEl = document.getElementById('gradTol');
const gradTolVal = document.getElementById('gradTolVal');
const useSmoothEl = document.getElementById('useSmooth');
const smoothIterEl = document.getElementById('smoothIter');
const smoothIterVal = document.getElementById('smoothIterVal');

const pickBgColorBtn = document.getElementById('pickBgColorBtn');
const toggleImageBtn = document.getElementById('toggleImageBtn');
const exportMaskBtn = document.getElementById('exportMaskBtn');
const modeSeg = document.getElementById('modeSeg');
const lumSliderRow = document.getElementById('lumSliderRow');
const colorSliderRow = document.getElementById('colorSliderRow');

const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });
const overlayCtx = overlay.getContext('2d');

let imgWidth = 0, imgHeight = 0;
let imgDataRef = null;
let isBg = null;
let bgCount = 0;

let mode = 'lum';
let hideImage = false;
let bgColorMode = false;
let pickColor = null; // {h, s, v} если выбрали пипеткой

// ZOOM / PAN
let zoom = 1, panX = 0, panY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0, dragStartPanX = 0, dragStartPanY = 0;

// WORKER
let worker = null;
let workerBusy = false;

function initWorker() {
  if (worker) return;
  worker = new Worker('worker.js');
  worker.onmessage = (e) => {
    const { type, payload } = e.data;
    if (type === 'mask') {
      isBg = payload.mask;
      bgCount = payload.bgCount;
      drawOverlay();
      workerBusy = false;
      progressOverlay.classList.remove('visible');
    } else if (type === 'error') {
      alert('Ошибка воркера: ' + payload);
      workerBusy = false;
      progressOverlay.classList.remove('visible');
    }
  };
  worker.onerror = (err) => { alert('Worker error'); workerBusy = false; progressOverlay.classList.remove('visible'); };
}

function rebuildAll() {
  if (!imgDataRef || !worker) return;
  if (workerBusy) return;
  workerBusy = true;
  progressOverlay.classList.add('visible');

  // Копируем данные для воркера
  const dataCopy = new Uint8ClampedArray(imgDataRef.data);

  worker.postMessage({
    type: 'build',
    payload: {
      imageData: { data: dataCopy, width: imgWidth, height: imgHeight },
      width: imgWidth, height: imgHeight,
      mode,
      thresholdLum: +bgLumEl.value,
      thresholdSat: +bgSatEl.value,
      gradTolerance: +gradTolEl.value,
      pickColor,
      useSmooth: useSmoothEl.checked,
      smoothIter: +smoothIterEl.value
    }
  });
}

// ============================================================
//  ЗАГРУЗКА
// ============================================================
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    imgWidth = img.naturalWidth; imgHeight = img.naturalHeight;
    [baseCanvas, overlay].forEach(c => { c.width = imgWidth; c.height = imgHeight; });
    baseCtx.drawImage(img, 0, 0);
    imgDataRef = baseCtx.getImageData(0, 0, imgWidth, imgHeight);
    pickColor = null;
    requestAnimationFrame(() => { fitToView(); rebuildAll(); });
  };
  img.src = URL.createObjectURL(file);
});

// ============================================================
//  ОВЕРЛЕЙ И UI
// ============================================================
function drawOverlay() {
  overlayCtx.clearRect(0, 0, imgWidth, imgHeight);
  if (isBg) {
    const img = overlayCtx.createImageData(imgWidth, imgHeight);
    const d = img.data;
    for (let i = 0, j = 0; i < imgWidth * imgHeight; i++, j += 4) {
      if (!isBg[i]) { d[j] = 255; d[j+1] = 60; d[j+2] = 60; d[j+3] = 120; } // Красная заливка на персонаже
    }
    overlayCtx.putImageData(img, 0, 0);
  }
}

function setMode(m) {
  mode = m;
  modeSeg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  lumSliderRow.style.display = m === 'lum' ? '' : 'none';
  colorSliderRow.style.display = m === 'color' ? '' : 'none';
  if (imgDataRef) rebuildAll();
}

modeSeg.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (btn) setMode(btn.dataset.mode);
});

// Пипетка
pickBgColorBtn.addEventListener('click', () => { bgColorMode = !bgColorMode; pickBgColorBtn.classList.toggle('active', bgColorMode); });

stageWrap.addEventListener('click', (e) => {
  if (!bgColorMode || !imgDataRef) return;
  const rect = stageEl.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / zoom);
  const y = Math.floor((e.clientY - rect.top) / zoom);
  if (x < 0 || y < 0 || x >= imgWidth || y >= imgHeight) return;

  const idx = (y * imgWidth + x) * 4;
  const d = imgDataRef.data;
  // Переводим RGB в HSV для пипетки
  const r = d[idx]/255, g = d[idx+1]/255, b = d[idx+2]/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0, v = max;
  const dlt = max - min;
  s = max === 0 ? 0 : dlt / max;
  if (max !== min) {
    switch(max) {
      case r: h = (g-b)/dlt + (g<b?6:0); break;
      case g: h = (b-r)/dlt + 2; break;
      case b: h = (r-g)/dlt + 4; break;
    }
    h /= 6;
  }
  pickColor = { h, s: s*255, v: v*255 };
  
  bgColorMode = false;
  pickBgColorBtn.classList.remove('active');
  setMode('color');
  bgSatEl.value = Math.round(s * 255);
  bgSatVal.textContent = bgSatEl.value;
  rebuildAll();
});

// ============================================================
//  ZOOM / PAN
// ============================================================
function applyTransform() { stageEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`; }
function fitToView() {
  if (!imgWidth) return;
  const wW = stageWrap.clientWidth, wH = stageWrap.clientHeight;
  zoom = Math.min(wW / imgWidth, wH / imgHeight) * 0.95;
  panX = (wW - imgWidth * zoom) / 2; panY = (wH - imgHeight * zoom) / 2;
  applyTransform();
}
stageWrap.addEventListener('mousedown', (e) => {
  if (e.button === 1 || e.button === 2) {
    e.preventDefault(); isDragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragStartPanX = panX; dragStartPanY = panY;
    stageWrap.classList.add('dragging');
  }
});
window.addEventListener('mousemove', (e) => {
  if (isDragging) { panX = dragStartPanX + (e.clientX - dragStartX); panY = dragStartPanY + (e.clientY - dragStartY); applyTransform(); }
});
window.addEventListener('mouseup', () => { isDragging = false; stageWrap.classList.remove('dragging'); });
stageWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const rect = stageWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const newZoom = Math.max(0.1, Math.min(20, zoom * factor));
  const k = newZoom / zoom;
  panX = mx - k * (mx - panX); panY = my - k * (my - panY);
  zoom = newZoom; applyTransform();
}, { passive: false });
stageWrap.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
//  ЭКСПОРТ
// ============================================================
exportMaskBtn.addEventListener('click', () => {
  if (!isBg) return;
  const c = document.createElement('canvas'); c.width = imgWidth; c.height = imgHeight;
  const ctx = c.getContext('2d');
  const out = ctx.createImageData(imgWidth, imgHeight);
  for (let i = 0, j = 0; i < imgWidth * imgHeight; i++, j+=4) {
    const v = isBg[i] ? 0 : 255;
    out.data[j] = v; out.data[j+1] = v; out.data[j+2] = v; out.data[j+3] = 255;
  }
  ctx.putImageData(out, 0, 0);
  const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'mask.png'; a.click();
});

toggleImageBtn.addEventListener('click', () => {
  hideImage = !hideImage;
  stageEl.classList.toggle('hide-base', hideImage);
  toggleImageBtn.classList.toggle('active', hideImage);
  toggleImageBtn.textContent = hideImage ? '👁 Показать' : '👁 Маска';
});

bgLumEl.addEventListener('input', () => { bgLumVal.textContent = bgLumEl.value; if(mode==='lum') rebuildAll(); });
bgSatEl.addEventListener('input', () => { bgSatVal.textContent = bgSatEl.value; if(mode==='color') rebuildAll(); });
gradTolEl.addEventListener('input', () => { gradTolVal.textContent = gradTolEl.value; rebuildAll(); });
useSmoothEl.addEventListener('change', () => rebuildAll());
smoothIterEl.addEventListener('input', () => { smoothIterVal.textContent = smoothIterEl.value; rebuildAll(); });

initWorker();
</script>
</body>
</html>
