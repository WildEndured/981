<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детектор лиц</title>
    <!-- Подключаем библиотеку face-api.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        canvas { max-width: 100%; height: auto; display: block; margin: 20px auto; border-radius: 8px; }
        input[type="file"] { margin-bottom: 20px; }
        #status { color: #666; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Детектор лиц (Тест)</h2>
        <input type="file" id="fileInput" accept="image/*">
        <div id="status">Загрузка моделей...</div>
        <!-- Сюда будем выводить картинку -->
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        let modelsLoaded = false;

        // 1. Загружаем модели для распознавания лиц
        Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),
            faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models')
        ]).then(() => {
            modelsLoaded = true;
            status.innerText = "Модели загружены. Выберите фото.";
            status.style.color = "green";
        }).catch(err => {
            status.innerText = "Ошибка загрузки моделей: " + err;
            status.style.color = "red";
        });

        // 2. Обработка выбора файла
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!modelsLoaded) {
                alert("Подождите, модели еще загружаются...");
                return;
            }

            const img = new Image();
            img.src = URL.createObjectURL(file);
            await img.decode();

            // Настраиваем размер холста под картинку
            canvas.width = img.width;
            canvas.height = img.height;
            
            // Рисуем картинку
            ctx.drawImage(img, 0, 0);
            status.innerText = "Идет детекция...";

            // 3. Запускаем детекцию
            try {
                const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
                
                status.innerText = `Найдено лиц: ${detections.length}`;

                // 4. Отрисовка рамок
                if (detections.length > 0) {
                    detections.forEach(det => {
                        const box = det.detection.box;
                        // Рисуем красную рамку
                        ctx.strokeStyle = '#ff0000';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                        
                        // Точки (глаза, нос и т.д.)
                        const landmarks = det.landmarks;
                        ctx.fillStyle = '#00ff00';
                        landmarks.positions.forEach(pt => {
                            ctx.beginPath();
                            ctx.arc(pt.x, pt.y, 3, 0, 2 * Math.PI);
                            ctx.fill();
                        });
                    });
                }
            } catch (err) {
                console.error(err);
                status.innerText = "Ошибка при обработке картинки.";
            }
        });
    </script>
</body>
</html>
