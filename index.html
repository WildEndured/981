<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Фигура — 2D скелет</title>
<style>
  :root {
    --bone: #3b7cff;
    --joint: #f03e6e;
    --joint-fill: #ffe0ea;
    --bone-fill: #eaf2ff;
    --bg: #faf8fc;
    --panel: #ffffff;
    --text: #2a2430;
    --muted: #8a8394;
    --line: #e5e1eb;
    --accent: #7a4dff;
    --highlight: #ffb020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    overflow: hidden;
  }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center;
    padding: 0 16px; gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  header .btn { font-size: 13px; padding: 6px 10px; }

  #stage {
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, var(--bg) 70%);
    touch-action: none;
  }
  #stage svg { width: 100%; height: 100%; display: block; user-select: none; }

  #stage .bone { stroke: var(--bone); stroke-linecap: round; fill: none; }
  #stage .bone-shadow { stroke: #fff; stroke-linecap: round; fill: none; }
  #stage .joint {
    fill: var(--joint-fill);
    stroke: var(--joint);
    stroke-width: 2.5;
    cursor: grab;
  }
  #stage .joint:hover { fill: #ffd0e0; }
  #stage .joint.dragging { fill: var(--highlight); cursor: grabbing; }
  #stage .joint-label {
    font-size: 11px;
    font-weight: 600;
    fill: var(--muted);
    pointer-events: none;
    paint-order: stroke;
    stroke: #fff;
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  #drop-cover {
    position: absolute; inset: 0;
    background: rgba(122, 77, 255, 0.15);
    border: 2px dashed var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; color: var(--accent);
    pointer-events: none;
  }
  #drop-cover[hidden] { display: none; }

  aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 0;
  }
  section { padding: 0 16px 12px; }
  section h2 {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
    font-weight: 600; margin: 14px 0 8px;
  }

  .btn {
    font: inherit; font-size: 12px; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--text);
    cursor: pointer; transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

  .slider {
    display: grid; grid-template-columns: 1fr 48px;
    gap: 2px 8px; margin-bottom: 10px;
    align-items: center;
  }
  .slider label { grid-column: 1 / -1; font-size: 12px; }
  .slider input[type="range"] { width: 100%; height: 20px; accent-color: var(--accent); }
  .slider output {
    text-align: right; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .hint { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 8px; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 48px 1fr auto; height: 100dvh; }
    aside { border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Фигура — 2D скелет</h1>
  <button class="btn" id="reset-pose" type="button">Сброс позы</button>
</header>

<main id="stage">
  <svg id="canvas" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="drop-cover" hidden>Отпустите, чтобы вставить</div>
</main>

<aside>
  <section>
    <h2>Пресеты позы</h2>
    <div class="row" id="presets"></div>
  </section>

  <section>
    <h2>Пропорции</h2>
    <div id="prop-sliders"></div>
  </section>

  <section>
    <h2>Углы (правые)</h2>
    <div id="angle-sliders"></div>
    <p class="hint">Левая сторона отражает правую. Чтобы сделать позу асимметричной — перетаскивай суставы мышью.</p>
  </section>

  <section>
    <h2>Подложка</h2>
    <p class="hint" id="underlay-hint">Перетащи файл или выбери ниже</p>
    <div class="row">
      <button class="btn" id="underlay-pick" type="button">Выбрать</button>
      <button class="btn" id="underlay-remove" type="button" hidden>Удалить</button>
      <input type="file" id="underlay-input" accept="image/*" hidden>
    </div>
    <div class="slider">
      <label>Прозрачность</label>
      <input type="range" id="underlay-opacity" min="0.1" max="0.9" step="0.05" value="0.4">
      <output id="underlay-opacity-out">40%</output>
    </div>
    <div class="slider">
      <label>Масштаб</label>
      <input type="range" id="underlay-scale" min="0.3" max="2" step="0.01" value="1">
      <output id="underlay-scale-out">100%</output>
    </div>
  </section>

  <section>
    <h2>Экспорт</h2>
    <div class="row">
      <button class="btn" id="save-png" type="button">PNG</button>
      <button class="btn" id="save-svg" type="button">SVG</button>
    </div>
  </section>
</aside>

<script type="module">
/* ==================================================================
 * Модель скелета
 * ==================================================================
 * Иерархия (каждый сустав знает родителя и локальные координаты):
 *   pelvis (корень)
 *   ├── spine
 *   │   └── chest
 *   │       ├── neck
 *   │       │   └── head
 *   │       ├── shoulderR → elbowR → wristR
 *   │       └── shoulderL → elbowL → wristL
 *   ├── hipR → kneeR → ankleR → toeR
 *   └── hipL → kneeL → ankleL → toeL
 *
 * Координаты в локальной системе родителя. Единица = 1/8 роста примерно.
 * Все координаты — «вперёд/вверх», но в 2D мы работаем в экранных (x вправо, y вниз).
 * Для ясности используем модель «мир: x вправо, y вверх», а на экран флипаем y.
 */

const BONES = {
  pelvis:    { parent: null,       local: [0, 0],              name: 'Таз' },
  spine:     { parent: 'pelvis',   local: [0, 40],             name: 'Поясница' },
  chest:     { parent: 'spine',    local: [0, 55],             name: 'Грудь' },
  neck:      { parent: 'chest',    local: [0, 30],             name: 'Шея' },
  head:      { parent: 'neck',     local: [0, 25],             name: 'Голова' },
  shoulderR: { parent: 'chest',    local: [28, 20],            name: 'Плечо R' },
  elbowR:    { parent: 'shoulderR',local: [55, 0],             name: 'Локоть R' },
  wristR:    { parent: 'elbowR',   local: [50, 0],             name: 'Кисть R' },
  shoulderL: { parent: 'chest',    local: [-28, 20],           name: 'Плечо L' },
  elbowL:    { parent: 'shoulderL',local: [-55, 0],            name: 'Локоть L' },
  wristL:    { parent: 'elbowL',   local: [-50, 0],            name: 'Кисть L' },
  hipR:      { parent: 'pelvis',   local: [18, -8],            name: 'Бедро R' },
  kneeR:     { parent: 'hipR',     local: [0, -75],            name: 'Колено R' },
  ankleR:    { parent: 'kneeR',    local: [0, -70],            name: 'Стопа R' },
  toeR:      { parent: 'ankleR',   local: [22, -10],           name: 'Носок R' },
  hipL:      { parent: 'pelvis',   local: [-18, -8],           name: 'Бедро L' },
  kneeL:     { parent: 'hipL',     local: [0, -75],            name: 'Колено L' },
  ankleL:    { parent: 'kneeL',    local: [0, -70],            name: 'Стопа L' },
  toeL:      { parent: 'ankleL',   local: [-22, -10],          name: 'Носок L' },
};

const BONE_ORDER = ['pelvis', 'spine', 'chest', 'neck', 'head',
  'shoulderR', 'elbowR', 'wristR', 'shoulderL', 'elbowL', 'wristL',
  'hipR', 'kneeR', 'ankleR', 'toeR', 'hipL', 'kneeL', 'ankleL', 'toeL'];

/* Пропорции: масштабныe множители по группам */
const PROPS = [
  { key: 'torso',   label: 'Торс',       min: 0.6, max: 1.4, def: 1 },
  { key: 'head',    label: 'Голова',     min: 0.6, max: 1.5, def: 1 },
  { key: 'arm',     label: 'Руки',       min: 0.6, max: 1.4, def: 1 },
  { key: 'leg',     label: 'Ноги',       min: 0.6, max: 1.4, def: 1 },
  { key: 'shoulder',label: 'Плечи (шир.)',min: 0.6, max: 1.4, def: 1 },
  { key: 'hip',     label: 'Бёдра (шир.)',min: 0.6, max: 1.4, def: 1 },
];

/* Углы (в градусах, поворот сегмента относительно родителя).
 * Плоскость: 0 = вверх, положительный — вправо.
 * Для рук/ног: 0 — «прямо вниз» вдоль локальной оси. */
const ANGLES = [
  { key: 'spine',    label: 'Наклон корпуса', min: -30, max: 30, def: 0 },
  { key: 'chest',    label: 'Наклон груди',   min: -20, max: 20, def: 0 },
  { key: 'neck',     label: 'Шея',            min: -20, max: 20, def: 0 },
  { key: 'head',     label: 'Голова',         min: -30, max: 30, def: 0 },
  { key: 'shoulderR',label: 'Плечо R',        min: -180, max: 180, def: 0 },
  { key: 'elbowR',   label: 'Локоть R',       min: -150, max: 150, def: 0 },
  { key: 'wristR',   label: 'Кисть R',        min: -60, max: 60, def: 0 },
  { key: 'hipR',     label: 'Бедро R',        min: -90, max: 90, def: 0 },
  { key: 'kneeR',    label: 'Колено R',       min: -90, max: 90, def: 0 },
  { key: 'ankleR',   label: 'Стопа R',        min: -45, max: 45, def: 0 },
];

/* Пресеты поз: {angleKey: value}. Симметричные — R и L одинаковые */
const POSES = [
  { id: 'stand', label: 'Стоя', values: {} },
  { id: 'walk', label: 'Идёт', values: {
    hipR: 25, kneeR: -35, ankleR: 10,
    hipL: -25, kneeL: -15, ankleL: -10,
    shoulderR: -20, elbowR: -30,
    shoulderL: 20, elbowL: 30,
    spine: 5,
  }},
  { id: 'run', label: 'Бежит', values: {
    hipR: 45, kneeR: -70, ankleR: 20,
    hipL: -35, kneeL: -60, ankleL: -20,
    shoulderR: -50, elbowR: -80,
    shoulderL: 50, elbowL: 80,
    spine: 15,
  }},
  { id: 'sit', label: 'Сидит', values: {
    hipR: 90, kneeR: -90, ankleR: 0,
    hipL: 90, kneeL: -90, ankleL: 0,
    spine: -5,
    shoulderR: 10, elbowR: 40,
    shoulderL: -10, elbowL: -40,
  }},
  { id: 'tpose', label: 'T-поза', values: {
    shoulderR: 90, shoulderL: -90,
    hipR: 0, hipL: 0,
  }},
];

/* ==================================================================
 * Состояние
 * ================================================================== */

const STORE_KEY = 'loomis-figure:v1';

function defaultState() {
  return {
    pose: 'stand',
    props: Object.fromEntries(PROPS.map((p) => [p.key, p.def])),
    angles: Object.fromEntries(ANGLES.map((a) => [a.key, a.def])),
    // Дополнительные смещения (после ручного перетаскивания суставов)
    overrides: {},   // {boneId: [x, y]} в мировых координатах
    underlay: { opacity: 0.4, scale: 1, x: 0, y: 0 },
  };
}

function sanitize(raw) {
  const s = defaultState();
  if (!raw || typeof raw !== 'object') return s;
  if (POSES.some((p) => p.id === raw.pose)) s.pose = raw.pose;
  for (const p of PROPS) {
    if (Number.isFinite(raw.props?.[p.key]))
      s.props[p.key] = Math.min(p.max, Math.max(p.min, raw.props[p.key]));
  }
  for (const a of ANGLES) {
    if (Number.isFinite(raw.angles?.[a.key]))
      s.angles[a.key] = Math.min(a.max, Math.max(a.min, raw.angles[a.key]));
  }
  // overrides — сохраняем как есть, если это объект
  if (raw.overrides && typeof raw.overrides === 'object') {
    for (const [k, v] of Object.entries(raw.overrides)) {
      if (BONES[k] && Array.isArray(v) && v.length === 2 && v.every(Number.isFinite)) {
        s.overrides[k] = [v[0], v[1]];
      }
    }
  }
  if (raw.underlay) {
    s.underlay.opacity = Math.min(0.9, Math.max(0.1, raw.underlay.opacity ?? 0.4));
    s.underlay.scale = Math.min(2, Math.max(0.3, raw.underlay.scale ?? 1));
    s.underlay.x = Number.isFinite(raw.underlay.x) ? raw.underlay.x : 0;
    s.underlay.y = Number.isFinite(raw.underlay.y) ? raw.underlay.y : 0;
  }
  return s;
}

const state = sanitize(JSON.parse(localStorage.getItem(STORE_KEY) || 'null'));

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
  }, 300);
}

/* ==================================================================
 * Математика скелета
 * ==================================================================
 * Каждый сустав имеет:
 *   - локальную позицию [lx, ly] относительно родителя
 *   - локальный угол (в градусах): 0 = «вверх» по родительской оси
 *   - масштабы из props (применяются к local)
 *   - override — ручное смещение в мир. координатах (приоритетнее)
 *
 * Мировые координаты считаются сверху вниз по дереву.
 * Оси мира: x вправо, y вверх (как в анатомии). На экран флипаем y.
 */

const rad = (d) => (d * Math.PI) / 180;

// Локальный угол по умолчанию для сустава. Для рук/ног «0» = «прямо вниз»,
// чтобы слайдер «плечо 90°» поднимал руку в сторону. Остальное «0» = вверх.
const DEFAULT_LOCAL_ANGLE = {
  spine: 0, chest: 0, neck: 0, head: 0,
  shoulderR: 90, shoulderL: -90,   // плечи «в сторону» — это T-поза при 0° отклонения
  elbowR: 90, elbowL: -90,         // предплечья продолжают линию плеча
  wristR: 90, wristL: -90,
  hipR: -90, hipL: 90,             // бёдра вниз — «−90°» от направления «вверх»
  kneeR: -90, kneeL: 90,
  ankleR: -90, ankleL: 90,
  toeR: 0, toeL: 0,
};

function propForBone(id) {
  if (id.startsWith('shoulder') || id.startsWith('elbow') || id.startsWith('wrist')) return 'arm';
  if (id.startsWith('hip') || id.startsWith('knee') || id.startsWith('ankle') || id.startsWith('toe')) return 'leg';
  if (id === 'head') return 'head';
  return 'torso';
}

function scaleLocal(id, [lx, ly]) {
  const bone = BONES[id];
  const p = propForBone(id);
  const s = state.props[p] ?? 1;
  // ширина плеч и бёдер влияет на X в соответствующей точке
  if (id.startsWith('shoulder')) {
    const sx = state.props.shoulder ?? 1;
    return [lx * sx, ly * s];
  }
  if (id.startsWith('hip')) {
    const sx = state.props.hip ?? 1;
    return [lx * sx, ly * s];
  }
  // плечи/бёдра — вершины цепочек; их концевые точки (локти, колени) масштабируются через родителя
  if (p === 'arm' || p === 'leg') {
    // длина сегмента (по локальной оси) масштабируется пропорционально
    return [lx, ly * s];
  }
  if (id === 'head') {
    // голова масштабируется по «длине», сохраняя направление
    return [lx, ly * s];
  }
  return [lx * 1, ly * s];
}

// поворот точки [x,y] на угол a (в градусах, 0 = не поворачивать, положительный — по часовой в экранных координатах = против часовой в мире)
function rot2([x, y], a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [x * c - y * s, x * s + y * c];
}

function effectiveAngle(id) {
  const def = DEFAULT_LOCAL_ANGLE[id] ?? 0;
  // углы «R» и «L» симметричны, если это парные конечности
  let key = id;
  if (!ANGLES.some((a) => a.key === id)) {
    // для L-пар ищем R-ключ
    if (id.endsWith('L')) key = id.slice(0, -1) + 'R';
  }
  const extra = state.angles[key] ?? 0;
  // для L-стороны знак угла инвертируется (зеркально)
  if (id.endsWith('L') && key !== id) return def - extra;
  return def + extra;
}

// Мировые позиции суставов и их углы (углы в мире — для отрисовки).
function computeSkeleton() {
  const world = {};   // {id: {x, y, angle}}
  for (const id of BONE_ORDER) {
    const bone = BONES[id];
    const [lx0, ly0] = scaleLocal(id, bone.local);
    // локальный поворот вокруг родителя (учёт положения родителя)
    let wx, wy, wAngle;
    const angleLocal = effectiveAngle(id);

    if (bone.parent === null) {
      // корень — в мировой позиции 0,0
      wx = 0;
      wy = 0;
      wAngle = angleLocal;
    } else {
      const par = world[bone.parent];
      // локальный вектор в системе родителя
      const localVec = rot2([lx0, ly0], rad(par.angle));
      wx = par.x + localVec[0];
      wy = par.y + localVec[1];
      wAngle = par.angle + angleLocal;
    }

    // override — прямое смещение в мировых координатах
    if (state.overrides[id]) {
      wx += state.overrides[id][0];
      wy += state.overrides[id][1];
    }

    world[id] = { x: wx, y: wy, angle: wAngle };
  }
  return world;
}

/* ==================================================================
 * Рендер SVG
 * ================================================================== */

const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('canvas');
const stage = document.getElementById('stage');

// Размер мира
const VIEW_W = 600, VIEW_H = 800;
// Центр фигуры на экране: точка «таз» в (300, 500), масштаб 1 мира = 2.5 px (примерно)
const SCALE = 2.6;
const ORIGIN_X = VIEW_W / 2;
const ORIGIN_Y = VIEW_H * 0.72;   // таз ниже центра

// Группы
const gUnderlay = document.createElementNS(SVG_NS, 'g');
const gBones = document.createElementNS(SVG_NS, 'g');
const gJoints = document.createElementNS(SVG_NS, 'g');
const gLabels = document.createElementNS(SVG_NS, 'g');
svg.appendChild(gUnderlay);
svg.appendChild(gBones);
svg.appendChild(gJoints);
svg.appendChild(gLabels);

// Подложка
const underlayImg = document.createElementNS(SVG_NS, 'image');
underlayImg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
underlayImg.setAttribute('x', 0);
underlayImg.setAttribute('y', 0);
underlayImg.setAttribute('width', VIEW_W);
underlayImg.setAttribute('height', VIEW_H);
underlayImg.style.display = 'none';
gUnderlay.appendChild(underlayImg);

// Преобразование мира в экран: y флипается
function toScreen(x, y) {
  return { x: ORIGIN_X + x * SCALE, y: ORIGIN_Y - y * SCALE };
}

/* ==================================================================
 * Отрисовка
 * ================================================================== */

function render() {
  const world = computeSkeleton();

  gBones.innerHTML = '';
  gJoints.innerHTML = '';
  gLabels.innerHTML = '';

  // 1. Кости (линии между суставами)
  for (const id of BONE_ORDER) {
    const bone = BONES[id];
    if (!bone.parent) continue;
    const p = world[bone.parent];
    const c = world[id];
    const a = toScreen(p.x, p.y);
    const b = toScreen(c.x, c.y);

    // тень-обводка
    const shadow = document.createElementNS(SVG_NS, 'line');
    shadow.setAttribute('x1', a.x); shadow.setAttribute('y1', a.y);
    shadow.setAttribute('x2', b.x); shadow.setAttribute('y2', b.y);
    shadow.setAttribute('stroke-width', '8');
    shadow.setAttribute('class', 'bone-shadow');
    gBones.appendChild(shadow);

    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('stroke-width', '5');
    line.setAttribute('class', 'bone');
    gBones.appendChild(line);
  }

  // 2. Суставы (кружки, за которые можно тянуть)
  for (const id of BONE_ORDER) {
    const p = world[id];
    const s = toScreen(p.x, p.y);
    const r = id === 'pelvis' || id === 'chest' || id === 'head' ? 9 : 7;

    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', s.x);
    circle.setAttribute('cy', s.y);
    circle.setAttribute('r', r);
    circle.setAttribute('class', 'joint');
    circle.dataset.bone = id;
    gJoints.appendChild(circle);
  }

  // 3. Подписи — только для главных суставов
  const LABELS = { pelvis: 'таз', chest: 'грудь', head: 'голова', wristR: 'R', wristL: 'L', ankleR: 'R', ankleL: 'L' };
  for (const [id, text] of Object.entries(LABELS)) {
    const p = world[id];
    if (!p) continue;
    const s = toScreen(p.x, p.y);
    const label = document.createElementNS(SVG_NS, 'text');
    label.setAttribute('x', s.x + 12);
    label.setAttribute('y', s.y - 10);
    label.setAttribute('class', 'joint-label');
    label.textContent = text;
    gLabels.appendChild(label);
  }
}

/* ==================================================================
 * UI: пресеты
 * ================================================================== */

const $ = (id) => document.getElementById(id);

const presetButtons = POSES.map((p) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn';
  b.textContent = p.label;
  b.addEventListener('click', () => {
    // Сбрасываем углы и overrides, применяем пресет
    state.angles = Object.fromEntries(ANGLES.map((a) => [a.key, a.def]));
    state.overrides = {};
    for (const [k, v] of Object.entries(p.values)) {
      const a = ANGLES.find((x) => x.key === k);
      if (a) state.angles[k] = Math.min(a.max, Math.max(a.min, v));
    }
    state.pose = p.id;
    syncAngleSliders();
    renderPresets();
    render();
    save();
  });
  $('presets').appendChild(b);
  return b;
});

function renderPresets() {
  POSES.forEach((p, i) => presetButtons[i].setAttribute('aria-pressed', String(state.pose === p.id)));
}

/* ==================================================================
 * UI: пропорции
 * ================================================================== */

const propSyncers = [];
const propHost = $('prop-sliders');

for (const p of PROPS) {
  const row = document.createElement('div');
  row.className = 'slider';
  const id = `prop-${p.key}`;
  row.innerHTML = `<label for="${id}">${p.label}</label>
    <input type="range" id="${id}" min="${p.min}" max="${p.max}" step="0.01">
    <output for="${id}"></output>`;
  propHost.appendChild(row);
  const input = row.querySelector('input');
  const out = row.querySelector('output');
  const fmt = (v) => Math.round(v * 100) + '%';
  const sync = () => {
    input.value = state.props[p.key];
    out.textContent = fmt(state.props[p.key]);
  };
  input.addEventListener('input', () => {
    state.props[p.key] = Number(input.value);
    state.pose = null;
    out.textContent = fmt(Number(input.value));
    renderPresets();
    render();
    save();
  });
  sync();
  propSyncers.push(sync);
}

/* ==================================================================
 * UI: углы
 * ================================================================== */

const angleSyncers = [];
const angleHost = $('angle-sliders');

for (const a of ANGLES) {
  const row = document.createElement('div');
  row.className = 'slider';
  const id = `angle-${a.key}`;
  row.innerHTML = `<label for="${id}">${a.label}</label>
    <input type="range" id="${id}" min="${a.min}" max="${a.max}" step="1">
    <output for="${id}"></output>`;
  angleHost.appendChild(row);
  const input = row.querySelector('input');
  const out = row.querySelector('output');
  const fmt = (v) => Math.round(v) + '°';
  const sync = () => {
    input.value = state.angles[a.key];
    out.textContent = fmt(state.angles[a.key]);
  };
  input.addEventListener('input', () => {
    state.angles[a.key] = Number(input.value);
    state.pose = null;
    out.textContent = fmt(Number(input.value));
    renderPresets();
    render();
    save();
  });
  sync();
  angleSyncers.push(sync);
}

function syncAngleSliders() {
  for (const s of angleSyncers) s();
}

/* ==================================================================
 * Перетаскивание суставов
 * ================================================================== */

let drag = null;

stage.addEventListener('pointerdown', (e) => {
  const target = e.target.closest('.joint');
  if (!target) return;
  e.preventDefault();
  const id = target.dataset.bone;
  if (!id) return;

  target.classList.add('dragging');

  // запоминаем, где сейчас сустав в мире
  const world = computeSkeleton();
  const w = world[id];
  const startClient = { x: e.clientX, y: e.clientY };
  const startWorld = { x: w.x, y: w.y };

  drag = { id, startClient, startWorld, target };
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  e.preventDefault();

  // пересчёт: смещение мыши в мире
  const rect = svg.getBoundingClientRect();
  // экран -> viewBox: масштаб
  const vbScaleX = VIEW_W / rect.width;
  const vbScaleY = VIEW_H / rect.height;
  const dxScreen = (e.clientX - drag.startClient.x) * vbScaleX;
  const dyScreen = (e.clientY - drag.startClient.y) * vbScaleY;

  // в мире: dx = dxScreen / SCALE, dy = -dyScreen / SCALE (y флип)
  const dxWorld = dxScreen / SCALE;
  const dyWorld = -dyScreen / SCALE;

  // Это движение в абсолюте мира. Сохраняем как override.
  // Сносим прежний override для этого сустава, потому что двигаем «с нуля» от чистой позы.
  // Но чтобы избежать скачка — учитываем его в начальной позиции.
  const base = sanitizeAngleOverride(drag.id);
  state.overrides[drag.id] = [base[0] + dxWorld, base[1] + dyWorld];
  render();
});

stage.addEventListener('pointerup', (e) => {
  if (!drag) return;
  drag.target.classList.remove('dragging');
  drag = null;
  save();
});
stage.addEventListener('pointercancel', () => {
  if (drag) drag.target.classList.remove('dragging');
  drag = null;
  save();
});

// Возвращает [dx, dy], который уже был применён к суставу до начала drag.
// Так проще: во время движения state.overrides = base + delta.
function sanitizeAngleOverride(id) {
  // Если overrides есть — он уже применён в computeSkeleton. Возвращаем как base.
  return state.overrides[id] ?? [0, 0];
}

/* ==================================================================
 * Сброс позы
 * ================================================================== */

$('reset-pose').addEventListener('click', () => {
  state.angles = Object.fromEntries(ANGLES.map((a) => [a.key, a.def]));
  state.props = Object.fromEntries(PROPS.map((p) => [p.key, p.def]));
  state.overrides = {};
  state.pose = 'stand';
  syncAngleSliders();
  for (const s of propSyncers) s();
  renderPresets();
  render();
  save();
});

/* ==================================================================
 * Подложка
 * ================================================================== */

const underlayPick = $('underlay-pick');
const underlayInput = $('underlay-input');
const underlayRemove = $('underlay-remove');
const underlayOpacity = $('underlay-opacity');
const underlayScale = $('underlay-scale');

underlayPick.addEventListener('click', () => underlayInput.click());
underlayInput.addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  if (f) loadUnderlay(f);
  e.target.value = '';
});
underlayRemove.addEventListener('click', () => {
  underlayImg.removeAttribute('href');
  underlayImg.style.display = 'none';
  underlayRemove.hidden = true;
  $('underlay-hint').textContent = 'Перетащи файл или выбери ниже';
  try { localStorage.removeItem(STORE_KEY + ':img'); } catch {}
});

underlayOpacity.addEventListener('input', () => {
  state.underlay.opacity = Number(underlayOpacity.value);
  $('underlay-opacity-out').textContent = Math.round(state.underlay.opacity * 100) + '%';
  underlayImg.style.opacity = state.underlay.opacity;
  save();
});
underlayScale.addEventListener('input', () => {
  state.underlay.scale = Number(underlayScale.value);
  $('underlay-scale-out').textContent = Math.round(state.underlay.scale * 100) + '%';
  applyUnderlayTransform();
  save();
});
underlayOpacity.value = state.underlay.opacity;
underlayScale.value = state.underlay.scale;
$('underlay-opacity-out').textContent = Math.round(state.underlay.opacity * 100) + '%';
$('underlay-scale-out').textContent = Math.round(state.underlay.scale * 100) + '%';

function applyUnderlayTransform() {
  const s = state.underlay.scale;
  underlayImg.setAttribute('transform',
    `translate(${VIEW_W / 2} ${VIEW_H / 2}) scale(${s}) translate(${-VIEW_W / 2} ${-VIEW_H / 2})`);
  underlayImg.style.opacity = state.underlay.opacity;
}

function loadUnderlay(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => {
    underlayImg.setAttribute('href', reader.result);
    underlayImg.style.display = '';
    underlayRemove.hidden = false;
    $('underlay-hint').textContent = file.name;
    applyUnderlayTransform();
    try { localStorage.setItem(STORE_KEY + ':img', reader.result); } catch {}
  };
  reader.readAsDataURL(file);
}

try {
  const saved = localStorage.getItem(STORE_KEY + ':img');
  if (saved) {
    underlayImg.setAttribute('href', saved);
    underlayImg.style.display = '';
    underlayRemove.hidden = false;
    $('underlay-hint').textContent = 'Сохранённая подложка';
    applyUnderlayTransform();
  }
} catch {}

// drag & drop
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes('Files');
window.addEventListener('dragenter', (e) => {
  if (!hasFiles(e)) return;
  dragDepth++;
  $('drop-cover').hidden = false;
});
window.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; $('drop-cover').hidden = true; }
});
window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('drop-cover').hidden = true;
  const f = e.dataTransfer.files?.[0];
  if (f) loadUnderlay(f);
});
document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); loadUnderlay(item.getAsFile()); }
});

/* ==================================================================
 * Экспорт
 * ================================================================== */

$('save-png').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVG_NS);
  const bg = document.createElementNS(SVG_NS, 'rect');
  bg.setAttribute('width', VIEW_W);
  bg.setAttribute('height', VIEW_H);
  bg.setAttribute('fill', '#ffffff');
  clone.insertBefore(bg, clone.firstChild);

  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = VIEW_W * 2;
    canvas.height = VIEW_H * 2;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob((b) => download(b, 'figure.png'));
  };
  img.src = url;
});

$('save-svg').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVG_NS);
  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  download(blob, 'figure.svg');
});

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ==================================================================
 * Запуск
 * ================================================================== */

for (const s of propSyncers) s();
syncAngleSliders();
renderPresets();
render();
</script>
</body>
</html>
