<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Anime Face Detector — face + eyes + chin</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1e1e24; color: #e5e5ea; }
  header { padding: 12px 20px; background: #2a2a33; border-bottom: 1px solid #3a3a45; }
  h1 { margin: 0; font-size: 18px; }
  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; }
  .panel { background: #26262e; padding: 14px; border-radius: 10px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9a9aa8; }
  .methods label { display: block; padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 6px; background: #1e1e24; border: 1px solid transparent; font-size: 13px; }
  .methods label:hover { background: #2f2f3a; }
  .methods input { margin-right: 8px; }
  .methods label.active { border-color: #4f9dff; background: #2b3550; }
  .desc { font-size: 12px; color: #9a9aa8; margin-top: 12px; line-height: 1.5; }
  .canvasBox { position: relative; background: #15151a; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 400px; }
  canvas { max-width: 100%; max-height: 75vh; display: block; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  input[type="range"] { flex: 1; min-width: 100px; }
  button { background: #4f9dff; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:hover { background: #6aabff; }
  button:disabled { opacity: .4; cursor: default; }
  .stat { font-size: 12px; color: #b0b0be; margin-top: 8px; line-height: 1.4; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
  .slider-row span { width: 40px; text-align: right; color: #9a9aa8; }
  .toggle { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #c0c0cc; cursor: pointer; user-select: none; }
  .toggle input { cursor: pointer; }
  .legend { font-size: 11px; color: #88889a; margin-top: 10px; line-height: 1.9; }
  .legend .l { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 2px solid; vertical-align: middle; }
  select { background: #1e1e24; color: #e5e5ea; border: 1px solid #3a3a45; border-radius: 4px; padding: 3px 6px; font-size: 12px; }
</style>
</head>
<body>
<header><h1>🎨 Anime Face Detector — face + eyes + chin (4 methods)</h1></header>
<div class="wrap">
  <div>
    <div class="panel">
      <h2>Метод-детектор</h2>
      <div class="methods" id="methods">
        <label class="active"><input type="radio" name="m" value="skin" checked>1. Skin (YCbCr) + блобы</label>
        <label><input type="radio" name="m" value="eyes">2. Глаза + геометрия</label>
        <label><input type="radio" name="m" value="ncc">3. Template Matching (NCC)</label>
        <label><input type="radio" name="m" value="sym">4. Симметрия (верификатор)</label>
        <label><input type="radio" name="m" value="all">5. Все + NMS</label>
      </div>
      <div class="desc" id="desc"></div>
    </div>

    <div class="panel" style="margin-top:12px">
      <h2>Верификация</h2>
      <label class="toggle"><input type="checkbox" id="vEyes" checked> Глаза (обязательно)</label>
      <div class="slider-row">
        <label>Подбородок:</label>
        <select id="vChin">
          <option value="off">выкл</option>
          <option value="weight" selected>учитывать (мягко)</option>
          <option value="require">требовать</option>
        </select>
      </div>
      <div class="slider-row">
        <label>Метод:</label>
        <select id="chinMethod">
          <option value="vote" selected>голосование (все)</option>
          <option value="proj">проекция кожи</option>
          <option value="shadow">тень под челюстью</option>
          <option value="wedge">V-клин (Sobel)</option>
          <option value="mask">нижняя точка skin-маски</option>
        </select>
      </div>
      <label class="toggle"><input type="checkbox" id="showCandidates"> показать всех кандидатов</label>
    </div>

    <div class="panel" style="margin-top:12px">
      <h2>Изображение</h2>
      <input type="file" id="file" accept="image/*" style="width:100%; font-size:12px;">
      <div class="slider-row"><label>Порог</label><input type="range" id="thr" min="1" max="100" value="50" style="flex:1"><span id="thrV">50</span></div>
      <div class="stat" id="stat">Загрузите картинку</div>
      <div class="legend">
        <span class="l" style="border-color:#4f9dff"></span>лицо
        <span class="l" style="border-color:#ff4f9d; margin-left:8px"></span>глаза
        <span class="l" style="border-color:#7affd2; margin-left:8px"></span>подбородок<br>
        <span class="l" style="border-color:#ffd24f; margin-left:0"></span>proj
        <span class="l" style="border-color:#ff9d4f; margin-left:6px"></span>shadow
        <span class="l" style="border-color:#4fd2ff; margin-left:6px"></span>wedge
        <span class="l" style="border-color:#ff7ad2; margin-left:6px"></span>mask
      </div>
    </div>
  </div>

  <div>
    <div class="canvasBox"><canvas id="cv"></canvas></div>
    <div class="controls">
      <button id="btn">Искать</button>
      <button id="btn2" style="background:#3a3a45">Пример</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ГЛОБАЛЬНЫЕ
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let imgData = null, W = 0, H = 0;
let srcImage = null;

const DESCR = {
  skin: "Маска кожи YCbCr → компоненты → фильтр формы. Верификация глазами + подбородок.",
  eyes: "Тёмные блобы → пары 'глаз' по геометрии → бокс лица. Верификация + подбородок.",
  ncc:  "NCC с синтетическим шаблоном глаза → боксы лица. Верификация + подбородок.",
  sym:  "Skin-кандидаты + проверка симметрии. Верификация + подбородок.",
  all:  "Объединение skin+eyes+NCC + симметрия, затем верификация глазами + подбородок."
};

// ============================================================
// ЗАГРУЗКА
// ============================================================
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => loadImage(ev.target.result);
  r.readAsDataURL(f);
});

document.getElementById('btn2').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = 500; c.height = 500;
  const g = c.getContext('2d');
  // фон
  g.fillStyle = '#c8d8e8'; g.fillRect(0, 0, 500, 500);
  // шея
  g.fillStyle = '#f0c8a8';
  g.fillRect(210, 380, 80, 120);
  // волосы
  g.fillStyle = '#3a2545'; g.beginPath(); g.ellipse(250, 230, 180, 220, 0, 0, 7); g.fill();
  // лицо (V-подбородок)
  g.fillStyle = '#ffe0c8';
  g.beginPath();
  g.ellipse(250, 220, 130, 150, 0, 0, Math.PI);
  // нижняя часть — V
  g.moveTo(120, 220);
  g.lineTo(250, 400);
  g.lineTo(380, 220);
  g.closePath();
  g.fill();
  // контур лица (жирный, как в аниме)
  g.strokeStyle = '#8a6050'; g.lineWidth = 3;
  g.beginPath();
  g.ellipse(250, 220, 130, 150, 0, 0, Math.PI);
  g.stroke();
  g.beginPath();
  g.moveTo(120, 220); g.lineTo(250, 400); g.lineTo(380, 220);
  g.stroke();
  // глаза
  g.fillStyle = '#1a1a3a';
  g.beginPath(); g.ellipse(200, 210, 26, 36, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(300, 210, 26, 36, 0, 0, 7); g.fill();
  g.fillStyle = '#4f9dff';
  g.beginPath(); g.ellipse(200, 215, 15, 22, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(300, 215, 15, 22, 0, 0, 7); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(193, 202, 8, 0, 7); g.fill();
  g.beginPath(); g.arc(293, 202, 8, 0, 7); g.fill();
  // рот
  g.strokeStyle = '#c04060'; g.lineWidth = 4;
  g.beginPath(); g.arc(250, 290, 22, 0.2, Math.PI - 0.2); g.stroke();
  loadImage(c.toDataURL());
});

function loadImage(src) {
  const im = new Image();
  im.onload = () => {
    srcImage = im;
    const maxW = 800;
    const scale = Math.min(1, maxW / im.width);
    W = Math.round(im.width * scale);
    H = Math.round(im.height * scale);
    cv.width = W; cv.height = H;
    ctx.drawImage(im, 0, 0, W, H);
    imgData = ctx.getImageData(0, 0, W, H);
    document.getElementById('stat').textContent = `Готово: ${W}×${H}. Нажмите «Искать».`;
  };
  im.src = src;
}

// ============================================================
// УТИЛИТЫ
// ============================================================
function redraw() { if (srcImage) ctx.drawImage(srcImage, 0, 0, W, H); }

function grayPixels() {
  const g = new Uint8Array(W * H);
  const d = imgData.data;
  for (let i = 0, j = 0; i < d.length; i += 4, j++)
    g[j] = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) | 0;
  return g;
}

function iou(a, b) {
  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x+a.w, b.x+b.w), y2 = Math.min(a.y+a.h, b.y+b.h);
  const iw = Math.max(0, x2-x1), ih = Math.max(0, y2-y1);
  const inter = iw*ih;
  return inter / (a.w*a.h + b.w*b.h - inter || 1);
}

function nms(boxes, thr = 0.3) {
  const sorted = [...boxes].sort((a, b) => (b.score||0) - (a.score||0));
  const keep = [];
  for (const b of sorted) if (keep.every(k => iou(k, b) < thr)) keep.push(b);
  return keep;
}

function erode(mask, w, h) {
  const out = new Uint8Array(w*h);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) {
    let s = 1;
    for (let dy = -1; dy <= 1 && s; dy++)
      for (let dx = -1; dx <= 1; dx++)
        if (!mask[(y+dy)*w + (x+dx)]) { s = 0; break; }
    out[y*w + x] = s;
  }
  return out;
}

function dilate(mask, w, h) {
  const out = new Uint8Array(w*h);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) {
    let s = 0;
    for (let dy = -1; dy <= 1 && !s; dy++)
      for (let dx = -1; dx <= 1; dx++)
        if (mask[(y+dy)*w + (x+dx)]) { s = 1; break; }
    out[y*w + x] = s;
  }
  return out;
}

function connectedComponents(mask, w, h, minArea = 20) {
  const labels = new Int32Array(w*h).fill(-1);
  const comps = [];
  const stack = [];
  let L = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const idx = y*w + x;
    if (!mask[idx] || labels[idx] !== -1) continue;
    stack.length = 0; stack.push(x, y);
    labels[idx] = L;
    let minX = x, minY = y, maxX = x, maxY = y, area = 0;
    while (stack.length) {
      const py = stack.pop(), px = stack.pop();
      area++;
      if (px < minX) minX = px; if (px > maxX) maxX = px;
      if (py < minY) minY = py; if (py > maxY) maxY = py;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = px + dx, ny = py + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const ni = ny*w + nx;
        if (mask[ni] && labels[ni] === -1) { labels[ni] = L; stack.push(nx, ny); }
      }
    }
    if (area >= minArea)
      comps.push({ x: minX, y: minY, w: maxX-minX+1, h: maxY-minY+1, area });
    L++;
  }
  return comps;
}

// ============================================================
// МЕТОДЫ-ДЕТЕКТОРЫ
// ============================================================
function methodSkin(threshold = 0.5) {
  const d = imgData.data;
  const mask = new Uint8Array(W*H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const cb = 128 - 0.168736*r - 0.331264*g + 0.5*b;
    const cr = 128 + 0.5*r - 0.418688*g - 0.081312*b;
    if (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173) mask[j] = 1;
  }
  const m2 = erode(mask, W, H), m3 = dilate(m2, W, H);
  const comps = connectedComponents(m3, W, H, 300);
  const boxes = [];
  for (const c of comps) {
    const ar = c.h / c.w;
    if (ar < 0.4 || ar > 1.6) continue;
    const fill = c.area / (c.w*c.h);
    if (fill < 0.35) continue;
    boxes.push({ x: c.x, y: c.y, w: c.w, h: c.h, score: Math.min(1, fill*1.2) });
  }
  return nms(boxes, 0.4);
}

function methodEyes(threshold = 0.5) {
  const g = grayPixels();
  const t = 60 + threshold * 40;
  const mask = new Uint8Array(W*H);
  for (let i = 0; i < g.length; i++) if (g[i] < t) mask[i] = 1;
  const m2 = erode(mask, W, H);
  const comps = connectedComponents(m2, W, H, 60);
  const eyes = comps.filter(c => {
    const ar = c.w / c.h;
    const fill = c.area / (c.w*c.h);
    return ar > 0.4 && ar < 2.5 && fill > 0.35 &&
           c.area > 80 && c.area < W*H*0.05;
  });
  const boxes = [];
  for (let i = 0; i < eyes.length; i++) for (let j = i+1; j < eyes.length; j++) {
    const a = eyes[i], b = eyes[j];
    const dy = Math.abs((a.y+a.h/2) - (b.y+b.h/2));
    const dx = Math.abs((a.x+a.w/2) - (b.x+b.w/2));
    const sizeAvg = (a.w + b.w) / 2;
    if (dy > sizeAvg * 0.6) continue;
    const ratio = dx / sizeAvg;
    if (ratio < 1.2 || ratio > 4) continue;
    if (Math.max(a.w,b.w) / Math.min(a.w,b.w) > 2) continue;
    const cx = (a.x + a.w/2 + b.x + b.w/2) / 2;
    const cyEyes = (a.y + a.h/2 + b.y + b.h/2) / 2;
    const eyeSpan = dx + sizeAvg;
    const fw = eyeSpan * 1.6, fh = fw * 1.3;
    boxes.push({ x: cx - fw/2, y: cyEyes - fh * 0.42, w: fw, h: fh, score: 0.9 });
  }
  return nms(boxes, 0.3);
}

function makeEyeTemplate(size = 24) {
  const t = new Float32Array(size*size);
  const cx = size/2, cy = size/2;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (x - cx) / (size*0.32), dy = (y - cy) / (size*0.45);
    const r2 = dx*dx + dy*dy;
    let v = r2 < 1 ? 0.15 : 0.9;
    const bx = (x - cx*0.7) / (size*0.1), by = (y - cy*0.8) / (size*0.12);
    if (bx*bx + by*by < 1) v = 1;
    t[y*size + x] = v;
  }
  return { data: t, size };
}

function methodNCC(threshold = 0.5) {
  const g = grayPixels();
  const gF = new Float32Array(W*H);
  for (let i = 0; i < g.length; i++) gF[i] = g[i] / 255;
  const { data: T, size: S } = makeEyeTemplate(24);
  const tMin = 0.45 + threshold * 0.3;
  const I = new Float64Array((W+1)*(H+1));
  const I2 = new Float64Array((W+1)*(H+1));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = gF[y*W + x];
    I[(y+1)*(W+1) + (x+1)]  = v   + I[y*(W+1)+(x+1)]     + I[(y+1)*(W+1)+x]     - I[y*(W+1)+x];
    I2[(y+1)*(W+1) + (x+1)] = v*v + I2[y*(W+1)+(x+1)]    + I2[(y+1)*(W+1)+x]    - I2[y*(W+1)+x];
  }
  const STEP = 3, raw = [];
  const sumT = T.reduce((a, b) => a + b, 0);
  const sumT2 = T.reduce((a, b) => a + b*b, 0);
  const N = S*S;
  for (let y = 0; y + S < H; y += STEP) for (let x = 0; x + S < W; x += STEP) {
    const a  = I[y*(W+1)+x],      b  = I[y*(W+1)+x+S];
    const c  = I[(y+S)*(W+1)+x],  dd = I[(y+S)*(W+1)+x+S];
    const sumI = dd - b - c + a;
    const a2  = I2[y*(W+1)+x],     b2  = I2[y*(W+1)+x+S];
    const c2  = I2[(y+S)*(W+1)+x], d2  = I2[(y+S)*(W+1)+x+S];
    const sumI2 = d2 - b2 - c2 + a2;
    let sumIT = 0;
    for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++)
      sumIT += gF[(y+yy)*W + (x+xx)] * T[yy*S + xx];
    const num = sumIT - sumI*sumT/N;
    const den = Math.sqrt((sumI2 - sumI*sumI/N) * (sumT2 - sumT*sumT/N));
    const ncc = den > 1e-6 ? num / den : 0;
    if (ncc > tMin) raw.push({ x, y, w: S, h: S, score: ncc });
  }
  const face = raw.map(b => {
    const fw = b.w * 3, fh = fw * 1.3;
    return { x: b.x - fw*0.28, y: b.y + b.h*0.1, w: fw, h: fh, score: b.score };
  });
  return nms(face, 0.25);
}

function symmetryScore(g, b) {
  const x0 = Math.max(0, b.x), x1 = Math.min(W, b.x + b.w);
  const y0 = Math.max(0, b.y), y1 = Math.min(H, b.y + b.h);
  const bw = x1 - x0, half = Math.floor(bw / 2);
  let sad = 0, n = 0;
  for (let y = y0; y < y1; y++) for (let x = 0; x < half; x++) {
    sad += Math.abs(g[y*W + x0+x] - g[y*W + x1-1-x]); n++;
  }
  if (!n) return 0;
  return Math.max(0, Math.min(1, 1 - (sad / n) / 255));
}

function methodSymmetry(threshold = 0.5) {
  const g = grayPixels();
  const base = methodSkin(threshold);
  const out = [];
  for (const b of base) {
    const s = symmetryScore(g, b);
    if (s > 0.72) out.push({ ...b, score: s });
  }
  return out;
}

function methodAll(threshold = 0.5) {
  const g = grayPixels();
  const a = methodSkin(threshold), b = methodEyes(threshold), c = methodNCC(threshold);
  const all = [...a, ...b, ...c].map(x => ({
    ...x, score: (x.score||0) * 0.5 + symmetryScore(g, x) * 0.5
  }));
  return nms(all.filter(b => symmetryScore(g, b) > 0.65), 0.3);
}

// ============================================================
// МАСКА КОЖИ
// ============================================================
function buildSkinMask() {
  const d = imgData.data;
  const mask = new Uint8Array(W * H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const cb = 128 - 0.168736*r - 0.331264*g + 0.5*b;
    const cr = 128 + 0.5*r - 0.418688*g - 0.081312*b;
    if (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173) mask[j] = 1;
  }
  return mask;
}

// ============================================================
// ГЕОМЕТРИЯ ПО ГЛАЗАМ
// ============================================================
function eyeGeometry(eyes) {
  const [e1, e2] = eyes;
  const c1x = e1.x + e1.w/2, c1y = e1.y + e1.h/2;
  const c2x = e2.x + e2.w/2, c2y = e2.y + e2.h/2;
  const cx = (c1x + c2x) / 2;
  const cy = (c1y + c2y) / 2;
  const dx = Math.abs(c1x - c2x);
  const eyeW = (e1.w + e2.w) / 2;
  const span = dx + eyeW;
  return { cx, cy, span, eyeW };
}

// ============================================================
// ГЛАЗА В ROI
// ============================================================
function findEyesInROI(gray, roi) {
  const rx = Math.max(0, roi.x | 0);
  const ry = Math.max(0, roi.y | 0);
  const rw = Math.min(W - rx, roi.w | 0);
  const rh = Math.min(H - ry, roi.h | 0);
  if (rw < 20 || rh < 20) return null;

  let sum = 0;
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++)
    sum += gray[(ry + y)*W + (rx + x)];
  const mean = sum / (rw * rh);
  const t = Math.min(115, mean * 0.6);

  const mask = new Uint8Array(rw * rh);
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++)
    if (gray[(ry + y)*W + (rx + x)] < t) mask[y*rw + x] = 1;

  const m2 = erode(mask, rw, rh), m3 = dilate(m2, rw, rh);
  const comps = connectedComponents(m3, rw, rh, 20);
  const eyes = comps.filter(c => {
    const ar = c.w / c.h;
    const fill = c.area / (c.w * c.h);
    const areaRatio = c.area / (rw * rh);
    return ar > 0.35 && ar < 3.0 && fill > 0.3 &&
           areaRatio > 0.004 && areaRatio < 0.25;
  });
  if (eyes.length < 2) return null;

  let best = null, bestScore = -Infinity;
  for (let i = 0; i < eyes.length; i++) for (let j = i + 1; j < eyes.length; j++) {
    const a = eyes[i], b = eyes[j];
    const ax = a.x + a.w/2, ay = a.y + a.h/2;
    const bx = b.x + b.w/2, by = b.y + b.h/2;
    const dx = Math.abs(ax - bx), dy = Math.abs(ay - by);
    const sAvg = (a.w + b.w) / 2;
    const sRatio = Math.max(a.w, b.w) / Math.min(a.w, b.w);
    if (sAvg < 3) continue;
    if (dy > sAvg * 0.7) continue;
    const rel = dx / sAvg;
    if (rel < 1.0 || rel > 4.5) continue;
    if (sRatio > 2.2) continue;
    const avgY = (ay + by) / 2;
    if (avgY > rh * 0.8) continue;
    const score = (1 - Math.abs(rel - 2) / 2.5) - dy / sAvg * 1.5 - (sRatio - 1) * 1.5;
    if (score > bestScore) {
      bestScore = score;
      best = [
        { x: rx + a.x, y: ry + a.y, w: a.w, h: a.h },
        { x: rx + b.x, y: ry + b.y, w: b.w, h: b.h }
      ];
    }
  }
  return best ? { pair: best, score: Math.max(0, bestScore) } : null;
}

// ============================================================
// ПОДБОРОДОК: 4 МЕТОДА
// ============================================================

// --- 1. Проекция кожи вниз от центра глаз ---
function findChinByProjection(gray, skin, eyes) {
  const { cx, cy, span } = eyeGeometry(eyes);
  const x = Math.round(cx);
  if (x < 0 || x >= W) return null;

  const yStart = Math.round(cy + span * 0.2);
  const yMax = Math.min(H - 1, Math.round(cy + span * 3.0));

  let lastSkinY = -1;
  let brokeAfter = 0;
  for (let y = yStart; y <= yMax; y++) {
    const idx = y * W + x;
    if (skin[idx]) {
      lastSkinY = y;
      brokeAfter = 0;
    } else {
      brokeAfter++;
      if (brokeAfter >= 3 && lastSkinY >= 0) break;
    }
  }
  if (lastSkinY < 0) return null;

  const dy = lastSkinY - cy;
  if (dy < span * 1.2 || dy > span * 3.0) return null;

  return { x: cx, y: lastSkinY, w: span * 0.4, h: span * 0.3, src: 'proj', score: 1 };
}

// --- 2. Тень под челюстью (локальный минимум яркости) ---
function findChinByShadow(gray, eyes) {
  const { cx, cy, span } = eyeGeometry(eyes);
  const x = Math.round(cx);
  const yStart = Math.round(cy + span * 0.8);
  const yEnd = Math.min(H - 1, Math.round(cy + span * 2.8));
  if (yEnd <= yStart) return null;

  const dx = Math.round(span * 0.3);
  const prof = [];
  for (let y = yStart; y <= yEnd; y++) {
    let s = 0, n = 0;
    for (let xx = Math.max(0, x - dx); xx <= Math.min(W - 1, x + dx); xx++) {
      s += gray[y*W + xx]; n++;
    }
    prof.push({ y, v: s / n });
  }

  // локальные минимумы
  const mins = [];
  for (let i = 1; i < prof.length - 1; i++) {
    if (prof[i].v < prof[i-1].v && prof[i].v < prof[i+1].v) {
      mins.push({ y: prof[i].y, v: prof[i].v, idx: i });
    }
  }
  if (!mins.length) return null;

  // берём самый «выраженный» минимум (ниже среднего и самый низкий из сильных)
  let avg = 0;
  for (const p of prof) avg += p.v;
  avg /= prof.length;

  const strong = mins.filter(m => m.v < avg * 0.85);
  if (!strong.length) return null;
  strong.sort((a, b) => a.v - b.v);
  const pick = strong[0];

  return { x: cx, y: pick.y, w: span * 0.4, h: span * 0.3, src: 'shadow', score: 1 };
}

// --- 3. V-клин через Sobel (жирный контур челюсти) ---
function sobelMagnitude(gray) {
  const g = new Float32Array(W*H);
  for (let y = 1; y < H-1; y++) for (let x = 1; x < W-1; x++) {
    const i = y*W + x;
    const gx = -gray[i-W-1] - 2*gray[i-1] - gray[i+W-1]
             +  gray[i-W+1] + 2*gray[i+1] + gray[i+W+1];
    const gy = -gray[i-W-1] - 2*gray[i-W] - gray[i-W+1]
             +  gray[i+W-1] + 2*gray[i+W] + gray[i+W+1];
    g[i] = Math.sqrt(gx*gx + gy*gy);
  }
  return g;
}

function findChinByWedge(gray, skin, eyes) {
  const { cx, cy, span } = eyeGeometry(eyes);
  const mag = sobelMagnitude(gray);

  const yTop = Math.round(cy + span * 1.0);
  const yBot = Math.min(H - 1, Math.round(cy + span * 2.8));
  const x = Math.round(cx);
  if (x < 0 || x >= W) return null;

  const side = Math.max(3, Math.round(span * 0.35));

  let best = null, bestScore = 0;
  for (let y = yTop; y <= yBot; y++) {
    const idx = y*W + x;
    // проверяем, что мы внутри лица (кожа в центре)
    if (skin && !skin[idx]) continue;

    // «поддержка» градиентами по диагоналям вверх-влево и вверх-вправо
    let leftEdge = 0, rightEdge = 0;
    for (let d = 2; d <= 8; d++) {
      const lx = x - side + Math.round(d * 0.4);
      const rx = x + side - Math.round(d * 0.4);
      const ly = y - d, ry = y - d;
      if (lx >= 0 && ly >= 0) leftEdge = Math.max(leftEdge, mag[ly*W + lx]);
      if (rx < W && ry >= 0)  rightEdge = Math.max(rightEdge, mag[ry*W + rx]);
    }
    const score = Math.min(leftEdge, rightEdge);
    if (score > bestScore) {
      bestScore = score;
      best = { x: cx, y, w: span * 0.4, h: span * 0.3, src: 'wedge', score: 1 };
    }
  }
  return bestScore > 40 ? best : null;
}

// --- 4. Нижняя точка skin-маски в центральной полосе ---
function findChinByMask(skin, eyes) {
  const { cx, cy, span } = eyeGeometry(eyes);
  const dx = Math.round(span * 0.25);
  const xL = Math.max(0, Math.round(cx) - dx);
  const xR = Math.min(W - 1, Math.round(cx) + dx);
  const yStart = Math.round(cy + span * 0.3);
  const yEnd = Math.min(H - 1, Math.round(cy + span * 3.0));

  let bestY = -1;
  for (let y = yEnd; y >= yStart; y--) {
    let skinCount = 0;
    for (let x = xL; x <= xR; x++) if (skin[y*W + x]) skinCount++;
    const ratio = skinCount / (xR - xL + 1);
    if (ratio > 0.6) { bestY = y; break; }
  }
  if (bestY < 0) return null;
  if (bestY - cy < span * 1.2 || bestY - cy > span * 3.0) return null;
  return { x: cx, y: bestY, w: span * 0.4, h: span * 0.3, src: 'mask', score: 1 };
}

// ============================================================
// ОБЪЕДИНЁННЫЙ ПОИСК ПОДБОРОДКА
// ============================================================
function findChinAll(gray, skin, eyes) {
  const { span } = eyeGeometry(eyes);
  const candidates = [];
  const c1 = findChinByProjection(gray, skin, eyes);
  const c2 = findChinByShadow(gray, eyes);
  const c3 = findChinByWedge(gray, skin, eyes);
  const c4 = findChinByMask(skin, eyes);
  if (c1) candidates.push(c1);
  if (c2) candidates.push(c2);
  if (c3) candidates.push(c3);
  if (c4) candidates.push(c4);
  return { candidates, span };
}

function pickChinByVote(candidates, span) {
  if (!candidates.length) return null;
  // кластеризация по Y с допуском ±0.25 span
  let bestCluster = null, bestCount = 0, bestAvgY = 0;
  for (const c of candidates) {
    const cluster = candidates.filter(x => Math.abs(x.y - c.y) < span * 0.25);
    if (cluster.length > bestCount) {
      bestCount = cluster.length;
      bestAvgY = cluster.reduce((s, x) => s + x.y, 0) / cluster.length;
      bestCluster = cluster;
    }
  }
  if (bestCount < 2) return null;
  const { cx } = eyeGeometryFromAny(candidates, span);
  return {
    x: candidates[0].x,
    y: bestAvgY,
    w: span * 0.4,
    h: span * 0.3,
    score: Math.min(1, bestCount / candidates.length),
    src: 'vote',
    members: bestCluster.map(c => c.src)
  };
}

// маленький хелпер: центр X из любого кандидата
function eyeGeometryFromAny(candidates, span) {
  return { cx: candidates[0].x, span };
}

// Универсальная функция: mode = 'proj'|'shadow'|'wedge'|'mask'|'vote'
function findChin(gray, skin, eyes, mode) {
  const { span } = eyeGeometry(eyes);
  let chin = null;

  if (mode === 'proj')   chin = findChinByProjection(gray, skin, eyes);
  else if (mode === 'shadow') chin = findChinByShadow(gray, eyes);
  else if (mode === 'wedge')  chin = findChinByWedge(gray, skin, eyes);
  else if (mode === 'mask')   chin = findChinByMask(skin, eyes);
  else {
    const { candidates } = findChinAll(gray, skin, eyes);
    chin = pickChinByVote(candidates, span);
  }
  return chin;
}

// ============================================================
// ВЕРИФИКАЦИЯ ЛИЦА
// ============================================================
function verifyFaceFull(gray, skin, faceBox, opts) {
  const eyesRes = findEyesInROI(gray, faceBox);
  if (!eyesRes) return null;
  const eyes = eyesRes.pair;

  // подбородок
  let chin = null;
  let chinCandidates = [];
  if (opts.chinMode !== 'off') {
    if (opts.chinMethod === 'vote') {
      const { candidates, span } = findChinAll(gray, skin, eyes);
      chinCandidates = candidates;
      chin = pickChinByVote(candidates, span);
    } else {
      chin = findChin(gray, skin, eyes, opts.chinMethod);
      if (chin) chinCandidates = [chin];
    }
    if (opts.chinMode === 'require' && !chin) return null;
  }

  // геометрия по глазам
  const [e1, e2] = eyes;
  const cx = (e1.x + e1.w/2 + e2.x + e2.w/2) / 2;
  const cyEyes = (e1.y + e1.h/2 + e2.y + e2.h/2) / 2;
  const eyeSpan = Math.abs((e1.x + e1.w/2) - (e2.x + e2.w/2)) + (e1.w + e2.w)/2;

  const fw = eyeSpan * 1.7;
  let top, height;
  if (chin) {
    // подбородок примерно на 78% высоты головы от глаз вниз
    const chinY = chin.y;
    height = (chinY - cyEyes) / 0.78 + (chinY - cyEyes) * 0.15;
    top = cyEyes - height * 0.35;
    height = chinY - top + height * 0.05;
  } else {
    height = fw * 1.25;
    top = cyEyes - height * 0.40;
  }

  // баллы
  let score = 0.40 + Math.min(0.15, Math.max(0, eyesRes.score * 0.15));
  if (opts.chinMode !== 'off' && chin) score += 0.15 + (chin.score || 0) * 0.05;
  if (opts.chinMode === 'weight' && !chin) score -= 0.05;
  score = Math.max(0, Math.min(1, score));

  return {
    x: cx - fw/2, y: top, w: fw, h: height,
    score, eyes, chin, chinCandidates
  };
}

// ============================================================
// UI
// ============================================================
const methods = { skin: methodSkin, eyes: methodEyes, ncc: methodNCC, sym: methodSymmetry, all: methodAll };
let currentMethod = 'skin';

document.querySelectorAll('input[name="m"]').forEach(r => {
  r.addEventListener('change', () => {
    currentMethod = r.value;
    document.querySelectorAll('.methods label').forEach(l =>
      l.classList.toggle('active', l.querySelector('input').checked));
    document.getElementById('desc').textContent = DESCR[currentMethod];
    redraw();
    if (imgData) run();
  });
});
document.getElementById('desc').textContent = DESCR[currentMethod];

document.getElementById('thr').addEventListener('input', e =>
  document.getElementById('thrV').textContent = e.target.value);

['vEyes', 'vChin', 'chinMethod', 'showCandidates'].forEach(id =>
  document.getElementById(id).addEventListener('change', () => { if (imgData) run(); }));

document.getElementById('btn').addEventListener('click', run);

const SRC_COLORS = {
  proj:   '#ffd24f',
  shadow: '#ff9d4f',
  wedge:  '#4fd2ff',
  mask:   '#ff7ad2',
  vote:   '#7affd2'
};

function drawResults(boxes, showCandidates) {
  redraw();
  for (const b of boxes) {
    // лицо
    ctx.lineWidth = 2; ctx.strokeStyle = '#4f9dff';
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#4f9dff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(Math.round((b.score||0) * 100) + '%', b.x, Math.max(12, b.y - 4));

    // глаза
    if (b.eyes) {
      ctx.strokeStyle = '#ff4f9d'; ctx.lineWidth = 2;
      for (const e of b.eyes) ctx.strokeRect(e.x, e.y, e.w, e.h);
    }

    // кандидаты подбородка (по цветам методов)
    if (showCandidates && b.chinCandidates && b.chinCandidates.length) {
      for (const c of b.chinCandidates) {
        const col = SRC_COLORS[c.src] || '#888';
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 4, 0, 7);
        ctx.fill();
        ctx.font = '10px sans-serif';
        ctx.fillText(c.src, c.x + 6, c.y + 3);
      }
    }

    // итоговый подбородок
    if (b.chin) {
      ctx.strokeStyle = '#7affd2'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.chin.x, b.chin.y, 3, 0, 7);
      ctx.fillStyle = '#7affd2';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(b.chin.x - b.chin.w/2, b.chin.y);
      ctx.lineTo(b.chin.x + b.chin.w/2, b.chin.y);
      ctx.stroke();
      // подпись метода
      ctx.fillStyle = '#7affd2';
      ctx.font = '10px sans-serif';
      const label = b.chin.src === 'vote'
        ? `vote(${(b.chin.members||[]).length})`
        : b.chin.src;
      ctx.fillText(label, b.chin.x + 8, b.chin.y + 12);
    }
  }
}

// ============================================================
// ЗАПУСК
// ============================================================
function run() {
  if (!imgData) return;
  const thr = +document.getElementById('thr').value / 100;
  const needEyes = document.getElementById('vEyes').checked;
  const chinMode = document.getElementById('vChin').value;
  const chinMethod = document.getElementById('chinMethod').value;
  const showCandidates = document.getElementById('showCandidates').checked;

  document.getElementById('btn').disabled = true;
  const t0 = performance.now();

  setTimeout(() => {
    try {
      const candidates = methods[currentMethod](thr);
      let boxes = candidates;

      if (candidates.length && (needEyes || chinMode !== 'off')) {
        const gray = grayPixels();
        const skin = buildSkinMask();
        const verified = [];
        for (const b of candidates) {
          const v = verifyFaceFull(gray, skin, b, { chinMode, chinMethod });
          if (v) verified.push(v);
        }
        boxes = nms(verified, 0.3);
      }

      drawResults(boxes, showCandidates);

      const dt = (performance.now() - t0).toFixed(0);
      const withChin = boxes.filter(b => b.chin).length;
      document.getElementById('stat').textContent =
        `Метод: ${currentMethod} | кандидатов: ${candidates.length} | ` +
        `прошло: ${boxes.length} | с подбородком: ${withChin} | ${dt} мс`;
    } catch (e) {
      document.getElementById('stat').textContent = 'Ошибка: ' + e.message;
      console.error(e);
    }
    document.getElementById('btn').disabled = false;
  }, 10);
}
