<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Лумис — Фигура</title>
<style>
  :root {
    --guide-red: #f03e6e;
    --guide-blue: #3b7cff;
    --guide-green: #2ecc71;
    --bg: #faf8fc;
    --panel: #ffffff;
    --text: #2a2430;
    --muted: #8a8394;
    --line: #e5e1eb;
    --accent: #7a4dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg); display: grid;
    grid-template-columns: 1fr 340px; grid-template-rows: 48px 1fr;
    height: 100vh; overflow: hidden;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; padding: 0 16px; gap: 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .view-name { font-size: 12px; color: var(--muted); margin-left: auto; }

  #stage {
    position: relative; overflow: hidden; background: radial-gradient(circle at 50% 45%, #ffffff 0%, var(--bg) 70%);
    display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; user-select: none; }

  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px 0; }
  section { padding: 0 16px 12px; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 14px 0 8px; }

  .btn {
    font: inherit; font-size: 12px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--text); cursor: pointer; transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

  .slider { display: grid; grid-template-columns: 1fr 52px; grid-template-rows: auto auto; gap: 2px 8px; margin-bottom: 10px; align-items: center; }
  .slider label { grid-column: 1 / -1; font-size: 12px; color: var(--text); }
  .slider input[type="range"] { width: 100%; height: 20px; accent-color: var(--accent); }
  .slider output { text-align: right; font-size: 11px; color: var(--muted); }

  .hint { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 48px 1fr auto; height: 100dvh; }
    aside { border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Лумис — Фигура</h1>
  <span class="view-name" id="view-name">Анфас · 0°</span>
</header>

<main id="stage">
  <svg id="canvas" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
</main>

<aside>
  <section>
    <h2>Поворот</h2>
    <div class="slider">
      <label>Yaw (вокруг вертикали)</label>
      <input type="range" id="yaw" min="-180" max="180" step="1" value="0">
      <output id="yaw-out">0°</output>
    </div>
    <div class="row">
      <button class="btn" data-angle="front" type="button">Анфас</button>
      <button class="btn" data-angle="side" type="button">Профиль</button>
      <button class="btn" id="spin" type="button" aria-pressed="false">↻ Крутить</button>
      <button class="btn" id="reset-view" type="button">Сброс</button>
    </div>
  </section>

  <section>
    <h2>Пропорции фигуры</h2>
    <div id="figure-sliders"></div>
  </section>
</aside>

<script type="module">
/* ==================================================================
 * МАТЕМАТИКА
 * ================================================================== */
const FIGURE_PARAMS = [
  { key: 'S',           label: 'Размер таза (S)',        min: 0.6, max: 1.4, step: 0.01, def: 1.0 },
  { key: 'neck_len',    label: 'Длина шеи',              min: 0.1, max: 0.4, step: 0.01, def: 0.25 },
  { key: 'chest_w',     label: 'Ширина груди',           min: 0.5, max: 1.2, step: 0.01, def: 0.85 },
  { key: 'chest_d',     label: 'Глубина груди',          min: 0.3, max: 1.0, step: 0.01, def: 0.55 },
  { key: 'taper_top',   label: 'Сужение кверху',         min: 0.4, max: 1.0, step: 0.01, def: 0.65 },
  { key: 'pelvis_d',    label: 'Глубина таза',           min: 0.3, max: 1.0, step: 0.01, def: 0.6 },
  { key: 'n_pelvis',    label: 'Скругление таза (n)',    min: 2.0, max: 6.0, step: 0.1, def: 4.0 },
  { key: 'waist_factor',label: 'Ширина талии',           min: 0.5, max: 1.0, step: 0.01, def: 0.8 },
  { key: 'bust_x',      label: 'Смещение груди',         min: 0.0, max: 0.4, step: 0.01, def: 0.18 },
  { key: 'bust_r',      label: 'Размер груди',           min: 0.0, max: 0.3, step: 0.01, def: 0.14 },
  { key: 'leg_len',     label: 'Длина ног',              min: 0.5, max: 1.5, step: 0.01, def: 1.0 },
  { key: 'leg_w',       label: 'Толщина ног',            min: 0.1, max: 0.5, step: 0.01, def: 0.25 },
  { key: 'arm_w',       label: 'Толщина рук',            min: 0.05, max: 0.3, step: 0.01, def: 0.12 },
  { key: 'head_r',      label: 'Размер головы',          min: 0.6, max: 1.5, step: 0.01, def: 1.0 },
];

const rad = (d) => (d * Math.PI) / 180;
const lerp = (a, b, t) => a + (b - a) * t;

function defaultFigure() { return Object.fromEntries(FIGURE_PARAMS.map(p => [p.key, p.def])); }
function clampFigure(input) {
  const s = {};
  for (const p of FIGURE_PARAMS) {
    const v = Number(input?.[p.key]);
    s[p.key] = Number.isFinite(v) ? Math.min(p.max, Math.max(p.min, v)) : p.def;
  }
  return s;
}

/* ==================================================================
 * ГЕНЕРАЦИЯ 3D ТОЧЕК
 * ================================================================== */
function buildFigure(fig) {
  const F = clampFigure(fig);
  const lines = [];

  // 0. Согласование с головой
  // Голова: радиус R=1, центр в 0, подбородок на Z ≈ -1.2
  // Масштабируем голову параметром head_r
  const headR = 1.0 * F.head_r;
  const Z_chin = -1.2 * F.head_r; 
  
  const Z_neck = Z_chin - F.neck_len;
  const Z_pelvis_top = Z_neck - F.S;
  const Z_pelvis_bot = Z_pelvis_top - F.S;

  // Функция сужения (k)
  const k_chest = (z) => {
    const u = Math.max(0, Math.min(1, (z - Z_pelvis_top) / (Z_neck - Z_pelvis_top)));
    return lerp(F.taper_top, 1.0, u);
  };

  // Центры
  const C_chest_z = Z_neck - F.S / 2;
  const C_pelvis_z = Z_pelvis_top - F.S / 2;

  // 1. ГРУДНАЯ КЛЕТКА (Эллипсоид с сужением)
  const chestW = F.chest_w * F.S;
  const chestD = F.chest_d * F.S;
  const chestH = F.S;

  const chestSurf = (phi, theta) => {
    // phi: 0..PI (сверху вниз), theta: 0..2PI
    let x = (chestW / 2) * Math.sin(phi) * Math.cos(theta);
    let y = (chestD / 2) * Math.sin(phi) * Math.sin(theta);
    let z = C_chest_z + (chestH / 2) * Math.cos(phi);

    // Применяем сужение k(z)
    const k = k_chest(z);
    x *= k;
    y *= k;
    return [x, y, z];
  };

  // 2. ТАЗ (Суперэллипсоид)
  const a_pelvis = F.S / 2;
  const c_pelvis = F.S / 2;
  const b_pelvis = F.pelvis_d / 2;
  const n = F.n_pelvis;

  const pelvisSurf = (t, psi) => {
    // t: 0..2PI (контур XZ), psi: 0..2PI (вращение вокруг Z)
    const cosT = Math.cos(t);
    const sinT = Math.sin(t);
    
    // Суперэллипс по XZ
    const x0 = a_pelvis * Math.sign(cosT) * Math.pow(Math.abs(cosT), 2 / n);
    const z0 = c_pelvis * Math.sign(sinT) * Math.pow(Math.abs(sinT), 2 / n);
    
    // Вращение вокруг Z (ось Y)
    const x = x0 * Math.cos(psi);
    const y = b_pelvis * Math.sin(psi);
    const z = C_pelvis_z + z0;
    
    return [x, y, z];
  };

  // 3. ТАЛИЯ (Интерполяция между грудью и тазом)
  const waistZ = Z_pelvis_top + 0.125 * F.S; // середина стыка
  // Ширина талии: интерполяция между низом груди и верхом таза, умноженная на waist_factor
  // Внизу груди ширина = chestW * 1.0 (так как k=1). Вверху таза ширина = S.
  const baseWaistW = lerp(chestW, F.S, 0.5); 
  const waistW = baseWaistW * F.waist_factor;
  const waistD = lerp(chestD, b_pelvis * 2, 0.5) * 0.8; // по глубине тоже сужаем

  // 4. ГЕНЕРАЦИЯ ЛИНИЙ (Контуры)

  // --- Контур торса (вид спереди, X=0) ---
  // Идем от шеи вниз до таза, строим правую и левую стороны
  const torsoR = [];
  const torsoL = [];
  const N_torso = 40;
  
  // Дуга груди (сверху вниз)
  for (let i = 0; i <= N_torso; i++) {
    const t = i / N_torso;
    const phi = Math.PI * t; // от 0 (верх) до PI (низ)
    const p = chestSurf(phi, 0); // theta=0, смотрим на правый бок
    torsoR.push(p);
    torsoL.push([-p[0], p[1], p[2]]);
  }
  
  // Переход в талию (линейно)
  const lastChest = torsoR[torsoR.length - 1];
  torsoR.push([waistW / 2, lastChest[1], waistZ]);
  torsoL.push([-waistW / 2, lastChest[1], waistZ]);

  // Дуга таза (сверху вниз)
  for (let i = 0; i <= N_torso; i++) {
    const t = i / N_torso;
    const angle = lerp(Math.PI / 2, -Math.PI / 2, t); // от верхнего полюса до нижнего
    const p = pelvisSurf(angle, 0); // psi=0, смотрим на правый бок
    torsoR.push(p);
    torsoL.push([-p[0], p[1], p[2]]);
  }

  lines.push({ id: 'torso-r', color: 'blue', pts: torsoR });
  lines.push({ id: 'torso-l', color: 'blue', pts: torsoL });

  // --- Линия талии (горизонтальная) ---
  const waistRing = [];
  for (let i = 0; i <= 32; i++) {
    const a = (i / 32) * Math.PI * 2;
    waistRing.push([(waistW / 2) * Math.cos(a), (waistD / 2) * Math.sin(a), waistZ]);
  }
  lines.push({ id: 'waist', color: 'green', pts: waistRing, closed: true });

  // --- Линия груди (горизонтальная) ---
  const bustZ = C_chest_z - chestH * 0.15; // чуть ниже центра
  const bustRing = [];
  for (let i = 0; i <= 32; i++) {
    const a = (i / 32) * Math.PI * 2;
    // Находим точку на эллипсоиде с этой Z
    // z = C_chest_z + (chestH/2)*cos(phi) => cos(phi) = (z - C_chest_z)/(chestH/2)
    const cosPhi = (bustZ - C_chest_z) / (chestH / 2);
    const phi = Math.acos(cosPhi);
    const p = chestSurf(phi, a);
    bustRing.push(p);
  }
  lines.push({ id: 'bust', color: 'red', pts: bustRing, closed: true });

  // --- Грудь (две полусферы) ---
  if (F.bust_r > 0.01) {
    for (const sx of [1, -1]) {
      const cx = sx * F.bust_x * F.S;
      const cz = C_chest_z - chestH * 0.15;
      const cy = -(chestD / 2) * 0.8; // выступ вперед
      const r = F.bust_r * F.S;
      
      const bustPts = [];
      for (let i = 0; i <= 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        // Рисуем как овал в плоскости XY
        bustPts.push([cx + r * Math.cos(a), cy + r * 0.5 * Math.sin(a), cz + r * 0.3 * Math.cos(a)]);
      }
      lines.push({ id: 'breast-' + (sx > 0 ? 'r' : 'l'), color: 'red', pts: bustPts, closed: true });
    }
  }

  // --- Ноги ---
  const legLen = F.leg_len * F.S;
  const legW = F.leg_w * F.S;
  const legTopZ = Z_pelvis_bot + 0.1 * F.S;
  const legBotZ = Z_pelvis_bot - legLen;
  
  for (const sx of [1, -1]) {
    const legX = sx * F.S * 0.25;
    const legPts = [
      [legX, 0, legTopZ],
      [legX, 0, legTopZ - legLen * 0.5], // колено
      [legX, 0, legBotZ]
    ];
    lines.push({ id: 'leg-' + (sx > 0 ? 'r' : 'l'), color: 'blue', pts: legPts });
    
    // Обводка ноги (контур)
    const contourPts = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      const z = lerp(legTopZ, legBotZ, t);
      const w = lerp(legW, legW * 0.6, t); // сужение к низу
      contourPts.push([legX + w / 2, 0, z]);
    }
    for (let i = 20; i >= 0; i--) {
      const t = i / 20;
      const z = lerp(legTopZ, legBotZ, t);
      const w = lerp(legW, legW * 0.6, t);
      contourPts.push([legX - w / 2, 0, z]);
    }
    contourPts.push(contourPts[0]);
    lines.push({ id: 'leg-contour-' + (sx > 0 ? 'r' : 'l'), color: 'blue', pts: contourPts });
    
    // Стопа (клин)
    const footW = legW * 0.4;
    const footLen = F.S * 0.25;
    const footPts = [
      [legX - footW, -footLen, legBotZ],
      [legX + footW, -footLen, legBotZ],
      [legX + footW * 0.8, 0, legBotZ],
      [legX - footW * 0.8, 0, legBotZ],
      [legX - footW, -footLen, legBotZ]
    ];
    lines.push({ id: 'foot-' + (sx > 0 ? 'r' : 'l'), color: 'green', pts: footPts });
  }

  // --- Руки ---
  const armW = F.arm_w * F.S;
  const shoulderX = F.chest_w * F.S * 0.5 * F.taper_top;
  const shoulderZ = Z_neck - 0.15 * F.S;
  const elbowZ = Z_pelvis_top + 0.1 * F.S; // локоть на уровне таза
  const wristZ = Z_pelvis_bot - 0.1 * F.S; // запястье на уровне бедра
  
  for (const sx of [1, -1]) {
    const shX = sx * shoulderX;
    const elX = sx * (shoulderX + 0.1 * F.S);
    const wrX = sx * (shoulderX + 0.15 * F.S);
    
    // Ось руки
    lines.push({ 
      id: 'arm-axis-' + (sx > 0 ? 'r' : 'l'), 
      color: 'green', 
      pts: [[shX, 0, shoulderZ], [elX, 0, elbowZ], [wrX, 0, wristZ]] 
    });
    
    // Контур руки
    const armContour = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      const x = lerp(shX, wrX, t);
      const z = lerp(shoulderZ, wristZ, t);
      const w = lerp(armW, armW * 0.7, t);
      armContour.push([x + w / 2, 0, z]);
    }
    for (let i = 20; i >= 0; i--) {
      const t = i / 20;
      const x = lerp(shX, wrX, t);
      const z = lerp(shoulderZ, wristZ, t);
      const w = lerp(armW, armW * 0.7, t);
      armContour.push([x - w / 2, 0, z]);
    }
    armContour.push(armContour[0]);
    lines.push({ id: 'arm-contour-' + (sx > 0 ? 'r' : 'l'), color: 'blue', pts: armContour });
  }

  // --- ГОЛОВА (круг с крестом) ---
  const headCenterZ = 0; // Центр головы в 0
  const headCircle = [];
  for (let i = 0; i <= 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    headCircle.push([headR * Math.cos(a), 0, headCenterZ + headR * Math.sin(a)]);
  }
  lines.push({ id: 'head-outline', color: 'blue', pts: headCircle, closed: true });
  // Крест
  lines.push({ id: 'head-cross-v', color: 'green', pts: [[0, 0, headCenterZ + headR], [0, 0, headCenterZ - headR]] });
  lines.push({ id: 'head-cross-h', color: 'green', pts: [[-headR, 0, headCenterZ], [headR, 0, headCenterZ]] });

  // --- ПОЗВОНОЧНИК (осевая линия) ---
  const spine = [];
  for (let i = 0; i <= 30; i++) {
    const t = i / 30;
    const z = lerp(headCenterZ - headR, Z_pelvis_bot, t);
    // Небольшой S-образный изгиб
    const y = 0.05 * F.S * Math.sin(t * Math.PI * 1.5);
    spine.push([0, y, z]);
  }
  lines.push({ id: 'spine', color: 'green', pts: spine });

  return { lines, labels: {}, solid: {} };
}

/* ==================================================================
 * СОСТОЯНИЕ
 * ================================================================== */
const STORE_KEY = 'loomis-figure:v1';
let state = loadState();

function wrapYaw(y) { return ((((y + 180) % 360) + 360) % 360) - 180; }

function loadState() {
  const def = {
    figure: defaultFigure(),
    view: { yaw: 0 },
  };
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (!raw) return def;
    return {
      ...def,
      figure: clampFigure(raw.figure),
      view: { yaw: Number.isFinite(raw.view?.yaw) ? wrapYaw(raw.view.yaw) : 0 },
    };
  } catch { return def; }
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
  }, 300);
}

/* ==================================================================
 * РЕНДЕР SVG
 * ================================================================== */
const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('canvas');
const VIEW_SIZE = 600;
const CX = VIEW_SIZE / 2, CY = VIEW_SIZE / 2;
const SCALE = 45; // Масштаб для фигуры

const gVisible = document.createElementNS(SVG_NS, 'g');
svg.appendChild(gVisible);

function rotate(p) {
  const yaw = rad(state.view.yaw);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  // Yaw вокруг Z (вертикаль). В нашей системе Z - вверх.
  const x1 = p[0] * cy - p[1] * sy;
  const y1 = p[0] * sy + p[1] * cy;
  return [x1, y1, p[2]];
}

function project(p) {
  const r = rotate(p);
  // X - вправо, Y - вперед/назад (глубина), Z - вверх
  return { x: CX + r[0] * SCALE, y: CY - r[2] * SCALE, depth: r[1] };
}

function lineToPath(pts, closed) {
  if (!pts.length) return '';
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) d += `L${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;
  if (closed) d += 'Z';
  return d;
}

function render() {
  const fig = buildFigure(state.figure);
  gVisible.innerHTML = '';

  const strokeW = 2; // Толщина линии

  for (const l of fig.lines) {
    const projected = l.pts.map((p) => project(p));
    
    // Проверка видимости для замкнутых линий (упрощенно)
    let visible = true;
    if (l.closed) {
      const avgDepth = projected.reduce((s, p) => s + p.depth, 0) / projected.length;
      visible = avgDepth > -0.1; // Если средняя глубина > -0.1, считаем видимой
    }

    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', lineToPath(projected, l.closed));
    path.setAttribute('fill', 'none');
    
    let strokeColor = '#3b7cff'; // blue
    if (l.color === 'red') strokeColor = '#f03e6e';
    if (l.color === 'green') strokeColor = '#2ecc71';
    
    path.setAttribute('stroke', strokeColor);
    path.setAttribute('stroke-width', strokeW.toFixed(2));
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    
    if (!visible) {
      path.setAttribute('stroke-opacity', '0.2');
      path.setAttribute('stroke-dasharray', '4 4');
    }
    
    gVisible.appendChild(path);
  }
}

/* ==================================================================
 * UI
 * ================================================================== */
const $ = (id) => document.getElementById(id);

function updateViewName() {
  const y = state.view.yaw;
  const ay = Math.abs(y);
  let name = 'Анфас';
  if (ay > 22 && ay <= 68) name = y > 0 ? '3/4 влево' : '3/4 вправо';
  else if (ay > 68 && ay <= 112) name = y > 0 ? 'Профиль влево' : 'Профиль вправо';
  else if (ay > 112) name = 'Спина';
  $('view-name').textContent = `${name} · ${Math.round(y)}°`;
}

const yawInput = $('yaw');
yawInput.addEventListener('input', () => {
  stopSpin();
  state.view.yaw = wrapYaw(Number(yawInput.value));
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  render(); updateViewName(); save();
});

document.querySelectorAll('[data-angle]').forEach((b) => {
  b.addEventListener('click', () => {
    stopSpin();
    const angles = { front: 0, side: 90 };
    const yaw = angles[b.dataset.angle] || 0;
    state.view.yaw = yaw;
    yawInput.value = yaw;
    $('yaw-out').textContent = yaw + '°';
    render(); updateViewName(); save();
  });
});

$('reset-view').addEventListener('click', () => {
  stopSpin();
  state.view.yaw = 0;
  yawInput.value = 0;
  $('yaw-out').textContent = '0°';
  render(); updateViewName(); save();
});

let spinRAF = 0;
const spinBtn = $('spin');
function stopSpin() {
  if (spinRAF) { cancelAnimationFrame(spinRAF); spinRAF = 0; }
  spinBtn.setAttribute('aria-pressed', 'false');
}
spinBtn.addEventListener('click', () => {
  const on = spinBtn.getAttribute('aria-pressed') !== 'true';
  spinBtn.setAttribute('aria-pressed', String(on));
  if (on) {
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(64, now - last);
      last = now;
      state.view.yaw = wrapYaw(state.view.yaw + dt * 0.04);
      yawInput.value = state.view.yaw;
      $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
      render(); updateViewName();
      spinRAF = requestAnimationFrame(tick);
    };
    spinRAF = requestAnimationFrame(tick);
  } else {
    stopSpin(); save();
  }
});

// Слайдеры
const figSyncers = [];
const figHost = $('figure-sliders');
for (const p of FIGURE_PARAMS) {
  const row = document.createElement('div'); row.className = 'slider';
  const id = `fig-${p.key}`;
  row.innerHTML = `<label for="${id}">${p.label}</label>
    <input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}">
    <output for="${id}"></output>`;
  figHost.appendChild(row);
  const input = row.querySelector('input'), out = row.querySelector('output');
  const fmt = (v) => v.toFixed(2);
  const sync = () => { input.value = state.figure[p.key]; out.textContent = fmt(state.figure[p.key]); };
  input.addEventListener('input', () => {
    state.figure[p.key] = Number(input.value);
    out.textContent = fmt(Number(input.value));
    render(); save();
  });
  sync(); figSyncers.push(sync);
}

/* ==================================================================
 * DRAG
 * ================================================================== */
const stage = $('stage');
let dragStart = null;
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('aside')) return;
  stopSpin();
  dragStart = { x: e.clientX, yaw: state.view.yaw };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart.x;
  state.view.yaw = wrapYaw(dragStart.yaw + dx * 0.5);
  yawInput.value = state.view.yaw;
  $('yaw-out').textContent = Math.round(state.view.yaw) + '°';
  render(); updateViewName();
});
stage.addEventListener('pointerup', () => { dragStart = null; save(); });
stage.addEventListener('pointercancel', () => { dragStart = null; save(); });

/* ==================================================================
 * ЗАПУСК
 * ================================================================== */
render();
updateViewName();
</script>
</body>
</html>
