<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Силуэт персонажа</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #111; color: #eee; padding: 16px;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .panel {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    margin-bottom: 16px; background: #1c1c1c; padding: 12px; border-radius: 8px;
  }
  .panel label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 120px; }
  button, input[type=file]::file-selector-button {
    background: #2d7df6; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  button:hover, input[type=file]::file-selector-button:hover { background: #1f66d0; }
  .stage {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }
  .cell {
    background: #000; border-radius: 8px; overflow: hidden; position: relative;
  }
  .cell canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .cell .label {
    position: absolute; top: 6px; left: 6px; font-size: 11px;
    background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 4px;
  }
  .status { font-size: 12px; color: #9aa; }
</style>
</head>
<body>

<h1>Определение силуэта персонажа</h1>

<div class="panel">
  <input type="file" id="file" accept="image/*">
  <label>Порог <input type="range" id="thr" min="0" max="100" value="25"><span id="thrv">25</span>%</label>
  <label>Шум <input type="range" id="noise" min="0" max="100" value="50"><span id="noisev">50</span>%</label>
  <button id="save">Скачать PNG</button>
  <span class="status" id="status">Загрузите изображение</span>
</div>

<div class="stage">
  <div class="cell"><span class="label">Оригинал</span><canvas id="c0"></canvas></div>
  <div class="cell"><span class="label">Маска (бинаризация)</span><canvas id="c1"></canvas></div>
  <div class="cell"><span class="label">Силуэт (итог)</span><canvas id="c2"></canvas></div>
</div>

<script>
/* ===================== УТИЛИТЫ ===================== */

const MAX_SIDE = 700; // ограничение для скорости обработки

function drawToCanvas(img, maxSide = MAX_SIDE) {
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  return c;
}

// Яркость 0..255
function luminance(d, i) {
  return (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
}

// Медианный цвет по краям (оценка фона)
function estimateBackground(data, w, h) {
  const samples = [[], [], []];
  const step = Math.max(1, Math.floor((w + h) / 200));
  const pushPx = (x, y) => {
    const i = (y * w + x) * 4;
    samples[0].push(data[i]);
    samples[1].push(data[i + 1]);
    samples[2].push(data[i + 2]);
  };
  for (let x = 0; x < w; x += step) { pushPx(x, 0); pushPx(x, h - 1); }
  for (let y = 0; y < h; y += step) { pushPx(0, y); pushPx(w - 1, y); }
  return samples.map(arr => {
    arr.sort((a, b) => a - b);
    return arr[arr.length >> 1];
  });
}

/* ===================== АЛГОРИТМ ===================== */

function detectSilhouette(srcCanvas, thresholdPercent, noisePercent) {
  const w = srcCanvas.width, h = srcCanvas.height;
  const ctx = srcCanvas.getContext('2d', { willReadFrequently: true });
  const img = ctx.getImageData(0, 0, w, h);
  const data = img.data;

  const [bgR, bgG, bgB] = estimateBackground(data, w, h);
  const bgLum = (bgR * 0.299 + bgG * 0.587 + bgB * 0.114);

  // Порог по разнице с фоном
  const thr = (thresholdPercent / 100) * 160 + 10;

  // 1) Бинаризация: пиксель принадлежит персонажу, если отличается от фона
  let mask = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    const dr = data[i] - bgR;
    const dg = data[i + 1] - bgG;
    const db = data[i + 2] - bgB;
    const dist = Math.sqrt(dr * dr + dg * dg + db * db);
    const lum = luminance(data, i);
    // Комбинируем отличие по цвету и по яркости
    const score = Math.max(dist, Math.abs(lum - bgLum));
    mask[p] = score > thr ? 1 : 0;
  }

  // 2) Шумоподавление — медианный фильтр 3x3 по маске
  const medianPasses = Math.round((noisePercent / 100) * 2); // 0..2
  for (let k = 0; k < medianPasses; k++) {
    mask = median3(mask, w, h);
  }

  // 3) Морфологические операции: сначала закрытие (заполнить дырки), потом открытие
  mask = dilate(mask, w, h, 1);
  mask = erode(mask, w, h, 1);
  mask = dilate(mask, w, h, 2);
  mask = erode(mask, w, h, 2);

  // 4) Оставляем только крупнейшую связную компоненту (персонаж)
  mask = largestComponent(mask, w, h);

  // 5) Заполняем внутренние дырки (flood fill от границ по «пустому»)
  mask = fillHoles(mask, w, h);

  // 6) Сглаживание краёв: сгладим маску гауссом и снова порог
  mask = smoothMask(mask, w, h);

  return { mask, w, h, bg: [bgR, bgG, bgB] };
}

/* ---------- Морфология ---------- */

function dilate(mask, w, h, r) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let v = 0;
      outer:
      for (let dy = -r; dy <= r; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= h) continue;
        for (let dx = -r; dx <= r; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= w) continue;
          if (mask[yy * w + xx]) { v = 1; break outer; }
        }
      }
      out[y * w + x] = v;
    }
  }
  return out;
}

function erode(mask, w, h, r) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let v = 1;
      outer:
      for (let dy = -r; dy <= r; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= h) continue;
        for (let dx = -r; dx <= r; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= w) continue;
          if (!mask[yy * w + xx]) { v = 0; break outer; }
        }
      }
      out[y * w + x] = v;
    }
  }
  return out;
}

function median3(mask, w, h) {
  const out = new Uint8Array(w * h);
  const buf = new Uint8Array(9);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let n = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= w) continue;
          buf[n++] = mask[yy * w + xx];
        }
      }
      // сортировка первых n
      const arr = Array.prototype.slice.call(buf, 0, n).sort((a, b) => a - b);
      out[y * w + x] = arr[arr.length >> 1];
    }
  }
  return out;
}

/* ---------- Связные компоненты ---------- */

function largestComponent(mask, w, h) {
  const labels = new Int32Array(w * h).fill(-1);
  const sizes = [];
  const stack = new Int32Array(w * h);
  let label = 0;

  for (let start = 0; start < w * h; start++) {
    if (mask[start] && labels[start] === -1) {
      let sp = 0;
      stack[sp++] = start;
      labels[start] = label;
      let size = 0;
      while (sp > 0) {
        const p = stack[--sp];
        size++;
        const x = p % w, y = (p / w) | 0;
        // 4-соседство
        if (x > 0) { const q = p - 1; if (mask[q] && labels[q] === -1) { labels[q] = label; stack[sp++] = q; } }
        if (x < w - 1) { const q = p + 1; if (mask[q] && labels[q] === -1) { labels[q] = label; stack[sp++] = q; } }
        if (y > 0) { const q = p - w; if (mask[q] && labels[q] === -1) { labels[q] = label; stack[sp++] = q; } }
        if (y < h - 1) { const q = p + w; if (mask[q] && labels[q] === -1) { labels[q] = label; stack[sp++] = q; } }
      }
      sizes.push(size);
      label++;
    }
  }

  if (label === 0) return mask;
  let best = 0;
  for (let i = 1; i < sizes.length; i++) if (sizes[i] > sizes[best]) best = i;

  const out = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) if (labels[i] === best) out[i] = 1;
  return out;
}

/* ---------- Заполнение дырок ---------- */

function fillHoles(mask, w, h) {
  // BFS по «пустым» от границ — всё, что не достижимо, является дыркой
  const visited = new Uint8Array(w * h);
  const stack = new Int32Array(w * h);
  let sp = 0;

  const push = (p) => {
    if (!mask[p] && !visited[p]) { visited[p] = 1; stack[sp++] = p; }
  };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }

  while (sp > 0) {
    const p = stack[--sp];
    const x = p % w, y = (p / w) | 0;
    if (x > 0) push(p - 1);
    if (x < w - 1) push(p + 1);
    if (y > 0) push(p - w);
    if (y < h - 1) push(p + w);
  }

  const out = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    out[i] = mask[i] || (!visited[i]) ? 1 : 0;
  }
  return out;
}

/* ---------- Сглаживание маски (гаусс 3x3) ---------- */

function smoothMask(mask, w, h) {
  const kernel = [1, 2, 1, 2, 4, 2, 1, 2, 1];
  const sum = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let acc = 0, k = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy;
        const cy = yy < 0 ? 0 : yy >= h ? h - 1 : yy;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx;
          const cx = xx < 0 ? 0 : xx >= w ? w - 1 : xx;
          acc += mask[cy * w + cx] * kernel[k++];
        }
      }
      sum[y * w + x] = acc / 16;
    }
  }
  const out = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) out[i] = sum[i] >= 0.5 ? 1 : 0;
  return out;
}

/* ===================== ОТРИСОВКА ===================== */

function renderOriginal(srcCanvas, dstCanvas) {
  dstCanvas.width = srcCanvas.width;
  dstCanvas.height = srcCanvas.height;
  dstCanvas.getContext('2d').drawImage(srcCanvas, 0, 0);
}

function renderMask(mask, w, h, dstCanvas) {
  dstCanvas.width = w; dstCanvas.height = h;
  const ctx = dstCanvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let i = 0, p = 0; p < w * h; p++, i += 4) {
    const v = mask[p] ? 255 : 0;
    img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function renderSilhouette(srcCanvas, mask, w, h, dstCanvas) {
  dstCanvas.width = w; dstCanvas.height = h;
  const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
  const src = srcCtx.getImageData(0, 0, w, h).data;
  const ctx = dstCanvas.getContext('2d');
  const out = ctx.createImageData(w, h);

  for (let i = 0, p = 0; p < w * h; p++, i += 4) {
    if (mask[p]) {
      // Персонаж — тёмный силуэт с лёгкой подложкой исходного цвета
      const r = src[i], g = src[i + 1], b = src[i + 2];
      out.data[i]     = (r * 0.25) | 0;
      out.data[i + 1] = (g * 0.25) | 0;
      out.data[i + 2] = (b * 0.25) | 0;
      out.data[i + 3] = 255;
    } else {
      out.data[i] = 20; out.data[i + 1] = 20; out.data[i + 2] = 30;
      out.data[i + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);

  // Обводка контура
  ctx.strokeStyle = '#39ff88';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = y * w + x;
      if (!mask[p]) continue;
      // граница = персонаж рядом с фоном
      const edge =
        (x === 0 || !mask[p - 1]) ||
        (x === w - 1 || !mask[p + 1]) ||
        (y === 0 || !mask[p - w]) ||
        (y === h - 1 || !mask[p + w]);
      if (edge) {
        ctx.moveTo(x, y);
        ctx.lineTo(x + 1, y + 1);
      }
    }
  }
  ctx.stroke();
}

/* ===================== UI ===================== */

const fileInput = document.getElementById('file');
const thrInput = document.getElementById('thr');
const thrVal = document.getElementById('thrv');
const noiseInput = document.getElementById('noise');
const noiseVal = document.getElementById('noisev');
const statusEl = document.getElementById('status');
const saveBtn = document.getElementById('save');

const c0 = document.getElementById('c0');
const c1 = document.getElementById('c1');
const c2 = document.getElementById('c2');

let srcCanvas = null;

function process() {
  if (!srcCanvas) return;
  const thr = +thrInput.value;
  const noise = +noiseInput.value;
  const t0 = performance.now();

  const { mask, w, h } = detectSilhouette(srcCanvas, thr, noise);
  renderMask(mask, w, h, c1);
  renderSilhouette(srcCanvas, mask, w, h, c2);

  const dt = (performance.now() - t0).toFixed(0);
  const area = mask.reduce((a, b) => a + b, 0);
  const pct = ((area / (w * h)) * 100).toFixed(1);
  statusEl.textContent = `${w}×${h} · ${dt} мс · силуэт ${pct}% площади`;
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    srcCanvas = drawToCanvas(img);
    renderOriginal(srcCanvas, c0);
    process();
  };
  img.onerror = () => { statusEl.textContent = 'Не удалось загрузить изображение'; };
  img.src = url;
});

thrInput.addEventListener('input', () => { thrVal.textContent = thrInput.value; process(); });
noiseInput.addEventListener('input', () => { noiseVal.textContent = noiseInput.value; process(); });

saveBtn.addEventListener('click', () => {
  if (!c2.width) return;
  const a = document.createElement('a');
  a.download = 'silhouette.png';
  a.href = c2.toDataURL('image/png');
  a.click();
});

statusEl.textContent = 'Загрузите изображение';
</script>
</body>
</html>
