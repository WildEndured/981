<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг 1. Пропорции</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #1e1e24;
    color: #e6e6e6;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: .9rem;
  }
  input[type="range"] { width: 200px; accent-color: #e8b04b; }
  canvas { background: #2a2a33; border-radius: 8px; }
</style>
</head>
<body>

<div class="controls">
  <label>Частей (голов): <span id="val">7</span></label>
  <input id="range" type="range" min="3" max="10" value="7" step="1">
</div>

<canvas id="canvas" width="300" height="600"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const range = document.getElementById('range');
const val = document.getElementById('val');

function draw(parts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pad = 20;
  const top = pad;
  const bottom = canvas.height - pad;
  const height = bottom - top;
  const step = height / parts;
  const left = 20;
  const right = canvas.width - 20;

  // Горизонтальные линии — деление на равные части
  ctx.strokeStyle = '#4a4a5a';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#b8b8c0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  for (let i = 0; i <= parts; i++) {
    const y = top + i * step;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();

    if (i < parts) {
      ctx.fillText(i + 1, right - 16, y + step / 2);
    }
  }

  // Осевая вертикаль
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.setLineDash([4, 6]);
  const cx = canvas.width / 2;
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(cx, bottom);
  ctx.stroke();
  ctx.setLineDash([]);
}

range.addEventListener('input', () => {
  const n = parseInt(range.value);
  val.textContent = n;
  draw(n);
});

draw(7);
</script>
</body>
</html>
