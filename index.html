<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineart Highlighter (4 Corners Fixed)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { font-size: 1.1rem; text-align: center; margin-bottom: 15px; }
        .controls { margin-bottom: 20px; }

        input[type="file"] { display: none; }

        .upload-btn {
            background-color: #ff4757;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            max-width: 100%;
            max-height: 80vh;
            border: 2px solid #333;
            background: #000;
            display: none;
            overflow: hidden;
        }

        #imageCanvas, #overlayCanvas {
            display: block;
            max-width: 100%;
            max-height: 80vh;
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .loader { display: none; color: #ff4757; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Авто-штриховка (4 угла - исправлено)</h1>

    <div class="controls">
        <label for="imageInput" class="upload-btn">Выбрать изображение</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="loader" id="loader">Обработка...</div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const imageCanvas = document.getElementById('imageCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const loader = document.getElementById('loader');

        const imgCtx = imageCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');

        // --- НАСТРОЙКИ ---
        const DARKNESS_THRESHOLD = 130; 
        const SATURATION_THRESHOLD = 25; 
        const LOOKAHEAD = 4;

        const STRIPE_COLOR = '#ff4757';
        const STRIPE_WIDTH = 4;     
        const STRIPE_GAP = 18;      
        const SCAN_STEP = 2;        

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loader.style.display = 'block';
            canvasContainer.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => processImage(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processImage(img) {
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.floor(height * (MAX_WIDTH / width));
                width = MAX_WIDTH;
            }

            imageCanvas.width = width;
            imageCanvas.height = height;
            overlayCanvas.width = width;
            overlayCanvas.height = height;

            imgCtx.drawImage(img, 0, 0, width, height);
            const imageData = imgCtx.getImageData(0, 0, width, height);
            const data = imageData.data;

            overlayCtx.clearRect(0, 0, width, height);
            
            // Запускаем отрисовку из 4 углов
            drawFromCorner(data, width, height, 'top-left');
            drawFromCorner(data, width, height, 'top-right');
            drawFromCorner(data, width, height, 'bottom-left');
            drawFromCorner(data, width, height, 'bottom-right');

            loader.style.display = 'none';
            canvasContainer.style.display = 'block';
        }

        function getPixel(data, width, height, x, y) {
            if (x < 0 || x >= width || y < 0 || y >= height) return null;
            const index = (y * width + x) * 4;
            return { r: data[index], g: data[index+1], b: data[index+2], a: data[index+3] };
        }

        function isCharacterPixel(data, width, height, x, y) {
            const p = getPixel(data, width, height, x, y);
            if (!p || p.a < 50) return false;

            const brightness = (p.r + p.g + p.b) / 3;
            if (brightness < DARKNESS_THRESHOLD) return true;

            const max = Math.max(p.r, p.g, p.b);
            const min = Math.min(p.r, p.g, p.b);
            const saturation = max - min;

            if (saturation > SATURATION_THRESHOLD) return true;
            return false;
        }

        function isCharacterAhead(data, width, height, x, y, dx, dy) {
            for (let i = 1; i <= LOOKAHEAD; i++) {
                if (isCharacterPixel(data, width, height, Math.floor(x + dx * i), Math.floor(y + dy * i))) {
                    return true;
                }
            }
            return false;
        }

        // Универсальная функция для рисования из угла
        function drawFromCorner(data, width, height, corner) {
            overlayCtx.strokeStyle = STRIPE_COLOR;
            overlayCtx.lineCap = 'butt'; 
            overlayCtx.lineWidth = STRIPE_WIDTH;

            const step = STRIPE_WIDTH + STRIPE_GAP;
            
            let startX, startY, dx, dy, limitX, limitY;

            // Настраиваем параметры для каждого угла
            switch(corner) {
                case 'top-left':
                    startX = -height; startY = 0; // Начинаем с верхнего левого угла
                    dx = 1; dy = 1;               // Идем вправо-вниз
                    limitX = width; limitY = height;
                    break;
                case 'top-right':
                    startX = width + height; startY = 0; // Начинаем с верхнего правого угла
                    dx = -1; dy = 1;                     // Идем влево-вниз
                    limitX = 0; limitY = height;
                    break;
                case 'bottom-left':
                    startX = -height; startY = height;   // Начинаем с нижнего левого угла
                    dx = 1; dy = -1;                     // Идем вправо-вверх
                    limitX = width; limitY = 0;
                    break;
                case 'bottom-right':
                    startX = width + height; startY = height; // Начинаем с нижнего правого угла
                    dx = -1; dy = -1;                         // Идем влево-вверх
                    limitX = 0; limitY = 0;
                    break;
            }

            // Определяем, сколько линий нужно нарисовать, чтобы покрыть весь холст
            // Количество шагов = (ширина + высота) / шаг
            const numLines = Math.ceil((width + height) / step) + 2;

            for (let i = 0; i < numLines; i++) {
                // Вычисляем стартовую точку для текущей линии
                let currentX = startX + i * step; // Смещаем по X
                let currentY = startY;            // Y остается на краю

                // Корректируем стартовую точку, если она выходит за пределы холста
                if (dx === 1 && currentX < 0) {
                    currentY = -currentX; // Сдвигаем вниз по левому краю
                    currentX = 0;
                } else if (dx === -1 && currentX > width) {
                    currentY = currentX - width; // Сдвигаем вниз по правому краю
                    currentX = width;
                }

                // Если стартовая точка вне холста, пропускаем
                if (currentX < 0 || currentX > width || currentY < 0 || currentY > height) continue;

                // Пропускаем линию, если она начинается уже внутри персонажа
                if (isCharacterPixel(data, width, height, Math.floor(currentX), Math.floor(currentY))) {
                    continue;
                }

                overlayCtx.beginPath();
                overlayCtx.moveTo(currentX, currentY);

                let hitCharacter = false;
                let x = currentX;
                let y = currentY;

                // Сканируем в направлении (dx, dy)
                while (x >= 0 && x <= width && y >= 0 && y <= height) {
                    if (isCharacterAhead(data, width, height, Math.floor(x), Math.floor(y), dx, dy)) {
                        hitCharacter = true;
                        break;
                    }
                    x += dx * SCAN_STEP;
                    y += dy * SCAN_STEP;
                }

                if (hitCharacter) {
                    overlayCtx.lineTo(x, y);
                    overlayCtx.stroke();
                }
            }
        }
    </script>
</body>
</html>
