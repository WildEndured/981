<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Силуэт персонажа</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: center;
    padding: 10px 14px;
    background: #1d2027; border-radius: 10px;
    max-width: min(92vw, 900px);
  }
  .controls label {
    font-size: 13px;
    display: flex; gap: 6px; align-items: center;
  }
  input[type="file"] { font-size: 13px; }
  input[type="range"] { width: 140px; }
  input[type="color"] {
    width: 34px; height: 26px; border: none; background: none;
    padding: 0; cursor: pointer;
  }
  button {
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid #333; background: #262a32; color: #e6e6e6;
    cursor: pointer;
  }
  button:hover { background: #303540; }
  button.active { background: #3a5; border-color: #4c7; color: #fff; }
  .stage {
    position: relative;
    display: inline-block;
    border: 1px solid #2b2f37;
    background: #0b0c0f;
    touch-action: none;
  }
  .stage.hide canvas#base { opacity: 0; }
  .stage.hide { background: #ffffff; }
  .stage canvas {
    display: block;
    max-width: min(92vw, 900px);
    height: auto;
  }
  .stage canvas#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .stage.edit canvas#overlay { pointer-events: auto; cursor: crosshair; }
  .info {
    font-size: 13px;
    color: #b9c3d1;
    text-align: center;
    max-width: min(92vw, 900px);
  }
  .info b { color: #e6e6e6; }
  .hint { color: #8a93a3; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
</style>
</head>
<body>

<div class="controls">
  <label>Файл:
    <input id="file" type="file" accept="image/*" />
  </label>
  <label>Порог:
    <input id="bgLum" type="range" min="0" max="255" value="200" />
    <span id="bgLumVal">200</span>
  </label>
  <label>Цвет маски:
    <input id="maskColor" type="color" value="#ffffff" />
  </label>
  <label>
    <input id="hideImage" type="checkbox" />
    Скрыть изображение
  </label>
</div>

<div class="controls">
  <button id="btnPick" title="Кликните по фону на изображении, чтобы добавить точку-образец">+ Добавить точку фона</button>
  <button id="btnClearPoints">Очистить точки</button>
  <label>Допуск:
    <input id="tolerance" type="range" min="0" max="120" value="30" />
    <span id="toleranceVal">30</span>
  </label>
  <label>
    <input id="showPoints" type="checkbox" checked />
    Показывать точки
  </label>
</div>

<div class="stage" id="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div class="info" id="info">
  Загрузите изображение. Затем нажмите «+ Добавить точку фона» и кликните по фону.
  <div class="hint">Точки можно перетаскивать мышью. Правый клик по точке — удалить.</div>
</div>

<script>
(function () {
  const fileInput     = document.getElementById('file');
  const bgLumInput    = document.getElementById('bgLum');
  const bgLumVal      = document.getElementById('bgLumVal');
  const maskColorInp  = document.getElementById('maskColor');
  const hideImageChk  = document.getElementById('hideImage');
  const toleranceInp  = document.getElementById('tolerance');
  const toleranceVal  = document.getElementById('toleranceVal');
  const showPointsChk = document.getElementById('showPoints');
  const btnPick       = document.getElementById('btnPick');
  const btnClear      = document.getElementById('btnClearPoints');
  const stage         = document.getElementById('stage');
  const base          = document.getElementById('base');
  const overlay       = document.getElementById('overlay');
  const info          = document.getElementById('info');

  const bctx = base.getContext('2d');
  const octx = overlay.getContext('2d', { willReadFrequently: true });

  let img = null;             // HTMLImageElement
  let srcData = null;         // исходные пиксели {data,width,height}
  let maskImageData = null;   // ImageData для маски
  let points = [];            // [{x,y}] в координатах исходного изображения
  let pickMode = false;
  let dragIndex = -1;
  let hoverIndex = -1;
  const POINT_R = 8;          // радиус точки в экранных пикселях

  // ---------- Утилиты ----------
  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : { r:255,g:255,b:255 };
  }

  function fitOverlay() {
    overlay.width  = base.width;
    overlay.height = base.height;
    overlay.style.width  = base.clientWidth + 'px';
    overlay.style.height = base.clientHeight + 'px';
  }

  function scaleFactor() {
    // отношение внутренних пикселей canvas к CSS-пикселям
    return base.width / (base.clientWidth || 1);
  }

  // ---------- Загрузка ----------
  fileInput.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      img = im;
      base.width = im.naturalWidth;
      base.height = im.naturalHeight;
      base.style.width  = '';
      base.style.height = '';
      bctx.clearRect(0,0,base.width,base.height);
      bctx.drawImage(im, 0, 0);
      srcData = bctx.getImageData(0,0,base.width,base.height);
      maskImageData = bctx.createImageData(base.width, base.height);
      points = [];
      fitOverlay();
      // стартовая точка — центр
      points.push({ x: Math.floor(base.width/2), y: Math.floor(base.height/2) });
      recompute();
      info.innerHTML = `Изображение: <b>${base.width}×${base.height}</b>. ` +
        `Нажмите «+ Добавить точку фона» и кликните по фону.`;
      URL.revokeObjectURL(url);
    };
    im.onerror = () => info.textContent = 'Не удалось загрузить изображение';
    im.src = url;
  });

  // ---------- Основной алгоритм: flood fill от точек-образцов ----------
  function recompute() {
    if (!srcData || !maskImageData) return;

    const w = srcData.width, h = srcData.height;
    const src = srcData.data;
    const dst = maskImageData.data;

    const tol = parseInt(toleranceInp.value, 10);
    const lum = parseInt(bgLumInput.value, 10);

    const { r: mr, g: mg, b: mb } = hexToRgb(maskColorInp.value);

    // Обнуление маски
    for (let i = 0; i < dst.length; i += 4) {
      dst[i] = mr; dst[i+1] = mg; dst[i+2] = mb; dst[i+3] = 0;
    }

    if (!points.length) {
      // нет точек — пустая маска
      bctx.putImageData(srcData, 0, 0);
      drawOverlay();
      return;
    }

    // Используем BFS от всех точек одновременно (multi-source flood fill).
    // Для каждого семпла берём его цвет и проверяем похожесть пикселя
    // на ЛЮБОЙ из семплов в пределах допуска.
    const samples = points.map(p => {
      const x = Math.max(0, Math.min(w - 1, Math.round(p.x)));
      const y = Math.max(0, Math.min(h - 1, Math.round(p.y)));
      const i = (y * w + x) * 4;
      return { r: src[i], g: src[i+1], b: src[i+2] };
    });

    const visited = new Uint8Array(w * h);
    const queue = [];

    // Инициализация: все точки
    for (const p of points) {
      const x = Math.max(0, Math.min(w - 1, Math.round(p.x)));
      const y = Math.max(0, Math.min(h - 1, Math.round(p.y)));
      const idx = y * w + x;
      if (!visited[idx]) {
        visited[idx] = 1;
        queue.push(idx);
      }
    }

    const tolSq = tol * tol * 3; // грубый квадрат расстояния

    function matches(x, y) {
      const i = (y * w + x) * 4;
      // Порог по яркости: слишком яркие пиксели не считаем фоном
      const l = 0.299 * src[i] + 0.587 * src[i+1] + 0.114 * src[i+2];
      if (l >= lum) return false;
      // Похожесть на любой из образцов
      for (let s = 0; s < samples.length; s++) {
        const dr = src[i] - samples[s].r;
        const dg = src[i+1] - samples[s].g;
        const db = src[i+2] - samples[s].b;
        if (dr*dr + dg*dg + db*db <= tolSq) return true;
      }
      return false;
    }

    // BFS
    let head = 0;
    while (head < queue.length) {
      const idx = queue[head++];
      const x = idx % w;
      const y = (idx - x) / w;

      // закраска маски
      const di = idx * 4;
      dst[di+3] = 255;

      // соседи
      const neigh = [];
      if (x > 0)     neigh.push(idx - 1);
      if (x < w - 1) neigh.push(idx + 1);
      if (y > 0)     neigh.push(idx - w);
      if (y < h - 1) neigh.push(idx + w);

      for (const n of neigh) {
        if (visited[n]) continue;
        const nx = n % w;
        const ny = (n - nx) / w;
        if (matches(nx, ny)) {
          visited[n] = 1;
          queue.push(n);
        } else {
          visited[n] = 2; // помечаем как проверенный "не фон", чтобы не проверять снова
        }
      }
    }

    drawOverlay();
  }

  function drawOverlay() {
    if (!maskImageData) return;
    // Рисуем маску на overlay
    octx.clearRect(0, 0, overlay.width, overlay.height);
    octx.putImageData(maskImageData, 0, 0);

    // Рисуем точки
    if (showPointsChk.checked) {
      const sf = scaleFactor();
      const r = POINT_R / sf; // радиус в пикселях canvas
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        octx.beginPath();
        octx.arc(p.x, p.y, r, 0, Math.PI * 2);
        octx.fillStyle = (i === hoverIndex) ? 'rgba(255,180,0,0.85)'
                       : (i === dragIndex) ? 'rgba(80,255,120,0.9)'
                       : 'rgba(255,80,80,0.8)';
        octx.fill();
        octx.lineWidth = 2 / sf;
        octx.strokeStyle = '#fff';
        octx.stroke();
        // крестик в центре
        octx.beginPath();
        octx.moveTo(p.x - r*0.6, p.y);
        octx.lineTo(p.x + r*0.6, p.y);
        octx.moveTo(p.x, p.y - r*0.6);
        octx.lineTo(p.x, p.y + r*0.6);
        octx.strokeStyle = '#000';
        octx.lineWidth = 1.5 / sf;
        octx.stroke();
      }
    }
  }

  // ---------- Управление ----------
  bgLumInput.addEventListener('input', () => {
    bgLumVal.textContent = bgLumInput.value;
    recompute();
  });

  toleranceInp.addEventListener('input', () => {
    toleranceVal.textContent = toleranceInp.value;
    recompute();
  });

  maskColorInp.addEventListener('input', recompute);
  showPointsChk.addEventListener('change', drawOverlay);

  hideImageChk.addEventListener('change', () => {
    stage.classList.toggle('hide', hideImageChk.checked);
  });

  btnPick.addEventListener('click', () => {
    pickMode = !pickMode;
    btnPick.classList.toggle('active', pickMode);
    stage.classList.toggle('edit', pickMode);
    btnPick.textContent = pickMode ? '✓ Кликните по фону…' : '+ Добавить точку фона';
  });

  btnClear.addEventListener('click', () => {
    points = [];
    recompute();
  });

  // ---------- Работа с точками на overlay ----------
  function toCanvasCoords(evt) {
    const rect = overlay.getBoundingClientRect();
    const x = (evt.clientX - rect.left) * (overlay.width  / rect.width);
    const y = (evt.clientY - rect.top)  * (overlay.height / rect.height);
    return { x, y };
  }

  function hitTest(x, y) {
    const sf = scaleFactor();
    const r = POINT_R / sf;
    for (let i = points.length - 1; i >= 0; i--) {
      const p = points[i];
      const dx = p.x - x, dy = p.y - y;
      if (dx*dx + dy*dy <= r*r) return i;
    }
    return -1;
  }

  overlay.addEventListener('mousedown', e => {
    if (!img) return;
    const { x, y } = toCanvasCoords(e);
    const idx = hitTest(x, y);

    if (e.button === 2) {
      // правый клик — удалить точку
      if (idx >= 0) {
        points.splice(idx, 1);
        recompute();
      }
      e.preventDefault();
      return;
    }

    if (pickMode) {
      // добавить новую точку
      points.push({ x, y });
      recompute();
      return;
    }

    if (idx >= 0) {
      dragIndex = idx;
      overlay.style.cursor = 'grabbing';
    }
  });

  overlay.addEventListener('mousemove', e => {
    if (!img) return;
    const { x, y } = toCanvasCoords(e);

    if (dragIndex >= 0) {
      points[dragIndex] = { x, y };
      recompute();
      return;
    }

    const idx = hitTest(x, y);
    if (idx !== hoverIndex) {
      hoverIndex = idx;
      if (!pickMode) {
        overlay.style.cursor = idx >= 0 ? 'grab' : 'default';
      }
      drawOverlay();
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragIndex >= 0) {
      dragIndex = -1;
      overlay.style.cursor = pickMode ? 'crosshair' : 'default';
      recompute();
    }
  });

  overlay.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Ресайз ----------
  window.addEventListener('resize', () => {
    fitOverlay();
    drawOverlay();
  });

  // На случай, если canvas#base имеет CSS max-width и меняет размер
  const ro = new ResizeObserver(() => {
    if (base.width) {
      fitOverlay();
      drawOverlay();
    }
  });
  ro.observe(base);
})();
</script>
</body>
</html>
