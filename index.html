<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineart Highlighter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            background-color: #ff4757;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .upload-btn:hover {
            background-color: #ff6b81;
        }

        .canvas-container {
            position: relative;
            max-width: 100%;
            max-height: 80vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #333;
            background: #000;
            overflow: hidden;
            display: none; /* Скрыто до загрузки */
        }

        /* Основное изображение */
        #imageCanvas {
            display: block;
            max-width: 100%;
            max-height: 80vh;
        }

        /* Слой поверх с штриховкой */
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none; /* Чтобы клики проходили сквозь */
        }

        .loader {
            display: none;
            color: #ff4757;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Загрузка изображения и авто-штриховка фона</h1>

    <div class="controls">
        <label for="imageInput" class="upload-btn">Выбрать изображение</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="loader" id="loader">Обработка изображения...</div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const imageCanvas = document.getElementById('imageCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const loader = document.getElementById('loader');

        const imgCtx = imageCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');

        // Настройки алгоритма
        const DARKNESS_THRESHOLD = 100; // Чем меньше число, тем темнее должен быть пиксель (0-255)
        const STRIPE_COLOR = '#ff4757';  // Цвет штриховки (красный из примера)
        const STRIPE_WIDTH = 15;         // Ширина штриховки
        const STRIPE_GAP = 25;           // Расстояние между штрихами

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loader.style.display = 'block';
            canvasContainer.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    processImage(img);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processImage(img) {
            // Ограничиваем максимальный размер для производительности
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.floor(height * (MAX_WIDTH / width));
                width = MAX_WIDTH;
            }

            // Настраиваем canvas
            imageCanvas.width = width;
            imageCanvas.height = height;
            overlayCanvas.width = width;
            overlayCanvas.height = height;

            // Рисуем оригинал
            imgCtx.drawImage(img, 0, 0, width, height);

            // Получаем данные пикселей
            const imageData = imgCtx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // Очищаем оверлей
            overlayCtx.clearRect(0, 0, width, height);

            // Запускаем отрисовку
            drawDiagonalStripes(data, width, height);

            loader.style.display = 'none';
            canvasContainer.style.display = 'block';
        }

        // Функция проверки, является ли пиксель "черной линией"
        function isDarkPixel(data, width, x, y) {
            if (x < 0 || x >= width || y < 0 || y >= imageCanvas.height) return true; // За границей считаем препятствием

            const index = (y * width + x) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];
            const a = data[index + 3];

            // Если пиксель прозрачный, пропускаем
            if (a < 50) return false;

            // Вычисляем яркость (среднее арифметическое)
            const brightness = (r + g + b) / 3;

            // Если яркость ниже порога — это линия
            return brightness < DARKNESS_THRESHOLD;
        }

        function drawDiagonalStripes(data, width, height) {
            overlayCtx.strokeStyle = STRIPE_COLOR;
            overlayCtx.lineWidth = STRIPE_WIDTH;
            overlayCtx.lineCap = 'round';

            // Шаг между линиями по оси X
            const step = STRIPE_WIDTH + STRIPE_GAP;

            // Проходим по верхнему и левому краям, чтобы покрыть все диагонали
            for (let startX = -height; startX < width + height; startX += step) {
                
                overlayCtx.beginPath();
                
                // Начальная точка на верхней грани или левой грани
                let startY = 0;
                let currentX = startX;
                
                if (currentX < 0) {
                    startY = -currentX;
                    currentX = 0;
                }

                overlayCtx.moveTo(currentX, startY);

                let hitLine = false;
                let x = currentX;
                let y = startY;

                // Идем по диагонали вниз-вправо (угол 45 градусов)
                // В Canvas Y растет вниз, X растет вправо.
                // Чтобы линия шла из левого верхнего угла в правый нижний (как на картинке), 
                // нужно увеличивать и X, и Y. Но на картинке штриховка идет сверху-слева налево-вниз.
                // На картинке пользователя линии идут из верхнего правого угла в нижний левый.
                // Это значит: x уменьшается, y увеличивается.
                
                // Переопределим направление: от верхнего правого к нижнему левому.
                // Но так как мы перебираем startX, давайте сделаем классическую диагональ: сверху-слева -> вправо-вниз.
                // На изображении пользователя линии идут под углом ~45 градусов.
                
                // Двигаемся вниз и вправо
                while (x < width && y < height) {
                    if (isDarkPixel(data, width, Math.floor(x), Math.floor(y))) {
                        hitLine = true;
                        break;
                    }
                    x += 2; // Шаг сканирования
                    y += 2;
                }

                // Если наткнулись на линию, рисуем отрезок до этой точки
                if (hitLine) {
                    overlayCtx.lineTo(x, y);
                    overlayCtx.stroke();
                }
            }
        }
    </script>
</body>
</html>
