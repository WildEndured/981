<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Face Detector (ONNX)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; color: #333; }
    .header { text-align: center; margin-bottom: 2rem; }
    .controls { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
    #status { margin-top: 1rem; color: #666; font-weight: 500; }
    .canvas-container { background: white; padding: 1rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: auto; text-align: center; }
    canvas { max-width: 100%; height: auto; border-radius: 8px; }
    input[type="file"] { font-size: 1rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌸 Anime Face Detector</h1>
    <p>Работает полностью в браузере на WebGPU / WASM</p>
  </div>

  <div class="controls">
    <input type="file" id="file" accept="image/*">
    <div id="status">Инициализация ONNX Runtime...</div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
