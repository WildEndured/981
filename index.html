<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Art & Hatching Effect</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
        }
        .controls {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        label { display: flex; flex-direction: column; font-size: 0.8rem; gap: 5px; }
        input[type="range"] { width: 120px; }
        input[type="file"] { margin-bottom: 10px; }
        canvas {
            max-width: 100%;
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: #000;
        }
    </style>
</head>
<body>

    <h1>Генератор эффекта Line Art & Hatching</h1>
    
    <div class="container">
        <div class="controls">
            <input type="file" id="upload" accept="image/*">
            <label>
                Толщина линии:
                <input type="range" id="thickness" min="1" max="5" value="2" step="0.5">
            </label>
            <label>
                Сдвиг цвета (RGB):
                <input type="range" id="shift" min="0" max="20" value="8">
            </label>
            <label>
                Плотность штриховки:
                <input type="range" id="hatchDensity" min="5" max="30" value="15">
            </label>
            <button id="downloadBtn" style="padding: 8px 16px; cursor: pointer;">Скачать PNG</button>
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const uploadInput = document.getElementById('upload');
        const thicknessInput = document.getElementById('thickness');
        const shiftInput = document.getElementById('shift');
        const hatchInput = document.getElementById('hatchDensity');
        const downloadBtn = document.getElementById('downloadBtn');

        let img = new Image();
        let originalImageData = null;

        // 1. Загрузка изображения
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    processImage();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 2. Основная функция обработки
        function processImage() {
            if (!originalImageData) return;

            const width = canvas.width;
            const height = canvas.height;
            
            // Создаем копию данных для работы
            const srcData = new Uint8ClampedArray(originalImageData.data);
            const outputData = ctx.createImageData(width, height);
            const outData = outputData.data;

            const shift = parseInt(shiftInput.value);
            const thickness = parseFloat(thicknessInput.value);
            const hatchSpacing = parseInt(hatchInput.value);

            // --- ЭТАП 1 & 2: Поиск границ (Line Art) ---
            // Мы будем использовать простой градиентный фильтр (разница между соседними пикселями)
            // для определения контуров.
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    
                    // Получаем яркость текущего пикселя (упрощенно)
                    const r = srcData[idx];
                    const g = srcData[idx + 1];
                    const b = srcData[idx + 2];
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b;

                    // Проверяем соседей (справа и снизу) для определения границы
                    let isEdge = false;
                    if (x < width - 1 && y < height - 1) {
                        const idxRight = (y * width + (x + 1)) * 4;
                        const idxDown = ((y + 1) * width + x) * 4;
                        
                        const grayRight = 0.299 * srcData[idxRight] + 0.587 * srcData[idxRight+1] + 0.114 * srcData[idxRight+2];
                        const grayDown = 0.299 * srcData[idxDown] + 0.587 * srcData[idxDown+1] + 0.114 * srcData[idxDown+2];

                        // Если разница в яркости превышает порог, это граница (лайнарт)
                        // Порог можно настроить, здесь 30
                        if (Math.abs(gray - grayRight) > 30 || Math.abs(gray - grayDown) > 30) {
                            isEdge = true;
                        }
                    }

                    // --- ЭТАП 3: Определение толщины линии и Сдвиг ---
                    // Вместо сложного морфологического расширения (dilation), 
                    // мы просто делаем пиксель черным, если это граница, 
                    // и расширяем его влияние на соседей через смещение каналов.
                    
                    let finalR, finalG, finalB;

                    if (isEdge) {
                        // Линия Art - делаем её черной или темной
                        // Чем толще, тем больше пикселей закрашиваем (упрощенно через размытие)
                        finalR = 0; finalG = 0; finalB = 0;
                    } else {
                        // Фон и заливка
                        // Применяем эффект "сдвига" (Chromatic Aberration)
                        
                        // Берем пиксель со сдвигом для красного канала
                        const shiftX = Math.round(shift); 
                        const shiftY = Math.round(shift); // Диагональный сдвиг
                        
                        let rSrcIdx = idx;
                        let bSrcIdx = idx;

                        // Сдвигаем координаты для выборки цвета
                        if (x + shiftX < width && y + shiftY < height) {
                            rSrcIdx = ((y + shiftY) * width + (x + shiftX)) * 4;
                        }
                        if (x - shiftX >= 0 && y - shiftY >= 0) {
                            bSrcIdx = ((y - shiftY) * width + (x - shiftX)) * 4;
                        }

                        // Берем красный канал со сдвигом вправо-вниз, синий - влево-вверх
                        // Это создает эффект "двоения" как на картинке
                        finalR = srcData[rSrcIdx];
                        finalG = srcData[idx + 1]; // Зеленый оставляем на месте
                        finalB = srcData[bSrcIdx + 2]; // Синий со сдвигом
                    }

                    // --- Фоновая штриховка (Hatching) ---
                    // Если пиксель не является частью лайнарта, накладываем диагональную штриховку
                    if (!isEdge) {
                        // Условие для диагональных линий
                        // (x + y) % spacing < lineWidth
                        const lineWidth = 2; // Толщина штриха
                        const isHatchLine = ((x + y) % hatchSpacing) < lineWidth;
                        
                        if (isHatchLine) {
                            // Смешиваем цвет штриховки (желтый/розовый) с текущим цветом
                            // На картинке штриховка желтая/оранжевая
                            const hatchColor = { r: 255, g: 230, b: 0 }; // Желтый
                            
                            // Смешиваем 50/50
                            finalR = (finalR * 0.4 + hatchColor.r * 0.6);
                            finalG = (finalG * 0.4 + hatchColor.g * 0.6);
                            finalB = (finalB * 0.4 + hatchColor.b * 0.6);
                        }
                    }

                    outData[idx] = finalR;
                    outData[idx + 1] = finalG;
                    outData[idx + 2] = finalB;
                    outData[idx + 3] = 255; // Alpha
                }
            }

            // Дополнительный проход для "утолщения" линий (упрощенный эффект)
            // Если пиксель черный, делаем соседей темнее в зависимости от thickness
            if (thickness > 1) {
                const thickCopy = new Uint8ClampedArray(outData);
                const radius = Math.floor(thickness / 2);
                for (let y = radius; y < height - radius; y++) {
                    for (let x = radius; x < width - radius; x++) {
                        const idx = (y * width + x) * 4;
                        // Если текущий пиксель черный (лайнарт)
                        if (thickCopy[idx] < 50 && thickCopy[idx+1] < 50 && thickCopy[idx+2] < 50) {
                            // Закрашиваем соседей
                            for(let dy = -radius; dy <= radius; dy++) {
                                for(let dx = -radius; dx <= radius; dx++) {
                                    const nIdx = ((y+dy) * width + (x+dx)) * 4;
                                    outData[nIdx] = 0;
                                    outData[nIdx+1] = 0;
                                    outData[nIdx+2] = 0;
                                }
                            }
                        }
                    }
                }
            }

            ctx.putImageData(outputData, 0, 0);
        }

        // Перерисовка при изменении настроек
        thicknessInput.addEventListener('input', processImage);
        shiftInput.addEventListener('input', processImage);
        hatchInput.addEventListener('input', processImage);

        // Скачивание
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'lineart_effect.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Инициализация пустого холста
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 0, 300, 300);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText('Загрузите изображение...', 20, 150);
    </script>
</body>
</html>
