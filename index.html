<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Определение художественной перспективы</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1115;
    color: #e6e8ee;
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 4px;
    background: linear-gradient(90deg, #7dd3fc, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { color: #8b93a7; font-size: 0.9rem; margin-bottom: 24px; }
  .dropzone {
    border: 2px dashed #2a3242;
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    background: #161b24;
    margin-bottom: 20px;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #7dd3fc;
    background: #1a2130;
  }
  .dropzone p { margin: 6px 0; color: #8b93a7; }
  .dropzone strong { color: #e6e8ee; }
  input[type=file] { display: none; }
  #preview {
    max-width: 100%;
    max-height: 400px;
    border-radius: 12px;
    display: block;
    margin: 0 auto 20px;
  }
  #canvas { display: none; }
  .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #7dd3fc, #a78bfa);
    color: #0f1115;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
    transition: opacity .2s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:hover:not(:disabled) { opacity: 0.9; }
  .results {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 24px;
  }
  .card {
    background: #161b24;
    border: 1px solid #2a3242;
    border-radius: 14px;
    padding: 18px;
  }
  .card h3 {
    margin: 0 0 12px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8b93a7;
    font-weight: 600;
  }
  .verdict {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #7dd3fc, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .metric { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222a38; font-size: 0.9rem; }
  .metric:last-child { border-bottom: none; }
  .metric span:last-child { color: #7dd3fc; font-variant-numeric: tabular-nums; }
  .bar {
    height: 6px;
    background: #222a38;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar > div {
    height: 100%;
    background: linear-gradient(90deg, #7dd3fc, #a78bfa);
    border-radius: 3px;
    transition: width .5s ease;
  }
  .desc { font-size: 0.9rem; color: #8b93a7; line-height: 1.5; margin-top: 8px; }
  #loading { display: none; text-align: center; padding: 20px; color: #8b93a7; }
</style>
</head>
<body>
<div class="container">
  <h1>Определение художественной перспективы</h1>
  <p class="subtitle">Загрузите картину или фото — алгоритм проанализирует линии, сходимость и цветовые градиенты</p>

  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*">
    <p><strong>Нажмите или перетащите изображение</strong></p>
    <p>PNG, JPG, WEBP</p>
  </label>

  <img id="preview" style="display:none">
  <canvas id="canvas"></canvas>

  <div style="text-align:center">
    <button class="btn" id="analyzeBtn" disabled>Анализировать</button>
  </div>

  <div id="loading">Анализ изображения…</div>

  <div class="results" id="results" style="display:none"></div>
</div>

<script src="app.js"></script>
</body>
</html>
