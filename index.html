<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineart Highlighter (Color Mask)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { font-size: 1.1rem; text-align: center; margin-bottom: 15px; }
        .controls { margin-bottom: 20px; }

        input[type="file"] { display: none; }

        .upload-btn {
            background-color: #ff4757;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            max-width: 100%;
            max-height: 80vh;
            border: 2px solid #333;
            background: #000;
            display: none;
            overflow: hidden;
        }

        #imageCanvas, #overlayCanvas {
            display: block;
            max-width: 100%;
            max-height: 80vh;
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .loader { display: none; color: #ff4757; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Авто-штриховка (Анализ цвета)</h1>

    <div class="controls">
        <label for="imageInput" class="upload-btn">Выбрать изображение</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="loader" id="loader">Обработка...</div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const imageCanvas = document.getElementById('imageCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const loader = document.getElementById('loader');

        const imgCtx = imageCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');

        // --- НАСТРОЙКИ ---
        // 1. Порог темноты (0-255). Если пиксель темнее этого значения - это контур.
        const DARKNESS_THRESHOLD = 130; 

        // 2. Порог насыщенности (0-255). Если цвет сильно отличается от серого - это персонаж.
        // Увеличьте, если фон цветной. Уменьшите, если полосы пропускают персонажа.
        const SATURATION_THRESHOLD = 25; 

        // 3. Насколько "вперед" смотреть при проверке (игнорирует шум)
        const LOOKAHEAD = 4;

        const STRIPE_COLOR = '#ff4757';
        const STRIPE_WIDTH = 4;     
        const STRIPE_GAP = 18;      
        const SCAN_STEP = 2;        

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loader.style.display = 'block';
            canvasContainer.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => processImage(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processImage(img) {
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.floor(height * (MAX_WIDTH / width));
                width = MAX_WIDTH;
            }

            imageCanvas.width = width;
            imageCanvas.height = height;
            overlayCanvas.width = width;
            overlayCanvas.height = height;

            imgCtx.drawImage(img, 0, 0, width, height);
            const imageData = imgCtx.getImageData(0, 0, width, height);
            const data = imageData.data;

            overlayCtx.clearRect(0, 0, width, height);
            drawDiagonalStripes(data, width, height);

            loader.style.display = 'none';
            canvasContainer.style.display = 'block';
        }

        function getPixel(data, width, height, x, y) {
            if (x < 0 || x >= width || y < 0 || y >= height) return null;
            const index = (y * width + x) * 4;
            return {
                r: data[index],
                g: data[index + 1],
                b: data[index + 2],
                a: data[index + 3]
            };
        }

        // Проверяем, является ли пиксель частью персонажа (темный или цветной)
        function isCharacterPixel(data, width, height, x, y) {
            const p = getPixel(data, width, height, x, y);
            if (!p || p.a < 50) return false; // Прозрачный

            // Проверка на темноту
            const brightness = (p.r + p.g + p.b) / 3;
            if (brightness < DARKNESS_THRESHOLD) return true;

            // Проверка на насыщенность (цветность)
            const max = Math.max(p.r, p.g, p.b);
            const min = Math.min(p.r, p.g, p.b);
            const saturation = max - min;

            // Если цвет сильно отличается от серого, это персонаж
            if (saturation > SATURATION_THRESHOLD) return true;

            return false;
        }

        // Проверяем, есть ли персонаж впереди по диагонали
        function isCharacterAhead(data, width, height, x, y) {
            // Смотрим на несколько пикселей вперед, чтобы не реагировать на шум
            for (let i = 1; i <= LOOKAHEAD; i++) {
                if (isCharacterPixel(data, width, height, Math.floor(x + i), Math.floor(y + i))) {
                    return true;
                }
            }
            return false;
        }

        function drawDiagonalStripes(data, width, height) {
            overlayCtx.strokeStyle = STRIPE_COLOR;
            overlayCtx.lineCap = 'butt'; 
            overlayCtx.lineWidth = STRIPE_WIDTH;

            const step = STRIPE_WIDTH + STRIPE_GAP;

            for (let startX = -height; startX < width + height; startX += step) {
                
                let startY = 0;
                let currentX = startX;

                if (currentX < 0) {
                    startY = -currentX;
                    currentX = 0;
                }

                // Пропускаем полосу, если она начинается уже внутри персонажа
                if (isCharacterPixel(data, width, height, Math.floor(currentX), Math.floor(startY))) {
                    continue;
                }

                overlayCtx.beginPath();
                overlayCtx.moveTo(currentX, startY);

                let hitCharacter = false;
                let x = currentX;
                let y = startY;

                while (x < width && y < height) {
                    if (isCharacterAhead(data, width, height, Math.floor(x), Math.floor(y))) {
                        hitCharacter = true;
                        break;
                    }
                    x += SCAN_STEP;
                    y += SCAN_STEP;
                }

                if (hitCharacter) {
                    overlayCtx.lineTo(x, y);
                    overlayCtx.stroke();
                }
            }
        }
    </script>
</body>
</html>
