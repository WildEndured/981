<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Разметка 4 части + штриховка до контура</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #14161a; color: #e6e6e6;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 12px;
  }
  h1 { font-size: 16px; margin: 0; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px 16px;
    align-items: center; justify-content: center;
    padding: 10px 14px; background: #1d2027; border-radius: 10px;
    max-width: 900px;
  }
  .controls label { font-size: 12px; display: flex; gap: 6px; align-items: center; }
  input[type="file"] { font-size: 12px; }
  input[type="range"] { width: 100px; }
  .stage {
    position: relative; display: inline-block;
    border: 1px solid #2b2f37; background: #0b0c0f; line-height: 0;
  }
  .stage canvas { display: block; max-width: min(92vw, 900px); height: auto; }
  .stage canvas#overlay { position: absolute; inset: 0; pointer-events: none; }
  .hint { font-size: 12px; color: #8b93a1; max-width: 700px; text-align: center; }
  .val { display: inline-block; min-width: 28px; text-align: right; color: #7fd7ff; }
</style>
</head>
<body>

<h1>Загрузите изображение персонажа</h1>

<div class="controls">
  <label>Файл: <input id="file" type="file" accept="image/*" /></label>

  <label>Порог контура:
    <input id="threshold" type="range" min="20" max="220" value="90" />
    <span class="val" id="thresholdVal">90</span>
  </label>

  <label>Плотность лучей:
    <input id="density" type="range" min="4" max="60" value="16" />
    <span class="val" id="densityVal">16</span>
  </label>

  <label>Длина штриха:
    <input id="length" type="range" min="10" max="400" value="120" />
    <span class="val" id="lengthVal">120</span>
  </label>

  <label>Толщина:
    <input id="thickness" type="range" min="1" max="12" value="2" />
    <span class="val" id="thicknessVal">2</span>
  </label>

  <label>Пропуск мелких деталей (gap):
    <input id="gap" type="range" min="0" max="60" value="10" />
    <span class="val" id="gapVal">10</span>
  </label>

  <label><input id="showGrid" type="checkbox" checked /> Разметка</label>
</div>

<div class="stage">
  <canvas id="base"></canvas>
  <canvas id="overlay"></canvas>
</div>

<p class="hint">
  Лучи идут от краёв к центру и останавливаются на силуэте.
  «Пропуск мелких деталей» — сколько подряд светлых пикселей нужно пройти,
  чтобы считать тёмное пятно внутренней деталью и не останавливаться на нём.
</p>

<script>
const fileInput   = document.getElementById('file');
const baseCanvas  = document.getElementById('base');
const overlay     = document.getElementById('overlay');
const thresholdEl = document.getElementById('threshold');
const densityEl   = document.getElementById('density');
const lengthEl    = document.getElementById('length');
const thicknessEl = document.getElementById('thickness');
const gapEl       = document.getElementById('gap');
const showGridEl  = document.getElementById('showGrid');

const baseCtx    = baseCanvas.getContext('2d');
const overlayCtx = overlay.getContext('2d');

let imageData = null;
let imgWidth = 0, imgHeight = 0;
let srcImage = null;

// ---- Шаг 1: загрузка изображения ----
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    srcImage  = img;
    imgWidth  = img.naturalWidth;
    imgHeight = img.naturalHeight;

    [baseCanvas, overlay].forEach(c => {
      c.width  = imgWidth;
      c.height = imgHeight;
    });

    baseCtx.clearRect(0, 0, imgWidth, imgHeight);
    baseCtx.drawImage(img, 0, 0);
    imageData = baseCtx.getImageData(0, 0, imgWidth, imgHeight);

    drawGrid();
    drawHatching();
  };
  img.src = URL.createObjectURL(file);
});

// ---- Шаг 2: разметка на 4 части ----
function drawGrid() {
  if (!imageData) return;
  baseCtx.clearRect(0, 0, imgWidth, imgHeight);
  baseCtx.drawImage(srcImage, 0, 0);
  if (!showGridEl.checked) return;

  baseCtx.save();
  baseCtx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
  baseCtx.lineWidth = Math.max(2, Math.round(imgWidth / 400));
  baseCtx.setLineDash([14, 8]);
  const mx = imgWidth / 2, my = imgHeight / 2;
  baseCtx.beginPath(); baseCtx.moveTo(mx, 0); baseCtx.lineTo(mx, imgHeight); baseCtx.stroke();
  baseCtx.beginPath(); baseCtx.moveTo(0, my); baseCtx.lineTo(imgWidth, my); baseCtx.stroke();
  baseCtx.restore();
}

// ---- проверка яркости пикселя ----
function lumAt(x, y) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= imgWidth || y >= imgHeight) return 999;
  const i = (y * imgWidth + x) * 4;
  const d = imageData.data;
  if (d[i + 3] < 20) return 999; // прозрачное
  return 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
}

// ---- Шаг 3 + 4: радиальные лучи от краёв к центру ----
function drawHatching() {
  if (!imageData) return;

  const threshold = +thresholdEl.value;
  const rayCount  = +densityEl.value;
  const maxLen    = +lengthEl.value;
  const thickness = +thicknessEl.value;
  const gap       = +gapEl.value;

  overlayCtx.clearRect(0, 0, imgWidth, imgHeight);
  overlayCtx.strokeStyle = 'rgba(80, 200, 255, 0.85)';
  overlayCtx.lineWidth   = thickness;
  overlayCtx.lineCap     = 'round';

  const cx = imgWidth / 2;
  const cy = imgHeight / 2;

  // «Радиус до края» для каждого угла, чтобы луч начинался точно от рамки
  function edgeDistance(angle) {
    const dx = Math.cos(angle), dy = Math.sin(angle);
    const tx = dx !== 0 ? (cx / Math.abs(dx)) : Infinity;
    const ty = dy !== 0 ? (cy / Math.abs(dy)) : Infinity;
    return Math.min(tx, ty);
  }

  for (let k = 0; k < rayCount; k++) {
    const angle = (k / rayCount) * Math.PI * 2;
    const dx = Math.cos(angle);
    const dy = Math.sin(angle);

    const startR = edgeDistance(angle);          // от края
    const maxR   = Math.min(maxLen, startR);     // ограничиваем длину ползунком

    // Идём от края к центру, ищем силуэт с учётом gap
    let stopped = -1;
    let gapCounter = 0;
    let foundDark = false;

    for (let r = 0; r <= maxR; r++) {
      const x = cx + dx * (startR - r);
      const y = cy + dy * (startR - r);
      const lum = lumAt(x, y);

      if (lum < threshold) {
        // тёмный пиксель
        if (!foundDark) { foundDark = true; gapCounter = 0; }
        else { gapCounter = 0; }
      } else if (foundDark) {
        gapCounter++;
        if (gapCounter > gap) {
          // прошли достаточно светлого — значит это была внутренняя деталь
          // откатываемся: стоп на предыдущей тёмной границе
          stopped = r - gapCounter;
          break;
        }
      }
    }

    if (foundDark && stopped === -1) {
      // тёмное найдено и до конца луча gap не сработал — стоп на конце
      stopped = maxR;
    }

    if (!foundDark) {
      // ничего тёмного не встретили — рисуем пустой луч (опционально можно пропустить)
      stopped = maxR;
    }

    // Рисуем штрих от края к найденной точке
    const rEnd = Math.max(0, stopped);
    const x0 = cx + dx * startR;
    const y0 = cy + dy * startR;
    const x1 = cx + dx * (startR - rEnd);
    const y1 = cy + dy * (startR - rEnd);

    overlayCtx.beginPath();
    overlayCtx.moveTo(x0, y0);
    overlayCtx.lineTo(x1, y1);
    overlayCtx.stroke();
  }
}

// ---- перерисовка при изменении параметров ----
const binds = [
  [thresholdEl, 'thresholdVal'],
  [densityEl,   'densityVal'],
  [lengthEl,    'lengthVal'],
  [thicknessEl, 'thicknessVal'],
  [gapEl,       'gapVal'],
];
binds.forEach(([el, out]) => {
  const span = document.getElementById(out);
  el.addEventListener('input', () => {
    span.textContent = el.value;
    drawHatching();
  });
});
showGridEl.addEventListener('change', drawGrid);
</script>

</body>
</html>
