<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineart Highlighter (4 Corners)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { font-size: 1.1rem; text-align: center; margin-bottom: 15px; }
        .controls { margin-bottom: 20px; }

        input[type="file"] { display: none; }

        .upload-btn {
            background-color: #ff4757;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            max-width: 100%;
            max-height: 80vh;
            border: 2px solid #333;
            background: #000;
            display: none;
            overflow: hidden;
        }

        #imageCanvas, #overlayCanvas {
            display: block;
            max-width: 100%;
            max-height: 80vh;
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .loader { display: none; color: #ff4757; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Авто-штриховка (4 угла)</h1>

    <div class="controls">
        <label for="imageInput" class="upload-btn">Выбрать изображение</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="loader" id="loader">Обработка...</div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const imageCanvas = document.getElementById('imageCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const loader = document.getElementById('loader');

        const imgCtx = imageCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');

        // --- НАСТРОЙКИ ---
        const DARKNESS_THRESHOLD = 130; 
        const SATURATION_THRESHOLD = 25; 
        const LOOKAHEAD = 4;

        const STRIPE_COLOR = '#ff4757';
        const STRIPE_WIDTH = 4;     
        const STRIPE_GAP = 18;      
        const SCAN_STEP = 2;        

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loader.style.display = 'block';
            canvasContainer.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => processImage(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processImage(img) {
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.floor(height * (MAX_WIDTH / width));
                width = MAX_WIDTH;
            }

            imageCanvas.width = width;
            imageCanvas.height = height;
            overlayCanvas.width = width;
            overlayCanvas.height = height;

            imgCtx.drawImage(img, 0, 0, width, height);
            const imageData = imgCtx.getImageData(0, 0, width, height);
            const data = imageData.data;

            overlayCtx.clearRect(0, 0, width, height);
            
            // Рисуем из 4 углов
            drawFromTopLeft(data, width, height);
            drawFromTopRight(data, width, height);
            drawFromBottomLeft(data, width, height);
            drawFromBottomRight(data, width, height);

            loader.style.display = 'none';
            canvasContainer.style.display = 'block';
        }

        function getPixel(data, width, height, x, y) {
            if (x < 0 || x >= width || y < 0 || y >= height) return null;
            const index = (y * width + x) * 4;
            return {
                r: data[index], g: data[index + 1], b: data[index + 2], a: data[index + 3]
            };
        }

        function isCharacterPixel(data, width, height, x, y) {
            const p = getPixel(data, width, height, x, y);
            if (!p || p.a < 50) return false;

            const brightness = (p.r + p.g + p.b) / 3;
            if (brightness < DARKNESS_THRESHOLD) return true;

            const max = Math.max(p.r, p.g, p.b);
            const min = Math.min(p.r, p.g, p.b);
            const saturation = max - min;

            if (saturation > SATURATION_THRESHOLD) return true;

            return false;
        }

        function isCharacterAhead(data, width, height, x, y, dx, dy) {
            for (let i = 1; i <= LOOKAHEAD; i++) {
                if (isCharacterPixel(data, width, height, Math.floor(x + dx * i), Math.floor(y + dy * i))) {
                    return true;
                }
            }
            return false;
        }

        // Функция для отрисовки линий в заданном направлении
        function drawLines(data, width, height, startX, startY, dx, dy, limitX, limitY) {
            overlayCtx.strokeStyle = STRIPE_COLOR;
            overlayCtx.lineCap = 'butt'; 
            overlayCtx.lineWidth = STRIPE_WIDTH;

            const step = STRIPE_WIDTH + STRIPE_GAP;
            
            // Определяем количество линий, которые нужно нарисовать
            // Мы идем по перпендикулярной оси
            let numLines;
            let perpX = -dy; // Перпендикулярный вектор
            let perpY = dx;

            if (dx !== 0) {
                numLines = Math.ceil((width + height) / step);
            } else {
                numLines = Math.ceil((width + height) / step);
            }

            // Смещение для первой линии, чтобы она начиналась за пределами холста
            let offset = -Math.max(width, height);

            for (let i = 0; i < numLines + 50; i++) {
                let currentStartX = startX + perpX * (offset + i * step);
                let currentStartY = startY + perpY * (offset + i * step);

                // Проверяем, находится ли стартовая точка в пределах холста (или за ним)
                // Если линия начинается внутри персонажа, пропускаем
                if (currentStartX >= 0 && currentStartX < width && currentStartY >= 0 && currentStartY < height) {
                    if (isCharacterPixel(data, width, height, Math.floor(currentStartX), Math.floor(currentStartY))) {
                        continue;
                    }
                }

                overlayCtx.beginPath();
                overlayCtx.moveTo(currentStartX, currentStartY);

                let hitCharacter = false;
                let x = currentStartX;
                let y = currentStartY;

                // Сканируем в заданном направлении
                while (x >= 0 && x < width && y >= 0 && y < height) {
                    if (isCharacterAhead(data, width, height, Math.floor(x), Math.floor(y), dx, dy)) {
                        hitCharacter = true;
                        break;
                    }
                    x += dx * SCAN_STEP;
                    y += dy * SCAN_STEP;
                }

                if (hitCharacter) {
                    overlayCtx.lineTo(x, y);
                    overlayCtx.stroke();
                }
            }
        }

        // 1. Из левого верхнего угла (вправо-вниз)
        function drawFromTopLeft(data, width, height) {
            drawLines(data, width, height, 0, 0, 1, 1, width, height);
        }

        // 2. Из правого верхнего угла (влево-вниз)
        function drawFromTopRight(data, width, height) {
            drawLines(data, width, height, width, 0, -1, 1, 0, height);
        }

        // 3. Из левого нижнего угла (вправо-вверх)
        function drawFromBottomLeft(data, width, height) {
            drawLines(data, width, height, 0, height, 1, -1, width, 0);
        }

        // 4. Из правого нижнего угла (влево-вверх)
        function drawFromBottomRight(data, width, height) {
            drawLines(data, width, height, width, height, -1, -1, 0, 0);
        }
    </script>
</body>
</html>
