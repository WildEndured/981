<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Face Landmarks Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #333;
        }
        .container {
            position: relative;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            max-width: 100%;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        #upload {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #6200ea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #upload:hover {
            background: #3700b3;
        }
        .info {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Детектор аниме-лиц</h1>
    
    <input type="file" id="upload" accept="image/*">
    
    <div class="container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="info">
        Наведите курсор на точку, чтобы увидеть её номер и описание.
    </div>

    <!-- Подключение библиотеки TensorFlow и anime-face-detector -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/anime-face-detector@1.0.0/dist/anime-face-detector.min.js"></script>

    <script>
        // Описание точек согласно вашему запросу
        const landmarksInfo = {
            0: "Левый Висок",
            1: "Левая Щека",
            2: "Подбородок",
            3: "Правая Щека",
            4: "Правый Висок",
            5: "Кончик левой брови",
            6: "Середина левой брови",
            7: "Кончик левой брови", // В оригинале 5 и 7 могут быть внешним и внутренним краем
            8: "Кончик правой брови",
            9: "Середина правой брови",
            10: "Кончик правой брови",
            11: "Кончик левой ресницы",
            12: "Середина левой ресницы",
            13: "Кончик левой ресницы",
            14: "Низ левого глаза",
            15: "Середина низа левого глаза",
            16: "Низ левого глаза",
            17: "Кончик правой ресницы",
            18: "Середина правой ресницы",
            19: "Кончик правой ресницы",
            20: "Низ правого глаза",
            21: "Середина низа правого глаза",
            22: "Низ правого глаза",
            23: "Нос",
            24: "Рот лево",
            25: "Рот верх",
            26: "Рот право",
            27: "Рот низ"
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uploadInput = document.getElementById('upload');
        let currentImage = null;
        let detectedLandmarks = null;
        let animationFrameId = null;

        // Инициализация модели (создается один раз)
        const model = new AnimeFaceDetector();

        uploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async () => {
                currentImage = img;
                
                // Устанавливаем размер canvas равным размеру изображения
                canvas.width = img.width;
                canvas.height = img.height;
                
                // Рисуем изображение
                ctx.drawImage(img, 0, 0);

                // Запускаем детекцию
                try {
                    const faces = await model.estimateFaces(img);
                    
                    if (faces.length > 0) {
                        // Берем первое найденное лицо
                        detectedLandmarks = faces[0].keypoints;
                        console.log("Найдено лицо:", detectedLandmarks);
                        
                        // Отрисовываем точки
                        drawLandmarks();
                    } else {
                        alert("Лицо не найдено. Попробуйте другое изображение.");
                    }
                } catch (error) {
                    console.error("Ошибка детекции:", error);
                    alert("Ошибка при обработке изображения.");
                }
            };
        });

        function drawLandmarks() {
            // Очищаем и перерисовываем изображение
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImage, 0, 0);

            if (!detectedLandmarks) return;

            detectedLandmarks.forEach((point, index) => {
                const [x, y] = point;
                
                // Рисуем точку
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff0044'; // Ярко-розовый цвет
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Рисуем номер точки рядом (мелко)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.font = '10px Arial';
                ctx.fillText(index, x + 5, y - 5);
            });
        }

        // Логика для показа подсказок при наведении
        canvas.addEventListener('mousemove', (e) => {
            if (!detectedLandmarks || !currentImage) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            // Проверяем, находимся ли мы близко к какой-либо точке
            let hoveredIndex = -1;
            detectedLandmarks.forEach((point, index) => {
                const [x, y] = point;
                const dist = Math.sqrt((mouseX - x) ** 2 + (mouseY - y) ** 2);
                if (dist < 15) { // Радиус срабатывания
                    hoveredIndex = index;
                }
            });

            // Перерисовываем сцену
            drawLandmarks();

            if (hoveredIndex !== -1) {
                const [x, y] = detectedLandmarks[hoveredIndex];
                
                // Рисуем выделение вокруг точки
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Показываем название точки
                const text = `${hoveredIndex}: ${landmarksInfo[hoveredIndex] || "Неизвестно"}`;
                ctx.font = 'bold 14px Arial';
                const textWidth = ctx.measureText(text).width;
                
                // Фон для текста
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(x + 10, y - 20, textWidth + 10, 20);
                
                // Текст
                ctx.fillStyle = '#ffffff';
                ctx.fillText(text, x + 15, y - 5);
            }
        });
    </script>
</body>
</html>
